{id:'location',title:'Location, Tracking and Automated Features',sub:'How live location, alerts, reminders, maps and automatic features work, and their limits',body:L=>`
<h2 id="l1">1. Driver location</h2><p>When a Driver starts a trip, the Driver’s phone shares its location with Enivel every few seconds until the trip ends. Parents can see it only while their own Child is on board. The latest position replaces the previous one; positions at pickup, drop-off and handover are kept as trip records. Location is not collected from Parents or Children.</p>
<h2 id="l2">2. Geofenced pickups</h2><p>A pickup or drop-off can only be recorded within about 200 metres (plus the phone’s reported GPS accuracy) of the pinned address. If an address is not pinned on the map, the record is marked as not location-verified and the Parent is told.</p>
<h2 id="l3">3. Automatic pickup and drop-off</h2><p>If the Driver has it switched on, Enivel records a pickup when the Driver has stopped near a Child’s home for about 45 seconds and then drives away, and a drop-off when the Driver has stopped at the school for about 30 seconds. The Driver can undo within 10 seconds and must correct any wrong record. Automatic detection may miss a stop or record one wrongly, for example if GPS is inaccurate, two homes are close together, or the Driver stops nearby for another reason. Where a Handover Code is set, a home drop-off is not recorded automatically; the Driver must enter the code.</p>
<h2 id="l4">4. Handover code checks</h2><p>Checking a Handover Code needs the Driver’s app to be working and, in some cases, a network connection. If it cannot be checked, the Driver must follow the steps in the Parent and Guardian Terms and contact the Parent. A correct code shows only that the code was given, not who gave it.</p>
<h2 id="l5">5. Alerts, reminders and push notifications</h2><p>Pickup, drop-off, handover, “driver outside”, proximity and reminder notifications (including Driver pickup reminders 30 and 10 minutes before a scheduled pickup, which can arrive as push notifications when Enivel is closed) are sent through the Platform, the browser, push services and SMS providers. They may be delayed or not delivered if a phone is off, offline, in battery-saving or do-not-disturb mode, has notifications switched off, has cleared its browser data, or if a provider is down. On iPhone, notifications while Enivel is closed only work when it was added to the Home Screen and notifications were allowed.</p>
<h2 id="l6">6. Maps, addresses, routes and estimates</h2><p>Maps are drawn from OpenStreetMap data (© OpenStreetMap contributors, available under the Open Database Licence) and displayed in light or dark styles to match your theme. Map data, address suggestions and road routes come from OpenStreetMap-based services and may be incomplete, out of date or wrong, for example for new developments, informal settlements, gated estates or closed roads. Distances, progress percentages and arrival estimates are calculated from straight-line or routed distances and typical speeds; they are estimates only and do not take account of live traffic.</p>
<h2 id="l7">7. Smart stop order</h2><p>The smart stop order suggests a sequence of pickups based on pinned addresses and the Driver’s current location. It does not know about traffic, road closures, roadworks, unrest, school gate rules, one-way systems, safe stopping places or the conditions of the Driver’s operating licence. The Driver decides the route.</p>
<h2 id="l8">8. Calendars, schedules and planners</h2><p>Public holiday and exam-period information, schedules, days off and Term Planner dates are based on information entered by Users or published calendars. They may be wrong or change at short notice. A change only reaches a Driver’s phone when it next connects.</p>
<h2 id="l9">9. Power and network interruptions</h2><p>Load-shedding, power failures, network congestion, tower outages and poor coverage can stop location updates, alerts, SMS codes and records from being sent or received. When connection returns, some records may arrive late and be time-stamped by the device.</p>
<h2 id="l10">10. Your responsibility</h2><p><b>These features help but are not guaranteed. Parents must not rely on Enivel alone to know where a Child is, or as the only cue to have a Child ready. Drivers remain responsible for punctuality, route choice, road safety and accurate records. Enivel is not liable for loss caused by a delayed, missing or inaccurate location, alert, reminder, notification, map, route, estimate, stop order suggestion, calendar or automatic record, to the extent the law allows and subject to clause 14.5 of the Terms of Service.</b></p>`},

{id:'storage',title:'Cookies and Device Storage',sub:'What Enivel saves on your phone or computer',body:L=>`
<p>Enivel does not use advertising or third-party tracking cookies and does not sell information about your browsing. It stores the following on your device so the app works. Information stored on your device is personal information to the extent it relates to you, and is protected under our Privacy Policy.</p>
<table class="lt"><tr><th>Item</th><th>Purpose</th><th>How long</th></tr>
<tr><td>Sign-in session</td><td>Keeps you logged in (stored by our authentication provider)</td><td>Until you sign out or it expires</td></tr>
<tr><td>Two-step verification flag</td><td>Remembers that this device passed your PIN or code</td><td>Until you sign out or clear it</td></tr>
<tr><td>Theme and map style</td><td>Remembers light or dark mode, which also sets the map style</td><td>Until changed or cleared</td></tr>
<tr><td>Intro and reminder flags</td><td>Remember that you saw the intro and which reminders were already shown, so you are not shown them twice</td><td>Until cleared</td></tr>
<tr><td>Pending sign-up details</td><td>Holds your name and role until your account is created</td><td>Deleted when the account is created</td></tr>
<tr><td>Service worker and push subscription</td><td>Lets Enivel receive notifications, including Driver pickup reminders when Enivel is closed</td><td>Until you remove notification permission or clear site data</td></tr>
<tr><td>Browser cache</td><td>Your browser may keep copies of app files and map tiles to load faster</td><td>Managed by your browser</td></tr></table>
<p>Map tiles, address search and routes are loaded from third-party OpenStreetMap-based services, which receive your IP address and the area or address requested, but Enivel does not allow them to set advertising cookies through the Platform.</p>
<p>Clearing your browser data removes these items and logs you out. Removing notification permission stops reminders and alerts on that device. Enivel no longer offers a demo mode; only real accounts exist.</p>`},

{id:'disputes',title:'Complaints and Disputes',sub:'How to complain and how disputes are resolved',body:L=>`
<h2 id="r1">1. Complaints</h2><p>1.1 Use Report an issue on the Booking, or email ${L.EMAIL}, with the Booking, date and what happened, and any supporting information. We acknowledge within 2 Business Days and aim to resolve within 15 Business Days. Safety reports are handled immediately under the Child Safeguarding Policy.</p><p>1.2 If you are not satisfied with the response, you may ask for the complaint to be escalated to a senior manager, who will respond within 10 Business Days.</p><p>1.3 We record every complaint and the outcome.</p>
<h2 id="r2">2. Disputes between Parents and Drivers</h2><p>Parents and Drivers must first try to resolve disputes about the transport service directly through Enivel chat. Either may then ask Enivel to review the Trip Data. Enivel’s review is to help, not a binding decision, except for refunds and fee decisions under the Payments policy, which remain subject to the rights of either party in sections 3 and 4.</p>
<h2 id="r3">3. Disputes with Enivel</h2><ol><li><b>Internal complaint</b> as in section 1.</li><li><b>Mediation:</b> if not resolved within 20 Business Days, either party may refer the dispute to mediation by an accredited mediator agreed by the parties or, failing agreement within 10 Business Days, appointed by the Arbitration Foundation of Southern Africa (AFSA). Each party pays its own costs and shares the mediator’s fee equally.</li><li><b>Arbitration for business users:</b> disputes between Enivel and Drivers or other business users that are not resolved by mediation within 30 Business Days will be finally decided by arbitration under the AFSA rules, by one arbitrator agreed by the parties or appointed by AFSA, in Johannesburg or by video conference, in English, under the Arbitration Act 42 of 1965. The award is final and binding and may be made an order of court.</li><li><b>Consumers</b> may, after the internal complaint, choose mediation, arbitration or any forum in section 4. Nothing in this policy limits those rights, and a Consumer is never obliged to arbitrate.</li><li><b>Privacy complaints</b> may be lodged with the Information Regulator at any time.</li></ol>
<h2 id="r4">4. Consumer forums</h2><ul><li>The Consumer Goods and Services Ombud (cgso.org.za), after you have first given us a chance to resolve the complaint.</li><li>The National Consumer Commission (thencc.org.za), and through it the National Consumer Tribunal.</li><li>A provincial consumer protection authority or consumer court.</li><li>The Small Claims Court for claims within its limit, or any other competent court.</li><li>The Information Regulator (inforegulator.org.za) for privacy and PAIA matters.</li></ul>
<h2 id="r5">5. Court jurisdiction</h2><p>Where a dispute goes to court, clause 22 of the Terms of Service applies, including the consent to Magistrates’ Court jurisdiction under section 45 of the Magistrates’ Courts Act and the protection for Consumers to be sued only where they reside or where the Booking was performed.</p>
<h2 id="r6">6. Urgent relief and prescription</h2><p>Any party may approach a court for urgent interim relief, for example to protect a Child or to stop a security breach. Following this policy does not shorten any prescription period. Because prescription may continue to run during a complaint or mediation, take legal advice if your claim is close to prescribing.</p>
<h2 id="r7">7. Good faith and confidentiality</h2><p>Everyone must take part in these steps in good faith and keep the dispute confidential, except as needed to obtain advice, report to an authority, or comply with the law. Nothing said in mediation may be used in later proceedings without consent.</p>`},

{id:'paia',title:'PAIA Manual',sub:'Requesting records under the Promotion of Access to Information Act',body:L=>`
<p>This manual is published under section 51 of the Promotion of Access to Information Act 2 of 2000 (“PAIA”), as amended by POPIA. It is available in the Platform’s Legal centre and on request from the Information Officer at no charge.</p>
<h2 id="a1">1. Contact details</h2><ul><li>Private body: ${L.E}, registration number ${L.REG}, trading as Enivel</li><li>Postal and street address: ${L.ADDR}</li><li>Information Officer (head of the private body or person authorised): ${L.IO}</li><li>Email: ${L.PRIV} · Phone: ${L.PHONE}</li></ul>
<h2 id="a2">2. The Information Regulator’s guide</h2><p>The Information Regulator has compiled a guide, in each official language, on how to use PAIA and POPIA, as section 10 of PAIA requires. It is available from inforegulator.org.za or from the Information Regulator’s offices. You may also ask our Information Officer for a copy.</p>
<h2 id="a3">3. Records available without a request</h2><p>The following are available without a formal request: the Terms of Service and all Policies in the Legal centre; information published on the Platform about fees and services. No notice under section 52 of PAIA has been published.</p>
<h2 id="a4">4. Records kept under other laws</h2><p>Records are kept, where applicable, under the Companies Act 71 of 2008, the Income Tax Act 58 of 1962, the Value-Added Tax Act 89 of 1991, the Tax Administration Act 28 of 2011, the Basic Conditions of Employment Act 75 of 1997, the Unemployment Insurance Act 63 of 2001, the Consumer Protection Act 68 of 2008, the Electronic Communications and Transactions Act 25 of 2002, POPIA and the Children’s Act 38 of 2005.</p>
<h2 id="a5">5. Subjects and categories of records</h2>
<table class="lt"><tr><th>Subject</th><th>Categories</th></tr>
<tr><td>Company</td><td>Incorporation documents, register of directors, minutes, resolutions, shareholder records</td></tr>
<tr><td>Finance and tax</td><td>Financial statements, accounting records, tax returns, VAT records, bank records</td></tr>
<tr><td>Users</td><td>Accounts, Children’s profiles, Bookings, Trip Data, Waiting List and Term Planner records, messages, reviews, complaints, payment and payout records, credit and giveaway records</td></tr>
<tr><td>Driver verification</td><td>Identity, licence, permit, clearance, insurance and vehicle documents, verification decisions</td></tr>
<tr><td>Safety</td><td>SOS alerts, incident reports, safeguarding records, records of disclosures to authorities</td></tr>
<tr><td>Technology and security</td><td>System logs, security incident records, operator agreements</td></tr>
<tr><td>Suppliers and contracts</td><td>Agreements with operators, payment providers and advisers</td></tr></table>
<h2 id="a6">6. Making a request</h2><p>Use Form 2 (Request for Access to Record) prescribed by the PAIA regulations, available from the Information Regulator, and send it to the Information Officer. Give enough detail to identify the record and yourself, state the form of access you want and, if you ask on behalf of someone else, proof of your authority. You must state the right you are exercising or protecting and why the record is required for it (section 53).</p>
<h2 id="a7">7. Fees</h2><p>A request fee and access fees may be payable as prescribed by the PAIA regulations. You will be told of any fee, and of any deposit required, before the record is prepared. A requester asking for their own personal information does not pay a request fee.</p>
<h2 id="a8">8. Timelines</h2><p>We will decide on a request within 30 days of receiving it. We may extend this once by up to 30 days where section 57 of PAIA allows, and will tell you why. If we do not respond in time, the request is regarded as refused (section 58).</p>
<h2 id="a9">9. Grounds for refusal</h2><p>Access may be refused on the grounds in Chapter 4 of Part 3 of PAIA, including to protect the privacy of third parties (including Children), commercial or confidential information of third parties or of Enivel, the safety of individuals and property, records privileged from production in legal proceedings, and research information. Where part of a record can be released, the rest will be severed.</p>
<h2 id="a10">10. Remedies</h2><p>If you are not satisfied with our decision, you may within 180 days lodge a complaint with the Information Regulator under section 77A of PAIA, or apply to a court under section 78.</p>
<h2 id="a11">11. Processing of personal information</h2><p>The purposes of processing, categories of data subjects and of personal information, recipients, planned cross-border transfers and general description of security measures are set out in the Privacy Policy and the Information Security policy, which form part of this manual.</p>
<h2 id="a12">12. Updates</h2><p>This manual is reviewed regularly and updated when our records or processing change. The version date is the effective date shown in the Legal centre.</p>`}
];

/* ---------- legal centre views ---------- */
function legalDoc(id){return LEGAL_DOCS.find(d=>d.id===id)}
function legalLinks(root){root.querySelectorAll('[data-doc]').forEach(a=>a.onclick=e=>{e.preventDefault();closeModal();go('doc',{legalDoc:a.dataset.doc,legalSec:a.dataset.sec||null})})}
VIEWS.legal=()=>`<div class="stack" style="max-width:820px;gap:16px">${pageHead('Legal centre',`Version ${TERMS_VERSION} · effective ${TERMS_EFFECTIVE}`,`<button class="btn sm ghost" onclick="history.length>1?history.back():go('landing')">Back</button>`)}
  ${legalMissing()&&S.admin?`<div class="notice"><b>Company details missing.</b> Fill them in under Admin → More → Legal details so they appear in every policy.</div>`:''}
  <div class="grid g2">${LEGAL_DOCS.map(d=>`<button class="card legalcard" onclick="go('doc',{legalDoc:'${d.id}'})"><b>${h(d.title)}</b><span class="tiny muted">${h(d.sub)}</span></button>`).join('')}</div>
  <div class="card soft"><b>Contact</b><div class="small muted" style="margin-top:6px">${(()=>{const L=LX();return `${L.E} · Reg. ${L.REG}<br>${L.ADDR}<br>${L.EMAIL} · ${L.PHONE}<br>Information Officer: ${L.IO}`})()}</div></div>
  <p class="tiny muted">These documents are provided in English. If anything in them conflicts with a right you have under South African law that cannot be waived, that right prevails.</p></div>`;
VIEWS.doc=()=>{const d=legalDoc(S.legalDoc)||legalDoc('terms');const L=LX();const body=d.body(L);const toc=[...body.matchAll(/<h2 id="([^"]+)">([^<]+)<\/h2>/g)];
  setTimeout(()=>{const m=$('main');if(m)legalLinks(m);if(S.legalSec){const t=document.getElementById(S.legalSec);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});S.legalSec=null}},50);
  return `<article class="legal" style="max-width:780px"><div class="row between"><button class="btn sm ghost" onclick="go('legal')">‹ Legal centre</button><span class="tiny muted">Version ${TERMS_VERSION}</span></div>
  <h1 style="font-size:clamp(1.6rem,5vw,2.2rem);margin-top:14px">${h(d.title)}</h1><p class="muted">${h(d.sub)} · effective ${TERMS_EFFECTIVE}</p>
  ${toc.length>3?`<nav class="toc card soft"><b class="tiny">Contents</b>${toc.map(([,id,t])=>`<a href="#" onclick="event.preventDefault();document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${t}</a>`).join('')}</nav>`:''}
  ${body}<div class="row" style="margin-top:28px"><button class="btn sm ghost" onclick="go('legal')">All legal documents</button></div></article>`};
VIEWS.privacy=()=>{S.legalDoc='privacy';return VIEWS.doc()};VIEWS.terms=()=>{S.legalDoc='terms';return VIEWS.doc()};VIEWS.safety=()=>{S.legalDoc='safeguarding';return VIEWS.doc()};
function legalMissing(){const s=Store.get('settings','legal')||{};return ['entity','reg','address','email','infoOfficer'].some(k=>!s[k])}
/* links from sign-in screen and menus */
const _landingL=VIEWS.landing;VIEWS.landing=()=>_landingL().replace(`<button onclick="go('privacy')">Privacy</button><button onclick="go('terms')">Terms</button><button onclick="go('safety')">Safety</button>`,`<button onclick="go('legal')">Legal</button><button onclick="go('doc',{legalDoc:'privacy'})">Privacy</button><button onclick="go('doc',{legalDoc:'safeguarding'})">Safety</button>`)
  .replace(/<label class="tiny muted"><input type="checkbox" required> I agree to the[\s\S]*?<\/label>/,`<label class="tiny muted" style="line-height:1.5"><input type="checkbox" required id="su-terms"> I am 18 or older and accept the <a href="#" onclick="event.preventDefault();go('doc',{legalDoc:'terms'})">Terms of Service</a>, <a href="#" onclick="event.preventDefault();go('doc',{legalDoc:'privacy'})">Privacy Policy</a>, <a href="#" onclick="event.preventDefault();go('doc',{legalDoc:'safeguarding'})">Child Safeguarding Policy</a>${(S.signupRole||'parent')==='driver'?` and <a href="#" onclick="event.preventDefault();go('doc',{legalDoc:'driver'})">Driver Agreement</a>`:` and <a href="#" onclick="event.preventDefault();go('doc',{legalDoc:'parent'})">Parent Terms</a>`}. I have read the <a href="#" onclick="event.preventDefault();go('doc',{legalDoc:'key-terms'})"><b>Important terms</b></a> that limit Enivel’s liability.</label>`);
for(const r of ['p-more','d-more']){const f=VIEWS[r];VIEWS[r]=()=>f().replace(/\[\['privacy','Privacy policy'\],\['terms','Terms of service'\](,\['safety','Safety standards'\])?\]/,"[['legal','Legal centre']]").replace(`onclick="go('privacy')"><div class="grow">Privacy policy</div>`,`onclick="go('legal')"><div class="grow">Legal centre</div>`)}
/* ---------- record acceptance ---------- */
function acceptedNow(){return {version:TERMS_VERSION,at:Date.now(),ua:navigator.userAgent.slice(0,120)}}
const _createCloud=typeof createCloudProfile==='function'?createCloudProfile:null;
if(_createCloud)createCloudProfile=async function(user,f){await _createCloud(user,f);try{await Store.patch('users',user.id,{termsAccepted:acceptedNow()})}catch(e){}};
const _registerL=register;register=async function(form){await _registerL(form);const u=me();if(u&&!S.cloud&&!u.termsAccepted)await Store.patch('users',u.id,{termsAccepted:acceptedNow()})};
function termsGate(){const u=me();if(!u||S.admin||u.role==='admin'||u.demo||S.demo)return;if(u.termsAccepted?.version===TERMS_VERSION||$('.overlay'))return;
  modal(`<h3>We’ve updated our terms</h3><p class="muted small" style="margin:6px 0 10px">Please read and accept the new version (${TERMS_EFFECTIVE}) to keep using Enivel. The most important points:</p><div class="card soft small" style="max-height:38vh;overflow:auto">${legalDoc('key-terms').body(LX())}</div>
  <label class="small" style="display:flex;gap:8px;margin-top:12px;line-height:1.45"><input type="checkbox" id="tg-ok"> I accept the <a href="#" data-doc="terms">Terms</a>, <a href="#" data-doc="privacy">Privacy Policy</a>, <a href="#" data-doc="safeguarding">Child Safeguarding Policy</a>${u.role==='driver'?` and <a href="#" data-doc="driver">Driver Agreement</a>`:` and <a href="#" data-doc="parent">Parent Terms</a>`}.</label>
  <div class="row" style="margin-top:12px"><button class="btn" id="tg-go">Accept and continue</button><button class="btn ghost" id="tg-no">Log out</button></div>`,m=>{legalLinks(m);$('#tg-go',m).onclick=async()=>{if(!$('#tg-ok',m).checked)return toast('Tick the box to accept');await Store.patch('users',me().id,{termsAccepted:acceptedNow()});closeModal();toast('Thanks. Terms accepted.')};$('#tg-no',m).onclick=()=>{closeModal();logout()}})}
const _renderL=render;render=function(){_renderL();if(S.session&&me()&&!['doc','legal','privacy','terms','safety'].includes(S.route))setTimeout(termsGate,600)};
/* ---------- child consent (POPIA s35) ---------- */
const _addKidL=addKid;addKid=function(id){_addKidL(id);const m=$('.modal');if(!m)return;const k=id?Store.get('kids',id):null;const b=$('#k-save',m);if(!b)return;
  b.insertAdjacentHTML('beforebegin',`<label class="tiny" style="display:flex;gap:8px;line-height:1.45"><input type="checkbox" id="k-consent" ${k?.consent?'checked':''}> I am this child’s parent or legal guardian and I consent to Enivel processing their information for transport and safety, as set out in the <a href="#" data-doc="privacy" data-sec="p6">Privacy Policy</a>.</label>`);legalLinks(m);

async function processWaitlist(){const u=me();if(!u||u.role!=='driver')return;for(const r of myRoutes()){const open=r.seats-routeSeatsUsed(r.id);const list=Store.all('waitlist').filter(w=>w.routeId===r.id).sort((a,b)=>a.ts-b.ts);
  for(const w of list.filter(w=>w.status==='offered'&&Date.now()-(w.offeredAt||0)>24*3600000))await Store.patch('waitlist',w.id,{status:'expired'});
  const offered=list.filter(w=>w.status==='offered'&&Date.now()-(w.offeredAt||0)<=24*3600000).length;let free=open-offered;for(const w of list.filter(w=>w.status==='waiting')){if(free<=0)break;await Store.patch('waitlist',w.id,{status:'offered',offeredAt:Date.now()});await notify(w.parentId,`A seat opened on ${r.name}. You have 24 hours to book it.`,'info','p-find');free--}}}
const _droutesR9=VIEWS['d-routes'];VIEWS['d-routes']=()=>{let html=_droutesR9();for(const r of myRoutes()){const n=Store.all('waitlist').filter(w=>w.routeId===r.id&&w.status==='waiting').length;if(n)html=html.replace(`<b>${h(r.name)}</b>`,`<b>${h(r.name)}</b> <span class="chip-on">${n} waiting</span>`)}return html};
let wlT=0;const _renderWLR9=render;render=function(){_renderWLR9();const u=me();if(u?.role==='driver'&&S.ready&&Date.now()-wlT>60000){wlT=Date.now();setTimeout(()=>processWaitlist().catch(()=>{}),2000)}};
/* notifications: handover label */
const _notifsR9=VIEWS.notifs;VIEWS.notifs=()=>_notifsR9().replace(/<span class="pill ">Info<\/span>(<div class="grow"><div[^>]*>[^<]*needs a handover confirmation)/g,'<span class="pill warn">Handover</span>$1');
</script>
<script>
/* where a pickup / drop-off happens: morning home→school, afternoon school→home, once-off from→to */
function atSchoolNow(b,k){if(b.once)return false;const r=routeOf(b.routeId);const live=r?.live;const school=k.schoolGeo||r?.schoolGeo;if(live?.gps&&k.geo&&school)return distM(live,school)<distM(live,k.geo);return kidStatus(k).today.some(e=>e.type==='dropoff')}
function stopPoint(b,k,type){const r=routeOf(b.routeId)||{};const school=k.schoolGeo||r.schoolGeo||null;if(b.once)return type==='pickup'?(b.fromGeo||k.geo):(b.toGeo||school);
  if(type==='pickup')return atSchoolNow(b,k)?(school||k.geo):(k.geo||null);return isHomeDrop(b,k)?(k.geo||null):(school||null)}
function stopLabel(b,k,type){const r=routeOf(b.routeId)||{};if(b.once)return type==='pickup'?(b.from||k.pickup):(b.to||r.schools);if(type==='pickup')return atSchoolNow(b,k)?(k.school||r.schools):k.pickup;return isHomeDrop(b,k)?(k.pickup||'home'):(k.school||r.schools)}
</script>
<style>
.sug .sch{display:flex;gap:10px;align-items:flex-start}
.sug .sch .ic{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--acc3) 16%,transparent);color:var(--acc3);display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.sug .sch .ic svg{width:15px;height:15px}
.sug .sch .loc{display:block;color:var(--fg3);font-size:.75rem;margin-top:1px}
.sug .tag{display:inline-block;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--bg2);color:var(--fg2);margin-left:6px;vertical-align:1px}
.sug .grp{padding:6px 12px 2px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);cursor:default;border:0}
.sug mark{background:none;color:inherit;font-weight:800}

<script>
/* ===================== live school suggestions (with location) ===================== */
ICON.school='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>';
const SCHOOL_TYPES=/^(school|college|university|kindergarten|childcare|music_school|language_school)$/;
const placeCache=new Map();
function placeLoc(a){if(!a)return '';const sub=a.suburb||a.neighbourhood||a.residential||a.quarter||a.hamlet||'';const city=a.city||a.town||a.village||a.municipality||'';return [sub,city,a.state].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(', ')}
async function nomi(q){if(placeCache.has(q))return placeCache.get(q);const pr=fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=za&dedupe=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}}).then(r=>r.ok?r.json():[]).catch(()=>null);placeCache.set(q,pr);const res=await pr;if(res===null)placeCache.delete(q);return res}
async function suggestSchools(q){const tries=[q];if(!/school|college|primary|secondary|high|laerskool|hoërskool|hoerskool|academy|preparatory|prep|cr[eè]che|kindergarten|university/i.test(q))tries.push(q+' school');const lists=await Promise.all(tries.map(nomi));if(lists.every(l=>l===null))return null;const seen=new Set();const out=[];
  for(const x of lists.flat().filter(Boolean)){const key=x.osm_type+x.osm_id;if(seen.has(key))continue;seen.add(key);const isSchool=x.category==='amenity'&&SCHOOL_TYPES.test(x.type)||x.addresstype==='amenity'&&SCHOOL_TYPES.test(x.type);out.push({lat:+x.lat,lng:+x.lon,name:x.name||x.display_name.split(',')[0],type:x.type,isSchool,loc:placeLoc(x.address),full:fmtAddr(x.address)||x.display_name,address:x.address})}
  return out.sort((a,b)=>(b.isSchool-a.isSchool)).slice(0,8)}
function routeSchoolHits(q){q=q.toLowerCase();const hits=new Map();for(const r of Store.all('routes').filter(r=>r.active&&isVerified(Store.get('users',r.driverId)))){for(const part of String(r.schools||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean))if(part.toLowerCase().includes(q))hits.set('s:'+part.toLowerCase(),{name:part,kind:'school',n:(hits.get('s:'+part.toLowerCase())?.n||0)+1});for(const part of String(r.area||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean))if(part.toLowerCase().includes(q))hits.set('a:'+part.toLowerCase(),{name:part,kind:'area',n:(hits.get('a:'+part.toLowerCase())?.n||0)+1})}return [...hits.values()].sort((a,b)=>b.n-a.n).slice(0,6)}
function markQ(text,q){const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0||!q)return h(text);return h(text.slice(0,i))+'<mark>'+h(text.slice(i,i+q.length))+'</mark>'+h(text.slice(i+q.length))}
/* one suggestion box for: school fields (places), and route search bars (schools/areas we serve + places) */
function attachSchoolSuggest(input,mode){if(input.dataset.sug)return;input.dataset.sug='1';input.autocomplete='off';const wrap=document.createElement('div');wrap.className='sugwrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const box=document.createElement('div');box.className='sug';box.hidden=true;wrap.appendChild(box);let t,seq=0,items=[],idx=-1;
  const close=()=>{box.hidden=true;idx=-1};
  const pick=it=>{close();if(it.kind){input.value=it.name;if(mode==='home')goSearch(it.name);else{S.filters.q=it.name;render()}return}
    input.value=it.name;input.dataset.geo=JSON.stringify({lat:it.lat,lng:it.lng,label:it.name+(it.loc?', '+it.loc:''),address:it.address});input.dataset.loc=it.loc||'';let ok=wrap.querySelector('.addrok');if(!ok){ok=document.createElement('span');ok.className='addrok';wrap.appendChild(ok)}ok.innerHTML=ICON.check+' '+h(it.loc||'Pinned on the map');
    if(mode==='home'){goSearch(it.name)}else if(mode==='find'){S.filters.q=it.name;render()}input.dispatchEvent(new Event('change'))};
  const draw=(q,local,places)=>{const rows=[];let i=0;items=[];
    if(local.length){rows.push('<div class="grp">On Enivel routes</div>');for(const l of local){items.push(l);rows.push(`<div class="${i===idx?'on':''}" data-i="${i++}"><div class="sch"><span class="ic">${l.kind==='school'?ICON.school:ICON.pin}</span><div><b>${markQ(l.name,q)}<span class="tag">${l.n} route${l.n>1?'s':''}</span></b><span class="loc">${l.kind==='school'?'School served by Enivel drivers':'Pickup area'}</span></div></div></div>`)}}
    if(places===null)rows.push('<div class="st">Live school search needs the hosted Enivel app.</div>');else if(places==='loading')rows.push('<div class="st">Searching schools…</div>');else if(places.length){rows.push('<div class="grp">Schools and places</div>');for(const p of places){items.push(p);rows.push(`<div class="${i===idx?'on':''}" data-i="${i++}"><div class="sch"><span class="ic">${p.isSchool?ICON.school:ICON.pin}</span><div><b>${markQ(p.name,q)}${p.isSchool?'':`<span class="tag">${h(p.type.replace(/_/g,' '))}</span>`}</b><span class="loc">${h(p.loc||p.full)}</span></div></div></div>`)}}else if(!local.length)rows.push('<div class="st">No school found yet. Keep typing the name or add the suburb.</div>');
    box.innerHTML=rows.join('');box.hidden=false;box.querySelectorAll('[data-i]').forEach(el=>el.onmousedown=e=>{e.preventDefault();pick(items[+el.dataset.i])})};
  input.addEventListener('input',()=>{delete input.dataset.geo;wrap.querySelector('.addrok')?.remove();const q=input.value.trim();clearTimeout(t);if(q.length<2)return close();const local=mode==='field'?[]:routeSchoolHits(q);draw(q,local,q.length>=3?'loading':[]);if(q.length<3)return;const my=++seq;t=setTimeout(async()=>{const res=await suggestSchools(q);if(my!==seq)return;idx=-1;draw(q,local,res)},260)});
  input.addEventListener('keydown',e=>{if(box.hidden||!items.length)return;if(e.key==='ArrowDown'){idx=Math.min(items.length-1,idx+1);box.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('on',+x.dataset.i===idx));e.preventDefault()}else if(e.key==='ArrowUp'){idx=Math.max(0,idx-1);box.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('on',+x.dataset.i===idx));e.preventDefault()}else if(e.key==='Enter'&&idx>=0){pick(items[idx]);e.preventDefault()}else if(e.key==='Escape')close()});
  input.addEventListener('blur',()=>setTimeout(close,150))}
const SCHOOL_IDS=['k-s','rq-s','r-sch'];
const _attachS=attachSuggest;attachSuggest=function(input){if(SCHOOL_IDS.includes(input.id)||input.dataset.school)return attachSchoolSuggest(input,'field');return _attachS(input)};
/* drop-off on the home journey is usually a school */
const _pickPlaceS=pickPlace;pickPlace=function(kind){if(kind==='dropoff'){const _a=attachSuggest;attachSuggest=function(i){if(i.id==='pl-v')i.dataset.school='1';return _a(i)};try{_pickPlaceS(kind)}finally{attachSuggest=_a}}else _pickPlaceS(kind)};
/* search bars on Home and Find */
const _renderSch=render;render=function(){_renderSch();const hq=document.getElementById('home-q');if(hq)attachSchoolSuggest(hq,'home');const fq=document.getElementById('f-q');if(fq)attachSchoolSuggest(fq,'find')};
/* the kid's school: keep the location too */
const _addKidS=addKid;addKid=function(id){_addKidS(id);const m=$('.modal');if(!m)return;const k=id?Store.get('kids',id):null;const si=$('#k-s',m);if(si&&k?.schoolLoc){si.insertAdjacentHTML('afterend',`<span class="addrok">${ICON.check} ${h(k.schoolLoc)}</span>`)}const b=$('#k-save',m);if(!b)return;const orig=b.onclick;b.onclick=async e=>{const loc=si?.dataset.loc;await orig.call(b,e);if(loc){const kid=id?Store.get('kids',id):Store.all('kids').filter(x=>x.parentId===me().id).sort((a,c)=>(c.createdAt||0)-(a.createdAt||0))[0];if(kid)await Store.patch('kids',kid.id,{schoolLoc:loc})}}};
</script>
