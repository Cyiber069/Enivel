<style>
.scene{position:relative;width:100%;max-width:100%;border-radius:var(--r);background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--line);overflow:hidden}
.scene svg{width:100%;height:auto;display:block}
.scene .hot{cursor:pointer}
.scene .hot:hover .glow,.scene .hot:focus .glow{opacity:1}
.scene .glow{opacity:0;transition:opacity .2s}
.scene .cap{font-family:var(--body);font-size:17px;font-weight:600;fill:var(--fg)}
.scene .sub{font-family:var(--body);font-size:13px;fill:var(--fg3)}
.scene .chip{fill:var(--ink)}.scene .chipt{font-family:var(--body);font-size:13px;font-weight:600;fill:var(--ink-fg)}
@media(prefers-reduced-motion:reduce){.scene animateMotion{display:none}}
.rides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ride{border:1px solid var(--line);border-radius:18px;padding:14px 12px;background:var(--bg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ride:hover{background:var(--bg2)}
.ride .ic{width:34px;height:34px;border-radius:12px;background:var(--bg2);display:grid;place-items:center}
.ride .ic svg{width:18px;height:18px}
.ride b{font-size:.9rem}.ride span{font-size:.74rem;color:var(--fg3)}
@media(max-width:420px){.rides{grid-template-columns:1fr 1fr}.rides .ride:last-child{grid-column:1/-1}}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--bg2);border-radius:999px;padding:6px 6px 6px 16px}
.searchbar>svg{width:20px;height:20px;flex-shrink:0;color:var(--fg3)}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;padding:8px 0;font-size:.95rem}
.searchbar button{flex-shrink:0}
.ring{width:72px;height:72px;flex-shrink:0}
.timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.timeline .ev{position:relative;padding:4px 0 10px}
.timeline .ev::before{content:"";position:absolute;left:-18px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg3);border:2px solid var(--bg)}
.timeline .ev.live::before{background:var(--live)}
.sos{background:var(--bad);color:#fff;border-color:var(--bad)}
.hdr{display:flex;flex-direction:column;gap:14px}
.wave{display:none;position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(180deg,transparent,var(--bg));pointer-events:none}
</style>
<script>
/* ===================== v3: splash, home journey scene, once-off trips, SOS, guardians ===================== */
const LOGO_SVG=ICON.pin; /* swap this for the final Enivel mark */
function showSplash(){if($('.splash'))return;const d=document.createElement('div');d.className='splash';d.innerHTML=`<div style="text-align:center"><div class="n">Enivel</div><div class="s">Safe scholar transport</div></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
(function(){const sess=ls.get('enivel_session');if(sess)showSplash()})();

function journey(){const u=me();return u?.journey||{}}
async function setJourney(p){await Store.patch('users',me().id,{journey:{...journey(),...p}})}
function sceneSVG(){const j=journey();const k=kidsOf(me().id);const onboard=k.some(x=>kidStatus(x).onboard);
  const cut=(t,n=22)=>t?(t.length>n?t.slice(0,n-1)+'…':t):'';
  return `<div class="scene"><svg viewBox="0 -50 640 380" role="img" aria-label="Your journey: pickup, stop, drop-off">
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".12"/></filter>
  <path id="road" d="M150 300 C 240 300, 240 215, 300 196 S 470 150, 580 92"/></defs>
  <ellipse cx="330" cy="235" rx="300" ry="78" fill="var(--s1)"/>
  <use href="#road" stroke="var(--s2)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <use href="#road" stroke="var(--s6)" stroke-width="2" stroke-dasharray="10 12" fill="none" opacity=".9"/>
  <!-- house -->
  <g class="hot" tabindex="0" onclick="pickPlace('pickup')" onkeydown="if(event.key==='Enter')pickPlace('pickup')" filter="url(#sh)">
    <circle class="glow" cx="92" cy="200" r="70" fill="var(--ink)" opacity="0" style="opacity:0;fill-opacity:.06"/>
    <polygon points="50,210 92,232 92,172 50,150" fill="var(--s4)"/><polygon points="92,232 134,210 134,150 92,172" fill="var(--s3)"/>
    <polygon points="50,150 92,172 134,150 92,128" fill="var(--s5)"/><polygon points="50,150 92,128 92,100 50,122" fill="var(--s5)"/><polygon points="134,150 92,128 92,100 134,122" fill="var(--s4)"/>
    <rect x="100" y="190" width="10" height="16" fill="var(--s5)"/><rect x="60" y="178" width="10" height="10" fill="var(--s6)"/><rect x="116" y="176" width="10" height="10" fill="var(--s6)"/>
    <rect x="36" y="244" width="112" height="22" rx="11" class="chip"/><text x="92" y="259" text-anchor="middle" class="chipt">${j.pickup?'Pickup set':'Set pickup'}</text>
    <text x="92" y="290" text-anchor="middle" class="cap">Home</text><text x="92" y="306" text-anchor="middle" class="sub">${h(cut(j.pickup)||'Tap to add pickup address')}</text>
  </g>
  <!-- extra stop -->
  <g class="hot" tabindex="0" onclick="pickPlace('stop')" onkeydown="if(event.key==='Enter')pickPlace('stop')">
    <circle class="glow" cx="330" cy="150" r="50" style="fill:var(--ink);fill-opacity:.06"/>
    <circle cx="330" cy="150" r="22" fill="var(--bg)" stroke="var(--s5)" stroke-width="2" stroke-dasharray="${j.stop?'0':'5 4'}"/>
    ${j.stop?`<path d="M330 162 c -8 -10 -10 -14 -10 -19 a10 10 0 0 1 20 0 c0 5 -2 9 -10 19z" fill="var(--ink)"/>`:`<path d="M330 141v18M321 150h18" stroke="var(--s5)" stroke-width="3" stroke-linecap="round"/>`}
    <text x="330" y="108" text-anchor="middle" class="cap">${j.stop?'Stop':'Add a stop'}</text><text x="330" y="126" text-anchor="middle" class="sub">${h(cut(j.stop,26)||'Aftercare, gran, sports')}</text>
  </g>
  <!-- school -->
  <g class="hot" tabindex="0" onclick="pickPlace('dropoff')" onkeydown="if(event.key==='Enter')pickPlace('dropoff')" filter="url(#sh)">
    <circle class="glow" cx="560" cy="70" r="80" style="fill:var(--ink);fill-opacity:.06"/>
    <polygon points="488,92 560,128 560,62 488,26" fill="var(--s4)"/><polygon points="560,128 632,92 632,26 560,62" fill="var(--s3)"/><polygon points="488,26 560,62 632,26 560,-10" fill="var(--s5)"/>
    ${[0,1,2].map(i=>`<rect x="${498+i*18}" y="${52+i*9}" width="9" height="11" fill="var(--s6)"/><rect x="${572+i*18}" y="${78-i*9}" width="9" height="11" fill="var(--s6)"/>`).join('')}
    <rect x="552" y="100" width="12" height="20" fill="var(--s5)"/>
    <line x1="560" y1="-8" x2="560" y2="-40" stroke="var(--s5)" stroke-width="2"/><polygon points="560,-40 582,-33 560,-26" fill="var(--ink)"/>
    <rect x="504" y="140" width="112" height="22" rx="11" class="chip"/><text x="560" y="155" text-anchor="middle" class="chipt">${j.dropoff?'Drop-off set':'Set drop-off'}</text>
    <text x="560" y="186" text-anchor="middle" class="cap">School</text><text x="560" y="202" text-anchor="middle" class="sub">${h(cut(j.dropoff)||'Tap to choose school')}</text>
  </g>
  <!-- car -->
  <g filter="url(#sh)"><g transform="translate(-16,-9)"><rect width="32" height="18" rx="6" fill="${onboard?'var(--live)':'var(--ink)'}"/><rect x="7" y="3" width="18" height="7" rx="2" fill="var(--s6)" opacity=".9"/><circle cx="8" cy="18" r="3" fill="var(--s5)"/><circle cx="24" cy="18" r="3" fill="var(--s5)"/></g>
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto"><mpath href="#road"/></animateMotion></g>
  </svg><div class="wave"></div></div>`}
function pickPlace(kind){const kids=kidsOf(me().id);const j=journey();const title={pickup:'Pickup address',dropoff:'Drop-off / school',stop:'Extra stop'}[kind];const opts=kind==='dropoff'?[...new Set(kids.map(k=>k.school).filter(Boolean))]:kind==='pickup'?[...new Set(kids.map(k=>k.pickup).filter(Boolean))]:['Aftercare','Gran\'s house','Sports practice'];
  modal(`<h3>${title}</h3><div class="stack" style="margin-top:12px">${opts.length?`<div class="row">${opts.map(o=>`<button class="pill" style="cursor:pointer" onclick="$('#pl-v').value=this.textContent">${h(o)}</button>`).join('')}</div>`:''}
  <div class="field"><label>${kind==='dropoff'?'School or address':'Address'}</label><input id="pl-v" value="${h(j[kind]||'')}" placeholder="${kind==='dropoff'?'e.g. Rietfontein Primary':'Street, suburb'}"></div>
  <div class="row"><button class="btn" id="pl-go">Save</button>${j[kind]?`<button class="btn ghost" id="pl-rm">Remove</button>`:''}</div></div>`,m=>{$('#pl-go',m).onclick=async()=>{await setJourney({[kind]:val(m,'pl-v').trim()});closeModal()};const rm=$('#pl-rm',m);if(rm)rm.onclick=async()=>{await setJourney({[kind]:''});closeModal()}})}
function minPrice(type){const rs=Store.all('routes').filter(r=>r.active&&(r.type||'shared')===type&&isVerified(Store.get('users',r.driverId)));return rs.length?Math.min(...rs.map(r=>r.price)):null}
function ringSVG(pct,label){const r=28,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">${label}</text></svg>`}
function goSearch(q){S.filters.q=q;S.filters.type=S.filters.type||'shared';go('p-find')}
function tripsOf(parentId){return Store.all('bookings').filter(b=>b.once&&b.parentId===parentId&&b.status==='trip').sort((a,b)=>(a.date||'').localeCompare(b.date||''))}

VIEWS['p-home']=()=>{const u=me();if(!u)return VIEWS.login();const kids=kidsOf(u.id);const n=myNotifs().slice(0,3);const j=journey();
  const hour=new Date().getHours();const greet=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  const bs=activeBookings(b=>b.parentId===u.id);const m=monthKey();const cost=bs.reduce((s,b)=>s+b.price,0);const due=cost+feeFor(cost);const paid=parentMonth(u,m).paidCost;
  const tripsThisMonth=Store.all('events').filter(e=>e.parentId===u.id&&e.type==='dropoff'&&monthKey(new Date(e.ts))===m).length;
  const shared=minPrice('shared'),priv=minPrice('private');const trips=tripsOf(u.id);
  return `<div class="stack" style="gap:18px">
  <div class="hdr"><div class="row between"><div><span class="eyebrow">${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</span><h2>${greet}, ${h(u.name.split(' ')[0])}</h2></div>${kids.length?`<div class="row">${kids.slice(0,3).map(k=>{const st=kidStatus(k);return `<span class="pill ${st.onboard?'live':st.today[0]?'info':''}" title="${h(k.name)}">${st.onboard?'<i class="blink"></i>':''}${h(k.name.split(' ')[0])}</span>`}).join('')}</div>`:''}</div>
  <form class="searchbar" onsubmit="event.preventDefault();goSearch(this.q.value)">${ICON.search}<input id="home-q" name="q" placeholder="Search area or school" value="${h(S.filters.q||'')}"><button type="button" class="btn sm ghost" onclick="go('p-find')">Filters</button><button class="btn sm">Search</button></form></div>
  ${needsParentId(u)?`<div class="notice"><b>Add your ID</b> before your first booking. <a href="#" onclick="event.preventDefault();go('p-more')">Add now</a></div>`:''}
  ${sceneSVG()}
  <div class="rides">
    <button class="ride" onclick="S.filters.type='shared';goSearch(journey().dropoff||'')"><span class="ic">${ICON.users}</span><b>Shared</b><span>${shared?'from '+money(shared)+'/mo':'Monthly routes'}</span></button>
    <button class="ride" onclick="S.filters.type='private';goSearch(journey().dropoff||'')"><span class="ic">${ICON.star}</span><b>Private chauffeur</b><span>${priv?'from '+money(priv)+'/mo':'Only your kids'}</span></button>
    <button class="ride" onclick="onceTrip()"><span class="ic">${ICON.bolt}</span><b>Once-off trip</b><span>Pick a date and time</span></button>
  </div>
  ${kids.length?`<div class="grid g2">${kids.map(k=>{const st=kidStatus(k);const b=bookingOf(k);const r=b&&routeOf(b.routeId);const drv=b&&Store.get('users',b.driverId);
    return `<div class="card"><div class="row between"><div class="row"><span class="avatar">${initials(k.name)}</span><div><div style="font-weight:600">${h(k.name)}</div><div class="tiny muted">${k.age} yrs · ${h(k.school||'School not set')}</div></div></div>${st.onboard?'<span class="pill live"><i class="blink"></i>On board</span>':st.today[0]?.type==='dropoff'?'<span class="pill info">At school</span>':b?'<span class="pill">Booked</span>':'<span class="pill warn">No transport</span>'}</div>
    ${b?`<div class="small" style="margin-top:12px"><b>${h(drv?.name||'')}</b> · ${h(r?.vehicleLabel||'')} · ${h(r?.plate||'')}</div>
      ${st.today.length?`<div class="timeline" style="margin-top:10px">${[...st.today].reverse().map(e=>`<div class="ev ${e.type==='pickup'?'live':''} small">${e.type==='pickup'?'Picked up':'Dropped off'} <span class="muted">${fmtT(e.ts)}</span></div>`).join('')}</div>`:`<div class="tiny muted" style="margin-top:6px">Next pickup ${h(r?.pickupTime||'')}</div>`}
      <div class="row" style="margin-top:12px">${st.onboard?`<button class="btn sm live" onclick="go('p-track',{trackKid:'${k.id}'})">${ICON.pin} Track</button>`:''}<button class="btn sm ghost" onclick="openChat('${b.driverId}')">${ICON.chat} Chat</button><button class="btn sm ghost" onclick="go('p-booking',{bookingId:'${b.id}'})">Details</button></div>`
    :`<div class="row" style="margin-top:12px"><button class="btn sm" onclick="go('p-find',{findKid:'${k.id}'})">Find transport</button></div>`}</div>`}).join('')}</div>`
  :`<div class="card soft" style="text-align:center;padding:26px"><h3>Add your first child</h3><p class="muted small" style="margin:6px 0 14px">Name and age is enough.</p><button class="btn" onclick="addKid()">Add child</button></div>`}
  ${trips.length?`<div class="card"><h3>Once-off trips</h3><div class="list" style="margin-top:6px">${trips.map(b=>{const k=Store.get('kids',b.kidId);const st=kidStatus(k);return `<div class="item"><span class="avatar sm">${initials(k?.name)}</span><div class="grow small"><b>${h(k?.name)}</b> · ${h(b.date)} ${h(b.time)}<div class="tiny muted">${h(b.from)} → ${h(b.to)} · ${h(userName(b.driverId))} · ${money(b.price)}</div></div>${st.onboard?`<button class="btn sm live" onclick="go('p-track',{trackKid:'${k.id}'})">Track</button>`:`<button class="btn sm ghost" onclick="openChat('${b.driverId}')">${ICON.chat}</button>`}</div>`}).join('')}</div></div>`:''}
  <div class="grid g2">
    <div class="card"><div class="row" style="gap:14px">${ringSVG(due?Math.min(1,paid/cost||0):0,due?Math.round(Math.min(1,paid/cost||0)*100)+'%':'—')}<div class="grow"><div class="eyebrow">${new Date().toLocaleDateString('en-ZA',{month:'long'})}</div><div style="font-weight:600">${due?money(due)+' due':'No subscription'}</div><div class="tiny muted">${due?(paid>=cost?'Paid':'Includes 2% Enivel fee'):'Choose a ride above'}</div></div>${due&&paid<cost?`<button class="btn sm" onclick="go('p-pay')">Pay</button>`:''}</div></div>
    <div class="card"><div class="row" style="gap:14px">${ringSVG(Math.min(1,tripsThisMonth/40),tripsThisMonth)}<div class="grow"><div class="eyebrow">Trips this month</div><div style="font-weight:600">${tripsThisMonth?tripsThisMonth+' safe drop-offs':'No trips yet'}</div><div class="tiny muted">Every one logged with a time.</div></div></div></div>
  </div>
  <div class="card"><div class="row between"><h3>Alerts</h3><button class="btn sm ghost" onclick="go('notifs')">All</button></div><div class="list" style="margin-top:4px">${n.length?n.map(x=>`<div class="item small"><div class="grow">${h(x.text)}<div class="tiny muted">${fmtDT(x.ts)}</div></div></div>`).join(''):'<p class="muted small">No alerts yet.</p>'}</div></div></div>`};

function onceTrip(){const u=me();const kids=kidsOf(u.id);if(!kids.length)return addKid();const j=journey();const d=localKey(new Date(Date.now()+864e5));
  modal(`<h3>Once-off trip</h3><p class="muted small">A verified driver for a single trip. Drivers send a price, you accept one.</p><div class="stack" style="margin-top:12px"><div class="row" id="ot-kids">${kids.map(k=>`<button class="kidchip" data-k="${k.id}"><span class="avatar">${initials(k.name)}</span>${h(k.name)}</button>`).join('')}</div>
  <div class="field"><label>From</label><input id="ot-f" value="${h(j.pickup||kids[0].pickup||'')}"></div><div class="field"><label>To</label><input id="ot-t" value="${h(j.stop||j.dropoff||kids[0].school||'')}"></div>
  <div class="grid g3"><div class="field"><label>Date</label><input id="ot-d" type="date" value="${d}"></div><div class="field"><label>Time</label><input id="ot-tm" type="time" value="14:00"></div><div class="field"><label>Budget</label><input id="ot-b" type="number" value="150"></div></div>
  <button class="btn wide" id="ot-go">Request trip</button></div>`,m=>{const sel=new Set();m.querySelectorAll('.kidchip').forEach(b=>b.onclick=()=>{sel.has(b.dataset.k)?sel.delete(b.dataset.k):sel.add(b.dataset.k);b.classList.toggle('on')});$('#ot-go',m).onclick=async()=>{if(!sel.size)return toast('Choose a child');if(!val(m,'ot-f')||!val(m,'ot-t'))return toast('From and to are required');await Store.put('requests',uid(),{parentId:u.id,kidIds:[...sel],type:'once',from:val(m,'ot-f'),to:val(m,'ot-t'),area:val(m,'ot-f'),school:val(m,'ot-t'),date:val(m,'ot-d'),time:val(m,'ot-tm'),budget:+val(m,'ot-b'),times:'',status:'open',ts:Date.now()});for(const d of Store.all('users').filter(x=>x.role==='driver'&&isVerified(x)))await notify(d.id,`Once-off trip request: ${val(m,'ot-f')} → ${val(m,'ot-t')} on ${val(m,'ot-d')} ${val(m,'ot-tm')}, budget ${money(+val(m,'ot-b'))}.`,'info','d-requests');closeModal();go('p-requests');toast('Trip requested. Offers will appear here.')}})}

/* bookings: include once-off trips when a child is on one */
const _bookingOf=bookingOf;bookingOf=function(kid){return _bookingOf(kid)||Store.all('bookings').find(b=>b.once&&b.kidId===kid.id&&b.status==='trip')};
markEvent=async function(bookingId,type){const b=Store.get('bookings',bookingId);const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId)||{};const where=stopLabel(b,k,type);const parent=Store.get('users',b.parentId);
  await Store.put('events',uid(),{type,kidId:k.id,bookingId,driverId:b.driverId,parentId:b.parentId,routeId:b.routeId,ts:Date.now(),where});
  const g=(parent?.guardians||[]).map(x=>x.name).join(', ');
  await notify(b.parentId,(type==='pickup'?`${k.name} was picked up by ${userName(b.driverId)} at ${fmtT(Date.now())}.`:`${k.name} was dropped off at ${where} at ${fmtT(Date.now())}.`)+(g?` Also sent to ${g}.`:''),type,'p-home');
  if(b.once&&type==='dropoff')await Store.patch('bookings',bookingId,{status:'done'});toast(`${k.name} marked ${type==='pickup'?'picked up':'dropped off'}`)};

/* driver home: once-off trips */
const _dhome=VIEWS['d-home'];VIEWS['d-home']=()=>{const u=me();const trips=Store.all('bookings').filter(b=>b.once&&b.driverId===u.id&&b.status==='trip').sort((a,b)=>(a.date||'').localeCompare(b.date||''));const base=_dhome();if(!trips.length)return base;
  const card=`<div class="card"><h3>Once-off trips</h3><div class="list" style="margin-top:6px">${trips.map(b=>{const k=Store.get('kids',b.kidId);const st=kidStatus(k);return `<div class="item"><span class="avatar sm">${initials(k?.name)}</span><div class="grow small"><b>${h(k?.name)}</b> · ${h(b.date)} ${h(b.time)} · ${money(b.price)}<div class="tiny muted">${h(b.from)} → ${h(b.to)} · ${h(userName(b.parentId))}</div></div>${st.onboard?`<button class="btn sm" onclick="markEvent('${b.id}','dropoff')">Drop off</button>`:`<button class="btn sm live" onclick="markEvent('${b.id}','pickup')">Pick up</button>`}</div>`}).join('')}</div></div>`;
  return base.replace('<div class="grid g2"><div class="card"><h3>Open requests',card+'<div class="grid g2"><div class="card"><h3>Open requests')};

/* SOS */
function sosBtn(){return `<button class="btn sm sos fab" onclick="sos()">SOS</button>`}
function sos(){modal(`<h3 style="color:var(--bad)">Emergency</h3><p class="small" style="margin:8px 0">Police <b>10111</b> · Ambulance <b>10177</b> · Cell emergency <b>112</b></p><p class="muted small">Alerting Enivel sends your account, the trip and the time to our safety team immediately.</p><div class="row" style="margin-top:14px"><button class="btn sos" id="sos-go">Alert Enivel now</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`,m=>{$('#sos-go',m).onclick=async()=>{await Store.put('events',uid(),{type:'report',sos:true,by:me().id,text:'🚨 SOS raised by '+me().name+' ('+me().role+')',ts:Date.now()});await notify('admin','🚨 SOS from '+me().name+' ('+me().role+'). Open reports now.','info','a-reports');closeModal();toast('Enivel safety team alerted')}})}
for(const r of ['p-track','d-trip']){const f=VIEWS[r];VIEWS[r]=()=>f()+sosBtn()}

/* guardians */
const _pmore=VIEWS['p-more'];VIEWS['p-more']=()=>{const u=me();const gs=u.guardians||[];return _pmore()+`<div class="card" style="margin-top:14px"><div class="row between"><h3>Trusted guardians</h3><button class="btn sm ghost" onclick="addGuardian()">Add</button></div><p class="tiny muted" style="margin:4px 0 8px">They are named on every pickup and drop-off alert.</p><div class="list">${gs.map((g,i)=>`<div class="item small"><div class="grow"><b>${h(g.name)}</b> · ${h(g.phone)}</div><button class="btn sm ghost" onclick="removeGuardian(${i})">Remove</button></div>`).join('')||'<p class="muted small">None yet.</p>'}</div></div>`};
function addGuardian(){modal(`<h3>Add guardian</h3><div class="stack" style="margin-top:12px"><div class="field"><label>Name</label><input id="g-n" placeholder="e.g. Gogo Mokoena"></div><div class="field"><label>Cellphone</label><input id="g-p" placeholder="072 000 0000"></div><button class="btn wide" id="g-go">Save</button></div>`,m=>{$('#g-go',m).onclick=async()=>{const name=val(m,'g-n').trim(),phone=val(m,'g-p').trim();if(!name||!phone)return toast('Name and phone are required');await Store.patch('users',me().id,{guardians:[...(me().guardians||[]),{name,phone}]});closeModal();toast('Guardian added')}})}
async function removeGuardian(i){const gs=[...(me().guardians||[])];gs.splice(i,1);await Store.patch('users',me().id,{guardians:gs})}
</script>
<style>
.otp{font-size:1.9rem;letter-spacing:.5em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sms{background:var(--bg2);border-radius:14px;padding:12px 14px;font-size:.85rem;display:flex;gap:10px;align-items:flex-start}
.sms .bub{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;flex-shrink:0}
.sms .bub svg{width:16px;height:16px}
.week{display:flex;gap:6px;align-items:center}
.week i{width:22px;height:22px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-style:normal;font-size:.62rem;font-weight:600;color:var(--fg3)}
.week i.ok{background:var(--live);color:#fff}.week i.skip{background:var(--warn);color:#fff}.week i.today{outline:2px solid var(--ink);outline-offset:1px}
.scene .pulse{animation:pulse 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.scene .tree{transition:transform .3s}
.score{display:inline-flex;align-items:center;gap:6px}
.stopn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--ink-fg);font-size:.72rem;font-weight:700}
.twofa{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;cursor:pointer}
.twofa.on{border-color:var(--ink);background:var(--bg2)}
.twofa .ic{width:38px;height:38px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;flex-shrink:0}
.twofa .ic svg{width:20px;height:20px}
.credit{background:color-mix(in srgb,var(--live) 12%,transparent);color:var(--live);border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:600}
</style>
<script>
/* ===================== v4: validation, OTP, 2FA, intro, scene, extras ===================== */
const validEmail=e=>/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(e.trim());
function normPhone(p){p=(p||'').replace(/[\s\-()]/g,'');if(/^0[6-8]\d{8}$/.test(p))return '+27'+p.slice(1);if(/^\+27[6-8]\d{8}$/.test(p))return p;if(/^27[6-8]\d{8}$/.test(p))return '+'+p;return null}
const prettyPhone=p=>p?p.replace(/^\+27(\d{2})(\d{3})(\d{4})$/,'0$1 $2 $3'):'';
function otpModal(phone,title,onOk){const code=String(Math.floor(100000+Math.random()*900000));S.otp={code,phone,exp:Date.now()+5*60000};
  modal(`<h3>${h(title||'Verify your phone')}</h3><p class="muted small" style="margin:6px 0 12px">Enter the 6-digit code sent by SMS to <b>${prettyPhone(phone)}</b>.</p>
  <div class="sms"><span class="bub">${ICON.chat}</span><div><b>Test mode</b> · SMS gateway not connected yet, so here is your code: <b style="letter-spacing:.15em">${code}</b></div></div>
  <div class="field" style="margin-top:14px"><input id="otp-in" class="otp" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="otp-go">Verify</button><button class="btn ghost" id="otp-re">Resend</button></div>`,m=>{const i=$('#otp-in',m);i.focus();const check=async()=>{if(i.value.trim()!==S.otp.code)return toast('Wrong code, try again');if(Date.now()>S.otp.exp)return toast('Code expired, resend');closeModal();await onOk()};i.oninput=()=>{if(i.value.length===6)check()};$('#otp-go',m).onclick=check;$('#otp-re',m).onclick=()=>otpModal(phone,title,onOk)})}
function refCodeFor(name){return (name.replace(/[^a-z]/gi,'').slice(0,4).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase()).padEnd(8,'X')}

const _register=register;
register=async function(form){const email=form.email.trim().toLowerCase();if(!validEmail(email))return toast('Enter a real email address, like name@gmail.com');
  const phone=normPhone(form.phone);if(!phone)return toast('Enter a valid South African cellphone, e.g. 072 123 4567');
  if(Store.all('users').some(u=>u.email===email))return toast('That email is already registered');if(Store.all('users').some(u=>u.phone===phone))return toast('That phone number already has an account');
  if(!form.name.trim().includes(' '))return toast('Enter your full name (first and last)');if(form.password.length<6)return toast('Password needs at least 6 characters');
  const ref=(form.ref||'').trim().toUpperCase();const referrer=ref?Store.all('users').find(u=>u.refCode===ref):null;if(ref&&!referrer)return toast('That referral code is not valid');
  otpModal(phone,'Verify your phone',async()=>{await _register({...form,phone});const u=me();if(!u)return;await Store.patch('users',u.id,{phone,phoneVerified:true,refCode:refCodeFor(u.name),credit:referrer?50:0,referredBy:referrer?.id||null});
    if(referrer){await Store.patch('users',referrer.id,{credit:(referrer.credit||0)+50});await notify(referrer.id,`${u.name} joined with your code. R50 credit added.`,'pay');await notify(u.id,'R50 welcome credit added for using a referral code.','pay')}
    setTimeout(()=>twoFaPrompt(),600)})};
function twoFaPrompt(){let choice='sms';modal(`<h3>Protect your account</h3><p class="muted small" style="margin:6px 0 14px">Add two-step verification? Every login will also need a code.</p>
  <div class="stack"><div class="twofa on" data-v="sms"><span class="ic">${ICON.phone}</span><div><b>SMS code</b><div class="tiny muted">Sent to ${prettyPhone(me().phone)}</div></div></div>
  <div class="twofa" data-v="pin"><span class="ic">${ICON.lock}</span><div><b>Security PIN</b><div class="tiny muted">A 4-digit PIN only you know</div></div></div>
  <div class="row"><button class="btn" id="tf-go">Turn on</button><button class="btn ghost" onclick="closeModal()">Not now</button></div></div>`,m=>{m.querySelectorAll('.twofa').forEach(el=>el.onclick=()=>{choice=el.dataset.v;m.querySelectorAll('.twofa').forEach(x=>x.classList.toggle('on',x===el))});$('#tf-go',m).onclick=()=>enableTwoFa(choice)})}
function enableTwoFa(kind){if(kind==='pin'){modal(`<h3>Choose a 4-digit PIN</h3><div class="field" style="margin-top:12px"><input id="pin-in" class="otp" inputmode="numeric" maxlength="4" type="password" placeholder="••••"></div><button class="btn wide" style="margin-top:12px" id="pin-go">Save PIN</button>`,m=>{$('#pin-go',m).onclick=async()=>{const v=val(m,'pin-in');if(!/^\d{4}$/.test(v))return toast('PIN must be 4 digits');await Store.patch('users',me().id,{twoFactor:'pin',pinHash:await sha('pin:'+v)});closeModal();toast('Two-step verification on')}})}
  else otpModal(me().phone,'Confirm your phone',async()=>{await Store.patch('users',me().id,{twoFactor:'sms',phoneVerified:true});toast('Two-step verification on')})}
async function disableTwoFa(){await Store.patch('users',me().id,{twoFactor:null,pinHash:null});toast('Two-step verification off')}
function pinModal(u,onOk){modal(`<h3>Enter your PIN</h3><p class="muted small" style="margin:6px 0 12px">Two-step verification is on for this account.</p><div class="field"><input id="pin-in" class="otp" inputmode="numeric" maxlength="4" type="password" placeholder="••••"></div><button class="btn wide" style="margin-top:12px" id="pin-go">Continue</button>`,m=>{const i=$('#pin-in',m);i.focus();const check=async()=>{if(await sha('pin:'+i.value)!==u.pinHash)return toast('Wrong PIN');closeModal();onOk()};i.oninput=()=>{if(i.value.length===4)check()};$('#pin-go',m).onclick=check})}
function finishLogin(u){S.session={userId:u.id};ls.set('enivel_session',S.session);go(u.role==='driver'?'d-home':'p-home')}
login=async function(email,password){email=email.trim().toLowerCase();const hash=await sha(password);
  if(email===ADMIN_EMAIL){if(hash!==ADMIN_HASH)return toast('Wrong admin password');let u=Store.all('users').find(x=>x.email===ADMIN_EMAIL);if(!u){u={id:'admin',name:'Enivel Admin',email:ADMIN_EMAIL,role:'admin',createdAt:Date.now(),verification:{status:'approved'}};await Store.put('users','admin',u)}const done=()=>{S.admin=true;ls.set('enivel_admin',true);S.session={userId:u.id};ls.set('enivel_session',S.session);go('a-home')};if(u.twoFactor==='pin')return pinModal(u,done);if(u.twoFactor==='sms')return otpModal(u.phone,'Admin verification',done);return done()}
  const u=Store.all('users').find(x=>x.email===email);if(!u||u.password!==hash)return toast('Email or password is wrong');if(u.banned)return toast('This account has been permanently banned.');if(u.suspended)return toast('This account is suspended. Contact support@enivel.co.za');
  if(u.twoFactor==='pin')return pinModal(u,()=>finishLogin(u));if(u.twoFactor==='sms')return otpModal(u.phone,'Two-step verification',()=>finishLogin(u));finishLogin(u)};
function phoneLogin(){modal(`<h3>Log in with phone</h3><div class="field" style="margin-top:12px"><label>Cellphone</label><input id="pl-ph" inputmode="tel" placeholder="072 123 4567"></div><button class="btn wide" style="margin-top:12px" id="pl-go">Send code</button>`,m=>{$('#pl-go',m).onclick=()=>{const ph=normPhone(val(m,'pl-ph'));if(!ph)return toast('Enter a valid South African cellphone');const u=Store.all('users').find(x=>x.phone===ph);if(!u)return toast('No account with that number');if(u.suspended)return toast('This account is suspended');otpModal(ph,'Log in',()=>u.twoFactor==='pin'?pinModal(u,()=>finishLogin(u)):finishLogin(u))}})}

/* account: 2FA + referral + phone */
const _pmore2=VIEWS['p-more'],_dmore=VIEWS['d-more'];
function securityCard(){const u=me();return `<div class="card" style="margin-top:14px"><h3>Security</h3><div class="list" style="margin-top:6px"><div class="item small"><div class="grow">Two-step verification<div class="tiny muted">${u.twoFactor==='sms'?'SMS code on every login':u.twoFactor==='pin'?'PIN on every login':'Off'}</div></div>${u.twoFactor?`<button class="btn sm ghost" onclick="disableTwoFa()">Turn off</button>`:`<button class="btn sm" onclick="twoFaPrompt()">Turn on</button>`}</div>
  <div class="item small"><div class="grow">Phone ${prettyPhone(u.phone)||h(u.phone||'')}<div class="tiny muted">${u.phoneVerified?'Verified':'Not verified'}</div></div>${u.phoneVerified?'<span class="pill live">✓</span>':`<button class="btn sm ghost" onclick="otpModal(normPhone(me().phone)||me().phone,'Verify your phone',()=>Store.patch('users',me().id,{phoneVerified:true}))">Verify</button>`}</div>
  <div class="item small"><div class="grow">Referral code <b>${h(u.refCode||'')}</b><div class="tiny muted">You both get R50 credit when a friend joins.</div></div>${u.refCode?`<button class="btn sm ghost" onclick="navigator.clipboard?.writeText('${h(u.refCode)}').then(()=>toast('Copied')).catch(()=>toast('${h(u.refCode)}'))">Copy</button>`:`<button class="btn sm ghost" onclick="Store.patch('users',me().id,{refCode:refCodeFor(me().name)})">Create</button>`}</div>
  ${u.credit?`<div class="item small"><div class="grow">Credit</div><span class="credit">${money(u.credit)}</span></div>`:''}</div></div>`}
VIEWS['p-more']=()=>_pmore2()+securityCard();VIEWS['d-more']=()=>_dmore()+securityCard();
/* credit applied at monthly payment */
payMonth=function(){const u=me();const bs=activeBookings(b=>b.parentId===u.id);const cost=bs.reduce((s,b)=>s+b.price,0);const credit=Math.min(u.credit||0,feeFor(cost)+cost);payModal(cost+feeFor(cost)-credit,async()=>{for(const b of bs){await pushTx({type:'subscription',amount:b.price,from:u.id,to:b.driverId,bookingId:b.id,kidId:b.kidId,note:'Monthly transport'});await pushTx({type:'platform_fee',amount:feeFor(b.price),from:u.id,to:'enivel',bookingId:b.id,note:'2% platform fee'});await chargeDriverFeeIfDue(b.driverId)}if(credit)await Store.patch('users',u.id,{credit:(u.credit||0)-credit});closeModal();toast(credit?'Paid, '+money(credit)+' credit used':'Paid')})};

/* logo intro: centre → left */
function logoIntro(){const l=$('.top .logo');if(!l||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=l.getBoundingClientRect();const shift=innerWidth/2-(r.left+r.width/2);document.body.style.setProperty('--logo-shift',shift+'px');document.body.classList.add('intro');requestAnimationFrame(()=>setTimeout(()=>document.body.classList.remove('intro'),$('.splash')?1900:300))}
setTimeout(logoIntro,80);

/* richer journey scene */
sceneSVG=function(){const j=journey();const k=kidsOf(me().id);const onboard=k.some(x=>kidStatus(x).onboard);const cut=(t,n=22)=>t?(t.length>n?t.slice(0,n-1)+'…':t):'';
  const tree=(x,y,s=1)=>`<g class="tree" transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="26" rx="13" ry="4" fill="var(--s2)" opacity=".7"/><rect x="-2" y="14" width="4" height="12" fill="var(--s5)"/><polygon points="-14,16 0,-14 14,16" fill="var(--s4)"/><polygon points="-10,4 0,-14 10,4" fill="var(--s3)"/></g>`;
  return `<div class="scene"><svg viewBox="0 -50 640 370" role="img" aria-label="Your journey">
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".14"/></filter>
  <linearGradient id="gL" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--s3)"/><stop offset="1" stop-color="var(--s4)"/></linearGradient>
  <linearGradient id="gR" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="var(--s6)"/><stop offset="1" stop-color="var(--s3)"/></linearGradient>
  <linearGradient id="gRoof" x1="0" x2="1"><stop offset="0" stop-color="var(--s5)"/><stop offset="1" stop-color="var(--s4)"/></linearGradient>
  <radialGradient id="gG" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="var(--s1)"/><stop offset="1" stop-color="var(--bg)"/></radialGradient>
  <path id="road" d="M150 300 C 240 300, 240 215, 300 196 S 470 150, 580 92"/></defs>
  <ellipse cx="330" cy="235" rx="310" ry="84" fill="url(#gG)"/>
  <use href="#road" stroke="var(--s4)" stroke-width="36" stroke-linecap="round" fill="none" opacity=".5"/>
  <use href="#road" stroke="var(--s2)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <use href="#road" stroke="var(--s6)" stroke-width="2" stroke-dasharray="10 12" fill="none" opacity=".9"/>
  ${tree(200,110,.8)}${tree(430,235,.9)}${tree(480,50,.7)}${tree(40,296,.7)}${tree(250,280,.6)}
  <g class="hot" tabindex="0" onclick="pickPlace('pickup')" onkeydown="if(event.key==='Enter')pickPlace('pickup')">
    <circle class="glow" cx="92" cy="200" r="72" style="fill:var(--ink);fill-opacity:.06"/>
    <ellipse cx="92" cy="236" rx="52" ry="12" fill="var(--s2)" opacity=".7"/><ellipse cx="92" cy="282" rx="40" ry="8" fill="var(--s2)" opacity=".35"/>
    <g filter="url(#sh)"><polygon points="50,210 92,232 92,172 50,150" fill="url(#gL)"/><polygon points="92,232 134,210 134,150 92,172" fill="url(#gR)"/>
    <polygon points="50,150 92,172 134,150 92,128" fill="url(#gRoof)"/><polygon points="50,150 92,128 92,100 50,122" fill="var(--s5)"/><polygon points="134,150 92,128 92,100 134,122" fill="var(--s4)"/>
    <rect x="100" y="190" width="10" height="16" fill="var(--s5)"/><rect x="60" y="178" width="10" height="10" fill="var(--s6)"/><rect x="116" y="176" width="10" height="10" fill="var(--s6)"/><rect x="72" y="108" width="7" height="14" fill="var(--s4)"/></g>
    <rect x="36" y="244" width="112" height="24" rx="12" class="chip"/><text x="92" y="260" text-anchor="middle" class="chipt">${j.pickup?'✓ Pickup':'Set pickup'}</text>
    <text x="92" y="74" text-anchor="middle" class="cap">Home</text><text x="92" y="92" text-anchor="middle" class="sub">${h(cut(j.pickup)||'Tap to add address')}</text></g>
  <g class="hot" tabindex="0" onclick="pickPlace('stop')" onkeydown="if(event.key==='Enter')pickPlace('stop')">
    <circle class="glow" cx="330" cy="150" r="52" style="fill:var(--ink);fill-opacity:.06"/>
    <ellipse cx="330" cy="172" rx="22" ry="6" fill="var(--s2)" opacity=".7"/>
    <circle cx="330" cy="150" r="22" fill="var(--bg)" stroke="var(--s5)" stroke-width="2" stroke-dasharray="${j.stop?'0':'5 4'}"/>
    ${j.stop?`<path d="M330 162 c -8 -10 -10 -14 -10 -19 a10 10 0 0 1 20 0 c0 5 -2 9 -10 19z" fill="var(--ink)"/>`:`<path d="M330 141v18M321 150h18" stroke="var(--s5)" stroke-width="3" stroke-linecap="round"/>`}
    <text x="330" y="108" text-anchor="middle" class="cap">${j.stop?'Stop':'Add a stop'}</text><text x="330" y="126" text-anchor="middle" class="sub">${h(cut(j.stop,26)||'Aftercare, gran, sports')}</text></g>
  <g class="hot" tabindex="0" onclick="pickPlace('dropoff')" onkeydown="if(event.key==='Enter')pickPlace('dropoff')">
    <circle class="glow" cx="560" cy="70" r="84" style="fill:var(--ink);fill-opacity:.06"/>
    <ellipse cx="560" cy="130" rx="80" ry="14" fill="var(--s2)" opacity=".7"/>
    <g filter="url(#sh)"><polygon points="488,92 560,128 560,62 488,26" fill="url(#gL)"/><polygon points="560,128 632,92 632,26 560,62" fill="url(#gR)"/><polygon points="488,26 560,62 632,26 560,-10" fill="url(#gRoof)"/>
    ${[0,1,2].map(i=>`<rect x="${498+i*18}" y="${52+i*9}" width="9" height="11" fill="var(--s6)"/><rect x="${572+i*18}" y="${78-i*9}" width="9" height="11" fill="var(--s6)"/>`).join('')}
    <rect x="552" y="100" width="12" height="20" fill="var(--s5)"/><line x1="560" y1="-8" x2="560" y2="-40" stroke="var(--s5)" stroke-width="2"/><polygon points="560,-40 582,-33 560,-26" fill="var(--ink)"/></g>
    <rect x="504" y="140" width="112" height="24" rx="12" class="chip"/><text x="560" y="156" text-anchor="middle" class="chipt">${j.dropoff?'✓ Drop-off':'Set drop-off'}</text>
    <text x="560" y="188" text-anchor="middle" class="cap">School</text><text x="560" y="206" text-anchor="middle" class="sub">${h(cut(j.dropoff)||'Tap to choose school')}</text></g>
  <g><g transform="translate(-16,-9)">${onboard?'<circle class="pulse" cx="16" cy="9" r="14" fill="var(--live)" opacity=".5"/>':''}<rect width="32" height="18" rx="6" fill="${onboard?'var(--live)':'var(--ink)'}"/><rect x="7" y="3" width="18" height="7" rx="2" fill="var(--s6)" opacity=".9"/><circle cx="8" cy="18" r="3" fill="var(--s5)"/><circle cx="24" cy="18" r="3" fill="var(--s5)"/></g>
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto"><mpath href="#road"/></animateMotion></g>
  </svg></div>`};

/* absences, stop order, attendance strip, on-time score */
const todayKey=()=>localKey(new Date());
function isAbsent(kid,day=todayKey()){if(!kid)return false;return (kid.absences||[]).includes(day)||(kid.termBreaks||[]).some(t=>t&&t.from<=day&&day<=t.to)}
async function toggleAbsent(kidId){const k=Store.get('kids',kidId);const d=todayKey();const a=new Set(k.absences||[]);a.has(d)?a.delete(d):a.add(d);await Store.patch('kids',kidId,{absences:[...a]});const b=bookingOf(k);if(b&&a.has(d))await notify(b.driverId,`${k.name} is not riding today.`,'info','d-trip');toast(a.has(d)?k.name+' marked as not riding today':k.name+' is riding today')}
function weekStrip(kid){const now=new Date();const dow=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-dow);const ev=Store.all('events').filter(e=>e.kidId===kid.id&&e.type==='dropoff');return `<div class="week">${['M','T','W','T','F'].map((l,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const key=localKey(d);const ok=ev.some(e=>new Date(e.ts).toDateString()===d.toDateString());const cls=ok?'ok':isAbsent(kid,key)?'skip':'';return `<i class="${cls} ${i===dow?'today':''}" title="${key}">${l}</i>`}).join('')}</div>`}
function stopNumber(b){const r=routeOf(b.routeId);if(!r)return null;const ids=activeBookings(x=>x.routeId===r.id).map(x=>x.id);const order=(r.order||[]).filter(id=>ids.includes(id)).concat(ids.filter(id=>!(r.order||[]).includes(id)));return {n:order.indexOf(b.id)+1,of:order.length}}
function onTimeScore(driverId){const ev=Store.all('events').filter(e=>e.driverId===driverId&&e.type==='pickup');if(!ev.length)return null;const ok=ev.filter(e=>{const r=routeOf(e.routeId);if(!r?.pickupTime||!/^\d\d:\d\d$/.test(r.pickupTime))return true;const [hh,mm]=r.pickupTime.split(':').map(Number);const d=new Date(e.ts);return d.getHours()*60+d.getMinutes()<=hh*60+mm+15}).length;return Math.round(ok/ev.length*100)}
function orderStops(routeId){const r=routeOf(routeId);const bs=activeBookings(b=>b.routeId===routeId);let order=(r.order||[]).filter(id=>bs.some(b=>b.id===id)).concat(bs.map(b=>b.id).filter(id=>!(r.order||[]).includes(id)));
  const draw=()=>{$('#ord').innerHTML=order.map((id,i)=>{const k=Store.get('kids',Store.get('bookings',id).kidId);return `<div class="item small"><span class="stopn">${i+1}</span><div class="grow"><b>${h(k?.name)}</b><div class="tiny muted">${h(k?.pickup||'')}</div></div><button class="btn sm ghost" data-up="${i}" ${i?'':'disabled'}>↑</button><button class="btn sm ghost" data-dn="${i}" ${i<order.length-1?'':'disabled'}>↓</button></div>`}).join('');$('#ord').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[order[i-1],order[i]]=[order[i],order[i-1]];draw()});$('#ord').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[order[i+1],order[i]]=[order[i],order[i+1]];draw()})};
  modal(`<h3>Pickup order</h3><p class="muted small">Parents see their stop number.</p><div class="list" id="ord" style="margin-top:8px"></div><button class="btn wide" style="margin-top:12px" id="ord-go">Save order</button>`,m=>{draw();$('#ord-go',m).onclick=async()=>{await Store.patch('routes',routeId,{order});closeModal();toast('Order saved')}})}

/* patch parent home kid cards + driver trip list + route cards via string hooks */
const _phome=VIEWS['p-home'];VIEWS['p-home']=()=>{let html=_phome();kidsOf(me().id).forEach(k=>{const b=bookingOf(k);const abs=isAbsent(k);const sn=b&&!b.once?stopNumber(b):null;const extra=`<div class="row between" style="margin-top:10px">${weekStrip(k)}${sn?`<span class="tiny muted">Stop ${sn.n} of ${sn.of}</span>`:''}</div>${b?`<button class="btn sm ghost" style="margin-top:8px" onclick="toggleAbsent('${k.id}')">${abs?'Riding today after all':'Not riding today'}</button>`:''}`;
  const marker=`<div class="tiny muted">${k.age} yrs · ${h(k.school||'School not set')}</div></div></div>`;const i=html.indexOf(marker);if(i<0)return;const cardStart=html.lastIndexOf('<div class="card">',i);const end=html.indexOf('</div></div>',html.indexOf('<div class="row" style="margin-top:12px">',i));if(end<0)return;html=html.slice(0,end)+extra+html.slice(end);if(abs){html=html.slice(0,cardStart)+html.slice(cardStart).replace('<span class="pill">Booked</span>','<span class="pill warn">Not riding today</span>')}});return html};
const _dtrip=VIEWS['d-trip'];VIEWS['d-trip']=()=>{let html=_dtrip();const r=routeOf(S.tripRoute);if(!r)return html;activeBookings(b=>b.routeId===r.id).forEach(b=>{const k=Store.get('kids',b.kidId);if(k&&isAbsent(k)){html=html.replace(`<button class="btn sm live" onclick="markEvent('${b.id}','pickup')">Pick up</button>`,'<span class="pill warn">Not riding today</span>')}});
  const sn=(r.order||[]);html=html.replace('<h3>Passengers</h3>',`<div class="row between"><h3>Passengers</h3><button class="btn sm ghost" onclick="orderStops('${r.id}')">Pickup order</button></div>`);return html};
const _routeCard=routeCard;routeCard=function(r,kids){const sc=onTimeScore(r.driverId);return _routeCard(r,kids).replace("' passengers</div>","' passengers"+(sc!=null?' · '+sc+'% on time':'')+"</div>")};
const _dhome2=VIEWS['d-home'];VIEWS['d-home']=()=>{const sc=onTimeScore(me().id);return _dhome2().replace('<div class="card"><div class="eyebrow">Rating</div>',`<div class="card"><div class="eyebrow">On time</div><div class="num">${sc!=null?sc+'%':'—'}</div></div><div class="card"><div class="eyebrow">Rating</div>`)};
</script>
<style>

<script>
/* ===================== v5: screening, review actions, reviews page, colour ===================== */
const APP_VERSION='2.1';
/* --- number ticker --- */
MOUNT.tick=el=>{const v=+el.dataset.v||0;if(!v||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const t0=performance.now();const d=700;const step=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)};
/* --- splash with gradient + loader --- */
showSplash=function(){if($('.splash'))return;const d=document.createElement('div');d.className='splash';d.innerHTML=`<div style="text-align:center"><div class="n gtext">Enivel</div><div class="s">Safe scholar transport</div><div class="bar"><i></i></div></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)};
/* --- auth title gradient --- */
const _landing=VIEWS.landing;VIEWS.landing=()=>_landing().replace('<div class="brand"><h1>Enivel</h1>','<div class="brand"><h1 class="gtext">Enivel</h1>').replace('</div></div>`','</div><div class="ver">Enivel '+APP_VERSION+'</div></div>`');

/* --- ID screening --- */
function idInfo(id){if(!/^\d{13}$/.test(id))return null;const yy=+id.slice(0,2),mm=+id.slice(2,4),dd=+id.slice(4,6);const now=new Date();const yr=yy+(yy<=now.getFullYear()%100?2000:1900);const dob=new Date(yr,mm-1,dd);const valid=dob.getMonth()===mm-1&&dob.getDate()===dd&&mm>=1&&mm<=12;const age=Math.floor((now-dob)/31557600000);return {dob,age,valid,citizen:id[10]==='0',gender:+id.slice(6,10)>=5000?'M':'F'}}
function imgHash(url){let h1=0;for(let i=url.length-400;i<url.length;i++){h1=(h1*31+url.charCodeAt(i))|0}return h1}
function screenUser(u){const flags=[];const add=(level,text)=>flags.push({level,text});const info=u.idNumber?idInfo(u.idNumber):null;
  if(!u.idNumber)add('bad','No ID number');else if(!validSAID(u.idNumber))add('bad','ID number fails the checksum: likely typed wrong or fabricated');else if(!info?.valid)add('bad','ID number contains an impossible birth date');else{if(info.age<18)add('bad',`ID says the holder is ${info.age}, under 18`);else if(info.age>80)add('warn',`ID says the holder is ${info.age}`);else add('ok',`ID checksum passes · born ${info.dob.toLocaleDateString('en-ZA')} · age ${info.age}`)}
  const dupId=u.idNumber&&Store.all('users').find(x=>x.id!==u.id&&x.idNumber===u.idNumber&&!x.demo);if(dupId)add('bad',`Same ID number is used by another account (${dupId.name})`);
  const docs=u.role==='driver'?(u.verification?.docs||{}):(u.idPhoto?{id:u.idPhoto}:{});const meta=u.docsMeta||{};const hashes={};
  Object.entries(docs).forEach(([k,url])=>{const hsh=imgHash(url);if(hashes[hsh])add('bad',`"${k}" is the same image as "${hashes[hsh]}"`);hashes[hsh]=k;const m=meta[k];if(m){if(m.w<600||m.h<600)add('warn',`"${k}" is low resolution (${m.w}×${m.h})`);if(m.blur!=null&&m.blur<60)add('warn',`"${k}" looks blurry`)}
    const other=Store.all('users').find(x=>x.id!==u.id&&!x.demo&&Object.values(x.verification?.docs||{}).concat(x.idPhoto?[x.idPhoto]:[]).some(v=>imgHash(v)===hsh));if(other)add('bad',`"${k}" image was also uploaded by ${other.name}`)});
  if(u.role==='driver'){const need=DOCS.filter(d=>!docs[d[0]]);if(need.length)add('warn','Missing: '+need.map(d=>d[1]).join(', '));
    if(u.policeDate){const age=(Date.now()-new Date(u.policeDate))/864e5;if(age>183)add('bad','Police clearance is older than 6 months');else if(age<0)add('bad','Police clearance date is in the future');else add('ok','Police clearance within 6 months')}else add('warn','No police clearance date');
    if(u.prdpExpiry){if(new Date(u.prdpExpiry)<new Date())add('bad','PrDP has expired');else add('ok','PrDP valid until '+u.prdpExpiry)}else add('warn','No PrDP expiry')}
  const level=flags.some(f=>f.level==='bad')?'bad':flags.some(f=>f.level==='warn')?'warn':'ok';return {level,flags}}
async function autoScreen(u){const r=screenUser(u);await Store.patch('users',u.id,{screen:{level:r.level,flags:r.flags,at:Date.now()}});if(r.level==='bad')await notify('admin',`⚠️ Suspicious verification from ${u.name} (${u.role}): ${r.flags.filter(f=>f.level==='bad')[0].text}`,'info','a-verify');else if(r.level==='warn')await notify('admin',`${u.name} (${u.role}) needs a document check.`,'info','a-verify');return r}
/* driver submit: store photo meta, screen */
MOUNT.dvSubmit=btn=>{btn.onclick=async()=>{const u=me();if(u.banned)return toast('This account is banned');const docs={...(u.verification?.docs||{})};const meta={...(u.docsMeta||{})};DOCS.forEach(([k])=>{const b=$('#doc-'+k);if(b?.dataset.url){docs[k]=b.dataset.url;if(S.photoMeta['doc-'+k])meta[k]=S.photoMeta['doc-'+k]}});const idn=$('#dv-id').value.trim();if(!validSAID(idn))return toast('Enter a valid SA ID number');const missing=DOCS.filter(d=>!docs[d[0]]);if(missing.length)return toast('Still missing: '+missing.map(d=>d[1]).join(', '));
  const wasApproved=u.verification?.status==='approved';await Store.patch('users',u.id,{idNumber:idn,prdpExpiry:$('#dv-prdp').value,policeDate:$('#dv-pol').value,years:$('#dv-yrs').value,docsMeta:meta,verification:{status:wasApproved?'approved':'pending',docs,submittedAt:Date.now()}});const r=await autoScreen(me());await notify('admin',`${u.name} submitted driver verification documents.`,'info','a-verify');toast(r.level==='bad'?'Submitted. Some checks failed, Enivel will review.':wasApproved?'Documents updated':'Submitted. We will review within 24 hours.');go('d-home')}};
/* parent ID save: screen too */
MOUNT.pidSave=btn=>{btn.onclick=async()=>{const n=$('#pid-n').value.trim();if(!validSAID(n))return toast('That is not a valid South African ID number');const info=idInfo(n);if(info&&info.age<18)return toast('You must be 18 or older to register children');const box=$('#pid-photo');const url=box.dataset.url||me().idPhoto;if(!url)return toast('Add a photo of your ID');const meta={...(me().docsMeta||{})};if(S.photoMeta['pid-photo'])meta.id=S.photoMeta['pid-photo'];await Store.patch('users',me().id,{idNumber:n,idPhoto:url,docsMeta:meta,idVerifiedAt:Date.now(),idStatus:'pending'});const r=await autoScreen(me());toast(r.level==='bad'?'Saved. Enivel will review your ID.':'ID saved')}};
/* admin verify page: drivers + parents, 3 actions */
VIEWS['a-verify']=adminGate(()=>{const subs=Store.all('users').filter(u=>u.role!=='admin'&&((u.role==='driver'&&u.verification?.status&&u.verification.status!=='none')||(u.role==='parent'&&u.idNumber))).map(u=>({u,sc:u.screen||screenUser(u)})).sort((a,b)=>{const pr=x=>x.u.banned?3:x.u.role==='driver'?(x.u.verification.status==='pending'?0:2):(x.u.idStatus==='pending'?0:2);return pr(a)-pr(b)||(b.sc.level==='bad')-(a.sc.level==='bad')});
  return pageHead('Verify','Automatic checks run on every upload. Fake = ban. Bad quality = retry.')+(subs.length?`<div class="stack">${subs.map(({u,sc})=>{const v=u.verification||{};const isD=u.role==='driver';const status=u.banned?'banned':isD?v.status:(u.idStatus||'pending');
    return `<div class="card ${sc.level==='bad'?'':''}" style="${sc.level==='bad'?'border-color:var(--bad)':''}"><div class="row between"><div class="row"><span class="avatar">${initials(u.name)}</span><div><b>${h(u.name)}</b> <span class="pill tiny">${u.role}</span><div class="tiny muted">${h(u.email)} · ${prettyPhone(u.phone)||h(u.phone||'')} · ID ${h(u.idNumber||'—')}</div>${isD?`<div class="tiny muted">PrDP ${h(u.prdpExpiry||'?')} · police ${h(u.policeDate||'?')} · ${h(u.years||'?')} yrs</div>`:''}</div></div><div class="row"><span class="pill ${sc.level==='bad'?'bad':sc.level==='warn'?'warn':'live'}">${sc.level==='bad'?'Suspicious':sc.level==='warn'?'Check quality':'Checks pass'}</span><span class="pill ${status==='approved'?'live':status==='pending'?'warn':status==='banned'?'bad':''}">${status}</span></div></div>
    <div style="margin-top:10px">${sc.flags.map(f=>`<div class="flag ${f.level}"><i></i><span>${h(f.text)}</span></div>`).join('')}</div>
    <div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px">${(isD?DOCS:[['id','ID document']]).map(([k,t])=>{const url=isD?v.docs?.[k]:u.idPhoto;return url?`<figure style="margin:0"><img src="${safeImg(url)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in" alt="${t}" onclick="zoomImg('${url.slice(0,0)}','${u.id}','${k}')"><figcaption class="tiny muted">${t}${u.docsMeta?.[k]?' · '+u.docsMeta[k].w+'×'+u.docsMeta[k].h:''}</figcaption></figure>`:`<div class="photo"><span>${t}<br>missing</span></div>`}).join('')}</div>
    ${u.banned?`<div class="row" style="margin-top:12px"><span class="small muted">Banned ${u.bannedAt?fmtDT(u.bannedAt):''}: ${h(u.banReason||'')}</span><button class="btn sm ghost" onclick="Store.patch('users','${u.id}',{banned:false,suspended:false,banReason:''})">Lift ban</button></div>`:
    `<div class="row" style="margin-top:12px"><input id="vn-${u.id}" placeholder="Note to the person (required for retry or ban)" value="${h(v.note||u.idNote||'')}" style="flex:1;min-width:180px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)"><button class="btn sm live" onclick="reviewUser('${u.id}','approved')">${ICON.check} Approve</button><button class="btn sm ghost" onclick="reviewUser('${u.id}','retry')">Retry photos</button><button class="btn sm bad" onclick="reviewUser('${u.id}','ban')">Ban · fake</button></div>`}</div>`}).join('')}</div>`:empty('No submissions yet.','shield'))});
function zoomImg(_,uid_,k){const u=Store.get('users',uid_);const url=u.role==='driver'?u.verification?.docs?.[k]:u.idPhoto;modal(`<img src="${safeImg(url)}" style="width:100%;border-radius:12px" alt=""><button class="btn ghost wide" style="margin-top:10px" onclick="closeModal()">Close</button>`)}
async function reviewUser(id,action){const u=Store.get('users',id);const note=$('#vn-'+id)?.value.trim()||'';if(action!=='approved'&&!note)return toast('Write a note first');const isD=u.role==='driver';
  if(action==='ban')return confirmBox('Ban '+u.name+' permanently?','Fake documents. They will be logged out, cannot log in again, and every booking they hold is cancelled.',async()=>{await Store.patch('users',id,{banned:true,suspended:true,banReason:note,bannedAt:Date.now(),verification:{...(u.verification||{}),status:'rejected',note},idStatus:'rejected'});for(const b of Store.all('bookings').filter(b=>(b.driverId===id||b.parentId===id)&&b.status==='active')){await Store.patch('bookings',b.id,{status:'cancelled',endedAt:Date.now()});await notify(b.driverId===id?b.parentId:b.driverId,'A booking was cancelled by Enivel for safety reasons.','info')}for(const r of Store.all('routes').filter(r=>r.driverId===id))await Store.patch('routes',r.id,{active:false});toast(u.name+' banned')});
  if(action==='retry'){await Store.patch('users',id,isD?{verification:{...u.verification,status:'rejected',note}}:{idStatus:'retry',idNote:note});await notify(id,'Enivel needs better photos: '+note,'info',isD?'d-verify':'p-more');return toast('Retry requested')}
  await Store.patch('users',id,isD?{verification:{...u.verification,status:'approved',note:'',reviewedAt:Date.now()}}:{idStatus:'approved',idNote:''});await notify(id,isD?'You are verified. Your routes are now visible to parents.':'Your ID is verified. You can book transport.','info',isD?'d-home':'p-home');toast('Approved')}
/* retry note visible to parent */
const _pmore3=VIEWS['p-more'];VIEWS['p-more']=()=>{const u=me();return (u.idStatus==='retry'?`<div class="notice" style="margin-bottom:14px"><b>Enivel asked for a better ID photo:</b> ${h(u.idNote||'')}</div>`:'')+_pmore3()};
needsParentId=function(u){return !(u.idNumber&&u.idPhoto)||u.idStatus==='rejected'};

/* --- reviews page --- */
VIEWS.reviews=()=>{const d=Store.get('users',S.reviewDriver);if(!d)return empty('Driver not found');const rs=Store.all('ratings').filter(r=>r.driverId===d.id).sort((a,b)=>b.ts-a.ts);const avg=rs.length?rs.reduce((s,r)=>s+r.stars,0)/rs.length:0;const dist=[5,4,3,2,1].map(n=>rs.filter(r=>r.stars===n).length);const sc=onTimeScore(d.id);const pax=driverPassengers(d.id);
  return pageHead(h(d.name),'Reviews from parents',`<button class="btn sm ghost" onclick="history.length>1?history.back():go('p-find')">Back</button>`)+`<div class="grid g2"><div class="card"><div class="row" style="gap:16px"><div><div class="num" style="font-size:2.6rem">${avg?avg.toFixed(1):'—'}</div><div class="tiny muted">${rs.length} review${rs.length===1?'':'s'}</div></div><div class="grow stack" style="gap:4px">${dist.map((c,i)=>`<div class="rbar"><span>${5-i}★</span><div class="bar"><i style="width:${rs.length?c/rs.length*100:0}%"></i></div><span class="muted">${c}</span></div>`).join('')}</div></div>
  <div class="row" style="margin-top:12px"><span class="pill live">${ICON.shield} Verified</span>${sc!=null?`<span class="pill">${sc}% on time</span>`:''}<span class="pill">${pax} passengers</span></div></div>
  <div class="card"><h3>What parents say</h3><div class="list" style="margin-top:6px">${rs.length?rs.map(r=>`<div class="item"><span class="avatar sm">${initials(userName(r.parentId))}</span><div class="grow small"><b>${h(userName(r.parentId).split(' ')[0])}</b> <span style="color:var(--acc3)">${'★'.repeat(r.stars)}</span><span class="muted">${'★'.repeat(5-r.stars)}</span><div>${h(r.comment||'')}</div><div class="tiny muted">${new Date(r.ts).toLocaleDateString('en-ZA')}</div></div></div>`).join(''):'<p class="muted small">No reviews yet.</p>'}</div></div></div>`};
const _dmore2=VIEWS['d-more'];VIEWS['d-more']=()=>_dmore2().replace("[['d-verify','Verification documents'],","[['d-verify','Verification documents'],['reviews','My reviews'],").replace(`onclick="go('reviews')"`,`onclick="go('reviews',{reviewDriver:me().id})"`);
const _dhome3=VIEWS['d-home'];VIEWS['d-home']=()=>_dhome3().replace('<div class="card"><div class="eyebrow">Rating</div>',`<div class="card" style="cursor:pointer" onclick="go('reviews',{reviewDriver:me().id})"><div class="eyebrow">Rating →</div>`);
/* --- on-board cards get the beam, scene car gradient, ring gradient --- */
const _phome5=VIEWS['p-home'];VIEWS['p-home']=()=>{let html=_phome5();kidsOf(me().id).forEach(k=>{if(!kidStatus(k).onboard)return;const i=html.indexOf(`<div style="font-weight:600">${h(k.name)}</div>`);if(i<0)return;const c=html.lastIndexOf('<div class="card">',i);if(c>=0)html=html.slice(0,c)+'<div class="card beam">'+html.slice(c+'<div class="card">'.length)});return html};
ringSVG=function(pct,label){const r=28,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 72 72"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">${label}</text></svg>`};
const _scene5=sceneSVG;sceneSVG=function(){return _scene5().replace('<path id="road"','<linearGradient id="carG" x1="0" x2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient><path id="road"').replace('fill="var(--ink)"/><rect x="7" y="3" width="18"','fill="url(#carG)"/><rect x="7" y="3" width="18"').replace('<use href="#road" stroke="var(--s6)" stroke-width="2" stroke-dasharray="10 12" fill="none" opacity=".9"/>','<use href="#road" stroke="var(--s6)" stroke-width="2" stroke-dasharray="10 12" fill="none" opacity=".9"><animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.6s" repeatCount="indefinite"/></use>')};
/* admin accounts: banned pill */
const _acc=VIEWS['a-accounts'];VIEWS['a-accounts']=()=>_acc().replace(/<span class="pill bad">Suspended<\/span>/g,'<span class="pill bad">Suspended</span>');
/* version label in More */
const _amore=VIEWS['a-more'];VIEWS['a-more']=()=>_amore()+`<div class="ver">Enivel ${APP_VERSION} · admin</div>`;
</script>
<style>
/* v6: maps, schedules */

<script>
/* ===================== v6: real maps, GPS, geofence, schedules, extras ===================== */
const HAS_L=typeof L!=='undefined';
const R=6371000;function distM(a,b){if(!a||!b)return null;const toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const s1=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s1))}
const GEOFENCE_M=200, NEAR_M=500;
async function geocode(q){if(!q)return null;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=za&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});if(!r.ok)return null;const j=await r.json();if(!j[0])return null;return {lat:+j[0].lat,lng:+j[0].lon,label:j[0].display_name}}catch(e){return null}}
async function roadRoute(pts){try{const c=pts.map(p=>p.lng+','+p.lat).join(';');const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${c}?overview=full&geometries=geojson`);if(!r.ok)return null;const j=await r.json();const rt=j.routes?.[0];if(!rt)return null;return {coords:rt.geometry.coordinates.map(([lng,lat])=>[lat,lng]),km:rt.distance/1000,min:Math.round(rt.duration/60)}}catch(e){return null}}
/* places with coordinates on the journey + kids */
async function setJourneyPlace(kind,text){const j=journey();const geo=text?await geocode(text):null;await setJourney({[kind]:text,[kind+'Geo']:geo||null});if(text&&!geo)toast('Saved. Could not pin it on the map yet (no map service here); you can pin it by tapping the map in the hosted app.')}
const _pickPlace=pickPlace;pickPlace=function(kind){_pickPlace(kind);const m=$('.modal');if(!m)return;const go_=$('#pl-go',m),rm=$('#pl-rm',m);go_.onclick=async()=>{go_.disabled=true;go_.textContent='Finding on map…';await setJourneyPlace(kind,val(m,'pl-v').trim());closeModal()};if(rm)rm.onclick=async()=>{await setJourney({[kind]:'',[kind+'Geo']:null});closeModal()}};
function journeyPoints(){const j=journey();const pts=[];if(j.pickupGeo)pts.push({...j.pickupGeo,kind:'home',label:'Pickup · '+j.pickup});if(j.stopGeo)pts.push({...j.stopGeo,kind:'stop',label:'Stop · '+j.stop});if(j.dropoffGeo)pts.push({...j.dropoffGeo,kind:'school',label:'Drop-off · '+j.dropoff});return pts}
/* map mount: real tiles or honest fallback */
MOUNT.rmap=async el=>{el.className='rmap';const mode=el.dataset.mode;const r=routeOf(el.dataset.route);const kid=el.dataset.kid?Store.get('kids',el.dataset.kid):null;
  let pts=[];if(mode==='home')pts=journeyPoints();else{const parent=kid?Store.get('users',kid.parentId):null;const pj=parent?.journey||{};if(kid?.geo)pts.push({...kid.geo,kind:'home',label:'Pickup · '+kid.pickup});else if(pj.pickupGeo)pts.push({...pj.pickupGeo,kind:'home',label:'Pickup'});if(pj.dropoffGeo)pts.push({...pj.dropoffGeo,kind:'school',label:'School · '+pj.dropoff});else if(r?.schoolGeo)pts.push({...r.schoolGeo,kind:'school',label:r.schools})}
  const live=r?.live;const car=live?.gps&&live.active?{lat:live.lat,lng:live.lng}:null;
  if(!HAS_L){el.innerHTML=`<div class="nomap"><div><b>Map not available in this preview</b><br>${mode==='home'?'The real road map with your pins shows in the hosted Enivel app.':'Live map tiles load in the hosted Enivel app.'}${car?'<br>Driver GPS: '+car.lat.toFixed(5)+', '+car.lng.toFixed(5):''}</div></div>`;return}
  el.innerHTML='<div class="lmap"></div>';const map=L.map($('.lmap',el),{zoomControl:true,attributionControl:true});let tileErr=0;const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);tiles.on('tileerror',()=>{if(++tileErr===3&&!$('.nomap',el)){const n=document.createElement('div');n.className='nomap';n.innerHTML='<div><b>Map tiles are blocked in this preview</b><br>Pins and routes work in the hosted Enivel app.</div>';el.appendChild(n)}});
  const icon=(k,t)=>L.divIcon({className:'',html:`<div class="pin ${k}"><span>${t}</span></div>`,iconSize:[30,30],iconAnchor:[15,30]});
  const layer=L.layerGroup().addTo(map);pts.forEach(p=>L.marker([p.lat,p.lng],{icon:icon(p.kind,p.kind==='home'?'H':p.kind==='school'?'S':'+')}).bindTooltip(p.label,{permanent:true,direction:'top',offset:[0,-28]}).addTo(layer));
  if(car)L.marker([car.lat,car.lng],{icon:L.divIcon({className:'',html:'<div class="carpin">🚐</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(layer);
  const all=pts.map(p=>[p.lat,p.lng]).concat(car?[[car.lat,car.lng]]:[]);if(all.length>1)map.fitBounds(all,{padding:[40,40]});else if(all.length)map.setView(all[0],15);else map.setView([-26.2041,28.0473],11);
  if(mode==='home'){map.on('click',e=>{const kinds=[['pickup','Pickup (home)'],['stop','Extra stop'],['dropoff','Drop-off (school)']];modal(`<h3>Pin this spot as…</h3><div class="stack" style="margin-top:12px">${kinds.map(([k,l])=>`<button class="btn ghost wide" onclick="setJourney({${k}Geo:{lat:${e.latlng.lat},lng:${e.latlng.lng},label:'pinned'},${k}:journey().${k}||'Pinned on map'}).then(closeModal)">${l}</button>`).join('')}</div>`)})}
  if(pts.length>1){const rt=await roadRoute(pts);if(rt){L.polyline(rt.coords,{color:'#6d5dfc',weight:5,opacity:.9}).addTo(layer);const cap=document.createElement('div');cap.className='pill';cap.style.cssText='position:absolute;left:10px;top:10px;z-index:900';cap.textContent=`${rt.km.toFixed(1)} km · about ${rt.min} min by road`;el.appendChild(cap)}else L.polyline(pts.map(p=>[p.lat,p.lng]),{color:'#6d5dfc',weight:4,dashArray:'6 8'}).addTo(layer)}
  setTimeout(()=>map.invalidateSize(),50)};
/* home: real map once pickup + dropoff are pinned, else illustration */
const _scene6=sceneSVG;sceneSVG=function(){const j=journey();if(j.pickupGeo&&j.dropoffGeo)return `<div data-mount="rmap" data-mode="home"></div><p class="tiny muted" style="margin-top:-8px">Real road route between your pins. Tap the map to move a pin.</p>`;return _scene6()+`<p class="tiny muted" style="margin-top:-8px">Illustration. Add your pickup and school to see the real road route.</p>`};
/* kid pickup geocode on save */
const _addKid=addKid;addKid=function(id){_addKid(id);const m=$('.modal');if(!m)return;const b=$('#k-save',m);const orig=b.onclick;b.onclick=async()=>{const name=val(m,'k-n').trim(),age=+val(m,'k-a');if(!name||!age)return toast('Name and age are required');const pickup=val(m,'k-p').trim(),school=val(m,'k-s').trim();b.disabled=true;b.textContent='Saving…';const k=id?Store.get('kids',id):{};const geo=pickup&&pickup!==k.pickup?await geocode(pickup):k.geo||null;const sgeo=school&&school!==k.school?await geocode(school):k.schoolGeo||null;await Store.put('kids',id||uid(),{...k,parentId:me().id,name,age,grade:val(m,'k-g'),school,pickup,geo:geo||null,schoolGeo:sgeo||null,notes:val(m,'k-notes'),createdAt:k.createdAt||Date.now()});closeModal();toast(pickup&&!geo?'Saved. Pickup address not pinned on the map yet.':'Saved')}};
/* driver GPS */
let gpsWatch=null,gpsLast=0;
function watchGPS(routeId){if(!navigator.geolocation)return toast('This device has no location service');stopGPS();gpsWatch=navigator.geolocation.watchPosition(async pos=>{const now=Date.now();if(now-gpsLast<5000)return;gpsLast=now;const r=routeOf(routeId);if(!r?.live?.active)return stopGPS();const live={...r.live,gps:true,lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,ts:now};await Store.patch('routes',routeId,{live});proximityAlerts(r,live)},err=>{toast(err.code===1?'Location permission refused. Parents cannot see you and pickups cannot be verified.':'Could not get location: '+err.message);const r=routeOf(routeId);if(r?.live)Store.patch('routes',routeId,{live:{...r.live,gps:false,gpsError:err.message,ts:Date.now()}})},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function stopGPS(){if(gpsWatch!=null&&navigator.geolocation){navigator.geolocation.clearWatch(gpsWatch)}gpsWatch=null}
useGPS=function(routeId){watchGPS(routeId)};
async function proximityAlerts(r,live){const day=todayKey();const near={...(r.live?.near||{})};let changed=false;for(const b of activeBookings(x=>x.routeId===r.id)){const k=Store.get('kids',b.kidId);if(!k?.geo||near[k.id]===day||kidStatus(k).onboard||isAbsent(k))continue;const d=distM(live,k.geo);if(d!=null&&d<NEAR_M){near[k.id]=day;changed=true;await notify(b.parentId,`${userName(r.driverId)} is about ${Math.max(1,Math.round(d/250))} min from ${k.name}'s pickup. Get ready.`,'info','p-home')}}if(changed)await Store.patch('routes',r.id,{live:{...routeOf(r.id).live,near}})}
/* geofenced pickup / drop-off */
const _mark6=markEvent;markEvent=async function(bookingId,type){const b=Store.get('bookings',bookingId);const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId)||{};const live=r.live||{};const target=stopPoint(b,k,type);
  if(me().role==='driver'){if(!live.active)return toast('Start the trip first so your location is shared');if(!live.gps)return toast('Turn on location. Pickups are only accepted from your real position.');
    if(target){const d=distM(live,target);if(d>GEOFENCE_M+(live.acc||0))return toast(`You are ${d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km'} from ${k.name}'s ${type==='pickup'?'pickup':'drop-off'} point. Get closer to mark it.`)}}
  S.evGeo={lat:live.lat,lng:live.lng,acc:live.acc,verified:!!target};await _mark6(bookingId,type);const ev=Store.all('events').filter(e=>e.bookingId===bookingId&&e.type===type).sort((a,b2)=>b2.ts-a.ts)[0];if(ev)await Store.patch('events',ev.id,{geo:S.evGeo,verified:!!target});S.evGeo=null;
  if(!target)await notify(b.parentId,`Note: ${k.name}'s ${type==='pickup'?'pickup':'drop-off'} address is not pinned, so the location could not be verified. Add the address with a map pin.`,'info','p-kids')};
async function arrived(bookingId){const b=Store.get('bookings',bookingId);const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId)||{};const live=r.live||{};if(k.geo&&live.gps){const d=distM(live,k.geo);if(d>GEOFENCE_M+(live.acc||0))return toast(`You are ${Math.round(d)} m away, not outside yet.`)}
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();[0,.35].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=420;g.gain.value=.12;o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.25)})}catch(e){}
  await notify(b.parentId,`📣 ${userName(b.driverId)} is outside for ${k.name} now.`,'arrived','p-home');await Store.put('events',uid(),{type:'arrived',kidId:k.id,bookingId,driverId:b.driverId,parentId:b.parentId,routeId:b.routeId,ts:Date.now()});toast('Parent told you are outside')}
/* progress from real positions */
function tripProgress(b,k){const r=routeOf(b.routeId);const live=r?.live;if(!live?.gps||!live.active)return null;const st=kidStatus(k);const pu=st.today.find(e=>e.type==='pickup');const start=pu?.geo?.lat?pu.geo:(k.geo||null);const parent=Store.get('users',k.parentId);const end=b.toGeo||k.schoolGeo||parent?.journey?.dropoffGeo||r.schoolGeo;if(!start||!end)return null;const total=distM(start,end),remain=distM(live,end);if(!total)return null;const pct=Math.max(0,Math.min(1,1-remain/total));return {pct,remainKm:remain/1000,etaMin:Math.max(1,Math.round(remain/1000/25*60)),toLabel:k.school||r.schools||'school'}}
/* parent home: progress bar on an on-board child's card */
const _phome6=VIEWS['p-home'];VIEWS['p-home']=()=>{let html=_phome6();kidsOf(me().id).forEach(k=>{if(!kidStatus(k).onboard)return;const b=bookingOf(k);if(!b)return;const pr=tripProgress(b,k);const marker=`<div style="font-weight:600">${h(k.name)}</div>`;const i=html.indexOf(marker);if(i<0)return;const ins=html.indexOf('<div class="row" style="margin-top:12px">',i);if(ins<0)return;const bar=pr?`<div style="margin-top:10px"><div class="row between tiny"><b>${Math.round(pr.pct*100)}% of the way to ${h(pr.toLabel)}</b><span class="muted">${pr.remainKm.toFixed(1)} km · ~${pr.etaMin} min</span></div><div class="bar" style="margin-top:4px"><i style="width:${Math.round(pr.pct*100)}%;background:var(--grad)"></i></div></div>`:`<div class="tiny muted" style="margin-top:8px">On board · waiting for driver GPS to show progress</div>`;html=html.slice(0,ins)+bar+html.slice(ins)});return html};

/* ---------- schedules: regular, second location, exam time ---------- */
const DAYS=['Mo','Tu','We','Th','Fr'];
function scheduleModal(bookingId){const b=Store.get('bookings',bookingId);const s=b.schedule||{};const reg=s.regular||{};const sec=s.second||{};const ex=s.exam||{};const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId)||{};
  const dayBtns=(id,sel)=>`<div class="daypick" id="${id}">${DAYS.map((d,i)=>`<button type="button" data-d="${i+1}" class="${(sel||[]).includes(i+1)?'on':''}">${d}</button>`).join('')}</div>`;
  modal(`<h3>${h(k.name)}'s times</h3><p class="muted small">Propose times. ${h(userName(b.driverId))} must accept before they apply.</p>
  <div class="stack" style="margin-top:12px"><div class="eyebrow">Normal school days</div><div class="sched"><div class="field"><label>Home pickup</label><input id="sc-hp" type="time" value="${h(reg.homePickup||r.pickupTime||'06:30')}"></div><div class="field"><label>School drop-off</label><input id="sc-sd" type="time" value="${h(reg.schoolDrop||r.dropoffTime||'07:15')}"></div><div class="field"><label>School pickup</label><input id="sc-sp" type="time" value="${h(reg.schoolPickup||'14:30')}"></div><div class="field"><label>Home drop-off</label><input id="sc-hd" type="time" value="${h(reg.homeDrop||'15:15')}"></div></div>
  <div class="eyebrow">Second location (sports, aftercare)</div><div class="field"><label>Address</label><input id="sc-2a" value="${h(sec.location||journey().stop||'')}" placeholder="e.g. Aftercare, 5 Vilakazi St"></div><div class="sched"><div class="field"><label>Pickup from school</label><input id="sc-2t" type="time" value="${h(sec.time||'')}"></div><div class="field"><label>Days</label>${dayBtns('sc-2d',sec.days)}</div></div>
  <div class="eyebrow">Exam time</div><div class="sched"><div class="field"><label>From</label><input id="sc-ef" type="date" value="${h(ex.from||'')}"></div><div class="field"><label>To</label><input id="sc-et" type="date" value="${h(ex.to||'')}"></div><div class="field"><label>School pickup</label><input id="sc-ep" type="time" value="${h(ex.schoolPickup||'12:00')}"></div><div class="field"><label>Days</label>${dayBtns('sc-ed',ex.days||[1,2,3,4,5])}</div></div>
  <div class="field"><label>Note to driver</label><input id="sc-n" value="${h(s.note||'')}" placeholder="e.g. Exams end 20 Nov, then back to normal"></div>
  ${s.status==='agreed'?'<span class="pill live">Current schedule agreed</span>':s.status==='proposed'?'<span class="pill warn">Waiting for driver</span>':s.status==='declined'?`<span class="pill bad">Declined: ${h(s.driverNote||'')}</span>`:''}
  <button class="btn wide" id="sc-go">Send to driver</button></div>`,m=>{m.querySelectorAll('.daypick button').forEach(x=>x.onclick=()=>x.classList.toggle('on'));const days=id=>[...m.querySelectorAll('#'+id+' button.on')].map(x=>+x.dataset.d);
    $('#sc-go',m).onclick=async()=>{const sched={regular:{homePickup:val(m,'sc-hp'),schoolDrop:val(m,'sc-sd'),schoolPickup:val(m,'sc-sp'),homeDrop:val(m,'sc-hd')},second:val(m,'sc-2a')?{location:val(m,'sc-2a'),time:val(m,'sc-2t'),days:days('sc-2d')}:null,exam:val(m,'sc-ef')&&val(m,'sc-et')?{from:val(m,'sc-ef'),to:val(m,'sc-et'),schoolPickup:val(m,'sc-ep'),days:days('sc-ed')}:null,note:val(m,'sc-n'),status:'proposed',proposedBy:me().id,ts:Date.now()};
      if(sched.exam&&sched.exam.from>sched.exam.to)return toast('Exam "to" date is before "from"');await Store.patch('bookings',bookingId,{schedule:sched});await notify(b.driverId,`${me().name} proposed new times for ${k.name}${sched.exam?' (exam time '+sched.exam.from+' to '+sched.exam.to+', school pickup '+sched.exam.schoolPickup+')':''}. Open the route to accept.`,'info','d-routes');closeModal();toast('Sent to driver')}})}
async function answerSchedule(bookingId,ok){const b=Store.get('bookings',bookingId);const k=Store.get('kids',b.kidId);let note='';if(!ok){note=$('#sn-'+bookingId)?.value||'';if(!note)return toast('Tell the parent why')}await Store.patch('bookings',bookingId,{schedule:{...b.schedule,status:ok?'agreed':'declined',driverNote:note,answeredAt:Date.now()}});await notify(b.parentId,ok?`${me().name} agreed to ${k.name}'s new times.`:`${me().name} declined ${k.name}'s new times: ${note}`,'info','p-home');toast(ok?'Agreed':'Declined')}
