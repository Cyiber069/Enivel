<script>
/* ===================== address suggestions (OpenStreetMap / Nominatim, South Africa) ===================== */
function fmtAddr(a){if(!a)return '';const street=[a.house_number,a.road||a.pedestrian||a.footway].filter(Boolean).join(' ');const place=a.amenity||a.school||a.building||a.shop||a.office||a.leisure||'';const sub=a.suburb||a.neighbourhood||a.residential||a.quarter||a.hamlet||'';const city=a.city||a.town||a.village||a.municipality||a.county||'';return [place,street,sub,city,a.state,a.postcode].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(', ')}
async function suggestPlaces(q){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=za&dedupe=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});if(!r.ok)return [];const j=await r.json();return j.map(x=>({lat:+x.lat,lng:+x.lon,name:x.name||x.display_name.split(',')[0],type:(x.type||'').replace(/_/g,' '),full:fmtAddr(x.address)||x.display_name,address:x.address,display:x.display_name}))}catch(e){return null}}
function attachSuggest(input){if(input.dataset.sug)return;input.dataset.sug='1';input.autocomplete='off';const wrap=document.createElement('div');wrap.className='sugwrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const box=document.createElement('div');box.className='sug';box.hidden=true;wrap.appendChild(box);let t,seq=0,items=[],idx=-1;
  const close=()=>{box.hidden=true;idx=-1};const pick=it=>{input.value=it.full;input.dataset.geo=JSON.stringify({lat:it.lat,lng:it.lng,label:it.full,address:it.address});close();let ok=wrap.querySelector('.addrok');if(!ok){ok=document.createElement('span');ok.className='addrok';wrap.appendChild(ok)}ok.innerHTML=ICON.check+' Pinned on the map';input.dispatchEvent(new Event('change'))};
  const draw=()=>{if(!items)return box.innerHTML='<div class="st">Suggestions need the hosted Enivel app (no map service here). You can still type the address.</div>',box.hidden=false;if(!items.length)return box.innerHTML='<div class="st">No match yet. Keep typing the street or suburb.</div>',box.hidden=false;box.innerHTML=items.map((it,i)=>`<div class="${i===idx?'on':''}" data-i="${i}"><b>${h(it.name)}${it.type&&!/yes|residential/.test(it.type)?' <small>'+h(it.type)+'</small>':''}</b><small>${h(it.full)}</small></div>`).join('');box.hidden=false;box.querySelectorAll('[data-i]').forEach(el=>el.onmousedown=e=>{e.preventDefault();pick(items[+el.dataset.i])})};
  input.addEventListener('input',()=>{delete input.dataset.geo;const q=input.value.trim();clearTimeout(t);if(q.length<3)return close();box.innerHTML='<div class="st">Searching…</div>';box.hidden=false;const my=++seq;t=setTimeout(async()=>{const res=await suggestPlaces(q);if(my!==seq)return;items=res;idx=-1;draw()},380)});
  input.addEventListener('keydown',e=>{if(box.hidden||!items?.length)return;if(e.key==='ArrowDown'){idx=Math.min(items.length-1,idx+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){idx=Math.max(0,idx-1);draw();e.preventDefault()}else if(e.key==='Enter'&&idx>=0){pick(items[idx]);e.preventDefault()}else if(e.key==='Escape')close()});
  input.addEventListener('blur',()=>setTimeout(close,150))}
const SUG_IDS=['pl-v','k-p','k-s','sc-2a','ot-f','ot-t','rq-a','rq-s','r-area','r-sch','pid-addr'];

const geoOf=el=>{try{return el?.dataset.geo?JSON.parse(el.dataset.geo):null}catch(e){return null}};
/* use the picked suggestion's coordinates instead of a second lookup */
setJourneyPlace=async function(kind,text,el){const g=geoOf(el)||(text?await geocode(text):null);await setJourney({[kind]:text,[kind+'Geo']:g||null,[kind+'Addr']:g?.address||null});if(text&&!g)toast('Saved without a map pin. Pick a suggestion from the list to pin it exactly.')};
pickPlace=function(kind){_pickPlace(kind);const m=$('.modal');if(!m)return;SUG_IDS.forEach(id=>{const el=$('#'+id,m);if(el)attachSuggest(el)});const go_=$('#pl-go',m),rm=$('#pl-rm',m);go_.onclick=async()=>{go_.disabled=true;go_.textContent='Saving…';await setJourneyPlace(kind,val(m,'pl-v').trim(),$('#pl-v',m));closeModal()};if(rm)rm.onclick=async()=>{await setJourney({[kind]:'',[kind+'Geo']:null});closeModal()}};

<script>
/* ===================== driver pickup reminders: 30 and 10 minutes before ===================== */
function hmToday(hm,date){if(!hm||!/^\d{1,2}:\d{2}$/.test(hm))return null;const [H,M]=hm.split(':').map(Number);const d=date?new Date(date+'T00:00:00'):new Date();d.setHours(H,M,0,0);return d.getTime()}
function isSchoolDay(d=new Date()){const dow=d.getDay();const key=localKey(d);return dow>=1&&dow<=5&&!SA_HOLIDAYS[key]}
function driverSlots(driverId){const u=Store.get('users',driverId);const today=todayKey();if((u?.offDays||[]).includes(today))return [];const slots={};const add=(key,ts,label,route,kid,b,kind)=>{if(!ts)return;const s=slots[key]||(slots[key]={key,ts,label,route,kids:[],bookings:[],kind});s.kids.push(kid);s.bookings.push(b)};
  if(isSchoolDay()){for(const b of activeBookings(x=>x.driverId===driverId&&!x.once)){const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId);if(!k||!r||isAbsent(k))continue;const st=kidStatus(k);const t=todaysTimes(b);
    const am=hmToday(t?.homePickup||r.pickupTime);if(am&&!st.today.some(e=>e.type==='pickup'))add('am-'+r.id+'-'+(t?.homePickup||r.pickupTime),am,'Home pickup',r,k,b,'am');
    if(t?.schoolPickup){const pm=hmToday(t.schoolPickup);const pickedPm=st.today.filter(e=>e.type==='pickup').length>=2;if(pm&&!pickedPm)add('pm-'+r.id+'-'+t.schoolPickup,pm,t.exam?'School pickup (exam time)':'School pickup',r,k,b,'pm')}}}
  for(const b of Store.all('bookings').filter(x=>x.once&&x.driverId===driverId&&x.status==='trip'&&x.date===today)){const k=Store.get('kids',b.kidId);if(!k||kidStatus(k).onboard)continue;add('once-'+b.id,hmToday(b.time),'Once-off trip',routeOf(b.routeId),k,b,'once')}
  return Object.values(slots).sort((a,b)=>a.ts-b.ts)}
function nextSlot(driverId){const now=Date.now();return driverSlots(driverId).find(s=>s.ts>now-15*60000)}
function slotStarted(s){return s.kind==='once'?s.kids.every(k=>kidStatus(k).onboard):!!s.route?.live?.active}
function fmtLeft(ms){if(ms<=0)return 'now';const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')}

async function checkReminders(){const u=me();if(!u||u.role!=='driver'||S.admin)return;const now=Date.now();const day=todayKey();for(const s of driverSlots(u.id)){if(slotStarted(s))continue;const left=s.ts-now;if(left<=0||left>30*60000)continue;const tier=left<=10*60000?10:30;const key=`enivel_rem_${day}_${s.key}_${tier}`;if(ls.get(key))continue;ls.set(key,1);const mins=Math.max(1,Math.ceil(left/60000));showReminder(s,mins);await notify(u.id,`In ${mins} minutes you must pick up ${s.kids.map(k=>k.name).join(', ')} (${s.label}, ${fmtT(s.ts)}).`,'info','d-home')}}

<script>
/* ===================== 1. automatic pickup and drop-off (with undo) ===================== */

function localHour(){return new Date().getHours()+new Date().getMinutes()/60}
async function autoDetect(r,live){if(!autoOn()||!live?.gps)return;const acc=Math.min(live.acc||30,80);const near=Math.max(60,acc+40);const now=Date.now();
  for(const b of Store.all('bookings').filter(x=>x.routeId===r.id&&(x.status==='active'||(x.once&&x.status==='trip')))){const k=Store.get('kids',b.kidId);if(!k||isAbsent(k))continue;const st=kidStatus(k);const drops=st.today.filter(e=>e.type==='dropoff').length;const s=autoState[k.id]||(autoState[k.id]={});
    if(!st.onboard){let pt;if(b.once)pt=b.fromGeo||k.geo;else if(drops===0)pt=k.geo;else{const t=todaysTimes(b);const pm=hmToday(t?.schoolPickup);if(localHour()<11||(pm&&now<pm-45*60000))continue;pt=k.schoolGeo||r.schoolGeo}
      if(!pt)continue;const d=distM(live,pt);
      if(d<=near){if(!s.at)s.at=now;s.near=true;s.pos={lat:live.lat,lng:live.lng,acc:live.acc}}
      else if(s.near&&d>near+60){const dwelt=s.at&&now-s.at>=AUTO.dwellPick;const pos=s.pos;s.at=null;s.near=false;if(dwelt&&!(st.today.length&&st.today[0].type==='pickup'))await autoMark(b,'pickup',pos)}}
    else{const pt=b.once?(b.toGeo||k.schoolGeo):(drops===0?(k.schoolGeo||r.schoolGeo):k.geo);if(!pt)continue;const d=distM(live,pt);
      if(d<=near){if(!s.dropAt)s.dropAt=now;if(now-s.dropAt>=AUTO.dwellDrop){s.dropAt=null;await autoMark(b,'dropoff')}}else s.dropAt=null}}}
async function autoMark(b,type,pos){const before=Store.all('events').length;const r=S.data.routes[b.routeId];const saved=r?.live;if(r&&pos)r.live={...saved,lat:pos.lat,lng:pos.lng,acc:pos.acc};try{await markEvent(b.id,type)}finally{if(r&&pos){const cur=S.data.routes[b.routeId];if(cur&&cur.live&&cur.live.lat===pos.lat)cur.live=saved}}const ev=Store.all('events').filter(e=>e.bookingId===b.id&&e.type===type).sort((a,c)=>c.ts-a.ts)[0];if(!ev||Store.all('events').length===before)return;await Store.patch('events',ev.id,{auto:true});showUndo(ev)}
let undoBatch=[],undoT=null;
function showUndo(ev){undoBatch=undoBatch.filter(x=>Date.now()-x.at<10000);undoBatch.push({id:ev.id,kid:ev.kidId,type:ev.type,at:Date.now()});$('.undobar')?.remove();const names=undoBatch.map(x=>Store.get('kids',x.kid)?.name).filter(Boolean);const types=[...new Set(undoBatch.map(x=>x.type))];const d=document.createElement('div');d.className='undobar';d.innerHTML=`<div class="grow"><b>${h(names.join(', '))}</b> marked ${types.length>1?'updated':types[0]==='pickup'?'picked up':'dropped off'} automatically<i></i></div><button>Undo</button>`;d.querySelector('button').onclick=async()=>{const batch=undoBatch;undoBatch=[];d.remove();for(const x of batch)await undoAuto(x.id)};document.body.appendChild(d);clearTimeout(undoT);undoT=setTimeout(()=>{d.remove();undoBatch=[]},10000);try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
async function undoAuto(evId){const ev=Store.get('events',evId);if(!ev)return;const k=Store.get('kids',ev.kidId);await Store.del('events',evId);const n=Store.all('notifications').filter(x=>x.userId===ev.parentId&&x.type===ev.type&&Math.abs(x.ts-ev.ts)<90000).sort((a,b)=>b.ts-a.ts)[0];if(n)await Store.del('notifications',n.id);await notify(ev.parentId,`Correction: ${k?.name} was not ${ev.type==='pickup'?'picked up':'dropped off'} yet. The driver undid an automatic update.`,'info','p-home');if(autoState[ev.kidId]){autoState[ev.kidId]={}}toast('Undone. Parent told.')}

/* ===================== 2. Enivel hours: when to be on Enivel, when free for other work ===================== */
function planSlotsFor(driverId,d){const key=localKey(d);const u=Store.get('users',driverId);if((u?.offDays||[]).includes(key))return [];const dow=d.getDay();const school=dow>=1&&dow<=5&&!SA_HOLIDAYS[key];const groups={};
  const add=(gk,ts,label,time,r,kid,kind,end)=>{const g=groups[gk]||(groups[gk]={key:gk,slot:ts,label,time,routeId:r?.id||'',kidIds:[],kind,end});g.kidIds.push(kid.id);if(end&&end>g.end)g.end=end};
  if(school)for(const b of activeBookings(x=>x.driverId===driverId&&!x.once)){const k=Store.get('kids',b.kidId),r=routeOf(b.routeId);if(!k||!r||isAbsent(k,key))continue;const s=b.schedule?.status==='agreed'?b.schedule:null;const reg=s?.regular||{};
    const am=reg.homePickup||r.pickupTime;const amTs=hmToday(am,key);const amEnd=hmToday(reg.schoolDrop||r.dropoffTime,key)||(amTs&&amTs+60*60000);if(amTs)add(key+'-am-'+r.id+'-'+am,amTs,'Home pickup',am,r,k,'am',amEnd);

  for(const b of Store.all('bookings').filter(x=>x.once&&x.driverId===driverId&&x.status==='trip'&&x.date===key)){const k=Store.get('kids',b.kidId);if(!k)continue;const ts=hmToday(b.time,key);if(ts)add(key+'-once-'+b.id,ts,'Once-off trip',b.time,routeOf(b.routeId),k,'once',ts+60*60000)}
  return Object.values(groups).sort((a,b)=>a.slot-b.slot)}
function enivelWindows(driverId){const slots=planSlotsFor(driverId,new Date());const wins=[];for(const s of slots){const start=s.slot-(s.kind==='am'?10:15)*60000,end=(s.end||s.slot+3600000)+10*60000;const last=wins[wins.length-1];if(last&&start<=last.end)last.end=Math.max(last.end,end);else wins.push({start,end})}return wins}
function hoursCard(){const u=me();const w=enivelWindows(u.id);if(!w.length)return `<div class="hours"><div class="grow"><b>No Enivel trips today</b><div class="tiny muted">You're free for other work all day.</div></div></div>`;const now=Date.now();const cur=w.find(x=>now>=x.start&&now<=x.end);const next=w.find(x=>x.start>now);
  const status=cur?`<b>Enivel time now</b><div class="tiny muted">Until ${fmtT(cur.end)}. Switch other ride apps offline so you're not offered a trip.</div>`:next?`<b>Free for other work until ${fmtT(next.start)}</b><div class="tiny muted">Go offline on other apps by ${fmtT(next.start-10*60000)}.</div>`:`<b>Done with Enivel for today</b><div class="tiny muted">Free for other work.</div>`;
  return `<div class="hours"><div class="grow">${status}<div class="win" style="margin-top:8px">${w.map(x=>`<span class="${x===cur?'on':''}">${fmtT(x.start)}–${fmtT(x.end)}</span>`).join('')}</div></div></div>`}
const _dhome11=VIEWS['d-home'];VIEWS['d-home']=()=>{const html=_dhome11();const u=me();if(!u)return html;return html.replace('<div class="kpi">',`<div style="margin-top:-6px">${hoursCard()}</div><div class="kpi">`)};

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64uToBytes(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0))}
let swReg=null;

async function enablePush(){if(!S.cloud)return toast('Phone pop-ups work on the live Enivel site');if(isIOS&&!isStandalone)return modal(`<h3>One step on iPhone</h3><p class="muted small" style="margin:8px 0 14px">iPhones only show reminders from apps on the Home Screen. Tap the <b>Share</b> button, then <b>Add to Home Screen</b>, open Enivel from there, and turn on reminders again.</p><button class="btn wide" onclick="closeModal()">OK</button>`);
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return toast('This browser cannot show reminders when Enivel is closed');

  try{let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});const j=sub.toJSON();const subs=(me().pushSubs||[]).filter(s=>s.endpoint!==j.endpoint);subs.push({endpoint:j.endpoint,keys:j.keys,device:(navigator.userAgent.match(/\(([^)]+)\)/)||[])[1]?.slice(0,60)||'phone',at:Date.now()});await Store.patch('users',me().id,{pushSubs:subs});S._planSig='';await savePushPlan();toast('Pickup reminders are on for this phone')}catch(e){toast('Could not switch on reminders: '+e.message)}}
async function disablePush(){const reg=await ensureSW();try{const sub=await reg?.pushManager.getSubscription();if(sub){await Store.patch('users',me().id,{pushSubs:(me().pushSubs||[]).filter(s=>s.endpoint!==sub.endpoint)});await sub.unsubscribe()}}catch(e){}toast('Reminders off for this phone')}
async function savePushPlan(){const u=me();if(!S.cloud||!u||u.role!=='driver'||!(u.pushSubs||[]).length)return;const items=[];const now=Date.now();for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);for(const g of planSlotsFor(u.id,d))for(const mins of [30,10]){const at=g.slot-mins*60000;if(at<now-60000)continue;items.push({key:g.key+'-'+mins,at,slot:g.slot,mins,label:g.label,time:g.time,routeId:g.routeId,kidIds:g.kidIds,kind:g.kind})}}items.sort((a,b)=>a.at-b.at);const plan=items.slice(0,120);const sig=JSON.stringify(plan.map(x=>[x.key,x.at,x.kidIds]));if(sig===S._planSig||sig===JSON.stringify((u.pushPlan||[]).map(x=>[x.key,x.at,x.kidIds])))return(S._planSig=sig);S._planSig=sig;await Store.patch('users',u.id,{pushPlan:plan})}

countdownCard=(function(orig){return function(){let html=orig();html=html.replace(/<button class="btn sm ghost" onclick="Notification\.requestPermission\(\)[\s\S]*?Allow reminder pop-ups<\/button>/,'');const u=me();if(!S.cloud||!u)return html;const on=pushReady();return html+(on?`<div class="tiny muted" style="display:flex;align-items:center;gap:6px">${ICON.check} Phone pop-ups on, even when Enivel is closed. <a href="#" onclick="event.preventDefault();disablePush()">Turn off</a></div>`:`<button class="btn sm" onclick="enablePush()">${ICON.bell} Get reminders even when Enivel is closed</button>`)}})(countdownCard);
/* tapping a pop-up opens the trip, "Start trip" starts it */
async function handleTripLink(hash){const m=(hash||'').match(/^#(start|trip)-(.+)$/);if(!m)return;const u=me();if(!u||u.role!=='driver')return;const r=routeOf(m[2]);if(!r||r.driverId!==u.id)return;history.replaceState(null,'',location.pathname+location.search);go('d-trip',{tripRoute:r.id});if(m[1]==='start'&&!r.live?.active){await startTrip(r.id);toast('Trip started from your reminder')}}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.enivel==='open')handleTripLink(e.data.hash)});
(function waitLink(){if(!/^#(start|trip)-/.test(location.hash))return;const t=setInterval(()=>{if(S.ready&&me()){clearInterval(t);handleTripLink(location.hash)}},400);setTimeout(()=>clearInterval(t),20000)})();
setTimeout(()=>{if(S.cloud&&'Notification' in window&&Notification.permission==='granted')ensureSW()},3000);
</script>

<li><b>Enivel is a booking platform, not a transport operator.</b> Drivers are independent operators who contract directly with Parents. Enivel does not drive, own or provide vehicles, employ Drivers or decide how they drive. Responsibility for driving, the vehicle and the Child during the trip rests with the Driver. (<a href="#" data-doc="terms" data-sec="t3">Terms 3</a>)</li>
<li><b>Enivel never has custody of your Child.</b> The Driver is responsible for the Child from pickup until a recorded handover. You are responsible for the Child before pickup and after handover, and for the people you authorise to receive your Child. (<a href="#" data-doc="parent" data-sec="pa13">Parent Terms 13</a>)</li>
<li><b>Verification lowers risk but cannot remove it.</b> We check documents, use automated screening and human review, but we cannot guarantee that every document is genuine, that a Driver will never commit an offence or drive badly, that a vehicle is safe on a given day, or that information users give us is true. A “Verified” badge only describes the documents we reviewed on the date shown. (<a href="#" data-doc="terms" data-sec="t6">Terms 6</a>)</li>
<li><b>Technology can fail.</b> Live location, pickup and drop-off alerts, automatic pickup detection, reminders, push notifications, SMS codes, maps, arrival estimates, the smart stop order and public holiday calendars depend on phones, networks and third parties. They may be late, wrong or unavailable, for example during load-shedding or a network outage. You must not rely on Enivel alone to know where a Child is. (<a href="#" data-doc="location">Location notice</a>)</li>
<li><b>The handover code is a safety aid, not a guarantee.</b> It helps a Driver confirm that the right adult is receiving your Child, but it can be shared, guessed, overheard or forced out of someone. You must keep it secret and change it immediately if it may have been exposed. (<a href="#" data-doc="parent" data-sec="pa7">Parent Terms 7</a>)</li>
<li><b>School holidays, closures and days off do not automatically reduce what you pay.</b> Days you record in the term planner or as days off are treated as days without trips, but your seat stays reserved and the monthly price is not automatically refunded, unless the Payments policy or the law provides otherwise or the Driver agrees. (<a href="#" data-doc="payments" data-sec="m5">Payments 5</a>)</li>
<li><b>Joining a waiting list does not guarantee a seat.</b> Offers are made in the order shown in the Platform, expire after the time stated, and the Driver may lawfully decline. (<a href="#" data-doc="terms" data-sec="t8">Terms 8</a>)</li>
<li><b>Our liability is limited</b> to the extent the law allows: we are not liable for indirect or consequential loss, and our total liability in any 12-month period is generally limited to the greater of the fees you paid Enivel in that period or R1 000. This never limits liability for our gross negligence, fraud or wilful misconduct, or anything the Consumer Protection Act or other law does not allow us to exclude. (<a href="#" data-doc="terms" data-sec="t14">Terms 14</a>)</li>
<li><b>You indemnify Enivel</b> against claims that arise from your own unlawful conduct, your breach of these terms or false information you give, except to the extent the loss was caused by Enivel’s gross negligence or wilful misconduct. (<a href="#" data-doc="terms" data-sec="t15">Terms 15</a>)</li>
<li><b>Drivers are independent contractors and their insurance responds first.</b> Drivers are responsible for their own operating licence, Professional Driving Permit, roadworthiness, insurance (including passenger liability cover of at least the platform minimum), tax and compliance with road traffic and learner transport law. A Driver indemnifies Enivel for claims arising from the Driver’s transport business. (<a href="#" data-doc="driver">Driver Agreement</a> · <a href="#" data-doc="vehicles">Vehicle Standards</a>)</li>
<li><b>Fees.</b> Parents pay the Transport Price plus a 2% Enivel Platform Fee, shown before payment. Drivers pay R100 per month only in months with at least one paying passenger, and R49.99 per month for each vehicle beyond three. Platform Fees are not refundable except as the Payments policy or the law provides. We may set off amounts you owe Enivel against amounts we owe you. (<a href="#" data-doc="payments">Payments</a>)</li>
<li><b>Credits and giveaways have conditions.</b> Referral credit has no cash value, cannot be transferred, expires as stated and may be reversed if obtained by abuse. Giveaways are discretionary. (<a href="#" data-doc="promotions">Referral, Credit and Giveaway Terms</a>)</li>
<li><b>Accounts can be suspended or permanently banned</b> immediately, without prior notice, where we reasonably believe a Child’s safety is at risk, documents are false, or there is fraud or a serious breach. (<a href="#" data-doc="terms" data-sec="t12">Terms 12</a>)</li>
<li><b>Our system records are evidence.</b> Records generated by the Platform (such as trip times, pickups, drop-offs, handover confirmations, messages, payments and acceptance of these terms) are prima facie proof of their contents, which you may disprove. (<a href="#" data-doc="terms" data-sec="t18">Terms 18</a>)</li>
<li><b>Driver tools give estimates only.</b> The expense tracker and estimated profit, the smart stop order and the on-time score are not tax, accounting, financial or route-safety advice. (<a href="#" data-doc="driver" data-sec="d9">Driver Agreement 9</a>)</li>
<li><b>Accidents and emergencies.</b> The SOS button is not an emergency service. Call 10111, 10177 or 112 first. Injured passengers may have claims against the Road Accident Fund that are subject to strict time limits. (<a href="#" data-doc="incidents">Incident Response</a>)</li>
<li><b>Disputes first go through our complaints process,</b> then mediation. Disputes between Enivel and Drivers or other business users go to arbitration. Consumers keep their right to approach the Consumer Goods and Services Ombud, the National Consumer Commission, the National Consumer Tribunal, a court or the Information Regulator. (<a href="#" data-doc="disputes">Disputes</a>)</li>
<li><b>Children’s information.</b> Only a parent or legal guardian may add a Child. By doing so you give the consent required by section 35 of POPIA for us to process that Child’s information for transport and safety. (<a href="#" data-doc="privacy" data-sec="p6">Privacy 6</a>)</li>
<li><b>We may change these terms</b> on at least 14 days’ notice (shorter only where urgent for safety or legal reasons). You will be asked to accept each new version; if you do not, you may close your account and receive a pro-rata refund of prepaid Platform Fees. (<a href="#" data-doc="terms" data-sec="t21">Terms 21</a>)</li>
</ol>
<p>Further documents: <a href="#" data-doc="parent">Parent and Guardian Terms</a> · <a href="#" data-doc="vehicles">Vehicle, Seating and Insurance Standards</a> · <a href="#" data-doc="incidents">Incident, Emergency and Accident Response</a> · <a href="#" data-doc="security">Information Security and Breach Response</a> · <a href="#" data-doc="promotions">Referral, Credit and Giveaway Terms</a>.</p>`},

{id:'terms',title:'Terms of Service',sub:'The agreement between you and Enivel',body:L=>`
<p>These Terms of Service (“Terms”) are a binding agreement between you and ${L.E} (registration number ${L.REG}), trading as <b>Enivel</b> (“Enivel”, “we”, “us”, “our”), with its registered address at ${L.ADDR}. They apply to the Enivel website, web application, installable app, mobile applications, notifications and all related services (together, the “Platform”).</p>
<p>The following documents form part of these Terms and are incorporated by reference: the Important Terms page, the Parent and Guardian Terms, the Driver Agreement, the Vehicle, Seating and Insurance Standards, the Privacy Policy, the Information Security and Breach Response policy, the Child Safeguarding Policy, the Incident, Emergency and Accident Response policy, the Payments policy, the Referral, Credit and Giveaway Terms, the Acceptable Use and Community Rules, the Location notice, the Cookies and Device Storage notice, the Complaints and Disputes policy and the PAIA manual (together, the “Policies”). If a Policy that deals specifically with a topic conflicts with these Terms, the specific Policy applies to that topic, except that nothing in any Policy reduces a right you have under the Consumer Protection Act or POPIA.</p>
<h2 id="t1">1. Acceptance, capacity and electronic conclusion</h2>
<p>1.1 You accept these Terms by ticking the acceptance box, clicking “I agree” or an equivalent button, creating an account, or using the Platform. If you do not accept them, do not use the Platform.</p>
<p>1.2 Your click, tick or other action in the Platform is an expression of intent and an electronic signature recognised by sections 13 and 24 of the Electronic Communications and Transactions Act 25 of 2002 (“ECTA”). Under section 22(2) of ECTA, this agreement is concluded when and where Enivel receives your acceptance, which is at our registered address.</p>
<p>1.3 You must be at least 18 years old and have full legal capacity to contract. Children may not hold accounts. A Child may only be added to the Platform by their parent or legal guardian.</p>
<p>1.4 If you use the Platform on behalf of a business (for example a transport business with several drivers or vehicles), you warrant that you are authorised to bind that business, and “you” includes that business.</p>
<p>1.5 Terms that limit our liability, place risk on you, require you to indemnify us or require you to acknowledge a fact appear in bold and are summarised on the Important Terms page. You confirm that we drew your attention to them in plain language before you agreed, and that you had a fair opportunity to read them and ask us about them, as section 49 of the Consumer Protection Act 68 of 2008 (“CPA”) requires.</p>
<p>1.6 We record the version of these Terms you accepted, the date and time of acceptance and the account used. You may view and download the current version at any time in the Legal centre.</p>
<p>1.7 Some provisions apply differently to consumers and business users. Where the CPA applies to you, these Terms must be read so that they do not exclude, waive or limit any right the CPA gives you, and any clause that says it applies “to the extent the law allows” applies only to that extent.</p>
<h2 id="t2">2. Definitions and interpretation</h2>
<p>2.1 In these Terms and the Policies:</p>
<ul>
<li><b>Applicable Law</b>: any law, regulation, by-law, licence condition, binding code or lawful directive of a competent authority that applies in South Africa, as amended from time to time.</li>
<li><b>Booking</b>: an arrangement made through the Platform for a Driver to transport a Child, whether a monthly shared route, a private chauffeur arrangement or a once-off trip.</li>
<li><b>Business Day</b>: any day other than a Saturday, Sunday or South African public holiday.</li>
<li><b>Child</b> or <b>Learner</b>: a person under 18 for whom transport is arranged.</li>
<li><b>Consumer</b>: a person who is a consumer as defined in the CPA in relation to the relevant transaction.</li>
<li><b>Driver</b>: an independent transport operator who offers transport through the Platform, including any business that operates vehicles and any relief driver or assistant it uses who has been verified on the Platform.</li>
<li><b>Driver Fees</b>: the monthly Driver fee and parking slot fees described in the Payments policy.</li>
<li><b>Handover Code</b>: the secret code a Parent sets for a Child that a Driver must enter, as given by the receiving adult, before a home or afternoon drop-off is recorded.</li>
<li><b>Parent</b>: a parent or legal guardian who uses the Platform to arrange transport for a Child.</li>
<li><b>Platform Fee</b>: the fees Enivel charges, as set out in the Payments policy.</li>
<li><b>Route</b>: a monthly service offered by a Driver with stated stops, times, seats and price.</li>
<li><b>Term Planner</b>: the feature in which a Parent records school holidays and closure periods for a Child.</li>
<li><b>Transport Contract</b>: the contract between a Parent and a Driver for the transport of a Child.</li>
<li><b>Transport Price</b>: the amount the Driver charges for transport.</li>
<li><b>Trip Data</b>: pickup, drop-off, handover, location, timing, alert and related records generated during or about a trip.</li>
<li><b>User</b>: anyone who holds an account or uses the Platform.</li>
<li><b>Waiting List</b>: the queue a Parent may join for a full Route.</li>
</ul>
<p>2.2 Headings are for convenience and do not affect interpretation. The singular includes the plural and the reverse. “Including” and “for example” do not limit the words before them. A reference to a law includes that law as amended or replaced and its regulations. Days are calendar days unless Business Days are stated; when a number of days is calculated, the first day is excluded and the last day included, unless the last day is not a Business Day, in which case it moves to the next Business Day.</p>
<p>2.3 Where the CPA applies to you, any ambiguity in these Terms will be interpreted to your benefit as section 4(4) of the CPA requires. Otherwise, no rule of interpretation applies against Enivel only because Enivel drafted these Terms.</p>
<p>2.4 Plain-language summaries, notices and examples in the Platform help you understand these Terms but do not replace them.</p>
<h2 id="t3">3. What Enivel is, and what it is not</h2>
<p><b>3.1 Enivel provides a technology platform that lets Parents find, book, pay, communicate with and follow Drivers. Enivel is not a transport operator, carrier, common carrier, school, child-care provider, place of care, guardian or employer of Drivers, and does not hold itself out as providing transport.</b></p>
<p><b>3.2 The Transport Contract is concluded directly between the Parent and the Driver. Enivel is not a party to it, does not control how a Driver drives, maintains or operates a vehicle, and does not guarantee the Driver’s performance of it.</b></p>
<p><b>3.3 Enivel does not at any time take custody, care, supervision or control of any Child. Enivel staff are not present in vehicles, at pickup points or at schools.</b></p>
<p>3.4 Drivers set their own Transport Prices, Routes, times, vehicles and the passengers they accept, subject to Applicable Law, these Terms and the Policies. Enivel does not set or recommend Transport Prices.</p>
<p>3.5 Enivel acts as a limited payment collection agent for Drivers: when a Parent pays the Transport Price through the Platform, that payment discharges the Parent’s obligation to the Driver for that amount, whether or not Enivel has yet paid it out to the Driver.</p>
<p>3.6 Nothing in these Terms creates a partnership, joint venture, franchise, agency (other than the limited collection agency above) or employment relationship between Enivel and any Driver or Parent.</p>
<p>3.7 The minimum safety and legal standards that Drivers must meet to use the Platform exist to protect Children and to keep the Platform lawful. They are conditions of access to the Platform, not instructions about how a Driver runs their business, and enforcing them does not make Enivel responsible for the transport.</p>
<p>3.8 Enivel does not endorse any school, does not check whether a Driver is approved by any particular school, and is not responsible for school rules about where vehicles may stop or wait.</p>
<h2 id="t4">4. Accounts and security</h2>
<p>4.1 You must give accurate, current and complete information and keep it up to date. One person may hold one account. You may not create an account for someone else or use another person’s account.</p>
<p>4.2 You are responsible for everything done through your account. Keep your password, SMS one-time codes, security PIN and any device on which you are signed in secure, and never share a one-time code with anyone, including someone claiming to be from Enivel. Enivel will never ask you for your password or a one-time code.</p>
<p>4.3 Tell us immediately at ${L.EMAIL} if you suspect unauthorised access. Until you tell us, you are responsible for activity on your account, except to the extent it resulted from Enivel’s negligence or a failure of our security.</p>
<p>4.4 We strongly recommend turning on two-step verification. We may require it for Drivers, administrators and anyone who has reported a security concern.</p>
<p>4.5 We may verify your phone number, email address and identity at any time, and may refuse, restrict or close an account that cannot be verified.</p>
<p>4.6 Your security duties are described further in the <a href="#" data-doc="security">Information Security and Breach Response</a> policy.</p>
<h2 id="t5">5. Bookings and the Transport Contract</h2>
<p>5.1 Before you confirm a Booking the Platform shows the Driver, the vehicle and number plate, the Route or trip, the Transport Price, the Platform Fee and the total. You may review and correct your selection, or abandon it, before you pay. A Booking is concluded when payment is confirmed.</p>
<p>5.2 The Transport Contract consists of the details shown when you book, any changes both parties accept in the Platform, the Parent and Guardian Terms, and the minimum standards in the Driver Agreement and the Vehicle Standards, which the Driver owes to the Parent as well as to Enivel.</p>
<p>5.3 Monthly Bookings renew each month until cancelled under the Payments policy. Once-off Bookings end when the trip ends. Private chauffeur arrangements follow the terms shown when booked.</p>
<p>5.4 Times, stops, second locations, exam-period times and other changes proposed through the Platform bind the Driver and Parent only once the other party accepts them in the Platform.</p>
<p>5.5 A Driver may not carry more Children than the vehicle’s seats with working seat belts, or more than the operating licence allows, regardless of what any screen allows. Seat counts on the Platform are guides, not certifications.</p>
<p>5.6 A Driver may decline a Booking for any lawful reason but may not unfairly discriminate on any ground prohibited by the Constitution, the CPA or the Promotion of Equality and Prevention of Unfair Discrimination Act 4 of 2000.</p>
<p>5.7 The Parent is responsible for having the Child ready at the agreed time and place, for telling the Driver about absences through the Platform, and for collection arrangements at the end of the trip, including who may receive the Child and the Handover Code.</p>
<h2 id="t6">6. Verification and its limits</h2>
<p>6.1 Before a Driver can be booked, Enivel requests identity documents, a driver’s licence, a Professional Driving Permit, a South African Police Service clearance certificate, vehicle licensing and roadworthiness documents, an operating licence or permit, proof of insurance, proof of address and a live photograph, and reviews them together with automated checks.</p>
<p><b>6.2 Verification is a risk-reduction measure only. Enivel does not guarantee the authenticity of any document, the character, conduct, fitness, competence, health or driving record of any Driver, or the condition, roadworthiness or insurance of any vehicle. A “Verified” badge means only that the documents listed in 6.1 were supplied and passed our review on the date shown.</b></p>
<p><b>6.3 Documents can expire, be withdrawn or become untrue between our checks. Enivel relies on information from Users, issuing authorities and verification partners and is not responsible for errors in that information, except to the extent caused by our own negligence in reviewing it.</b></p>
<p>6.4 Parents should meet the Driver, inspect the vehicle and satisfy themselves that the arrangement is suitable before the first trip, and should report any concern immediately.</p>
<p>6.5 Automated checks support, but never replace, a human decision. No account is permanently banned on the basis of automated processing alone. You may ask for a human review of any decision about your account and make representations.</p>
<p>6.6 Ratings, reviews, on-time scores and badges reflect the opinions of other Users or calculations from Trip Data. They are not Enivel’s endorsement or guarantee of a Driver’s future performance.</p>
<h2 id="t7">7. Location, alerts and automated features</h2>
<p><b>7.1 Live location, pickup and drop-off alerts, estimated arrival times, progress bars, reminders, push notifications, SMS messages, automatic pickup and drop-off detection and maps depend on phones, GPS satellites, mobile networks, electricity supply, operating systems and third-party services outside our control. They may be delayed, inaccurate or unavailable. They are aids, not guarantees, and must not be your only way of knowing where a Child is.</b></p>
<p>7.2 Drivers remain responsible for recording pickups, drop-offs and handovers accurately and for correcting any automatic record that is wrong.</p>
<p>7.3 The full rules are in the <a href="#" data-doc="location">Location, Tracking and Automated Features</a> notice.</p>
<h2 id="t8">8. Planning, safety and business tools</h2>
<p>8.1 <b>General.</b> The tools in this clause help Users organise and record transport. <b>They are aids only. They do not transfer any responsibility to Enivel, and Users remain responsible for their own decisions and for complying with the law.</b></p>
<p>8.2 <b>Handover Code.</b> A Parent may set a secret Handover Code for each Child. On a home or afternoon drop-off, the Driver must enter the code given by the receiving adult before the drop-off is recorded. <b>The Handover Code is a safety aid, not a guarantee that the person receiving the Child is authorised. Enivel is not liable for a handover to a person who gave the correct code, except to the extent caused by Enivel’s own gross negligence or a failure of our security.</b> The rules are in the <a href="#" data-doc="parent" data-sec="pa7">Parent and Guardian Terms</a> and the <a href="#" data-doc="driver" data-sec="d7">Driver Agreement</a>.</p>
<p>8.3 <b>Term Planner.</b> A Parent may record school holidays and closure periods for a Child. Those days are automatically treated as days off and the Driver is told. Billing for those days follows the Payments policy: there is no automatic refund and the seat remains reserved. The Parent is responsible for the accuracy of the dates entered.</p>
<p>8.4 <b>Schedules, exam times and public holidays.</b> The Platform may show South African public holidays and exam-period times. Calendars can be wrong or change at short notice (for example when a public holiday is declared). Parents and Drivers must confirm arrangements with each other.</p>
<p>8.5 <b>Smart stop order.</b> The Platform may suggest an order of pickups using pinned addresses and the Driver’s location. <b>It is a suggestion only. It does not take account of traffic, road closures, roadworks, unrest, school gate rules or road safety, and the Driver alone remains responsible for choosing a safe and lawful route.</b></p>
<p>8.6 <b>Waiting List.</b> When a Route is full, a Parent may join its Waiting List. When a seat becomes available, the first eligible Parent on the list is notified and given an offer that expires after the time shown. <b>Joining a Waiting List does not guarantee a seat, a price or a start date, and an unanswered offer lapses and passes to the next Parent.</b> A Driver may change or withdraw a Route or seat in accordance with the Driver Agreement and the Payments policy.</p>
<p>8.7 <b>Expense tracker.</b> A Driver may record fuel, maintenance, insurance and other costs and see an estimated monthly profit. These records are private to the Driver and to authorised Enivel administrators. <b>Figures are estimates only and are not tax, accounting, legal or financial advice.</b></p>
<p>8.8 <b>Reviews, scores and badges</b> are described in clause 6.6 and the Acceptable Use rules.</p>
<h2 id="t9">9. Fees, payments and set-off</h2>
<p>9.1 Fees, billing, cancellations, refunds, chargebacks and price changes are governed by the <a href="#" data-doc="payments">Payments policy</a>. Credits and giveaways are governed by the <a href="#" data-doc="promotions">Referral, Credit and Giveaway Terms</a>. ${L.VAT}</p>
<p>9.2 You may not arrange to pay a Driver outside the Platform for a Booking first made through the Platform for the purpose of avoiding Platform Fees. If you do, we may close the account and recover the Platform Fees that would have been payable for the transport arranged outside the Platform during the following 12 months.</p>
<p>9.3 <b>To the extent the law allows, Enivel may set off any amount you owe Enivel that is due and payable against any amount Enivel owes you, including refunds, credits and Driver payouts.</b> We will show any set-off in your statement.</p>
<p>9.4 Amounts not paid when due bear interest at the rate prescribed under the Prescribed Rate of Interest Act 55 of 1975, from the due date until paid, unless a lower rate is required by law.</p>
<h2 id="t10">10. Your content and communications</h2>
<p>10.1 You keep ownership of content you upload (messages, photographs, documents, reviews, notes, codes and records). You give Enivel a non-exclusive, royalty-free, worldwide licence, for as long as we are entitled to keep the content, to host, store, copy, process, display and use it to operate, secure and improve the Platform, to enforce these Terms, to investigate incidents and to comply with law.</p>
<p>10.2 <b>You are responsible for the accuracy and lawfulness of the content and information you provide. Enivel does not check every item of User content and is not responsible for errors in it.</b></p>
<p>10.3 Messages between Users are kept so that we can investigate safety incidents and disputes, and authorised administrators may read them for those purposes. Do not use the Platform to send anything you would not want a safety investigator to read.</p>
<p>10.4 Reviews must be honest and based on your own experience. We may remove or decline to publish reviews that are fake, abusive, defamatory, discriminatory or that disclose personal information, but we do not edit the substance of genuine reviews.</p>
<h2 id="t11">11. Acceptable use</h2>
<p>You must follow the <a href="#" data-doc="conduct">Acceptable Use and Community Rules</a>. Breaches may lead to removal of content, suspension, a permanent ban, recovery of losses and, where relevant, a report to the South African Police Service or another authority.</p>
<h2 id="t12">12. Suspension, banning and termination</h2>
<p><b>12.1 We may immediately suspend or restrict an account, hide a Driver’s Routes, cancel Bookings or Waiting List places, or permanently ban an account, without prior notice, if we reasonably believe that: a Child’s safety is at risk; documents or information are false, altered or belong to someone else; a required licence, permit, clearance or insurance has lapsed; the law or these Terms have been seriously breached; payments are fraudulent; the account has been compromised; or a credible complaint has been made that requires investigation.</b></p>
<p>12.2 For other breaches we will, where practical, give you written notice describing the breach and at least 5 Business Days to remedy it before we suspend or terminate.</p>
<p>12.3 Where it is safe and lawful to do so, we will tell you the reason for a suspension or ban and give you an opportunity to respond. We will not disclose information that could prejudice an investigation, endanger any person or breach someone else’s privacy. A permanent ban for false documents or child-safety reasons is final unless new evidence clearly shows our decision was wrong.</p>
<p>12.4 If a Driver is suspended or banned, affected Parents are told that the service is unavailable and receive refunds as set out in the Payments policy. If a Parent is suspended or banned, affected Drivers are told and the Parent’s Bookings may be cancelled.</p>
<p>12.5 You may close your account at any time in the Platform or by writing to ${L.EMAIL}. Closing an account does not cancel amounts already due, Bookings that must still run out their notice period, or records we must keep by law.</p>
<p>12.6 Clauses that by their nature should survive termination survive, including those on fees owed, set-off, indemnities, limitation of liability, records and evidence, intellectual property, disputes and record keeping.</p>
<h2 id="t13">13. Availability, changes to the Platform and events beyond our control</h2>
<p>13.1 We aim to keep the Platform available but do not promise uninterrupted or error-free operation. We may suspend it for maintenance, security or reasons beyond our control, and will try to schedule planned maintenance outside school transport hours.</p>
<p>13.2 We may change, add or remove features. If a change materially reduces a paid service you have already paid for, you may cancel and receive a pro-rata refund of the affected Platform Fee.</p>
<p><b>13.3 Neither Enivel nor you is liable for failing to perform an obligation (other than an obligation to pay money already due) to the extent the failure is caused by an event beyond the reasonable control of that party, including load-shedding or other interruptions of electricity supply, failure of mobile, internet or SMS networks, failure of cloud, hosting, map or payment providers, cyber-attacks that could not reasonably have been prevented, civil unrest, protests, taxi violence, strikes, lockouts, floods, fire, storms, epidemics, acts of government or road closures.</b> The affected party must take reasonable steps to limit the effect of the event and tell the other party as soon as practical. If the event continues for more than 30 days, either party may cancel the affected Booking or service on written notice, and prepaid amounts for services not delivered will be refunded as the Payments policy provides.</p>
<p>13.4 Clause 13.3 does not excuse a Driver from any duty to keep a Child safe once the Child is in the Driver’s care.</p>
<h2 id="t14">14. Limitation of liability</h2>
<p><b>14.1 To the maximum extent permitted by law, and subject to 14.5, Enivel is not liable for any loss, damage, injury or death arising from: (a) the acts or omissions of any Driver, assistant, Parent, guardian, receiving adult, school or other third party; (b) the condition, roadworthiness or insurance of any vehicle; (c) road, traffic, weather or security conditions; (d) failure, delay or inaccuracy of location, alerts, reminders, push notifications, SMS messages, maps, address suggestions, arrival estimates, the smart stop order, calendars or other automated features; (e) a handover to a person who supplied the correct Handover Code; (f) unavailability of the Platform or of third-party services such as mobile networks, electricity supply, SMS providers, payment processors, map providers or cloud hosting; or (g) events beyond our reasonable control.</b></p>
<p><b>14.2 To the maximum extent permitted by law, Enivel is not liable for indirect, consequential or special loss, loss of income, profit, business or opportunity, wasted expenditure, or loss of data, however caused.</b></p>
<p><b>14.3 To the maximum extent permitted by law, Enivel’s total liability to you for all claims arising from the Platform in any 12-month period is limited to the greater of the Platform Fees and Driver Fees you paid Enivel in the 12 months before the event giving rise to the claim, or R1 000.</b></p>
<p><b>14.4 Where you use the Platform in the course of business, the limit in 14.3 is the Platform Fees and Driver Fees you paid in that 12-month period, and you agree that it is a fair allocation of risk reflected in the level of those fees.</b></p>
<p>14.5 Nothing in these Terms excludes or limits liability: for death, personal injury or damage caused by Enivel’s gross negligence; for fraud, wilful misconduct or dishonesty; for a misrepresentation by Enivel; under section 61 of the CPA where it applies; or any liability or right that cannot be excluded or limited under the CPA, POPIA or other law. Where the CPA applies, these Terms must be read so as not to deprive you of any right it gives you, including your rights under section 54 to services of a quality that persons are generally entitled to expect, and to have the service remedied or a refund where it is not.</p>
<p>14.6 Nothing in these Terms shortens any period of prescription under the Prescription Act 68 of 1969.</p>
<p>14.7 Where a loss is caused partly by Enivel and partly by you or a third party, Enivel’s liability (within the limits above) is reduced in proportion to the extent of the other causes, as the Apportionment of Damages Act 34 of 1956 provides.</p>
<h2 id="t15">15. Indemnity</h2>
<p><b>15.1 You indemnify Enivel, its directors, employees and contractors against all claims by third parties, losses, fines, penalties and reasonable legal costs arising from: your breach of these Terms or the law; false, misleading or unlawfully obtained information or documents you supply; your content; a Handover Code or account credential you disclosed; and, for Drivers, the operation of any vehicle and the transport of any passenger.</b></p>
<p>15.2 This indemnity does not apply to the extent the loss was caused by Enivel’s own gross negligence, fraud or wilful misconduct, or to the extent it would be unlawful under the CPA.</p>
<p>15.3 Enivel will tell you promptly of any claim covered by the indemnity, will not settle it without consulting you, and will give you reasonable information to defend it. Legal costs recoverable from a Consumer are limited to costs a court would award; business users are liable for costs on the attorney-and-own-client scale.</p>
<h2 id="t16">16. Third-party services</h2>
<p>16.1 The Platform uses third parties for hosting, database and authentication, maps (based on OpenStreetMap data, © OpenStreetMap contributors, available under the Open Database Licence), address search, routing, messaging, push notifications, SMS and payments.</p>
<p><b>16.2 Third-party availability and accuracy are not within our control. To the extent the law allows, Enivel is not liable for their failures, except to the extent caused by our own negligence in choosing or using them.</b> Their own terms may also apply to you.</p>
<p>16.3 Links to third-party websites (such as regulators or emergency services) are provided for convenience. We do not control their content.</p>
<h2 id="t17">17. Your warranties and non-reliance</h2>
<p>17.1 You warrant that: the information and documents you supply are true, complete, your own and lawfully obtained; you have the consent of any person whose information you give us (such as trusted guardians and authorised collectors); you will comply with Applicable Law; and, if you are a Parent, you hold parental responsibilities and rights or are a legal guardian of each Child you add.</p>
<p><b>17.2 You acknowledge that you have not relied on any statement, promise or representation about the Platform that is not set out in these Terms or the Policies.</b> This does not exclude liability for a misrepresentation made fraudulently or any right you have under section 41 of the CPA.</p>
<p>17.3 You acknowledge that road travel carries inherent risks that cannot be removed entirely, and that you decide for yourself whether a particular Driver and vehicle are suitable. This acknowledgement does not limit anyone’s liability for their own negligence or reduce any right under the CPA.</p>
<h2 id="t18">18. Records and evidence</h2>
<p><b>18.1 Records generated or kept by the Platform, including Trip Data, handover confirmations, location points, alerts, messages, payment and fee records, logs of acceptance of these Terms and administrative actions, are prima facie proof of their contents, unless the contrary is proved.</b> Data messages are admissible in evidence as section 15 of ECTA provides.</p>
<p>18.2 A certificate signed by an Enivel director or authorised manager stating an amount owed by you is prima facie proof of that amount, unless the contrary is proved.</p>
<p>18.3 You may ask us for a copy of records about your own Bookings, subject to the privacy of other people. We keep records for the periods in the Privacy Policy.</p>
<h2 id="t19">19. Intellectual property</h2>
<p>The Platform, the Enivel name, logo, design, software, documentation and content (other than User content and third-party map data) belong to Enivel or its licensors. You receive a limited, revocable, non-exclusive, non-transferable right to use the Platform for its intended purpose. You may not copy, reverse engineer, decompile, scrape, frame, resell or create derivative works from it, except as the law expressly allows.</p>
<h2 id="t20">20. Notices, domicilium and electronic communication</h2>
<p>20.1 You agree to receive notices, statements and documents electronically, in the Platform, by email, push notification or SMS. A data message is treated as sent and received as provided in section 23 of ECTA; a notice sent to the email address or cellphone number on your account is treated as received when it enters that system, unless you prove otherwise.</p>
<p>20.2 Enivel chooses ${L.ADDR} as its address for legal notices and service of process (domicilium citandi et executandi). Formal legal notices to Enivel must be delivered there in writing, with a copy to ${L.EMAIL}.</p>
<p>20.3 You choose the email address on your account for notices and, for service of legal process, the physical address you most recently gave us. You must keep both up to date.</p>
<p>20.4 Where the law requires a notice to be in writing, a data message satisfies that requirement as section 12 of ECTA provides.</p>
<h2 id="t21">21. Changes to these Terms</h2>
<p>21.1 Each version of these Terms and the Policies carries a version identifier and effective date. The current version is shown in the Legal centre.</p>
<p>21.2 We may update these Terms to reflect changes in law, safety practice, our services or our business. We will give at least 14 days’ notice in the Platform and by email of any material change, except where a change is needed urgently for safety, security or legal reasons, in which case we will give as much notice as practical.</p>
<p>21.3 You will be asked to accept the new version before continuing to use the Platform. Changes do not apply to a fee already paid for a period that started before the change, unless the change is in your favour.</p>
<p>21.4 If you do not accept a new version, you may close your account and receive a pro-rata refund of any prepaid Platform Fee for the period after the change takes effect. Bookings will then end in accordance with the Payments policy.</p>
<h2 id="t22">22. Disputes, governing law and jurisdiction</h2>
<p>22.1 South African law governs these Terms and the Policies.</p>
<p>22.2 The <a href="#" data-doc="disputes">Complaints and Disputes</a> policy applies. It provides for internal complaints, mediation, and arbitration for business users, and preserves the rights of Consumers to approach the Consumer Goods and Services Ombud, the National Consumer Commission, the National Consumer Tribunal, a consumer court or an ordinary court, and of everyone to approach the Information Regulator.</p>
<p>22.3 Subject to the Disputes policy, you consent under section 45 of the Magistrates’ Courts Act 32 of 1944 to the jurisdiction of any Magistrate’s Court having jurisdiction over you or over Enivel, even if the amount claimed exceeds that court’s ordinary monetary jurisdiction. Where you are a Consumer, Enivel will institute proceedings against you only in a court having jurisdiction where you reside or where the Booking was performed. This clause does not prevent either party from approaching the High Court.</p>
<p>22.4 Nothing in these Terms prevents a party from seeking urgent interim relief from a competent court.</p>
<h2 id="t23">23. General</h2>
<p>23.1 <b>Whole agreement.</b> These Terms and the Policies are the whole agreement between you and Enivel about the Platform and replace earlier versions and discussions, subject to clause 17.2.</p>
<p>23.2 <b>No waiver.</b> A delay or failure to enforce a right, or any relaxation or indulgence, is not a waiver of it and does not prevent its later enforcement.</p>
<p>23.3 <b>Severability.</b> If any provision is found unlawful or unenforceable, it is severed and the rest continues to apply. Any provision that would be unlawful under the CPA applies only to the extent it is lawful.</p>
<p>23.4 <b>Assignment.</b> You may not cede, assign or delegate your rights or obligations without our written consent. We may cede or assign ours to a successor to the business on notice to you, provided your rights are not reduced.</p>
<p>23.5 <b>Survival.</b> Clause 12.6 applies.</p>
<p>23.6 <b>Language.</b> These Terms are written in English. If we provide a translation and there is a conflict, the English version applies, except where the CPA requires otherwise.</p>
<p>23.7 <b>Third parties.</b> No third party may enforce these Terms, except that clause 15 benefits Enivel’s directors, employees and contractors, who may accept that benefit.</p>
<p>23.8 <b>Costs.</b> Each party bears its own costs of concluding this agreement.</p>
<h2 id="t24">24. Supplier information (ECTA section 43)</h2>

{id:'parent',title:'Parent and Guardian Terms',sub:'Your duties, authorised collectors, handover codes, term planning and how responsibility is shared',body:L=>`
<p>These Parent and Guardian Terms apply, in addition to the Terms of Service, to every Parent who arranges transport for a Child through Enivel. If they conflict with the Terms of Service on a matter concerning Parents, these terms apply. Words defined in the Terms of Service have the same meaning here.</p>
<h2 id="pa1">1. Your relationship with the Driver and with Enivel</h2>
<p>1.1 When you make a Booking you conclude a Transport Contract directly with the Driver. The Driver, not Enivel, provides the transport and is responsible for your Child during the trip.</p>
<p>1.2 Enivel provides the Platform you use to find, book, pay, message and follow the Driver, and holds the Transport Price as the Driver’s limited collection agent. <b>Enivel does not transport, supervise or take custody of your Child at any time.</b></p>
<p>1.3 You may hold your Driver to the minimum standards in the Driver Agreement and the Vehicle Standards, which form part of your Transport Contract. Report any failure to meet them to Enivel immediately.</p>
<h2 id="pa2">2. Eligibility and authority</h2>
<p>2.1 You warrant that you are the Child’s parent with parental responsibilities and rights, or the Child’s legal guardian, and that you are entitled under the Children’s Act 38 of 2005 to arrange the Child’s transport and to give the consents in these terms.</p>
<p>2.2 Where more than one person holds parental responsibilities and rights, you warrant that you are entitled to make transport arrangements on your own or have the agreement of the other co-holders where the law or a court order requires it.</p>
<p>2.3 You must tell us and the Driver, through the Platform, about any court order, protection order or arrangement that restricts who may collect or have contact with the Child, and keep authorised collectors up to date to reflect it. <b>Enivel and Drivers cannot enforce, interpret or decide family disputes and are not responsible for a handover to a person you have not removed as an authorised collector.</b></p>
<h2 id="pa3">3. Your Child’s profile and information</h2>
<p>3.1 You must give accurate information about each Child (first name, age, school, grade, pickup point and notes) and keep it current. Pin pickup and drop-off addresses on the map accurately; an unpinned address means pickups cannot be location-verified.</p>
<p>3.2 Tell the Driver, through the Child’s notes, of anything the Driver reasonably needs to know to keep the Child safe on the trip, such as a severe allergy, a condition that could cause an emergency, a mobility need or a need for a particular child restraint. Give only what is needed; you need not share diagnoses or medical records. You consent to that information being shown to the Driver for that purpose.</p>
<p>3.3 <b>If you withhold or misstate information that the Driver reasonably needed for your Child’s safety, Enivel is not liable for loss that results, to the extent the law allows.</b></p>
<h2 id="pa4">4. Choosing a Driver and the first trip</h2>
<p>4.1 Before the first trip you should meet the Driver, check that the person matches the photograph and the vehicle matches the number plate and photographs on the Platform, look at the seat belts and any child restraint, and ask about the Driver’s operating licence and insurance.</p>
<p>4.2 If anything does not match what the Platform shows, do not let your Child travel, and report it immediately.</p>
<p>4.3 You decide whether a Driver and vehicle are suitable for your Child. Verification by Enivel reduces risk but does not replace your own judgment (Terms of Service clause 6).</p>
<h2 id="pa5">5. Child readiness, pickups and waiting time</h2>
<p>5.1 Have your Child ready at the pinned pickup point at least 5 minutes before the agreed time, dressed for the weather and with what they need for the day.</p>
<p>5.2 The Driver need not wait longer than the waiting time stated on the Route or, if none is stated, 5 minutes after the agreed time, so that other Children are not made late. If your Child misses a pickup because they were not ready, you are responsible for getting the Child to school, and the day is not refundable.</p>
<p>5.3 Use the Platform to report absences, late starts, early closures and changes as early as possible. Messages sent only by phone call or outside the Platform may not be recorded.</p>
<p>5.4 Pickup reminders and alerts may arrive late or not at all. Do not rely on them as your only cue to have the Child ready.</p>
<h2 id="pa6">6. Authorised collectors and trusted guardians</h2>
<p>6.1 You may add trusted guardians and other adults who may receive your Child at the end of a trip. You warrant that each has agreed to be added and to their details being shared with the Driver.</p>
<p>6.2 Only an adult (18 or older) may be named to receive a Child, unless you expressly instruct otherwise in the Platform for a particular arrangement. <b>If you instruct the Driver to leave your Child with an older sibling or at a particular place, you accept the risk of that instruction.</b></p>
<p>6.3 Remove anyone who should no longer receive your Child immediately. A change takes effect when it is saved in the Platform and the Driver’s app has been updated, which may require a network connection.</p>
<h2 id="pa7">7. Handover code</h2>
<p>7.1 You may set a secret Handover Code for each Child. For a home or afternoon drop-off, the Driver must enter the code given to them by the adult receiving the Child before the drop-off can be recorded. Morning drop-offs at school do not use the code.</p>
<p>7.2 You must: choose a code that is not easy to guess (not a birth date, house number or repeated digits); share it only with adults you authorise to receive the Child; never write it on the Child’s bag or share it in a group chat; not give it to the Child unless you decide the Child is old enough to keep it safe; and change it immediately if you think it may have been seen, overheard or shared with someone who should no longer have it.</p>
<p>7.3 If the receiving adult cannot give the correct code, the Driver must not hand the Child over, must keep the Child safe and must contact you through the Platform. The Driver may then hand over only if you personally confirm, through the Platform where possible, that the handover may proceed. <b>If you confirm a handover without the code, you accept responsibility for that decision.</b></p>
<p>7.4 If you and your trusted guardians cannot be reached within a reasonable time, the Driver will follow the steps in the Child Safeguarding Policy, which may include keeping the Child in the vehicle while completing the Route, returning to the pickup point later, or as a last resort asking the police for help. You must pay any reasonable extra charge the Driver has disclosed for this.</p>
<p><b>7.5 The Handover Code is a safety aid, not a guarantee. A code can be guessed, overheard, shared or obtained by force or deception. Enivel and the Driver are not liable for a handover to a person who gave the correct code, unless the Driver knew or should reasonably have suspected that the person was not authorised, or the loss was caused by Enivel’s gross negligence or a failure of our security.</b></p>
<h2 id="pa8">8. Schedules, days off and the term planner</h2>
<p>8.1 You may record days off for a Child and, in the Term Planner, school holidays and closure periods. Those days are automatically treated as days off and the Driver is told.</p>
<p>8.2 You are responsible for entering the correct dates and for updating them if the school changes its calendar. If a closure is announced at short notice, also message the Driver directly through the Platform.</p>
<p>8.3 <b>Days off, school holidays and closures do not reduce the monthly Transport Price or Platform Fee and are not automatically refunded, because the Driver keeps your Child’s seat reserved.</b> Exceptions are set out in the Payments policy.</p>
<p>8.4 Exam-period times, second locations and other schedule changes apply only once the Driver accepts them in the Platform.</p>
<h2 id="pa9">9. Waiting lists</h2>
<p>9.1 If a Route is full, you may join its Waiting List. When a seat becomes available, the first eligible Parent on the list is notified and given an offer that expires after the period shown. If the offer is not accepted and paid within that period, it lapses and passes to the next Parent.</p>
<p>9.2 Your place may change if a Parent ahead of you is reinstated after an error or if a place was obtained in breach of the Terms of Service. A Driver may decline a Booking for lawful reasons (Terms of Service clause 5.6).</p>
<p><b>9.3 Joining a Waiting List does not guarantee a seat, a start date or a price, and Enivel is not liable if a seat is not offered or an offer is missed because a notification was delayed.</b> You may leave the Waiting List at any time.</p>
<h2 id="pa10">10. Your Child’s behaviour and safety education</h2>
<p>10.1 Teach your Child to wear a seat belt at all times, stay seated, not distract the Driver, treat others with respect, and tell you if anything makes them uncomfortable.</p>
<p>10.2 A Driver may refuse to carry a Child whose behaviour seriously endangers others after you have been warned through the Platform and given a reasonable chance to address it, or immediately where there is an immediate danger. The Payments policy sets out the refund consequences.</p>
<p>10.3 You are responsible, to the extent the law allows, for wilful or reckless damage your Child causes to the vehicle, subject to proof of the damage and its reasonable cost.</p>
<h2 id="pa11">11. Payments</h2>
<p>11.1 You pay the Transport Price plus the 2% Platform Fee, monthly in advance or at booking, as set out in the Payments policy. Keep a valid payment method on your account.</p>
<p>11.2 Pay only through the Platform. Paying the Driver outside the Platform for a Booking made on Enivel, to avoid Platform Fees, breaches the Terms of Service (clause 9.2) and removes the protection of the Platform’s records, refund rules and support.</p>
<p>11.3 Contact us before disputing a payment with your bank, so we can resolve it quickly.</p>
<h2 id="pa12">12. Conduct and communication</h2>
<p>12.1 Communicate with Drivers respectfully and through the Platform. Do not ask a Driver to break traffic or licensing rules, to carry more Children than seats, to stop where it is unsafe or unlawful, or to use a phone while driving.</p>
<p>12.2 Do not post allegations about a Driver on social media before reporting them to Enivel and, where a crime is suspected, to the police. Publishing untrue allegations may expose you to a defamation claim by the Driver.</p>
<h2 id="pa13">13. How responsibility is shared</h2>
<table class="lt"><tr><th>Phase</th><th>Who is responsible</th></tr>
<tr><td>Before pickup, including getting the Child to the pickup point and waiting with them</td><td>The Parent</td></tr>
<tr><td>From the moment the Child enters the vehicle until handover to the school or to an authorised adult</td><td>The Driver</td></tr>
<tr><td>After drop-off at school</td><td>The school, under its own rules</td></tr>
<tr><td>After handover to the receiving adult at home or another agreed place</td><td>The Parent and the receiving adult</td></tr>
<tr><td>Accuracy of Child profile, addresses, authorised collectors, Handover Code and Term Planner dates</td><td>The Parent</td></tr>
<tr><td>Driver’s licences, permits, vehicle, insurance and driving</td><td>The Driver</td></tr>
<tr><td>Operating the Platform with reasonable care and skill, verification as described, protecting personal information</td><td>Enivel</td></tr></table>
<p><b>13.1 Enivel’s responsibilities are limited to those in the last row, and Enivel’s liability is limited as set out in clause 14 of the Terms of Service, which does not limit liability for Enivel’s gross negligence or any right you have under the CPA.</b></p>
<h2 id="pa14">14. Your indemnity</h2>
<p><b>You indemnify Enivel against third-party claims and reasonable costs arising from your breach of these terms, false information you give, an instruction you give about who may receive your Child, or your disclosure of a Handover Code or account credential, except to the extent caused by Enivel’s gross negligence or wilful misconduct.</b></p>
<h2 id="pa15">15. Ending transport</h2>
<p>15.1 You may cancel a monthly Booking at any time in the Platform; cancellation takes effect as set out in the Payments policy.</p>
<p>15.2 Removing a Child from your account ends that Child’s Bookings and Waiting List places and withdraws your consent to further processing of the Child’s information, subject to the records we must keep (Privacy Policy section 9).</p>`},
