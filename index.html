const Store={
  all(c){return Object.values(S.data[c]||{})},
  get(c,id){return S.data[c]?.[id]},
  async put(c,id,doc){doc={...doc,id};S.data[c][id]=doc;if(S.mode==='db'){try{await S.db.collection(c).doc(id).set(doc)}catch(e){console.warn('db set',e);toast('Could not save: '+(e.message||e.code))}}else this.flush();if(!S.silent)render();return doc},
  async patch(c,id,p){const cur=S.data[c][id]||{id};return this.put(c,id,{...cur,...p})},
  async del(c,id){delete S.data[c][id];if(S.mode==='db'){try{await S.db.collection(c).doc(id).delete()}catch(e){console.warn(e)}}else this.flush();render()},
  flush(){ls.set('enivel_db',S.data)},
  loadLocal(){const d=ls.get('enivel_db');if(d)COLS.forEach(c=>S.data[c]=d[c]||{})}
};
async function initStore(){
  Store.loadLocal();
  try{
    const db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))]);
    if(db){S.db=db;S.mode='db';S.user=await claude.use('user');
      try{S.viewer=S.user?await S.user.me():null}catch(e){}
      COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S.data[c]=o;render()},err=>console.warn('snap',c,err))});
    }
  }catch(e){console.warn('no db',e)}
  S.ready=true;
}

async function register(form){
  const email=form.email.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email');
  if(Store.all('users').some(u=>u.email===email))return toast('That email is already registered. Log in instead.');
  if(form.password.length<6)return toast('Password needs at least 6 characters');
  const id=uid();const u={id,name:form.name.trim(),email,phone:form.phone.trim(),role:form.role,password:await sha(form.password),createdAt:Date.now(),verification:{status:'none'},rating:null,suspended:false};

  await notify(id,`Welcome to Enivel, ${u.name.split(' ')[0]}! ${form.role==='driver'?'Complete verification to start listing transport.':'Add your children and find a verified transport.'}`,'info');
  go(form.role==='driver'?'d-verify':'p-home');toast('Account created')}
async function login(email,password){email=email.trim().toLowerCase();const hash=await sha(password);
  if(email===ADMIN_EMAIL){if(hash!==ADMIN_HASH)return toast('Wrong admin password');S.admin=true;ls.set('enivel_admin',true);let u=Store.all('users').find(x=>x.email===ADMIN_EMAIL);if(!u){u={id:'admin',name:'Enivel Admin',email:ADMIN_EMAIL,role:'admin',createdAt:Date.now(),verification:{status:'approved'}};await Store.put('users','admin',u)}S.session={userId:u.id};ls.set('enivel_session',S.session);return go('a-home')}
  const u=Store.all('users').find(x=>x.email===email);if(!u||u.password!==hash)return toast('Email or password is wrong');
  if(u.suspended)return toast('This account is suspended. Contact support@enivel.co.za');
  S.session={userId:u.id};ls.set('enivel_session',S.session);go(u.role==='driver'?'d-home':'p-home')}

S.photoMeta={};function blurScore(cx,W,H){try{const n=64;const t=document.createElement('canvas');t.width=n;t.height=n;const tx=t.getContext('2d');tx.drawImage(cx.canvas,0,0,n,n);const d=tx.getImageData(0,0,n,n).data;const g=new Float32Array(n*n);for(let i=0;i<n*n;i++)g[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);let sum=0,sq=0,c=0;for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++){const v=-4*g[y*n+x]+g[y*n+x-1]+g[y*n+x+1]+g[(y-1)*n+x]+g[(y+1)*n+x];sum+=v;sq+=v*v;c++}const mean=sum/c;return Math.round(sq/c-mean*mean)}catch(e){return null}}

    <div class="field"><label>Referral code <span class="muted">(optional)</span></label><input id="su-ref" name="ref" placeholder="e.g. NALE7K2Q"></div>

    <button class="btn wide">Create account</button></form>`}

</div></div>`};

VIEWS.privacy=()=>`<article class="legal" style="max-width:760px"><span class="eyebrow">Last updated ${new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})}</span><h1 style="font-size:2rem;margin-top:8px">Privacy Policy</h1>
<p style="margin-top:10px">Enivel ("we", "us") is a scholar-transport marketplace operated in the Republic of South Africa. This policy explains what personal information we collect, why, how we protect it and the rights you have under the Protection of Personal Information Act 4 of 2013 (POPIA), the Electronic Communications and Transactions Act and the Children's Act. Because Enivel is used by parents on behalf of children, we hold ourselves to a stricter standard than the law minimum.</p>
<h2>1. Who is responsible</h2><p>Enivel is the "responsible party" for personal information processed through the app and website. Drivers are independent transport operators and are separately responsible for their own conduct and vehicles. Our Information Officer can be reached at privacy@enivel.co.za.</p>
<h2>2. What we collect</h2><h3>Parents and guardians</h3><ul><li>Account details: name, email address, cellphone number, password (stored only as a one-way hash).</li><li>Identity verification: South African ID or passport number and a photo of the ID document, used only to confirm you are an adult legally entitled to arrange transport for the child.</li><li>Child profiles: first name, age, school and grade. We deliberately do not collect a child's ID number, photo, medical information or home address beyond the pickup point you choose.</li><li>Pickup and drop-off addresses, time windows and budget preferences.</li><li>Payment records: amounts, dates, the driver paid and the Enivel fee. Card numbers are handled by our payment processor and never stored by Enivel.</li><li>In-app messages between you and drivers, kept so disputes can be resolved.</li></ul>
<h3>Drivers</h3><ul><li>Account details as above.</li><li>Verification documents: SA ID, driver's licence, Professional Driving Permit (PrDP), SAPS police clearance certificate, vehicle roadworthy certificate, licence disc, proof of address and a live selfie.</li><li>Vehicle details: make, model, colour, registration number, photographs of all sides and the number plate, and the seat count Enivel estimates from them.</li><li>Location data: only while you have switched on trip sharing. It is shown only to parents whose child is currently marked as picked up in your vehicle, and is deleted at the end of the trip.</li><li>Pickup and drop-off events you record, with timestamps.</li><li>Billing history: platform fees, parking-slot fees and payouts.</li></ul>
<h3>Everyone</h3><ul><li>Device and usage data such as app version, crash logs and the pages you open, used for security and to improve the service.</li><li>Notifications we send you and whether they were delivered.</li></ul>
<h2>3. Why we process it (lawful basis)</h2><ul><li><b>To run the service you asked for</b>: matching parents with drivers, managing bookings, chat, payments and alerts (performance of a contract).</li><li><b>Child safety and legal compliance</b>: verifying driver identity, licensing and police clearance, enforcing seat limits and keeping an audit trail of every pickup and drop-off (legitimate interest and legal obligation).</li><li><b>Fraud prevention and security</b>: detecting duplicate or fake accounts, suspicious payments and abuse of chat.</li><li><b>Communication</b>: service messages such as "Thabo was picked up at 06:42". Marketing messages are sent only if you opt in and you can opt out at any time.</li><li><b>Consent</b>: where we rely on consent (for example marketing or optional location sharing) you can withdraw it at any time in Settings.</li></ul>
<h2>4. Children's information</h2><p>Children under 18 cannot create Enivel accounts. A child's profile can only be created by a verified adult account holder who confirms they are the parent or legal guardian. We collect the minimum needed to run a safe transport service. Drivers see a child's first name, school and pickup point only for children booked on their route, and lose that access when the booking ends. We never sell or share children's information for advertising.</p>
<h2>5. Who we share information with</h2><ul><li><b>Drivers and parents on the same booking</b> see each other's name, cellphone number (optional), vehicle details and chat messages.</li><li><b>Payment processors</b> (for example PayFast, Yoco or Ozow) receive what is needed to process your payment under their own privacy policies.</li><li><b>Verification partners</b> may be used to validate ID numbers, licences and police clearance certificates.</li><li><b>Cloud hosting providers</b> that store our data under contract, with servers in South Africa or in jurisdictions with adequate protection as required by section 72 of POPIA.</li><li><b>Law enforcement or regulators</b> when legally required, or where a child's safety is at risk.</li></ul><p>We never sell personal information.</p>
<h2>6. How long we keep it</h2><ul><li>Account and child profiles: for as long as the account is active, then deleted within 90 days of closure.</li><li>Pickup and drop-off records and chat: 24 months, because they may be needed to resolve a safety incident or dispute.</li><li>Driver verification documents: for the life of the driver account plus 12 months, as evidence of our checks.</li><li>Financial records: 5 years as required by the Tax Administration Act.</li><li>Live location: deleted at the end of each trip.</li></ul>
<h2>7. How we protect it</h2><p>Data is encrypted in transit and at rest. Passwords are hashed and cannot be recovered by staff. Verification documents are stored separately from profiles with restricted staff access, and every access is logged. Location is shared on a strict need-to-know basis tied to an active pickup. We run regular access reviews and will notify you and the Information Regulator of any breach that affects you, as section 22 of POPIA requires.</p>
<h2>8. Your rights</h2><ul><li>Access a copy of the information we hold about you and your children.</li><li>Correct inaccurate information.</li><li>Delete your account and data, subject to the retention periods above.</li><li>Object to processing based on legitimate interest, and opt out of marketing.</li><li>Withdraw consent for location sharing or optional features.</li><li>Lodge a complaint with the Information Regulator of South Africa (complaints.IR@justice.gov.za).</li></ul><p>Email privacy@enivel.co.za and we will respond within 30 days.</p>
<h2>9. Cookies and local storage</h2><p>The web app stores your login session, theme choice and drafts in your browser so that you do not need to log in every time. We do not use third-party advertising cookies.</p>
<h2>10. Changes</h2><p>We will notify you in the app at least 14 days before a material change to this policy takes effect.</p>
<div class="row" style="margin-top:30px"><button class="btn ghost sm" onclick="history.length>1?history.back():go('landing')">Back</button><button class="btn ghost sm" onclick="go('terms')">Terms of service</button></div></article>`;
VIEWS.terms=()=>`<article class="legal" style="max-width:760px"><h1 style="font-size:2rem">Terms of Service</h1>
<h2>1. The service</h2><p>Enivel is a marketplace that connects parents with independent scholar-transport drivers. Enivel is not a transport operator, does not employ drivers and does not own vehicles. Drivers contract directly with parents; Enivel provides verification, matching, communication, tracking, payments and dispute support.</p>
<h2>2. Accounts</h2><p>You must be 18 or older. Parents confirm they are the parent or legal guardian of every child they add and must verify their identity with a South African ID or passport before their first booking. One person may not hold more than one account.</p>
<h2>3. Driver obligations</h2><ul><li>Hold a valid driver's licence and a Professional Driving Permit (PrDP) with the "G" (goods) and "P" (passengers) categories as applicable, and a SAPS police clearance certificate not older than 6 months at the time of upload, renewed annually.</li><li>Hold a valid operating licence or permit for scholar transport where required by the National Land Transport Act and provincial regulations.</li><li>Keep every listed vehicle roadworthy, licensed and insured, and carry only as many children as there are seats with seatbelts. Enivel enforces the seat count estimated from your photographs; you may request a correction with proof.</li><li>Mark every pickup and drop-off truthfully and immediately. False marking is grounds for permanent removal.</li><li>Keep trip sharing on for the duration of every trip.</li></ul>
<h2>4. Fees</h2><ul><li><b>Parents</b> pay the driver's monthly transport price plus a platform fee of 2% of that price, displayed before confirmation. Example: transport R1 000.00, fee R20.00, total R1 020.00.</li><li><b>Drivers</b> pay a platform fee of R100.00 per month, charged only in months in which the driver has at least one active paying passenger.</li><li><b>Parking slots</b>: a driver may list three vehicles free. Each additional vehicle requires a parking slot at R49.99 per month.</li><li><b>Private chauffeur</b> bookings follow the same 2% fee.</li><li>Fees include VAT where applicable and may change with 30 days' notice.</li></ul>
<h2>5. Payments, refunds and payouts</h2><p>Monthly subscriptions are billed in advance. Driver payouts are released after the Enivel fee is deducted. If a driver fails verification or is removed mid-month, the unused portion is refunded to the parent. Disputes must be raised within 14 days.</p>
<h2>6. Safety</h2><p>Enivel may suspend any account immediately where a child's safety is at risk, including on a credible report from a parent, school or the public. Parents can report any incident in the app or at safety@enivel.co.za.</p>
<h2>7. Liability</h2><p>To the extent permitted by the Consumer Protection Act, Enivel is not liable for the acts or omissions of drivers or parents. Nothing in these terms limits liability for gross negligence or wilful misconduct.</p>
<h2>8. Governing law</h2><p>South African law applies. Disputes may be referred to the Consumer Goods and Services Ombud or the courts of South Africa.</p>
<div class="row" style="margin-top:30px"><button class="btn ghost sm" onclick="go('landing')">Back</button><button class="btn ghost sm" onclick="go('privacy')">Privacy policy</button></div></article>`;
VIEWS.safety=()=>`<article class="legal" style="max-width:760px"><h1 style="font-size:2rem">Safety Standards</h1>
<p style="margin-top:10px">Every driver on Enivel passes these checks before a parent can book them, and keeps passing them to stay listed.</p>
<ul><li>Identity confirmed against a South African ID or passport with a live selfie match.</li><li>Valid driver's licence and Professional Driving Permit.</li><li>SAPS police clearance certificate, renewed every 12 months.</li><li>Roadworthy certificate and current licence disc for every listed vehicle.</li><li>Photographs of all four sides and the number plate of every vehicle, reviewed by Enivel staff.</li><li>Seat limit enforced in the app: a route cannot accept more children than seats.</li><li>Pickup and drop-off must be recorded for every child, every trip. Parents are notified instantly.</li><li>Driver location is visible to a parent only while their child is on board.</li><li>Two-strike policy for late or missed pickups without notice; immediate removal for any safety breach.</li></ul>
<button class="btn ghost sm" style="margin-top:20px" onclick="go('landing')">Back</button></article>`;

<script>
/* ===================== parent ===================== */
function kidStatus(kid){const ev=Store.all('events').filter(e=>e.kidId===kid.id).sort((a,b)=>b.ts-a.ts);const today=new Date().toDateString();const t=ev.filter(e=>new Date(e.ts).toDateString()===today);return {last:ev[0],today:t,onboard:t[0]?.type==='pickup'}}
function bookingOf(kid){return activeBookings(b=>b.kidId===kid.id)[0]}
function routeOf(id){return Store.get('routes',id)}
function needsParentId(u){return !(u.idNumber&&u.idPhoto)}

VIEWS['p-home']=()=>{const u=me();if(!u)return VIEWS.login();const kids=kidsOf(u.id);const n=myNotifs().slice(0,4);
  const hour=new Date().getHours();const greet=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  return `<div class="stack" style="gap:20px">
  <div class="row between"><div><span class="eyebrow">${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</span><h2>${greet}, ${h(u.name.split(' ')[0])}</h2></div><button class="btn sm" onclick="go('p-find')">${ICON.search} Find transport</button></div>
  ${needsParentId(u)?`<div class="notice"><b>Add your ID</b> before your first booking. <a href="#" onclick="event.preventDefault();go('p-more')">Add now</a></div>`:''}
  ${kids.length?`<div class="grid g2">${kids.map(k=>{const st=kidStatus(k);const b=bookingOf(k);const r=b&&routeOf(b.routeId);const drv=b&&Store.get('users',b.driverId);
    return `<div class="card"><div class="row between"><div class="row"><span class="avatar">${initials(k.name)}</span><div><div style="font-weight:800">${h(k.name)}</div><div class="tiny muted">${k.age} yrs · ${h(k.school||'School not set')}${k.grade?' · '+h(k.grade):''}</div></div></div>${st.onboard?'<span class="pill live"><i class="blink"></i>On board</span>':st.today[0]?.type==='dropoff'?'<span class="pill info">Dropped off</span>':b?'<span class="pill">Waiting</span>':'<span class="pill warn">No transport</span>'}</div>
    ${b?`<div class="small" style="margin-top:12px"><b>${h(r?.name||'Route')}</b> · ${h(drv?.name||'')}<br><span class="muted">${h(r?.vehicleLabel||'')} · ${h(r?.plate||'')}</span></div>
      ${st.last?`<div class="tiny muted" style="margin-top:6px">Last: ${st.last.type==='pickup'?'picked up':'dropped off'} ${fmtDT(st.last.ts)}</div>`:''}
      <div class="row" style="margin-top:12px">${st.onboard?`<button class="btn sm live" onclick="go('p-track',{trackKid:'${k.id}'})">${ICON.pin} Track live</button>`:''}<button class="btn sm ghost" onclick="openChat('${b.driverId}')">${ICON.chat} Chat</button><button class="btn sm ghost" onclick="go('p-booking',{bookingId:'${b.id}'})">Details</button></div>`
    :`<div class="row" style="margin-top:12px"><button class="btn sm" onclick="go('p-find',{findKid:'${k.id}'})">Find transport</button></div>`}</div>`}).join('')}</div>`
  :`<div class="card soft" style="text-align:center;padding:30px"><h3>Add your first child</h3><p class="muted small" style="margin:6px 0 14px">Name and age is enough.</p><button class="btn" onclick="addKid()">Add child</button></div>`}
  <div class="grid g2">
    <div class="card"><div class="row between"><h3>Recent alerts</h3><button class="btn sm ghost" onclick="go('notifs')">All</button></div><div class="list" style="margin-top:8px">${n.length?n.map(x=>`<div class="item"><div class="grow small">${h(x.text)}<div class="tiny muted">${fmtDT(x.ts)}</div></div></div>`).join(''):'<p class="muted small">No alerts yet.</p>'}</div></div>
    <div class="card"><h3>This month</h3>${monthSummary(u)}</div>
  </div></div>`};
function monthSummary(u){const bs=activeBookings(b=>b.parentId===u.id);if(!bs.length)return '<p class="muted small" style="margin-top:8px">No active subscriptions.</p>';const cost=bs.reduce((s,b)=>s+b.price,0);const fee=feeFor(cost);const m=monthKey();const paid=Store.all('transactions').filter(t=>t.from===u.id&&t.month===m&&t.type==='subscription').reduce((s,t)=>s+t.amount,0);
  return `<div class="fee" style="margin-top:10px"><span>Transport (${bs.length} ${bs.length>1?'children':'child'})</span><b>${money(cost)}</b><span>Enivel fee 2%</span><b>${money(fee)}</b><span class="tot">Total</span><b class="tot">${money(cost+fee)}</b></div><div class="row between small" style="margin-top:10px"><span class="muted">Paid this month: ${money(paid)}</span>${paid<cost+fee?`<button class="btn sm" onclick="go('p-pay')">Pay now</button>`:'<span class="pill live">Paid</span>'}</div>`}

VIEWS['p-kids']=()=>{const u=me();const kids=kidsOf(u.id);return pageHead('My children','',`<button class="btn sm" onclick="addKid()">Add child</button>`)+
  (kids.length?`<div class="grid g2">${kids.map(k=>{const b=bookingOf(k);const r=b&&routeOf(b.routeId);const hist=Store.all('events').filter(e=>e.kidId===k.id).sort((a,b)=>b.ts-a.ts).slice(0,5);
  return `<div class="card"><div class="row between"><div class="row"><span class="avatar">${initials(k.name)}</span><div><b>${h(k.name)}</b><div class="tiny muted">${k.age} yrs · ${h(k.school||'No school')} ${k.grade?'· '+h(k.grade):''}</div></div></div><button class="btn sm ghost" onclick="addKid('${k.id}')">Edit</button></div>
  <div class="small" style="margin-top:10px">${b?`Rides with <b>${h(userName(b.driverId))}</b> on <b>${h(r?.name||'')}</b> · ${money(b.price)}/month ${b.type==='private'?'<span class="pill">Private</span>':''}`:'<span class="muted">No transport yet.</span>'}</div>
  ${k.notes?`<div class="tiny muted" style="margin-top:6px">Notes for driver: ${h(k.notes)}</div>`:''}
  <div style="margin-top:10px"><div class="eyebrow">Recent trips</div>${hist.length?hist.map(e=>`<div class="tiny" style="padding:4px 0;border-bottom:1px solid var(--line)">${e.type==='pickup'?'↑ Picked up':'↓ Dropped off'} · ${fmtDT(e.ts)}${e.where?' · '+h(e.where):''}</div>`).join(''):'<div class="tiny muted">No trips recorded.</div>'}</div>
  <div class="row" style="margin-top:12px">${b?`<button class="btn sm ghost" onclick="cancelBooking('${b.id}')">Cancel transport</button>`:`<button class="btn sm" onclick="go('p-find',{findKid:'${k.id}'})">Find transport</button>`}<button class="btn sm ghost" onclick="confirmBox('Remove ${h(k.name)}?','Their profile and trip history will be deleted.',()=>Store.del('kids','${k.id}'))">Remove</button></div></div>`}).join('')}</div>`:empty('No children added yet.','kids'))};
function addKid(id){const k=id?Store.get('kids',id):{};modal(`<h3>${id?'Edit':'Add'} child</h3><div class="stack" style="margin-top:14px">
  <div class="field"><label>First name</label><input id="k-n" value="${h(k.name||'')}" placeholder="e.g. Thabo"></div>
  <div class="grid g2"><div class="field"><label>Age</label><input id="k-a" type="number" min="3" max="19" value="${k.age||''}"></div><div class="field"><label>Grade</label><input id="k-g" value="${h(k.grade||'')}" placeholder="e.g. Grade 4"></div></div>
  <div class="field"><label>School</label><input id="k-s" value="${h(k.school||'')}" placeholder="e.g. Laerskool Rietfontein"></div>
  <div class="field"><label>Pickup address</label><input id="k-p" value="${h(k.pickup||'')}" placeholder="Street, suburb"></div>
  <div class="field"><label>Notes for the driver (optional)</label><textarea id="k-notes" rows="2" placeholder="Allergies, who may collect, anything the driver must know">${h(k.notes||'')}</textarea></div>
  <button class="btn wide" id="k-save">Save</button></div>`,m=>{$('#k-save',m).onclick=async()=>{const name=val(m,'k-n').trim(),age=+val(m,'k-a');if(!name||!age)return toast('Name and age are required');await Store.put('kids',id||uid(),{...k,parentId:me().id,name,age,grade:val(m,'k-g'),school:val(m,'k-s'),pickup:val(m,'k-p'),notes:val(m,'k-notes'),createdAt:k.createdAt||Date.now()});closeModal();toast('Saved')}})}

VIEWS['p-find']=()=>{const u=me();const f=S.filters;const kids=kidsOf(u.id);const type=f.type||'shared';
  let routes=Store.all('routes').filter(r=>r.active&&isVerified(Store.get('users',r.driverId))&&(r.type||'shared')===type);
  if(f.q){const q=f.q.toLowerCase();routes=routes.filter(r=>[r.name,r.area,r.schools,r.suburbs].join(' ').toLowerCase().includes(q))}
  if(f.budget)routes=routes.filter(r=>r.price<=+f.budget);
  if(f.seats)routes=routes.filter(r=>r.seats-routeSeatsUsed(r.id)>0);
  if(f.sort==='price')routes.sort((a,b)=>a.price-b.price);else if(f.sort==='rating')routes.sort((a,b)=>driverRating(b.driverId)-driverRating(a.driverId));
  return `<div class="stack" style="gap:16px">${pageHead('Find transport','')}
  <div class="seg"><button class="${type==='shared'?'on':''}" onclick="S.filters.type='shared';render()">Shared transport</button><button class="${type==='private'?'on':''}" onclick="S.filters.type='private';render()">Private chauffeur</button></div>
  <div class="card soft"><div class="grid g4">
    <div class="field"><label>Area / school</label><input id="f-q" value="${h(f.q||'')}" placeholder="e.g. Soweto, Rietfontein" oninput="S.filters.q=this.value"></div>
    <div class="field"><label>Max budget / month</label><input id="f-b" type="number" value="${h(f.budget||'')}" placeholder="R" oninput="S.filters.budget=this.value"></div>
    <div class="field"><label>Sort</label><select id="f-s" onchange="S.filters.sort=this.value;render()"><option value="">Newest</option><option value="price" ${f.sort==='price'?'selected':''}>Cheapest</option><option value="rating" ${f.sort==='rating'?'selected':''}>Best rated</option></select></div>
    </div><label class="row small" style="margin-top:12px;gap:8px"><input id="f-seats" type="checkbox" ${f.seats?'checked':''} onchange="S.filters.seats=this.checked;render()"> Only with open seats</label>
    <div class="row" style="margin-top:10px"><button class="btn sm" onclick="render()">Search</button><button class="btn sm ghost" onclick="S.filters={type:'${type}'};render()">Clear</button><button class="btn sm ghost" onclick="go('p-requests')">Post a request instead</button></div></div>
  ${routes.length?`<div class="grid g2">${routes.map(r=>routeCard(r,kids)).join('')}</div>`:empty(`No ${type==='private'?'private chauffeurs':'routes'} match. Try widening your budget or <a href="#" onclick="event.preventDefault();go('p-requests')">post a request</a> so drivers can offer.`)}</div>`};
function driverRating(id){const rs=Store.all('ratings').filter(r=>r.driverId===id);return rs.length?rs.reduce((s,r)=>s+r.stars,0)/rs.length:0}
function routeCard(r,kids){const d=Store.get('users',r.driverId);const v=Store.get('vehicles',r.vehicleId);const used=routeSeatsUsed(r.id);const open=r.seats-used;const rating=driverRating(r.driverId);const nR=Store.all('ratings').filter(x=>x.driverId===r.driverId).length;
  return `<div class="card"><div class="row between"><div class="row"><span class="avatar">${initials(d?.name)}</span><div><b>${h(d?.name)}</b> <span class="pill live tiny">${ICON.shield} Verified</span><div class="tiny muted">${rating?'★ '+rating.toFixed(1)+' ('+nR+')':'New driver'} · ${driverPassengers(r.driverId)} passengers</div></div></div><div style="text-align:right"><div class="num" style="font-size:1.4rem">${money(r.price)}</div><div class="tiny muted">per month</div></div></div>

MOUNT.map=el=>{const c=$('canvas',el);const r=Store.get('routes',el.dataset.route);const draw=()=>{const dpr=devicePixelRatio||1;const W=el.clientWidth,H=el.clientHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const dark=isDark();x.fillStyle=dark?'#101010':'#f3f3f0';x.fillRect(0,0,W,H);x.strokeStyle=dark?'#1f1f1f':'#e3e3df';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
    const pts=[[.08,.82],[.25,.7],[.38,.74],[.5,.5],[.62,.42],[.78,.3],[.9,.18]].map(([a,b])=>[a*W,b*H]);x.strokeStyle=dark?'#3a3a3a':'#c9c9c4';x.lineWidth=8;x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();

    x.strokeStyle='#1db954';x.lineWidth=8;x.beginPath();x.moveTo(...pts[0]);for(let j=1;j<=i;j++)x.lineTo(...pts[j]);x.lineTo(px,py);x.stroke();

  activeBookings(b=>b.parentId===u.id||b.driverId===u.id).forEach(b=>{const o=b.parentId===u.id?b.driverId:b.parentId;partners[o]=1});
  Store.all('offers').forEach(o=>{const rq=Store.get('requests',o.requestId);if(!rq)return;if(o.driverId===u.id)partners[rq.parentId]=1;if(rq.parentId===u.id)partners[o.driverId]=1});
  msgs.forEach(m=>{if(m.from===u.id)partners[m.to]=1;if(m.to===u.id)partners[m.from]=1});if(S.chatWith)partners[S.chatWith]=1;
  const list=Object.keys(partners).filter(id=>Store.get('users',id)).map(id=>{const th=msgs.filter(m=>threadId(m.from,m.to)===threadId(u.id,id)).sort((a,b)=>b.ts-a.ts);return {id,last:th[0],unread:th.filter(m=>m.to===u.id&&!m.read).length}}).sort((a,b)=>(b.last?.ts||0)-(a.last?.ts||0));
  const w=S.chatWith&&Store.get('users',S.chatWith);
  const thread=w?msgs.filter(m=>threadId(m.from,m.to)===threadId(u.id,w.id)).sort((a,b)=>a.ts-b.ts):[];
  if(w)setTimeout(()=>thread.filter(m=>m.to===u.id&&!m.read).forEach(m=>{S.data.messages[m.id].read=true;if(S.mode==='db')S.db.collection('messages').doc(m.id).update({read:true}).catch(()=>{});else Store.flush()}),300);
  return `<div class="grid" style="grid-template-columns:${w?'minmax(0,1fr)':'1fr'};gap:14px">${w?`<div><div class="row" style="margin-bottom:10px"><button class="btn sm ghost" onclick="S.chatWith=null;render()">‹ All chats</button><span class="avatar sm">${initials(w.name)}</span><b>${h(w.name)}</b><span class="pill tiny">${w.role}</span></div>
    <div class="chatbox"><div class="msgs" id="msgs">${thread.length?thread.map(m=>`<div class="msg ${m.from===u.id?'me':''}">${h(m.text)}<span class="ts">${fmtDT(m.ts)}</span></div>`).join(''):'<p class="muted small" style="text-align:center">Say hello. Keep all transport arrangements in Enivel so there is a record.</p>'}</div>
    <form class="compose" onsubmit="event.preventDefault();sendMsg('${w.id}',this.t)"><input id="chat-in" name="t" placeholder="Message ${h(w.name.split(' ')[0])}…" autocomplete="off"><button class="btn sm">Send</button></form></div></div>`
  :pageHead('Chat','')+(list.length?`<div class="card list">${list.map(p=>{const o=Store.get('users',p.id);return `<div class="item" style="cursor:pointer" onclick="S.chatWith='${p.id}';render()"><span class="avatar">${initials(o.name)}</span><div class="grow"><div class="t">${h(o.name)} <span class="tiny muted">${o.role}</span></div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h(p.last?.text||'No messages yet')}</div></div>${p.unread?`<span class="pill ink">${p.unread}</span>`:''}</div>`}).join('')}</div>`:empty('No conversations yet. Chats open from a booking, a request or a route.','chat'))}</div>`}
VIEWS['p-chat']=chatView;VIEWS['d-chat']=chatView;
async function sendMsg(to,inp){const text=inp.value.trim();if(!text)return;inp.value='';await Store.put('messages',uid(),{from:me().id,to,text,ts:Date.now(),read:false});await notify(to,`${me().name}: ${text.slice(0,60)}`,'chat',Store.get('users',to)?.role==='driver'?'d-chat':'p-chat');const box=$('#msgs');if(box)box.scrollTop=box.scrollHeight}

VIEWS['p-pay']=()=>{const u=me();const bs=activeBookings(b=>b.parentId===u.id);const m=monthKey();const cost=bs.reduce((s,b)=>s+b.price,0),fee=feeFor(cost);const txs=Store.all('transactions').filter(t=>t.from===u.id||(t.type==='sponsorship'&&bs.some(b=>b.id===t.bookingId))).sort((a,b)=>b.ts-a.ts);const paid=txs.filter(t=>t.month===m&&t.type==='subscription').reduce((s,t)=>s+t.amount,0);
  return pageHead('Payments','Your monthly subscription and history')+`<div class="grid g2"><div class="card"><h3>${new Date().toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}</h3>${bs.length?`<div class="fee" style="margin-top:10px">${bs.map(b=>`<span>${h(Store.get('kids',b.kidId)?.name)} · ${h(userName(b.driverId))}</span><b>${money(b.price)}</b>`).join('')}<span>Enivel fee 2%</span><b>${money(fee)}</b><span class="tot">Total</span><b class="tot">${money(cost+fee)}</b></div>${paid>=cost?'<p class="pill live" style="margin-top:10px">Paid for this month</p>':`<button class="btn wide" style="margin-top:12px" onclick="payMonth()">Pay ${money(cost+fee)}</button>`}`:'<p class="muted small" style="margin-top:8px">No active subscriptions.</p>'}</div>
  <div class="card"><h3>History</h3><div class="list" style="margin-top:8px">${txs.length?txs.map(t=>`<div class="item small"><div class="grow">${h(t.note||t.type)}<div class="tiny muted">${fmtDT(t.ts)} · ${t.month}</div></div><b>${t.type==='sponsorship'?'−':''}${money(t.amount)}</b></div>`).join(''):'<p class="muted small">Nothing yet.</p>'}</div></div></div>`};
function payMonth(){const u=me();const bs=activeBookings(b=>b.parentId===u.id);const cost=bs.reduce((s,b)=>s+b.price,0);payModal(cost+feeFor(cost),async()=>{for(const b of bs){await pushTx({type:'subscription',amount:b.price,from:u.id,to:b.driverId,bookingId:b.id,kidId:b.kidId,note:'Monthly transport'});await pushTx({type:'platform_fee',amount:feeFor(b.price),from:u.id,to:'enivel',bookingId:b.id,note:'2% platform fee'});await chargeDriverFeeIfDue(b.driverId)}closeModal();toast('Paid');render()})}

VIEWS['p-more']=()=>{const u=me();return pageHead('Account')+`<div class="grid g2"><div class="card"><div class="row"><span class="avatar">${initials(u.name)}</span><div><b>${h(u.name)}</b><div class="small muted">${h(u.email)} · ${h(u.phone||'')}</div></div></div>
  <h3 style="margin-top:18px">Parent ID verification ${needsParentId(u)?'<span class="pill warn">Required</span>':'<span class="pill live">Done</span>'}</h3><p class="small muted" style="margin:4px 0 10px">Needed once, before your first booking.</p>
  <div class="stack"><div class="field"><label>SA ID number</label><input id="pid-n" value="${h(u.idNumber||'')}" inputmode="numeric" maxlength="13" placeholder="13 digits"></div>${photoBox('pid-photo','Photo of your ID document or card',u.idPhoto)}<button class="btn" id="pid-save" data-mount="pidSave">Save ID</button></div></div>
  <div class="stack"><div class="card"><h3>Quick links</h3><div class="list" style="margin-top:6px">${[['p-pay','Payments and invoices'],['p-requests','My transport requests'],['notifs','Notifications'],['privacy','Privacy policy'],['terms','Terms of service'],['safety','Safety standards']].map(([r,l])=>`<div class="item" style="cursor:pointer" onclick="go('${r}')"><div class="grow">${l}</div>›</div>`).join('')}</div></div>
  <div class="card"><h3>Appearance</h3><div class="seg" style="margin-top:8px"><button class="${!S.theme?'on':''}" onclick="setTheme(null);render()">System</button><button class="${S.theme==='light'?'on':''}" onclick="setTheme('light');render()">Light</button><button class="${S.theme==='dark'?'on':''}" onclick="setTheme('dark');render()">Dark</button></div></div>
  <button class="btn ghost" onclick="logout()">Log out</button></div></div>`};
MOUNT.pidSave=btn=>{btn.onclick=async()=>{const n=$('#pid-n').value.trim();if(!validSAID(n))return toast('That is not a valid South African ID number');const box=$('#pid-photo');const url=box.dataset.url||me().idPhoto;if(!url)return toast('Add a photo of your ID');await Store.patch('users',me().id,{idNumber:n,idPhoto:url,idVerifiedAt:Date.now()});toast('ID saved')}};
</script>
<script>
/* ===================== driver ===================== */
const DOCS=[['id','SA ID / passport','Front of your green ID book, smart card or passport'],['licence',"Driver's licence",'Card, both sides if possible'],['prdp','Professional Driving Permit (PrDP)','Must show the P category'],['police','SAPS police clearance','Not older than 6 months'],['roadworthy','Roadworthy certificate','For your main vehicle'],['disc','Licence disc','Current year'],['address','Proof of address','Not older than 3 months'],['selfie','Live selfie','Hold your ID next to your face']];
function myVehicles(){return Store.all('vehicles').filter(v=>v.driverId===me().id).sort((a,b)=>a.createdAt-b.createdAt)}
function myRoutes(){return Store.all('routes').filter(r=>r.driverId===me().id)}
function parkingSlotsNeeded(driverId){return Math.max(0,Store.all('vehicles').filter(v=>v.driverId===driverId).length-FREE_VEHICLES)}

VIEWS['d-home']=()=>{const u=me();const vs=myVehicles(),rs=myRoutes();const bs=activeBookings(b=>b.driverId===u.id);const ver=u.verification?.status||'none';const m=monthKey();const earned=Store.all('transactions').filter(t=>t.to===u.id&&t.month===m).reduce((s,t)=>s+t.amount,0);const rating=driverRating(u.id);
  const today=new Date().toDateString();const todaysEvents=Store.all('events').filter(e=>e.driverId===u.id&&new Date(e.ts).toDateString()===today);
  return `<div class="stack" style="gap:18px"><div class="row between"><div><span class="eyebrow">Driver</span><h2>${h(u.name)}</h2></div>${ver==='approved'?'<span class="pill live">'+ICON.shield+' Verified</span>':ver==='pending'?'<span class="pill warn">Verification pending</span>':ver==='rejected'?'<span class="pill bad">Verification rejected</span>':'<span class="pill warn">Not verified</span>'}</div>
  ${ver!=='approved'?`<div class="card ink"><h3>${ver==='pending'?'We are checking your documents':ver==='rejected'?'Some documents were rejected':'Complete verification to go live'}</h3><p class="small" style="opacity:.8;margin:6px 0 12px">${ver==='pending'?'Usually within 24 hours. You can add vehicles and routes meanwhile; they go live once approved.':ver==='rejected'?h(u.verification?.note||'See the note from Enivel and re-upload.'):'Upload your ID, licence, PrDP, police clearance, roadworthy, licence disc, proof of address and a selfie.'}</p><button class="btn" style="background:var(--ink-fg);color:var(--ink);border-color:var(--ink-fg)" onclick="go('d-verify')">${ver==='none'?'Start verification':'View documents'}</button></div>`:''}
  <div class="kpi"><div class="card"><div class="eyebrow">Passengers</div><div class="num">${bs.length}</div></div><div class="card"><div class="eyebrow">Routes</div><div class="num">${rs.length}</div></div><div class="card"><div class="eyebrow">Vehicles</div><div class="num">${vs.length}<span class="tiny muted">/${FREE_VEHICLES} free</span></div></div><div class="card"><div class="eyebrow">Earned ${m}</div><div class="num" style="font-size:1.4rem">${money(earned)}</div></div><div class="card"><div class="eyebrow">Rating</div><div class="num">${rating?rating.toFixed(1):'—'}</div></div></div>
  <div class="card"><div class="row between"><h3>Today's trips</h3><span class="tiny muted">${todaysEvents.length} events logged</span></div>${rs.length?`<div class="stack" style="margin-top:10px">${rs.filter(r=>r.active).map(r=>{const n=routeSeatsUsed(r.id);return `<div class="row between" style="padding:10px;border:1px solid var(--line);border-radius:12px"><div><b>${h(r.name)}</b><div class="tiny muted">${n}/${r.seats} seats · pickup ${h(r.pickupTime)}</div></div><div class="row">${r.live?.active?'<span class="pill live"><i class="blink"></i>Trip live</span>':''}<button class="btn sm" onclick="go('d-trip',{tripRoute:'${r.id}'})">${r.live?.active?'Open trip':'Start trip'}</button></div></div>`}).join('')}</div>`:'<p class="muted small" style="margin-top:8px">Add a vehicle, then create a route to start receiving bookings.</p>'}</div>
  <div class="grid g2"><div class="card"><h3>Open requests near you</h3>${openRequestsList(3)}</div><div class="card"><h3>Recent alerts</h3><div class="list" style="margin-top:6px">${myNotifs().slice(0,4).map(x=>`<div class="item small"><div class="grow">${h(x.text)}<div class="tiny muted">${fmtDT(x.ts)}</div></div></div>`).join('')||'<p class="muted small">Nothing yet.</p>'}</div></div></div></div>`};

VIEWS['d-verify']=()=>{const u=me();const v=u.verification||{status:'none',docs:{}};const docs=v.docs||{};const done=DOCS.filter(d=>docs[d[0]]).length;
  return pageHead('Verification','Reviewed within 24 hours. Never shown to parents.')+`<div class="stack"><div class="row between"><span class="small">${done} of ${DOCS.length} uploaded</span><span class="pill ${v.status==='approved'?'live':v.status==='pending'?'warn':v.status==='rejected'?'bad':''}">${v.status==='none'?'Not submitted':v.status}</span></div><div class="bar"><i style="width:${done/DOCS.length*100}%"></i></div>
  ${v.note?`<div class="notice">${h(v.note)}</div>`:''}
  <div class="grid g2"><div class="field"><label>SA ID number</label><input id="dv-id" value="${h(u.idNumber||'')}" maxlength="13" inputmode="numeric"></div><div class="field"><label>PrDP expiry</label><input id="dv-prdp" type="date" value="${h(u.prdpExpiry||'')}"></div><div class="field"><label>Police clearance issue date</label><input id="dv-pol" type="date" value="${h(u.policeDate||'')}"></div><div class="field"><label>Years driving scholar transport</label><input id="dv-yrs" type="number" value="${h(u.years||'')}"></div></div>
  <div class="grid g3" id="dv-docs">${DOCS.map(([k,t,d])=>`<div class="stack" style="gap:6px"><div class="eyebrow">${t} ${docs[k]?'<span class="pill live tiny">✓</span>':''}</div>${photoBox('doc-'+k,d,docs[k])}</div>`).join('')}</div>
  <div class="row"><button class="btn" data-mount="dvSubmit">${v.status==='approved'?'Update documents':'Submit for review'}</button><button class="btn ghost" onclick="go('d-home')">Back</button></div></div>`};
MOUNT.dvSubmit=btn=>{btn.onclick=async()=>{const u=me();const docs={...(u.verification?.docs||{})};DOCS.forEach(([k])=>{const b=$('#doc-'+k);if(b?.dataset.url)docs[k]=b.dataset.url});const idn=$('#dv-id').value.trim();if(!validSAID(idn))return toast('Enter a valid SA ID number');const missing=DOCS.filter(d=>!docs[d[0]]);if(missing.length)return toast('Still missing: '+missing.map(d=>d[1]).join(', '));
  const wasApproved=u.verification?.status==='approved';await Store.patch('users',u.id,{idNumber:idn,prdpExpiry:$('#dv-prdp').value,policeDate:$('#dv-pol').value,years:$('#dv-yrs').value,verification:{status:wasApproved?'approved':'pending',docs,submittedAt:Date.now()}});await notify('admin',`${u.name} submitted driver verification documents.`,'info','a-verify');toast(wasApproved?'Documents updated':'Submitted. We will review within 24 hours.');go('d-home')}};

VIEWS['d-vehicles']=()=>{const vs=myVehicles();const slots=parkingSlotsNeeded(me().id);return pageHead('My vehicles',`${FREE_VEHICLES} free, then ${money(PARKING_FEE)}/month per parking slot.`,`<button class="btn sm" onclick="addVehicle()">Add vehicle</button>`)+`${slots?`<div class="notice" style="margin-bottom:14px">You are using <b>${slots} parking slot${slots>1?'s':''}</b> (${money(slots*PARKING_FEE)}/month), billed with your platform fee.</div>`:''}
  ${vs.length?`<div class="grid g2">${vs.map((v,i)=>`<div class="card">${v.photos?.front?`<img src="${v.photos.front}" style="width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:10px;margin-bottom:10px" alt="">`:''}<div class="row between"><div><b>${h(v.make)} ${h(v.model)}</b> <span class="tiny muted">${v.year||''}</span><div class="small muted">${h(v.plate)} · ${h(v.color||'')}</div></div>${i>=FREE_VEHICLES?'<span class="pill warn">Parking slot</span>':''}</div>
  <div class="row" style="margin-top:10px"><span class="pill">${v.seats} passenger seats</span><span class="pill tiny">${Object.keys(v.photos||{}).length}/5 photos</span>${v.seatScan?`<span class="pill tiny">Scan ${Math.round(v.seatScan.conf*100)}% sure</span>`:''}</div>
  <div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="addVehicle('${v.id}')">Edit</button><button class="btn sm ghost" onclick="viewVehicle('${v.id}')">Photos</button><button class="btn sm ghost" onclick="confirmBox('Remove vehicle?','Routes using it will be paused.',async()=>{await Store.del('vehicles','${v.id}');for(const r of myRoutes().filter(r=>r.vehicleId==='${v.id}'))await Store.patch('routes',r.id,{active:false})})">Remove</button></div></div>`).join('')}</div>`:empty('No vehicles yet. Add one with photos of all four sides and the plate.','car')}`};
function addVehicle(id){const v=id?Store.get('vehicles',id):{photos:{}};const n=myVehicles().length;const willNeedSlot=!id&&n>=FREE_VEHICLES;
  modal(`<h3>${id?'Edit':'Add'} vehicle</h3>${willNeedSlot?`<div class="notice" style="margin-top:10px">This is vehicle ${n+1}. It needs a <b>parking slot</b> at ${money(PARKING_FEE)}/month, charged now and monthly.</div>`:''}
  <div class="stack" style="margin-top:12px"><div class="grid g2"><div class="field"><label>Make</label><input id="v-make" value="${h(v.make||'')}" placeholder="Toyota"></div><div class="field"><label>Model</label><input id="v-model" value="${h(v.model||'')}" placeholder="Quantum"></div><div class="field"><label>Year</label><input id="v-year" value="${h(v.year||'')}" placeholder="2019"></div><div class="field"><label>Colour</label><input id="v-color" value="${h(v.color||'')}" placeholder="White"></div></div>
  <div class="field"><label>Number plate</label><input id="v-plate" value="${h(v.plate||'')}" placeholder="CA 123-456"></div>
  <div class="eyebrow">Photos (all four sides + plate are required)</div><div class="grid g2" id="v-photos">${[['front','Front'],['back','Back'],['left','Left side'],['right','Right side'],['plate','Number plate close-up']].map(([k,l])=>photoBox('vp-'+k,l,v.photos?.[k])).join('')}</div>
  <div class="card soft" id="v-scan"><div class="row between"><div><b>Seat scan</b><div class="tiny muted">Estimated from model and photos.</div></div><button class="btn sm ghost" id="v-scanbtn">Scan</button></div><div id="v-scanres" style="margin-top:8px">${v.seatScan?`<span class="pill live">${v.seatScan.seats} seats · ${Math.round(v.seatScan.conf*100)}% confidence</span>`:''}</div></div>
  <div class="field"><label>Passenger seats (max ${v.seatScan?v.seatScan.seats+1:'scan first'})</label><input id="v-seats" type="number" min="1" value="${v.seats||''}" ${v.seatScan?'':'disabled'}><span class="hint">Driver's seat excluded.</span></div>
  <button class="btn wide" id="v-save">${willNeedSlot?'Pay '+money(PARKING_FEE)+' and save':'Save vehicle'}</button></div>`,m=>{let scan=v.seatScan||null;
    $('#v-scanbtn',m).onclick=async()=>{const make=val(m,'v-make'),model=val(m,'v-model');if(!make||!model)return toast('Enter make and model first');const box=$('#v-photos',m);box.classList.add('scan');$('#v-scanres',m).innerHTML='<span class="tiny muted">Analysing photos…</span>';await new Promise(r=>setTimeout(r,1600));box.classList.remove('scan');scan=estimateSeats({make,model});const sides=['front','back','left','right','plate'].filter(k=>$('#vp-'+k,m).dataset.url||v.photos?.[k]).length;scan.conf=Math.min(.98,scan.conf+(sides>=5?.05:sides>=3?0:-.15));$('#v-scanres',m).innerHTML=`<span class="pill live">${scan.seats} passenger seats · ${Math.round(scan.conf*100)}% confidence</span><div class="tiny muted" style="margin-top:4px">${h(scan.why)}. ${sides<5?'Add all 5 photos to raise confidence.':''}</div>`;const si=$('#v-seats',m);si.disabled=false;si.max=scan.seats+1;si.value=scan.seats;si.previousElementSibling.textContent=`Passenger seats (max ${scan.seats+1})`};
    $('#v-save',m).onclick=async()=>{const photos={...(v.photos||{})};['front','back','left','right','plate'].forEach(k=>{const b=$('#vp-'+k,m);if(b.dataset.url)photos[k]=b.dataset.url});const make=val(m,'v-make').trim(),model=val(m,'v-model').trim(),plate=val(m,'v-plate').trim().toUpperCase();if(!make||!model||!plate)return toast('Make, model and plate are required');const miss=['front','back','left','right','plate'].filter(k=>!photos[k]);if(miss.length)return toast('Missing photos: '+miss.join(', '));if(!scan)return toast('Run the seat scan first');const seats=+val(m,'v-seats');if(!seats||seats>scan.seats+1)return toast(`Seats must be between 1 and ${scan.seats+1}`);
      const save=async()=>{await Store.put('vehicles',id||uid(),{...v,driverId:me().id,make,model,plate,year:val(m,'v-year'),color:val(m,'v-color'),photos,seats,seatScan:scan,createdAt:v.createdAt||Date.now()});for(const r of myRoutes().filter(r=>r.vehicleId===id))await Store.patch('routes',r.id,{seats:Math.min(r.seats,seats),vehicleLabel:make+' '+model,plate});closeModal();toast('Vehicle saved')};
      if(willNeedSlot)payModal(PARKING_FEE,async()=>{await pushTx({type:'parking_slot',amount:PARKING_FEE,from:me().id,to:'enivel',note:'Parking slot (vehicle '+(n+1)+')'});await save()});else await save()}})}

VIEWS['d-routes']=()=>{const rs=myRoutes();const vs=myVehicles();return pageHead('My routes','',`<button class="btn sm" onclick="addRoute()" ${vs.length?'':'disabled title="Add a vehicle first"'}>New route</button>`)+(rs.length?`<div class="grid g2">${rs.map(r=>{const bs=activeBookings(b=>b.routeId===r.id);return `<div class="card"><div class="row between"><div><b>${h(r.name)}</b> ${r.type==='private'?'<span class="pill ink tiny">Private</span>':''}<div class="small muted">${h(r.area)} → ${h(r.schools)}</div><div class="tiny muted">${h(r.vehicleLabel)} · ${h(r.plate)} · ${h(r.pickupTime)}–${h(r.dropoffTime)}</div></div><div style="text-align:right"><div class="num" style="font-size:1.3rem">${money(r.price)}</div><span class="pill ${r.active?'live':''}">${r.active?'Listed':'Paused'}</span></div></div>
  <div class="bar" style="margin-top:10px"><i style="width:${bs.length/r.seats*100}%"></i></div><div class="tiny muted" style="margin-top:4px">${bs.length}/${r.seats} seats filled</div>
  <div class="list" style="margin-top:8px">${bs.map(b=>{const k=Store.get('kids',b.kidId);return `<div class="item small"><span class="avatar sm">${initials(k?.name)}</span><div class="grow"><b>${h(k?.name)}</b> <span class="muted">${k?.age} yrs · ${h(k?.pickup||'')}</span><div class="tiny muted">Parent: ${h(userName(b.parentId))}${k?.notes?' · '+h(k.notes):''}</div></div><button class="btn sm ghost" onclick="openChat('${b.parentId}')">${ICON.chat}</button></div>`}).join('')||'<p class="tiny muted">No passengers yet.</p>'}</div>
  <div class="row" style="margin-top:12px"><button class="btn sm" onclick="go('d-trip',{tripRoute:'${r.id}'})">Trip</button><button class="btn sm ghost" onclick="addRoute('${r.id}')">Edit</button><button class="btn sm ghost" onclick="Store.patch('routes','${r.id}',{active:${!r.active}})">${r.active?'Pause':'List'}</button></div></div>`}).join('')}</div>`:empty(vs.length?'No routes yet. Create one so parents can find you.':'Add a vehicle first, then create a route.','pin'))};
function addRoute(id){const r=id?routeOf(id):{};const vs=myVehicles();if(!vs.length)return toast('Add a vehicle first');modal(`<h3>${id?'Edit':'New'} route</h3><div class="stack" style="margin-top:12px">
  <div class="field"><label>Route name</label><input id="r-name" value="${h(r.name||'')}" placeholder="e.g. Protea Glen → Rietfontein Primary"></div>
  <div class="grid g2"><div class="field"><label>Type</label><select id="r-type"><option value="shared" ${r.type!=='private'?'selected':''}>Shared transport</option><option value="private" ${r.type==='private'?'selected':''}>Private chauffeur (one family)</option></select></div><div class="field"><label>Vehicle</label><select id="r-veh">${vs.map(v=>`<option value="${v.id}" ${r.vehicleId===v.id?'selected':''}>${h(v.make)} ${h(v.model)} · ${h(v.plate)} (${v.seats} seats)</option>`).join('')}</select></div></div>
  <div class="field"><label>Pickup area / suburbs</label><input id="r-area" value="${h(r.area||'')}" placeholder="Protea Glen, Chiawelo"></div><div class="field"><label>Schools served</label><input id="r-sch" value="${h(r.schools||'')}" placeholder="Rietfontein Primary, Laerskool..."></div>
  <div class="grid g3"><div class="field"><label>First pickup</label><input id="r-pt" value="${h(r.pickupTime||'06:30')}"></div><div class="field"><label>School drop-off</label><input id="r-dt" value="${h(r.dropoffTime||'07:15')}"></div><div class="field"><label>Price / month</label><input id="r-price" type="number" value="${r.price||''}" placeholder="900"></div></div>
  <label class="small"><input type="checkbox" id="r-aft" ${r.afternoon!==false?'checked':''}> Includes afternoon return trip</label>
  <div class="field"><label>Seats offered on this route</label><input id="r-seats" type="number" value="${r.seats||''}"><span class="hint">Cannot exceed the vehicle's verified seats.</span></div>
  <button class="btn wide" id="r-save">Save route</button></div>`,m=>{const vehSel=$('#r-veh',m);const syncSeats=()=>{const v=Store.get('vehicles',vehSel.value);$('#r-seats',m).max=v.seats;if(!$('#r-seats',m).value||+$('#r-seats',m).value>v.seats)$('#r-seats',m).value=$('#r-type',m).value==='private'?Math.min(v.seats,4):v.seats};vehSel.onchange=syncSeats;$('#r-type',m).onchange=syncSeats;syncSeats();
    $('#r-save',m).onclick=async()=>{const v=Store.get('vehicles',vehSel.value);const seats=+val(m,'r-seats');const price=+val(m,'r-price');if(!val(m,'r-name')||!val(m,'r-area')||!val(m,'r-sch')||!price)return toast('Fill in name, area, schools and price');if(!seats||seats>v.seats)return toast(`Seats must be 1 to ${v.seats}`);if(id&&seats<routeSeatsUsed(id))return toast('You already have more passengers than that');
      await Store.put('routes',id||uid(),{...r,driverId:me().id,name:val(m,'r-name'),type:val(m,'r-type'),vehicleId:v.id,vehicleLabel:v.make+' '+v.model,plate:v.plate,area:val(m,'r-area'),schools:val(m,'r-sch'),pickupTime:val(m,'r-pt'),dropoffTime:val(m,'r-dt'),price,afternoon:$('#r-aft',m).checked,seats,active:r.active??true,createdAt:r.createdAt||Date.now()});closeModal();toast('Route saved')}})}

VIEWS['d-trip']=()=>{const r=routeOf(S.tripRoute);if(!r)return VIEWS['d-routes']();const bs=activeBookings(b=>b.routeId===r.id);const live=r.live||{};
  return pageHead(`Trip · ${h(r.name)}`,`${h(r.vehicleLabel)} · ${h(r.plate)}`,`<button class="btn sm ghost" onclick="go('d-routes')">Back</button>`)+`<div class="grid g2"><div class="stack">
  <div class="card"><div class="row between"><div><b>Location sharing</b><div class="tiny muted">Seen only by parents of kids on board.</div></div>${live.active?`<button class="btn sm bad" onclick="stopTrip('${r.id}')">End trip</button>`:`<button class="btn sm live" onclick="startTrip('${r.id}')">Start trip</button>`}</div>
  ${live.active?`<div style="margin-top:12px" data-mount="rmap" data-route="${r.id}" data-mode="driver"></div><div class="row between" style="margin-top:10px"><span class="pill ${live.gps?'live':'warn'}">${live.gps?'<i class="blink"></i>GPS on · ±'+Math.round(live.acc||0)+' m':'Location off'}</span><span class="tiny muted">${live.ts?'updated '+fmtT(live.ts):''}</span>${live.gps?'':`<button class="btn sm ghost" onclick="watchGPS('${r.id}')">Turn on location</button>`}</div>`:''}</div>
  </div><div class="card"><h3>Passengers</h3><div class="list" style="margin-top:8px">${bs.length?bs.map(b=>{const k=Store.get('kids',b.kidId);const st=kidStatus(k);return `<div class="item"><span class="avatar">${initials(k?.name)}</span><div class="grow"><b>${h(k?.name)}</b><div class="tiny muted">${h(k?.pickup||'No pickup address')}${st.today[0]?' · '+(st.today[0].type==='pickup'?'picked up ':'dropped off ')+fmtT(st.today[0].ts):''}</div></div>${st.onboard?`<button class="btn sm" onclick="markEvent('${b.id}','dropoff')">Drop off</button>`:`<button class="btn sm ghost" title="Hoot: tell the parent you are outside" onclick="arrived('${b.id}')">📣</button><button class="btn sm live" onclick="markEvent('${b.id}','pickup')">Pick up</button>`}</div>`}).join(''):'<p class="muted small">No passengers on this route.</p>'}</div>
  ${bs.length?`<div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="markAll('${r.id}','pickup')">All picked up</button><button class="btn sm ghost" onclick="markAll('${r.id}','dropoff')">All dropped off</button></div>`:''}</div></div>`};
async function startTrip(routeId){await Store.patch('routes',routeId,{live:{active:true,ts:Date.now(),gps:false}});watchGPS(routeId);toast('Trip started')}
async function stopTrip(routeId){stopGPS();await Store.patch('routes',routeId,{live:{active:false,ts:Date.now()}});toast('Trip ended. Location hidden.')}
function useGPS(routeId){if(!navigator.geolocation)return toast('GPS not available in this view');navigator.geolocation.getCurrentPosition(p=>{const r=routeOf(routeId);Store.patch('routes',routeId,{live:{...(r.live||{}),gps:true,lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()}});toast('GPS position shared')},()=>toast('Location permission was refused here. Simulation continues.'))}
async function markEvent(bookingId,type){const b=Store.get('bookings',bookingId);const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId);await Store.put('events',uid(),{type,kidId:k.id,bookingId,driverId:b.driverId,parentId:b.parentId,routeId:r.id,ts:Date.now(),where:type==='pickup'?k.pickup:r.schools});
  await notify(b.parentId,type==='pickup'?`${k.name} was picked up by ${userName(b.driverId)} at ${fmtT(Date.now())}. Tap to track.`:`${k.name} was dropped off at ${r.schools} at ${fmtT(Date.now())}.`,type,type==='pickup'?'p-home':'p-home');toast(`${k.name} marked ${type==='pickup'?'picked up':'dropped off'}`)}
async function markAll(routeId,type){for(const b of activeBookings(b=>b.routeId===routeId)){const st=kidStatus(Store.get('kids',b.kidId));if((type==='pickup'&&!st.onboard)||(type==='dropoff'&&st.onboard))await markEvent(b.id,type)}}

function openRequestsList(limit){const reqs=Store.all('requests').filter(r=>r.status==='open').sort((a,b)=>b.ts-a.ts).slice(0,limit||99);if(!reqs.length)return '<p class="muted small" style="margin-top:8px">No open requests right now.</p>';return `<div class="list" style="margin-top:6px">${reqs.map(r=>{const mine=Store.all('offers').find(o=>o.requestId===r.id&&o.driverId===me().id);return `<div class="item"><div class="grow small"><b>${h(r.area)} → ${h(r.school)}</b><div class="tiny muted">${r.type==='once'?'<b>Once-off</b> · '+h(r.date||'')+' '+h(r.time||'')+' · '+h(r.from||'')+' → '+h(r.to||'')+' · ':''}${r.kidIds.length} child${r.kidIds.length>1?'ren':''} · ${r.type==='once'?'':'budget '}${money(r.budget)} · ${h(r.times||'')} ${r.type==='private'?'· private':''}</div>${r.note?`<div class="tiny muted">${h(r.note)}</div>`:''}</div>${mine?'<span class="pill">Offer sent</span>':`<button class="btn sm" onclick="makeOffer('${r.id}')">Offer</button>`}</div>`}).join('')}</div>`}
VIEWS['d-requests']=()=>pageHead('Requests','')+`<div class="card">${openRequestsList()}</div>`;
function makeOffer(reqId){const u=me();if(!isVerified(u))return toast('You can send offers once verified');const rs=myRoutes().filter(r=>r.active);if(!rs.length)return toast('Create a route first');const rq=Store.get('requests',reqId);modal(`<h3>Offer to ${h(userName(rq.parentId))}</h3><p class="small muted">${rq.type==='once'?h(rq.from)+' → '+h(rq.to)+' · '+h(rq.date)+' '+h(rq.time):h(rq.area)+' → '+h(rq.school)} · budget ${money(rq.budget)}</p><div class="stack" style="margin-top:12px"><div class="field"><label>Route</label><select id="of-r">${rs.map(r=>`<option value="${r.id}">${h(r.name)} · ${r.seats-routeSeatsUsed(r.id)} open · ${money(r.price)}</option>`).join('')}</select></div><div class="field"><label>${rq.type==='once'?'Price for this trip':'Your price / month per child'}</label><input id="of-p" type="number" value="${rq.type==='once'?rq.budget:rs[0].price}"></div><div class="field"><label>Note</label><textarea id="of-n" rows="2" placeholder="Pickup time, anything the parent should know"></textarea></div><button class="btn wide" id="of-go">Send offer</button></div>`,m=>{$('#of-go',m).onclick=async()=>{const price=+val(m,'of-p');if(!price)return;await Store.put('offers',uid(),{requestId:reqId,driverId:u.id,routeId:val(m,'of-r'),price,note:val(m,'of-n'),ts:Date.now()});await notify(rq.parentId,`${u.name} sent you an offer: ${money(price)}/month for ${rq.area} → ${rq.school}.`,'info','p-requests');closeModal();toast('Offer sent')}})}

VIEWS['d-billing']=()=>{const u=me();const m=monthKey();const txs=Store.all('transactions').filter(t=>t.from===u.id||t.to===u.id).sort((a,b)=>b.ts-a.ts);const earned=txs.filter(t=>t.to===u.id&&t.month===m).reduce((s,t)=>s+t.amount,0);const fees=txs.filter(t=>t.from===u.id&&t.month===m).reduce((s,t)=>s+t.amount,0);const slots=parkingSlotsNeeded(u.id);const pax=driverPassengers(u.id);
  return pageHead('Earnings and fees')+`<div class="kpi"><div class="card"><div class="eyebrow">Earned ${m}</div><div class="num" style="font-size:1.5rem">${money(earned)}</div></div><div class="card"><div class="eyebrow">Fees ${m}</div><div class="num" style="font-size:1.5rem">${money(fees)}</div></div><div class="card"><div class="eyebrow">Net</div><div class="num" style="font-size:1.5rem">${money(earned-fees)}</div></div></div>
  <div class="card" style="margin-top:14px"><h3>How you are billed</h3><div class="fee" style="margin-top:10px"><span>Platform fee (R100/month, only with ≥1 passenger)</span><b>${pax?money(DRIVER_FEE):'R0.00'}</b><span>Parking slots (${slots} × ${money(PARKING_FEE)})</span><b>${money(slots*PARKING_FEE)}</b><span class="tot">Monthly total</span><b class="tot">${money((pax?DRIVER_FEE:0)+slots*PARKING_FEE)}</b></div><p class="tiny muted" style="margin-top:8px">${pax?'You have '+pax+' paying passenger(s), so the platform fee applies.':'No fee this month: the R100 only starts once you have a paying passenger.'}</p></div>
  <div class="card" style="margin-top:14px"><h3>Ledger</h3><div class="list" style="margin-top:6px">${txs.map(t=>`<div class="item small"><div class="grow">${h(t.note||t.type)}<div class="tiny muted">${fmtDT(t.ts)} · ${t.to===u.id?'from '+h(userName(t.from)):'to Enivel'}</div></div><b style="color:${t.to===u.id?'var(--live)':'inherit'}">${t.to===u.id?'+':'−'}${money(t.amount)}</b></div>`).join('')||'<p class="muted small">No transactions yet.</p>'}</div></div>`};
VIEWS['d-more']=()=>{const u=me();return pageHead('Account')+`<div class="grid g2"><div class="card"><div class="row"><span class="avatar">${initials(u.name)}</span><div><b>${h(u.name)}</b><div class="small muted">${h(u.email)} · ${h(u.phone||'')}</div></div></div><div class="list" style="margin-top:12px">${[['d-verify','Verification documents'],['d-billing','Earnings and fees'],['d-requests','Parent requests'],['notifs','Notifications'],['privacy','Privacy policy'],['terms','Terms of service']].map(([r,l])=>`<div class="item" style="cursor:pointer" onclick="go('${r}')"><div class="grow">${l}</div>›</div>`).join('')}</div></div>
  <div class="stack"><div class="card"><h3>Appearance</h3><div class="seg" style="margin-top:8px"><button class="${!S.theme?'on':''}" onclick="setTheme(null);render()">System</button><button class="${S.theme==='light'?'on':''}" onclick="setTheme('light');render()">Light</button><button class="${S.theme==='dark'?'on':''}" onclick="setTheme('dark');render()">Dark</button></div></div><button class="btn ghost" onclick="logout()">Log out</button></div></div>`};
</script>
<script>
/* ===================== admin ===================== */
function adminGate(fn){return ()=>S.admin?fn():`<div style="max-width:420px;margin:30px auto" class="card"><h3>Admin only</h3><p class="muted small">Log in with the Enivel admin account.</p><button class="btn" style="margin-top:12px" onclick="go('login')">Log in</button></div>`}
function revenue(){const t=Store.all('transactions');const sum=f=>t.filter(f).reduce((s,x)=>s+x.amount,0);return {gmv:sum(x=>x.type!=='sponsorship'),fees:sum(x=>x.type==='platform_fee'),driverFees:sum(x=>x.type==='driver_fee'),parking:sum(x=>x.type==='parking_slot'),toDrivers:sum(x=>x.type==='subscription'||x.type==='trip'),sponsored:sum(x=>x.type==='sponsorship'),profit:sum(x=>x.to==='enivel')-sum(x=>x.type==='sponsorship')}}
VIEWS['a-home']=adminGate(()=>{const us=Store.all('users');const parents=us.filter(u=>u.role==='parent'),drivers=us.filter(u=>u.role==='driver');const kids=Store.all('kids');const bs=activeBookings();const rv=revenue();const pend=drivers.filter(d=>d.verification?.status==='pending').length;const m=monthKey();const thisM=Store.all('transactions').filter(t=>t.month===m&&t.to==='enivel').reduce((s,t)=>s+t.amount,0);
  return pageHead('Overview','',`<div class="row"><button class="btn sm ghost" onclick="go('a-verify')">${pend?pend+' to verify':'Verify queue'}</button></div>`)+(Store.all('users').some(x=>x.demo)?`<div class="notice" style="margin-bottom:14px">These numbers include <b>demo records</b>. Clear them under More → Data to see only real accounts.</div>`:'')+`
  <div class="kpi">${[['Parents',parents.length],['Drivers',drivers.length],['Verified drivers',drivers.filter(isVerified).length],['Children',kids.length],['Active bookings',bs.length],['Open requests',Store.all('requests').filter(r=>r.status==='open').length]].map(([l,v])=>`<div class="card"><div class="eyebrow">${l}</div><div class="num" data-mount="tick" data-v="${v}">${v}</div></div>`).join('')}</div>
  <div class="grid g3" style="margin-top:14px"><div class="card ink"><div class="eyebrow" style="color:inherit;opacity:.7">Enivel profit (all time)</div><div class="num" style="margin-top:4px">${money(rv.profit)}</div><div class="tiny" style="opacity:.7;margin-top:4px">${money(thisM)} earned this month</div></div><div class="card"><div class="eyebrow">Total money through the app</div><div class="num" style="margin-top:4px">${money(rv.gmv)}</div><div class="tiny muted">${money(rv.toDrivers)} paid to drivers</div></div><div class="card"><div class="eyebrow">Fee breakdown</div><div class="small" style="margin-top:6px">2% parent fees <b>${money(rv.fees)}</b><br>Driver R100 fees <b>${money(rv.driverFees)}</b><br>Parking slots <b>${money(rv.parking)}</b><br>Giveaways paid <b>−${money(rv.sponsored)}</b></div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Revenue by month</h3><canvas class="chart" data-mount="revChart"></canvas></div><div class="card"><h3>Sign-ups by month</h3><canvas class="chart" data-mount="signupChart"></canvas></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Latest activity</h3><div class="list" style="margin-top:6px">${Store.all('events').filter(e=>e.type!=='report').sort((a,b)=>b.ts-a.ts).slice(0,6).map(e=>`<div class="item small"><span class="pill ${e.type==='pickup'?'live':'info'}">${e.type}</span><div class="grow">${h(Store.get('kids',e.kidId)?.name||'')} · ${h(userName(e.driverId))}<div class="tiny muted">${fmtDT(e.ts)}</div></div></div>`).join('')||'<p class="muted small">No trips yet.</p>'}</div></div><div class="card"><h3>Reports</h3><div class="list" style="margin-top:6px">${Store.all('events').filter(e=>e.type==='report').sort((a,b)=>b.ts-a.ts).slice(0,5).map(e=>`<div class="item small"><div class="grow">${h(e.text)}<div class="tiny muted">${h(userName(e.by))} · ${fmtDT(e.ts)}</div></div></div>`).join('')||'<p class="muted small">No reports. Good.</p>'}</div></div></div>`});
function barChart(c,series,fmt){const el=c;const draw=()=>{const dpr=devicePixelRatio||1;const W=el.clientWidth||300,H=el.clientHeight||180;el.width=W*dpr;el.height=H*dpr;const x=el.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);const dark=isDark();const ink=dark?'#f5f5f3':'#0a0a0a',mut=dark?'#7a7a76':'#8a8a86',line=dark?'#242424':'#e2e2df';const keys=Object.keys(series).sort().slice(-6);if(!keys.length){x.fillStyle=mut;x.font='13px Manrope';x.fillText('No data yet',10,H/2);return}const max=Math.max(...keys.map(k=>series[k]),1);const pad={l:8,r:8,t:24,b:24};const bw=(W-pad.l-pad.r)/keys.length;x.strokeStyle=line;[0,.5,1].forEach(f=>{const y=pad.t+(H-pad.t-pad.b)*(1-f);x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke()});keys.forEach((k,i)=>{const v=series[k];const bh=(H-pad.t-pad.b)*v/max;const X=pad.l+i*bw+bw*.2;x.fillStyle=ink;x.fillRect(X,H-pad.b-bh,bw*.6,bh);x.fillStyle=mut;x.font='11px Manrope';x.textAlign='center';x.fillText(k.slice(2),X+bw*.3,H-8);x.fillStyle=ink;x.fillText(fmt(v),X+bw*.3,H-pad.b-bh-6)})};draw();new ResizeObserver(draw).observe(el.parentElement)}
MOUNT.revChart=c=>{const s={};Store.all('transactions').forEach(t=>{if(t.to==='enivel')s[t.month]=(s[t.month]||0)+t.amount});barChart(c,s,v=>'R'+Math.round(v))};
MOUNT.signupChart=c=>{const s={};Store.all('users').forEach(u=>{if(u.role==='admin')return;const k=monthKey(new Date(u.createdAt));s[k]=(s[k]||0)+1});barChart(c,s,v=>v)};

VIEWS['a-accounts']=adminGate(()=>{const q=(S.filters.aq||'').toLowerCase();const role=S.filters.arole||'';let us=Store.all('users').filter(u=>u.role!=='admin'&&(!role||u.role===role)&&(!q||(u.name+' '+u.email+' '+(u.phone||'')).toLowerCase().includes(q))).sort((a,b)=>b.createdAt-a.createdAt);const m=monthKey();
  return pageHead('Accounts','')+`<div class="row" style="margin-bottom:12px"><input id="aq" placeholder="Search name, email, phone" value="${h(S.filters.aq||'')}" oninput="S.filters.aq=this.value;render()" style="flex:1;min-width:200px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"><div class="seg"><button class="${!role?'on':''}" onclick="S.filters.arole='';render()">All</button><button class="${role==='parent'?'on':''}" onclick="S.filters.arole='parent';render()">Parents</button><button class="${role==='driver'?'on':''}" onclick="S.filters.arole='driver';render()">Drivers</button></div></div>
  <div class="tw"><table><thead><tr><th>Account</th><th>Role</th><th>Status</th><th>Children / vehicles</th><th>Transport in use</th><th>Monthly</th><th>Paid (all time)</th><th>Joined</th><th></th></tr></thead><tbody>${us.map(u=>{const isP=u.role==='parent';const bs=isP?activeBookings(b=>b.parentId===u.id):activeBookings(b=>b.driverId===u.id);const monthly=isP?bs.reduce((s,b)=>s+b.price+feeFor(b.price),0):(bs.length?DRIVER_FEE:0)+parkingSlotsNeeded(u.id)*PARKING_FEE;const paid=Store.all('transactions').filter(t=>t.from===u.id).reduce((s,t)=>s+t.amount,0);const sponsored=bs.some(b=>(b.sponsoredMonths||[]).includes(m));
    return `<tr><td><b>${h(u.name)}</b><div class="tiny muted">${h(u.email)}<br>${h(u.phone||'')}</div></td><td><span class="pill">${u.role}</span></td><td>${u.suspended?'<span class="pill bad">Suspended</span>':isP?(needsParentId(u)?'<span class="pill warn">ID missing</span>':'<span class="pill live">ID ok</span>'):`<span class="pill ${isVerified(u)?'live':u.verification?.status==='pending'?'warn':''}">${u.verification?.status||'none'}</span>`}</td><td>${isP?kidsOf(u.id).map(k=>h(k.name)+' ('+k.age+')').join(', ')||'—':Store.all('vehicles').filter(v=>v.driverId===u.id).map(v=>h(v.make+' '+v.model)).join(', ')||'—'}</td><td class="small">${isP?bs.map(b=>h(routeOf(b.routeId)?.name||'')+' · '+h(userName(b.driverId))).join('<br>')||'—':bs.length+' passengers on '+myRoutesOf(u.id).length+' routes'}</td><td>${money(monthly)}${sponsored?' <span class="pill live tiny">🎁 sponsored</span>':''}</td><td>${money(paid)}</td><td class="tiny muted">${new Date(u.createdAt).toLocaleDateString('en-ZA')}</td><td><div class="row" style="flex-wrap:nowrap">${isP&&bs.length&&!sponsored?`<button class="btn sm" title="Enivel pays this month" onclick="sponsor('${u.id}')">${ICON.gift}</button>`:''}<button class="btn sm ghost" onclick="viewAccount('${u.id}')">View</button><button class="btn sm ghost" onclick="Store.patch('users','${u.id}',{suspended:${!u.suspended}})">${u.suspended?'Restore':'Suspend'}</button></div></td></tr>`}).join('')||'<tr><td colspan="9" class="muted">No accounts yet.</td></tr>'}</tbody></table></div>`});
function myRoutesOf(id){return Store.all('routes').filter(r=>r.driverId===id)}
