{id:'driver',title:'Driver Agreement',sub:'Additional terms for drivers and transport businesses',body:L=>`
<p>This Driver Agreement applies, in addition to the Terms of Service and the Vehicle, Seating and Insurance Standards, to every Driver who offers transport through Enivel, including a transport business and every relief driver and assistant it uses. If it conflicts with the Terms of Service on a matter concerning Drivers, this agreement applies. Words defined in the Terms of Service have the same meaning here. You enter into this agreement in the course of your business.</p>
<h2 id="d1">1. Independent contractor</h2>
<p><b>1.1 You are an independent business operator and not an employee, agent or representative of Enivel. You decide whether and when to offer transport, which Routes, stops, times, prices and passengers you accept, which vehicles you use, and how you run your business, subject only to the law and the minimum safety and legal standards in this agreement.</b></p>
<p>1.2 Enivel does not pay you a wage or salary, does not set working hours or minimum hours, does not provide your vehicle, fuel, phone or equipment, does not direct how you drive, and does not require you to work only through Enivel. You may offer transport through other channels and platforms, and may build your own brand, provided you comply with clause 15 (non-circumvention).</p>
<p>1.3 Nothing in this agreement is intended to create an employment relationship for the purposes of the Labour Relations Act 66 of 1995 (including section 200A), the Basic Conditions of Employment Act 75 of 1997, the Unemployment Insurance Act or any other law. The minimum standards in this agreement are conditions for access to a platform used by Children, required by law and by Parents, and not control over how you perform your work.</p>
<p>1.4 You are solely responsible for your income tax, provisional tax, any VAT, UIF, Compensation Fund, skills development levy and other statutory obligations of your business, and for the people you employ or use. Any relief driver or assistant must be verified on Enivel before they transport or accompany any Child, and you remain responsible for them.</p>
<h2 id="d2">2. Legal requirements you must meet at all times</h2>
<ul>
<li>A valid South African driver’s licence of the correct code for each vehicle.</li>
<li>A valid Professional Driving Permit (PrDP) in the passenger category, as required by the National Road Traffic Act 93 of 1996 and its regulations. You must be at least 21 years old.</li>
<li>A valid operating licence or permit for the transport you offer, issued under the National Land Transport Act 5 of 2009 by the relevant Provincial Regulatory Entity or other competent authority, and compliance with its conditions (including routes or area, vehicle and capacity).</li>
<li>A South African Police Service clearance certificate issued within the last six months when you register, renewed at least every 12 months.</li>
<li>A current vehicle licence disc and, where the law requires one, a certificate of roadworthiness or fitness for every vehicle, and roadworthiness at all times.</li>
<li>The insurance required by the <a href="#" data-doc="vehicles" data-sec="v6">Vehicle Standards</a>, including passenger liability cover of at least R5 million per vehicle, or such higher amount as the law or your operating licence requires.</li>
<li>Compliance with learner transport requirements, including the National Learner Transport Policy and any provincial, departmental or school requirements that apply to you.</li>
</ul>
<p><b>2.1 You must not offer or perform any trip through Enivel if any of the above has expired, been suspended or withdrawn, or if you are charged with or convicted of any offence involving children, violence, sexual offences, driving under the influence, reckless or negligent driving, or dishonesty.</b></p>
<p>2.2 Enivel’s acceptance of your documents does not confirm that you comply with the law. Compliance remains your responsibility.</p>
<h2 id="d3">3. Disclosures and background checks</h2>
<p>3.1 You warrant that you are not listed on the National Register for Sex Offenders under the Criminal Law (Sexual Offences and Related Matters) Amendment Act 32 of 2007 or in Part B of the National Child Protection Register under the Children’s Act 38 of 2005, and that no person you use to transport or accompany Children is listed.</p>
<p>3.2 You consent to Enivel or its verification partners checking your identity, documents, criminal record and these registers to the extent the law permits, and you will provide any certificate or consent the law requires for such a check.</p>
<p><b>3.3 You must tell Enivel within 24 hours if: any document or licence expires, is suspended or withdrawn; you are arrested, charged or convicted of any offence; any protection order is made against you; your insurer cancels or refuses cover; or a vehicle is involved in an accident or fails a roadworthiness test.</b></p>
<h2 id="d4">4. Vehicles and capacity</h2>
<p>4.1 Every vehicle must be listed with its correct make, model, year, registration number, seating capacity and photographs of all four sides and the number plate. You may only use listed and verified vehicles for Enivel Bookings.</p>
<p><b>4.2 You may never carry more passengers than the number of seats fitted with working seat belts, or more than your operating licence or the vehicle’s licensed capacity allows, whichever is lowest. Each Child must wear a seat belt and, where required by law or the Vehicle Standards, an appropriate child restraint.</b></p>
<p>4.3 The detailed standards are in the <a href="#" data-doc="vehicles">Vehicle, Seating and Insurance Standards</a>, which form part of this agreement.</p>
<h2 id="d5">5. Conduct and safety standards</h2>
<ul>
<li>No alcohol, drugs or impairing medication before or during any trip. Zero tolerance.</li>
<li>No use of a handheld phone while driving. Use Enivel only while stopped safely or through a hands-free mount.</li>
<li>Obey all traffic laws, speed limits and school-zone rules, and drive defensively.</li>
<li>No smoking or vaping in the vehicle at any time.</li>
<li>Never leave a Child alone in a vehicle, even for a moment.</li>
<li>Do not carry any adult who is not verified on Enivel while Children are on board, unless the Parents have agreed through the Platform.</li>
<li>No physical punishment, threats, harassment, inappropriate contact, photographs or messages. Communicate with Children only as needed for the trip, and with Parents through Enivel.</li>
<li>Do not drive when fatigued. Plan rest so that you are alert for every trip.</li>
<li>Report every accident, injury, breakdown, incident, threat or allegation as required by the <a href="#" data-doc="incidents">Incident Response</a> policy.</li>
</ul>
<h2 id="d6">6. Trips, location and records</h2>
<p>6.1 You must start each trip in Enivel and keep location sharing on for its full duration. You consent to Enivel collecting your location during trips and sharing it with the Parents of Children on board, as described in the Location notice.</p>
<p><b>6.2 You must record every pickup, drop-off and handover truthfully and at the time it happens. Automatic pickup and drop-off detection is an aid: you must check it, use the 10-second undo where it is wrong, and correct any wrong record immediately. Falsifying a record is grounds for a permanent ban.</b></p>
<p>6.3 You must use the pickup reminders, schedules, absence and day-off information in Enivel, but you remain responsible for being on time and for knowing which Children to collect even if a reminder or update does not arrive. If in doubt, confirm with the Parent.</p>
<p>6.4 Keep your phone charged and connected, and carry a power source in the vehicle. If your phone or the Platform fails during a trip, continue the trip safely and tell the Parents by any available means.</p>
<h2 id="d7">7. Handovers, collections and Children who cannot be handed over</h2>
<p>7.1 At school, hand a Child only into the school’s arrangements. At home or another agreed drop-off point, hand a Child only to the Parent, a trusted guardian or another adult the Parent has authorised in the Platform.</p>
<p><b>7.2 Where a Handover Code is set, you must ask the receiving adult for the code and enter it before the drop-off is recorded. You must not enter the code yourself from memory or a note, record a drop-off without the code, or share any code you learn.</b></p>
<p>7.3 If the receiving adult cannot give the correct code, or you have any reason to believe the person is not authorised or is not in a fit state to receive the Child, do not hand the Child over. Keep the Child safely in the vehicle, contact the Parent and trusted guardians through the Platform, and follow the Parent’s confirmed instructions as set out in the Parent and Guardian Terms.</p>
<p>7.4 If nobody can be reached within a reasonable time, never leave the Child unattended or at an unsafe place. Follow the Child Safeguarding Policy, contact Enivel through the Platform, and as a last resort ask the South African Police Service for help.</p>
<p>7.5 You may charge a reasonable extra amount for waiting or returning a Child only if you disclosed it on your Route before the Booking.</p>
<h2 id="d8">8. Days off, closures, schedules and waiting lists</h2>
<p>8.1 Days off and school holidays or closures recorded by Parents are shown to you. You must not collect a Child on such a day unless the Parent asks you to through the Platform.</p>
<p>8.2 Seats are reserved during days off and closures, and you are paid for the month in accordance with the Payments policy.</p>
<p>8.3 When a seat on a full Route becomes available, you must release it in the Platform honestly and promptly so that the Waiting List works fairly. You must not hold seats open to sell outside the Platform. You may decline a Waiting List Parent only for a lawful reason.</p>
<p>8.4 Public holiday and exam-time calendars are guides. Confirm arrangements with Parents.</p>
<h2 id="d9">9. Driver tools: smart stop order, expense tracker, scores and badges</h2>
<p><b>9.1 The smart stop order suggests a pickup order using pinned addresses and your location. It is a suggestion only. You alone choose your route and remain responsible for road safety, traffic law, school gate rules, avoiding unsafe areas and the conditions of your operating licence.</b></p>
<p>9.2 The expense tracker lets you record fuel, maintenance, insurance and other costs and see an estimated monthly profit. These entries are private to you and to authorised Enivel administrators, who may access them only for support, security, fraud prevention or legal reasons. They are not shared with Parents.</p>
<p><b>9.3 Expense tracker figures and profit estimates are based only on what you enter and simple calculations. They are not tax, accounting, legal or financial advice, are not a tax record accepted by SARS, and may be wrong. Keep your own original records and consult a qualified adviser.</b></p>
<p>9.4 Your on-time score and badges are calculated automatically from Trip Data and shown to Parents. They may be affected by GPS errors, traffic and changes Parents make. If you believe your score is wrong, ask us to review it. A score alone is never used to suspend or ban you.</p>
<h2 id="d10">10. Fees, payouts and tax</h2>
<p>10.1 You pay the Driver Fees in the Payments policy: R100 per month, charged only in a calendar month in which you have at least one active paying passenger; and R49.99 per month for each listed vehicle beyond three (a “parking slot”).</p>
<p>10.2 Transport Prices collected by Enivel are paid out to you on the payout schedule shown in the Platform, after deduction of Driver Fees, refunds due to Parents under the Payments policy, chargebacks and any other amount you owe Enivel.</p>
<p><b>10.3 You authorise Enivel to set off any amount you owe Enivel against payouts due to you, and to withhold a payout for up to 60 days while a credible fraud, chargeback or safety investigation is under way.</b> We will tell you of any withholding and release undisputed amounts.</p>
<p>10.4 Where a Giveaway or Referral Credit pays for a Parent’s transport, you receive the Transport Price as if the Parent had paid it.</p>
<p>10.5 You are responsible for declaring all income to SARS and for keeping your own records for the periods the Tax Administration Act 28 of 2011 requires. Enivel may provide statements of payouts and may report information to SARS where the law requires.</p>
<h2 id="d11">11. Documents, checks and audits</h2>
<p>11.1 You authorise Enivel and its verification partners to verify your documents with the issuing authorities where possible.</p>
<p>11.2 Enivel may at any time ask you to re-upload documents, provide clearer photographs, present originals, provide a recent roadworthiness or fitness certificate, or allow a vehicle inspection at a reasonable time and place. Failure to comply within the time we give (at least 5 Business Days, except where safety requires sooner) may lead to suspension.</p>
<p><b>11.3 Uploading a false, altered or borrowed document leads to an immediate permanent ban, cancellation of all Bookings, and may be reported to the South African Police Service. Driver Fees already paid are not refunded.</b></p>
<h2 id="d12">12. Insurance first and indemnity</h2>
<p><b>12.1 Your insurance must respond first to any claim arising from a trip, your vehicles or your business. You must notify your insurer of every accident or claim within the time your policy requires and must not do anything that could prejudice cover.</b></p>
<p><b>12.2 You indemnify Enivel, its directors, employees and contractors against all claims, losses, damages, fines, penalties and legal costs (on the attorney-and-own-client scale) arising from the operation of your vehicles, your driving, the transport of your passengers, your relief drivers and assistants, your breach of law or of this agreement, and any lapse in your licences, permits or insurance.</b> This indemnity does not apply to the extent the loss was caused by Enivel’s gross negligence, fraud or wilful misconduct.</p>
<p>12.3 Enivel does not provide insurance to Drivers, Parents or Children, and nothing in the Platform is an offer of insurance.</p>
<h2 id="d13">13. Enivel’s liability to you</h2>
<p><b>13.1 Clause 14 of the Terms of Service applies to you as a business user. Enivel is not liable to you for loss of income or bookings caused by suspension during an investigation conducted in good faith, by Platform downtime, or by a Parent’s cancellation or non-payment, except to the extent the law does not allow this exclusion or the loss was caused by Enivel’s gross negligence, fraud or wilful misconduct.</b></p>
<p>13.2 If a suspension is shown to have been based on a clear error by Enivel, we will reinstate your account promptly and refund Driver Fees for the period of suspension.</p>
<h2 id="d14">14. Personal information you receive</h2>
<p>14.1 You receive Parents’ and Children’s personal information only to provide the transport. You must keep it confidential and secure, use it only for that purpose, not copy it into other systems or share it, and delete any copies you made outside the Platform when the Booking ends, except where the law requires you to keep them.</p>
<p>14.2 To the extent you process personal information outside the Platform, you do so as your own responsible party under POPIA and must comply with it. You must tell Enivel immediately if you lose a phone signed in to Enivel or suspect anyone has accessed Platform information through you.</p>
<h2 id="d15">15. Non-circumvention</h2>
<p>15.1 For 12 months after a Parent first books you through Enivel, you may not encourage or accept payment from that Parent outside Enivel for the same or substantially similar transport in order to avoid Platform Fees.</p>
<p>15.2 If you do, you must pay Enivel, as a pre-estimate of its loss, an amount equal to the Platform Fees that would have been payable on that transport for the rest of the 12-month period, calculated on the Transport Price last charged on the Platform. The parties agree that this amount is reasonable. It is subject to reduction by a court under section 3 of the Conventional Penalties Act 15 of 1962 if it is out of proportion to Enivel’s prejudice, and Enivel may not recover both this amount and damages for the same breach.</p>
<h2 id="d16">16. Ending this agreement</h2>
<p>16.1 You may stop offering transport at any time, but must give each Parent at least the notice set out in the Payments policy for monthly Bookings, so that no Child is left without transport without warning, unless you stop for a reason the Payments policy allows.</p>
<p>16.2 You may close your account once all notice periods have run and amounts owed have been settled. Enivel may end this agreement in the circumstances described in the Terms of Service, or for convenience on 30 days’ written notice.</p>
<p>16.3 On termination, payouts due to you will be paid after deduction of amounts you owe, and records will be kept as the Privacy Policy sets out.</p>
<h2 id="d17">17. Disputes</h2>
<p>Disputes between you and Enivel are resolved under the Complaints and Disputes policy, including mediation and then arbitration under the rules of the Arbitration Foundation of Southern Africa. Disputes between you and a Parent about the transport are for you and the Parent to resolve, with Enivel’s help on request.</p>`},

{id:'vehicles',title:'Vehicle, Seating and Insurance Standards',sub:'Minimum vehicle, seat belt, child restraint, capacity, inspection and insurance requirements',body:L=>`
<p>These standards set the minimum requirements for every vehicle used for an Enivel Booking. They form part of the Driver Agreement and of every Transport Contract. They are platform minimums: where the law, your operating licence, a learner transport authority or a school sets a stricter requirement, the stricter requirement applies. Meeting them does not mean that a vehicle complies with the law, and compliance remains the Driver’s responsibility.</p>
<h2 id="v1">1. Eligible vehicles</h2>
<p>1.1 A vehicle may be used only if it is: registered and licensed in South Africa; listed on the Driver’s Enivel account with correct details and current photographs; covered by the operating licence or permit for the transport offered; roadworthy; and insured as required in section 6.</p>
<p>1.2 Children may not be carried in the load-bed of a bakkie or in any part of a vehicle not designed and fitted with seats for passengers. Folding, side-facing or temporary seats may be used only if fitted by the manufacturer or an approved converter, and only with a working seat belt.</p>
<p>1.3 Each vehicle must have working doors, windows, lights, indicators, brakes, tyres with legal tread, mirrors, wipers and a working child lock on rear doors where fitted. Window tinting must comply with the law.</p>
<p>1.4 Each vehicle should carry a basic first-aid kit and a working fire extinguisher, and display any signage required by law, the operating licence or the learner transport authority in the province.</p>
<h2 id="v2">2. Seat belts</h2>
<p><b>2.1 Every Child must occupy a seat with a working seat belt and must wear it for the whole trip. One Child per seat belt. A Driver may not move off until every Child is buckled in.</b></p>
<p>2.2 Seat belts must be in good condition, not frayed, cut, knotted or tied back, and must latch and release properly.</p>
<p>2.3 The National Road Traffic Regulations require seat belts to be worn where fitted. Enivel’s rule of one Child per seat with its own belt applies even where any concession in the law would allow more.</p>
<h2 id="v3">3. Child restraints and front seats</h2>
<p><b>3.1 A Child for whom the National Road Traffic Regulations (including regulation 213, as amended) require an appropriate child restraint may not be carried without one. The Driver must not start a trip with such a Child unless the restraint is fitted correctly.</b></p>
<p>3.2 Before the first trip, the Parent and Driver must agree through the Platform who supplies the child restraint or booster seat. If the Parent supplies it, the Parent warrants that it is suitable for the Child’s age, weight and height and is in good condition; the Driver must fit it according to the manufacturer’s instructions.</p>
<p>3.3 Enivel recommends a booster seat for any Child shorter than about 150 cm, and recommends that young Children travel in the rear seats. A Child should not travel in a front seat with an active front airbag unless the Child is tall enough to use an adult seat belt safely.</p>
<h2 id="v4">4. Capacity</h2>
<p><b>4.1 The maximum number of Children on any trip is the lowest of: the number of seats with working seat belts (after any child restraints are fitted); the capacity on the vehicle’s licence documents; and the capacity allowed by the operating licence.</b></p>
<p>4.2 Seat counts shown on Routes are entered by the Driver and enforced by the Platform as a limit on Bookings, not as a certification of capacity. Drivers must set them correctly and update them if a seat is unavailable.</p>
<p>4.3 Children on different Routes, private chauffeur trips and once-off trips count together if they are in the vehicle at the same time.</p>
<h2 id="v5">5. Inspections and maintenance</h2>
<p>5.1 Drivers must keep each vehicle roadworthy and serviced according to the manufacturer’s schedule, and must carry out a daily walk-around check (tyres, lights, seat belts, doors and fluid leaks) before the first trip of the day.</p>
<p>5.2 Enivel may ask a Driver at any time to upload current photographs, a recent service record, a certificate of roadworthiness or fitness, or to make the vehicle available for inspection at a reasonable time and place. A vehicle may be suspended from the Platform until the request is met.</p>
<p>5.3 A vehicle that becomes unroadworthy, is damaged in a way that affects safety, or fails a test may not be used for Enivel Bookings until repaired. The Driver must tell affected Parents and use a verified replacement vehicle or arrange an alternative with the Parent’s agreement.</p>
<p>5.4 Enivel does not inspect vehicles mechanically. A photograph review or document check is not a roadworthiness test.</p>
<h2 id="v6">6. Insurance</h2>
<p>6.1 Every vehicle must at all times have:</p>
<ul>
<li>passenger liability cover of at least R5 million per vehicle per event, or such higher amount as the law or your operating licence requires, that expressly covers the carriage of learners for reward;</li>
<li>motor vehicle cover for third-party property damage at a minimum, and Enivel recommends comprehensive cover; and</li>
<li>any other cover the law, the operating licence or a learner transport authority requires.</li>
</ul>
<p><b>6.2 You must disclose to your insurer that the vehicle is used to transport learners for reward through a platform. Failure to do so may entitle the insurer to reject a claim. Enivel is not responsible if your insurer rejects a claim.</b></p>
<p>6.3 You must upload proof of cover, keep it current, tell Enivel immediately if any cover lapses, is cancelled or is reduced, and provide the policy schedule on request.</p>
<p>6.4 The R5 million minimum is an Enivel platform requirement, not a statement of what the law requires or of what is adequate for every risk. Drivers should take advice from a registered insurance adviser about adequate cover.</p>
<p>6.5 Road Accident Fund benefits for injured passengers do not replace the Driver’s insurance obligations. See the <a href="#" data-doc="incidents">Incident Response</a> policy.</p>
<h2 id="v7">7. Accidents and breakdowns</h2>
<p>7.1 After any accident the Driver must stop, ensure the safety of the Children, call emergency services where anyone is injured, and follow the <a href="#" data-doc="incidents" data-sec="i3">accident procedure</a>, including reporting to the police within 24 hours where required by section 61 of the National Road Traffic Act.</p>
<p>7.2 After a breakdown the Driver must move the Children to a safe place away from traffic where possible, never leave them unattended, tell the Parents through the Platform and arrange safe onward transport with the Parents’ agreement.</p>
<h2 id="v8">8. Consequences</h2>
<p><b>Using a vehicle that does not meet these standards, overloading, or carrying a Child without a required seat belt or restraint may lead to immediate suspension of the vehicle or the Driver’s account and, for serious or repeated breaches, a permanent ban.</b></p>`},

{id:'privacy',title:'Privacy Policy',sub:'How we collect, use and protect personal information under POPIA',body:L=>`
<p>This Privacy Policy explains how ${L.E} (“Enivel”, “we”) processes personal information as a responsible party under the Protection of Personal Information Act 4 of 2013 (“POPIA”). It is our notice to you under section 18 of POPIA. Our Information Officer is ${L.IO}, contactable at ${L.PRIV}, ${L.PHONE} or at ${L.ADDR}.</p>
<h2 id="p1">1. Scope</h2>
<p>This policy applies to Parents, trusted guardians and authorised collectors, Children whose information Parents add, Drivers and their relief drivers and assistants, people who contact us, and visitors to the Platform. It does not apply to information a Driver or Parent keeps outside the Platform; each of them is responsible for that information.</p>
<h2 id="p2">2. Information we collect</h2>
<h3>Parents</h3><ul><li>Name, email address, cellphone number, password (stored only in hashed form by our authentication provider) and optional security PIN (stored only as a hash).</li><li>South African ID number and a photograph of an identity document, to confirm you are an adult entitled to act for the Child.</li><li>Addresses for pickup, drop-off and stops, with map coordinates.</li><li>Bookings, schedules, days off, Term Planner dates, Waiting List entries, payment records, ratings, reviews, complaints, reports and messages.</li><li>Handover Codes you set for each Child.</li><li>Names and phone numbers of trusted guardians and authorised collectors you add (you confirm you have their permission).</li></ul>
<h3>Children</h3><ul><li>First name, age, school, grade, pickup and drop-off address and coordinates, and notes you choose to give the Driver.</li><li>Trip records: pickup, drop-off and handover times and places.</li><li>We do not ask for a Child’s ID number, photograph, medical records or biometric information. Do not include health information in notes unless it is needed for the Child’s safety on the trip.</li></ul>
<h3>Drivers, relief drivers and assistants</h3><ul><li>Identity, licence, PrDP, operating licence or permit, police clearance, insurance, roadworthiness, licence disc, proof of address, a live photograph, and the dates and details on them.</li><li>Vehicle details and photographs, including the number plate.</li><li>Location during active trips, pickup, drop-off and handover records, punctuality, on-time score, badges, ratings and reviews.</li><li>Payout, fee and set-off records.</li><li>Expense tracker entries (fuel, maintenance, insurance and other costs) and calculated profit estimates.</li></ul>
<h3>Everyone</h3><ul><li>Device, browser and app information, IP address, log and error records, notification subscription details, and settings stored on your device (see the Device Storage notice).</li><li>SOS alerts, incident reports and related correspondence.</li><li>Referral codes used, credits issued and giveaway records.</li></ul>
<h2 id="p3">3. Sources and whether supply is voluntary</h2>
<p>3.1 We collect most information directly from you. We collect information about Children from their Parent, about trusted guardians and collectors from the Parent who adds them, and about Drivers from the Driver, from verification partners and issuing authorities where the law permits, and from Parents’ reports and reviews. Location and Trip Data are generated by the Driver’s device during trips.</p>
<p>3.2 Fields marked as required in the Platform are mandatory for the service to work. If you do not provide them we cannot create the account, verify a Driver, make a Booking or keep the Child safe on the trip. Other information is voluntary.</p>
<p>3.3 Some processing is required or authorised by law, including the Tax Administration Act 28 of 2011 (financial records), the Financial Intelligence Centre Act where it applies to our payment providers, and laws on child protection and road traffic.</p>
<h2 id="p4">4. Special personal information</h2>
<p>4.1 Criminal behaviour information (police clearance and related checks of Drivers) is special personal information under section 26 of POPIA. We process it with the Driver’s consent under section 27(1)(a), to protect Children, and otherwise as permitted by sections 27 and 33. Access is restricted to authorised reviewers.</p>
<p>4.2 Health information in a Child’s notes is special personal information. We process it only with the Parent’s consent, only to the extent needed for the Child’s safety on the trip, and show it only to the Child’s Driver.</p>
<h2 id="p5">5. Why we process information and our lawful basis</h2>
<table class="lt"><tr><th>Purpose</th><th>Lawful basis (POPIA s11)</th></tr>
<tr><td>Creating and running accounts, Bookings, trips, chat and payments</td><td>Necessary to perform the contract with you</td></tr>
<tr><td>Verifying Drivers and Parents, screening documents, preventing fraud and re-registration of banned users</td><td>Legitimate interest in Children’s safety; legal obligation; consent for special information</td></tr>
<tr><td>Sharing Driver location with Parents of Children on board</td><td>Contract; legitimate interest in Children’s safety</td></tr>
<tr><td>Pickup, drop-off, reminder, handover and safety alerts</td><td>Contract; legitimate interest</td></tr>
<tr><td>Verifying Handover Codes</td><td>Contract; legitimate interest in Children’s safety; consent of the Parent</td></tr>
<tr><td>Term Planner, days off and schedule updates to Drivers</td><td>Contract</td></tr>
<tr><td>Waiting Lists and seat offers</td><td>Contract; legitimate interest in fair allocation</td></tr>
<tr><td>Smart stop order suggestions</td><td>Contract; legitimate interest</td></tr>
<tr><td>Expense tracker for Drivers</td><td>Contract (a feature the Driver chooses to use)</td></tr>
<tr><td>On-time scores, badges, ratings and reviews</td><td>Legitimate interest in informing Parents’ choices and in service quality</td></tr>
<tr><td>SOS, incident handling and cooperation with authorities</td><td>Legitimate interest; protecting the vital interests of a Child; legal obligation</td></tr>
<tr><td>Keeping trip records, messages and complaints</td><td>Legitimate interest in investigating incidents; establishing and defending legal claims</td></tr>
<tr><td>Referral credits and giveaways</td><td>Contract; legal obligations under the CPA</td></tr>
<tr><td>Accounting and tax records</td><td>Legal obligation</td></tr>
<tr><td>Product improvement and security monitoring</td><td>Legitimate interest</td></tr>
<tr><td>Marketing by Enivel</td><td>Your consent (opt-in), which you may withdraw at any time</td></tr></table>
<h2 id="p6">6. Children’s personal information</h2>
<p>6.1 Under sections 34 and 35 of POPIA we may process a Child’s information with the prior consent of a competent person. When you add a Child you confirm that you are the Child’s parent or legal guardian and give that consent, and we record when it was given.</p>
<p>6.2 We collect the minimum information needed to transport the Child safely. We never sell it, use it for advertising, or build marketing profiles of Children.</p>
<p>6.3 A Child’s information is shown to a Driver only while the Child has an active Booking with that Driver, and to the Driver’s verified relief drivers and assistants only for trips they perform.</p>
<p>6.4 You may withdraw consent by removing the Child, which ends their Bookings and Waiting List places. Trip records already created are kept for the period in section 10 for safety and legal reasons, as section 14 of POPIA permits.</p>
<h2 id="p7">7. Who can see what</h2>
<ul><li>Other Users see only a limited public profile: name, role, verification status, years of experience and, for Drivers, a contact number, vehicle details, ratings, on-time score and badges. They never see ID numbers, identity documents, verification documents, security PINs, Handover Codes or expense records.</li><li>A Driver sees a Child’s first name, age, school, pickup point, authorised collectors and notes only while that Child has an active Booking with that Driver.</li><li>A Parent sees a Driver’s live location only while their own Child is on board.</li><li>Expense tracker entries are visible only to the Driver who entered them and to authorised administrators.</li><li>Waiting List positions are visible to the Parent concerned and to the Driver, not to other Parents.</li><li>Authorised Enivel administrators can see information only for verification, safety, support, fraud prevention, payments, security and legal purposes. Their access is restricted and recorded.</li></ul>
<h2 id="p8">8. Operators and other recipients</h2>
<p>8.1 We share information only as needed with: our cloud database and authentication provider; our hosting provider; our SMS provider; our push-notification and serverless-function providers; map tile, address-search and routing providers (which receive the map area or addresses requested and your IP address); payment processors; identity and document verification partners; auditors and professional advisers; and insurers where needed for a claim.</p>
<p>8.2 We disclose information to the South African Police Service, courts, regulators, the Road Accident Fund and child-protection authorities where the law requires, under a lawful request such as a subpoena under section 205 of the Criminal Procedure Act 51 of 1977, or where a Child’s safety or someone’s life is at risk.</p>
<p>8.3 Operators process information under written agreements and must protect it as sections 20 and 21 of POPIA require. We do not sell personal information.</p>
<p>8.4 If Enivel’s business is sold or restructured, information may be transferred to the successor, who will be bound by this policy.</p>
<h2 id="p9">9. Transfers outside South Africa</h2>
<p>Some providers may store or process information outside South Africa. We transfer information only where section 72 of POPIA allows, in particular to providers in countries with adequate data protection laws or bound by binding agreements giving equivalent protection, or where the transfer is necessary to perform our contract with you. Where we can choose, we select data centres in or near South Africa.</p>
<h2 id="p10">10. How long we keep information</h2>
<table class="lt"><tr><th>Record</th><th>Kept for</th></tr>
<tr><td>Account and Child profiles</td><td>While the account is active, then deleted or de-identified within 90 days of closure</td></tr>
<tr><td>Trip records, handover confirmations, alerts, messages, complaints, SOS alerts and incident reports</td><td>3 years after the trip, or longer while a claim, investigation or legal hold is pending</td></tr>
<tr><td>Handover Codes</td><td>Until you change or remove the code, or the Child is removed</td></tr>
<tr><td>Term Planner dates and days off</td><td>Until 12 months after the period ends</td></tr>
<tr><td>Waiting List entries</td><td>Until you leave the list or accept or decline an offer, then up to 12 months as a record of fair allocation</td></tr>
<tr><td>Expense tracker entries</td><td>Until the Driver deletes them or closes the account</td></tr>
<tr><td>Driver verification documents</td><td>While the Driver is active plus 3 years; records of banned accounts until no longer needed to prevent re-registration</td></tr>
<tr><td>Financial and tax records</td><td>5 years from the relevant return or transaction, or longer where the Tax Administration Act requires</td></tr>
<tr><td>Live location</td><td>Current position replaced continuously; only positions recorded at pickup, drop-off and handover are kept as trip records</td></tr>
<tr><td>Security logs</td><td>Up to 12 months, or longer for an investigation</td></tr></table>
<p>Information may be kept for longer in de-identified form for statistics, or where the law requires or a legal claim is reasonably anticipated.</p>
<h2 id="p11">11. Security</h2>
<p>We take appropriate, reasonable technical and organisational measures under section 19 of POPIA, described in the <a href="#" data-doc="security">Information Security and Breach Response</a> policy. No system is completely secure. If there are reasonable grounds to believe your information has been accessed or acquired by an unauthorised person, we will notify you and the Information Regulator as section 22 of POPIA requires.</p>
<h2 id="p12">12. Automated processing and decisions</h2>
<p>12.1 We use automated checks (for example ID number validation, duplicate document detection, image quality and expiry checks) to flag submissions for human review. We calculate on-time scores and badges automatically from Trip Data, and automatically detect likely pickups and drop-offs.</p>
<p>12.2 Decisions to reject verification, suspend or ban are made by a person, not by automated processing alone, as section 71 of POPIA requires. You may ask for the reasons for any decision about you and make representations, and we will consider them.</p>
<h2 id="p13">13. Direct marketing</h2>
<p>Service messages (pickups, payments, safety, account, legal notices) are not marketing. We send marketing by electronic communication only with your opt-in consent or, where you are an existing customer, about our own similar services with an opt-out, as section 69 of POPIA allows. Every marketing message includes a way to opt out. We never market to Children.</p>
<h2 id="p14">14. Your rights</h2>
<ul><li>Be told that information about you is being collected and that it has been compromised (sections 18 and 22).</li><li>Ask whether we hold your information and request a copy and the identity of recipients (section 23).</li><li>Ask us to correct or delete inaccurate, outdated, incomplete, misleading or unlawfully obtained information (section 24).</li><li>Object to processing based on legitimate interest, and to direct marketing (section 11(3)).</li><li>Withdraw consent where consent is the basis, without affecting earlier lawful processing.</li><li>Not be subject to a decision based solely on automated processing (section 71).</li><li>Lodge a complaint with the Information Regulator (inforegulator.org.za, POPIAComplaints@inforegulator.org.za).</li></ul>
<p>Send requests to ${L.PRIV}. We will respond within 30 days and may need to confirm your identity first. Access requests may also be made under our PAIA manual. A Parent may exercise these rights on behalf of their Child.</p>
<h2 id="p15">15. Your responsibilities</h2>
<p>When you give us information about another person (a Child, guardian, collector, relief driver or assistant), you confirm that you are entitled to do so and that you have told them about this policy where the law requires. Keep the information you receive about others on the Platform confidential and use it only for the transport arrangement.</p>
<h2 id="p16">16. Changes</h2>
<p>We will notify you in the Platform before material changes to this policy take effect and, where a change requires your consent, ask for it.</p>`},

{id:'security',title:'Information Security and Breach Response',sub:'How we protect information, what you must do, and what happens if something goes wrong',body:L=>`
<p>This policy describes the security measures Enivel takes under sections 19 to 22 of POPIA, the security duties of Users, how we respond to a security compromise, and how to report a vulnerability. It forms part of the Terms of Service and the Privacy Policy.</p>
<h2 id="x1">1. Our security measures</h2>
<ul>
<li>Encryption of data in transit between your device and our services.</li>
<li>Access rules enforced by the database itself, so that each User can only read and change the records they are entitled to.</li>
<li>Passwords handled by our authentication provider and stored only in hashed form; security PINs stored only as hashes.</li>
<li>SMS one-time codes and optional two-step verification; we may require two-step verification for Drivers and administrators.</li>
<li>Administrator access limited to people who need it, protected by strong authentication, and recorded.</li>
<li>Separation of verification documents from public profiles, and restricted access to criminal behaviour information.</li>
<li>Written agreements with operators requiring them to protect information (sections 20 and 21 of POPIA).</li>
<li>Monitoring of errors and unusual activity, backups, and periodic review of our measures against new risks.</li>
<li>Confidentiality undertakings from everyone who works on Enivel.</li>
</ul>
<p><b>No system is completely secure. Enivel does not guarantee that the Platform will be free of vulnerabilities, malware or unauthorised access, and its liability for a security compromise is subject to clause 14 of the Terms of Service, which does not limit liability for gross negligence or rights under POPIA.</b></p>
<h2 id="x2">2. Your security duties</h2>
<ul>
<li>Use a strong, unique password and turn on two-step verification.</li>
<li>Never share passwords, one-time codes, PINs or Handover Codes, except a Handover Code with adults you authorise.</li>
<li>Keep your phone locked with a PIN, pattern or biometric lock and up to date.</li>
<li>Sign out on shared devices and remove Enivel from a device you sell or give away.</li>
<li>Be alert to phishing: Enivel will never ask you for a password or one-time code by phone, SMS, email or chat.</li>
<li>Report a lost or stolen phone, suspicious activity or a suspected compromise to ${L.EMAIL} immediately.</li>
<li>Drivers must not take screenshots of Children’s information or store it outside the Platform.</li>
</ul>
<p><b>You are responsible for loss caused by your failure to follow these duties, except to the extent the loss was caused by Enivel’s own negligence.</b></p>
<h2 id="x3">3. Security compromises</h2>
<p>3.1 A security compromise is any situation where there are reasonable grounds to believe that personal information has been accessed or acquired by an unauthorised person (section 22 of POPIA).</p>
<p>3.2 When we become aware of a possible compromise we will: contain it; assess what information and which people are affected; preserve evidence; involve our operators; and, where appropriate, report a crime to the South African Police Service, including offences under the Cybercrimes Act 19 of 2020.</p>
<p>3.3 We will notify the Information Regulator and affected data subjects as soon as reasonably possible after discovering the compromise, taking into account the legitimate needs of law enforcement and the measures needed to determine its scope and restore the integrity of our systems. Notification will be made in the manner the Information Regulator prescribes and, to affected people, by email, in the Platform, by SMS or as the Regulator directs.</p>
<p>3.4 The notice will give enough information for affected people to protect themselves, including a description of the possible consequences, the measures we have taken or intend to take, recommendations on what you should do, and, if known, the identity of the unauthorised person.</p>
<p>3.5 We may delay notification only where a public body responsible for the prevention, detection or investigation of offences, or the Information Regulator, determines that notification will impede a criminal investigation.</p>
<p>3.6 If a compromise could affect a Child’s safety (for example exposure of pickup addresses or Handover Codes), we will also tell affected Parents to change Handover Codes and review collection arrangements, and may temporarily restrict features.</p>
<h2 id="x4">4. Operator incidents</h2>
<p>Our operators must tell us immediately if they have reasonable grounds to believe information has been compromised, as section 21(2) of POPIA requires, and must cooperate with our response.</p>
<h2 id="x5">5. Responsible disclosure</h2>
<p>5.1 If you believe you have found a security vulnerability in the Platform, please report it to ${L.PRIV} with enough detail for us to reproduce it. Please do not disclose it publicly until we have had a reasonable time (at least 90 days) to fix it.</p>
<p>5.2 When testing, you must: only use your own accounts; not access, change or delete other people’s data (stop and report as soon as you see any); not degrade the service, use automated scanning at volume, or test during school transport hours; not use social engineering, phishing or physical attacks; and not demand payment.</p>
<p>5.3 If you act in good faith and within these rules, Enivel will not bring civil proceedings against you or lay a criminal complaint about your research. This undertaking does not bind any third party or authority, does not authorise access to other people’s data, and is not consent for purposes of the Cybercrimes Act beyond the limits set out here.</p>
<p>5.4 We may acknowledge helpful reports with thanks. We do not currently run a paid bug bounty.</p>
<h2 id="x6">6. Contact</h2>
<p>Security and privacy reports: ${L.PRIV}. Information Officer: ${L.IO}.</p>`},

{id:'safeguarding',title:'Child Safeguarding Policy',sub:'How we protect children who travel with Enivel drivers',body:L=>`
<p>Every decision on Enivel starts with the safety of the Child. This policy sets the minimum standards for Drivers, the duties of Parents, and what Enivel does when a concern is raised. It applies alongside the Constitution (section 28), the Children’s Act 38 of 2005, the Criminal Law (Sexual Offences and Related Matters) Amendment Act 32 of 2007 and the road traffic and learner transport laws. It forms part of the Terms of Service.</p>
<h2 id="s1">1. Principles</h2>
<ul><li>A Child’s best interests are of paramount importance in every decision we make about safety.</li><li>Every concern is taken seriously, recorded and acted on.</li><li>We act on reasonable suspicion; we do not wait for proof before protecting a Child.</li><li>We treat everyone involved fairly, respect the presumption of innocence, and give people a chance to respond where it is safe to do so.</li><li>We share information only with those who need it to protect a Child or as the law requires.</li></ul>
<h2 id="s2">2. Before a Driver is visible to Parents</h2>
<ul><li>Identity confirmed against an identity document and a live photograph.</li><li>Valid driver’s licence and Professional Driving Permit, minimum age 21.</li><li>South African Police Service clearance certificate not older than six months, renewed every 12 months.</li><li>Operating licence or permit, passenger liability insurance, licensing and roadworthiness documents for each vehicle.</li><li>Photographs of all four sides of each vehicle and the number plate.</li><li>A declaration that the Driver is not listed on the National Register for Sex Offenders or Part B of the National Child Protection Register, and checks of those registers where the law permits.</li><li>Automated screening for invalid or duplicate ID numbers, duplicated or recycled document images, poor-quality images and expired documents, followed by human review.</li><li>The same checks for every relief driver and assistant before they transport or accompany a Child.</li></ul>
<h2 id="s3">3. During every trip</h2>
<ul><li>Pickups, drop-offs and handovers are recorded for each Child, and the Parent is alerted.</li><li>Pickups can only be recorded from close to the pinned pickup point.</li><li>Where a Parent has set a Handover Code, a home or afternoon drop-off can only be recorded after the Driver enters the code given by the receiving adult.</li><li>A Driver’s location is visible to a Parent only while that Parent’s Child is in the vehicle.</li><li>Seat limits are enforced: a Route cannot accept more Bookings than seats.</li><li>An SOS button sends an alert to Enivel’s safety team with the account, trip and time.</li></ul>
<h2 id="s4">4. Behaviour that is never acceptable</h2>
<p>Any form of physical, emotional or sexual abuse or neglect; grooming, including building secret or special relationships, gifts, or private contact with a Child outside the trip; inappropriate touching, language, images or messages; photographing or filming a Child other than for a genuine safety reason shared with the Parent; contacting a Child directly on social media or by private message; giving a Child alcohol, drugs, tobacco or vapes; leaving a Child alone in a vehicle or at an unsafe place; carrying unverified adults with Children without the Parent’s knowledge; driving under the influence or recklessly; handing a Child to an unauthorised person.</p>
<h2 id="s5">5. When a Child cannot be handed over</h2>
<p>5.1 If no authorised adult is present, the Handover Code is not given correctly, or the receiving adult appears unfit to care for the Child, the Driver must keep the Child safely in the vehicle and contact the Parent and trusted guardians through the Platform.</p>
<p>5.2 The Driver may complete the Route with the Child on board and return, or wait at a safe place, and must keep the Parent informed. A Child must never be left at a gate, on a pavement or with a neighbour who is not authorised.</p>
<p>5.3 If nobody can be reached within a reasonable time, the Driver must contact Enivel through the Platform and, as a last resort, take the Child to or ask for help from the nearest police station.</p>
<h2 id="s6">6. Raising a concern</h2>
<p>Anyone can report a concern through the Report button on a Booking, the SOS button, or ${L.EMAIL}. In an emergency, call 10111 (police), 10177 (ambulance) or 112 from a cellphone first. Childline South Africa: 116. Reports may be made confidentially; we will not disclose who made a report except where the law requires or with their consent.</p>
<h2 id="s7">7. What Enivel does</h2>
<ol><li>Within one hour of a report that suggests risk of harm, during our support hours, we restrict the Driver’s account and hide their Routes while we look into it. Reports received outside support hours are dealt with as soon as they are seen.</li><li>We preserve trip records, location points, handover records, messages and payment records.</li><li>We report to the South African Police Service and, where relevant, to a designated child protection organisation or the Department of Social Development, where the law requires it (for example, section 54 of the Criminal Law (Sexual Offences and Related Matters) Amendment Act requires any person who knows that a sexual offence has been committed against a child to report it to the police) and otherwise where we reasonably believe a Child may be in need of care and protection, as section 110 of the Children’s Act permits.</li><li>We tell affected Parents as soon as it is safe and lawful to do so, without prejudicing an investigation.</li><li>We give the person concerned an opportunity to respond where this will not put a Child at risk or prejudice an investigation.</li><li>A Driver who is found on a balance of probabilities to have harmed or endangered a Child, or whose documents are false, is permanently banned.</li></ol>
<h2 id="s8">8. Duties of Drivers</h2>
<ul><li>Follow the Driver Agreement and Vehicle Standards at all times.</li><li>Keep interactions with Children professional, brief and visible.</li><li>Report any disclosure of abuse by a Child, any sign of injury or neglect that concerns you, and any incident, to Enivel and where required to the police, without questioning the Child in detail.</li></ul>
<h2 id="s9">9. Duties of Parents</h2>
<ul><li>Meet the Driver and see the vehicle before the first trip.</li><li>Keep your Child’s profile, pickup point, authorised collectors and Handover Code up to date and the code secret.</li><li>Tell the Driver about absences, school closures and changes through Enivel, not only by phone.</li><li>Teach your Child to wear a seat belt and to tell you if anything makes them uncomfortable.</li><li>Report concerns immediately.</li></ul>
<h2 id="s10">10. Limits</h2>
<p><b>These measures reduce risk; they cannot eliminate it. Enivel is not present in the vehicle and does not supervise Children. The Driver is responsible for the Child during the trip, and the Parent for arrangements before pickup and after handover. Enivel’s safety team is not an emergency service and may not be available at all hours.</b></p>`},

{id:'incidents',title:'Incident, Emergency and Accident Response',sub:'SOS, reporting timelines, evidence, police cooperation, the Road Accident Fund and communication',body:L=>`
<p>This policy explains what Drivers, Parents and Enivel must do when something goes wrong during or around a trip. It forms part of the Terms of Service and the Driver Agreement. An “incident” includes an accident, injury, breakdown, medical emergency, threat, assault, attempted abduction, hijacking, harassment, a Child who cannot be handed over, a lost Child, and any allegation of misconduct.</p>
<h2 id="i1">1. Emergencies come first</h2>
<p>In an emergency, first protect life: move Children away from danger where it is safe to do so and call emergency services. Police: 10111. Ambulance and fire: 10177. From any cellphone: 112. Childline: 116.</p>
<h2 id="i2">2. The SOS button</h2>
<p>2.1 The SOS button sends an alert to Enivel’s safety team with the account, the trip, the time and the last known location.</p>
<p><b>2.2 The SOS button is not an emergency service and is not a substitute for calling 10111, 10177 or 112. It depends on your phone, network and our systems, and Enivel’s safety team may not see an alert immediately, particularly outside support hours. Enivel cannot dispatch police, ambulances or security.</b></p>
<p>2.3 After an SOS alert we will try to contact the person who raised it and, where appropriate, the Driver, the Parents of Children on board and emergency services. False or malicious SOS alerts breach the Acceptable Use rules.</p>
<h2 id="i3">3. Accident procedure for Drivers</h2>
<ol>
<li>Stop immediately in a safe place, switch on hazard lights and switch off the engine.</li>
<li>Check every Child and anyone else involved for injuries. Call 10177 or 112 if anyone is hurt. Do not move a seriously injured person unless they are in immediate danger.</li>
<li>Keep the Children together, away from traffic, and never leave them unattended.</li>
<li>Exchange names, addresses, ID numbers, vehicle registration numbers and insurance details with the other drivers involved, as section 61 of the National Road Traffic Act requires, and note witnesses’ details.</li>
<li>Report the accident to the police within 24 hours or, if that is not possible, as soon as reasonably practicable afterwards, if the police did not attend, and obtain the accident (AR) or case number.</li>
<li>Tell the Parents of every Child on board through the Platform or by phone as soon as the Children are safe, and arrange safe onward transport or collection with them.</li>
<li>Report the accident to Enivel through the Platform immediately, and in any event within 2 hours, followed by a written report within 24 hours.</li>
<li>Notify your insurer within the time your policy requires.</li>
<li>Do not admit liability or sign documents on behalf of Enivel. You may give the police a truthful statement.</li>
</ol>
<h2 id="i4">4. Reporting timelines</h2>
<table class="lt"><tr><th>Event</th><th>Report to</th><th>When</th></tr>
<tr><td>Medical emergency, serious injury, threat to life, attempted abduction, hijacking</td><td>Emergency services, then Parents and Enivel</td><td>Immediately</td></tr>
<tr><td>Accident (any)</td><td>Parents and Enivel; police where required</td><td>Parents and Enivel immediately (within 2 hours at the latest); police within 24 hours</td></tr>
<tr><td>Allegation or suspicion of abuse or a sexual offence against a Child</td><td>Police and Enivel</td><td>Immediately</td></tr>
<tr><td>Child not handed over, or lost</td><td>Parent and trusted guardians, then Enivel; police if the Child cannot be found</td><td>Immediately</td></tr>
<tr><td>Breakdown or delay of more than 15 minutes</td><td>Parents of Children affected</td><td>As soon as it is safe</td></tr>
<tr><td>Minor incident (behaviour, near miss, property damage)</td><td>Parents and Enivel</td><td>Within 24 hours</td></tr>
<tr><td>Lapse of licence, permit or insurance; arrest or charge</td><td>Enivel</td><td>Within 24 hours</td></tr></table>
<h2 id="i5">5. Preserving evidence</h2>
<p>5.1 Do not delete messages, call logs, photographs or dash-camera footage about an incident. Photograph the scene, the vehicles and any damage where it is safe to do so.</p>
<p>5.2 When Enivel is told of an incident, we place the related Trip Data, location points, handover records, messages, SOS alerts and payment records on hold, so that they are not deleted under our normal retention periods until the matter is resolved.</p>
<p>5.3 Do not alter, re-record or “correct” a trip record after an incident without telling Enivel. Changes are logged.</p>
<h2 id="i6">6. Cooperation with the police and authorities</h2>
<p>6.1 Users must cooperate with the South African Police Service, traffic authorities, learner transport authorities and the Department of Social Development in any investigation.</p>
<p>6.2 Enivel discloses records to the police or other authorities where the law requires, under a lawful request such as a subpoena under section 205 of the Criminal Procedure Act 51 of 1977 or a court order, or without such a request where disclosure is necessary to prevent a serious and imminent threat to life or to a Child’s safety, as POPIA permits. We record every disclosure.</p>
<p>6.3 Enivel does not investigate crimes. Its internal review is limited to deciding what action to take on the Platform.</p>
<h2 id="i7">7. Communication with Parents and the public</h2>
<p>7.1 Drivers must tell affected Parents promptly and truthfully what happened and where their Child is. Enivel will share factual information with affected Parents as soon as it is safe and lawful to do so.</p>
<p>7.2 <b>Statements made by Enivel to help Parents or authorities are not admissions of liability.</b> Enivel will not disclose the identity or personal information of a Child or other person to anyone who is not entitled to it.</p>
<p>7.3 Users must not publish photographs or details of Children involved in an incident on social media, and should refer media enquiries to Enivel at ${L.EMAIL}.</p>
<h2 id="i8">8. The Road Accident Fund</h2>
<p>8.1 People injured in a road accident in South Africa caused by the negligent driving of a motor vehicle, including passengers, may be entitled to claim compensation from the Road Accident Fund (RAF) under the Road Accident Fund Act 56 of 1996, which may limit or replace claims against the driver or owner.</p>
<p><b>8.2 RAF claims are subject to strict time limits: generally three years from the date of the accident where the driver or owner is identified, and shorter periods where they are not. Special rules apply to minors. Enivel does not lodge RAF claims for anyone and does not give legal advice; obtain independent legal advice promptly.</b></p>
<p>8.3 Enivel will, on request and subject to the Privacy Policy, give an injured person or their legal representative copies of relevant Trip Data to support a claim.</p>
<h2 id="i9">9. Insurance claims</h2>
<p>Claims for injury or damage arising from a trip must first be made against the Driver’s insurance and, where applicable, the RAF. Enivel does not insure trips. Drivers must cooperate with their insurer and tell Enivel the outcome.</p>
<h2 id="i10">10. Enivel’s actions after an incident</h2>
<p>10.1 Enivel may restrict a Driver’s account or a vehicle while an incident is reviewed, especially where a Child was injured or put at risk or a vehicle may be unsafe. We will tell affected Parents and arrange refunds under the Payments policy.</p>
<p>10.2 After review we may reinstate the account, require corrective steps (such as a vehicle inspection or new documents), or suspend or ban it under the Terms of Service.</p>
<p><b>10.3 Enivel’s role in an incident is limited to operating the Platform, preserving records and taking action on accounts. It is not responsible for the emergency response, the conduct of the Driver or third parties, or the outcome of any police, insurance or RAF process, to the extent the law allows.</b></p>`},

{id:'payments',title:'Payments, Fees, Cancellations and Refunds',sub:'What you pay, when, and how money is returned',body:L=>`
<h2 id="m1">1. Fees</h2>
<table class="lt"><tr><th>Who</th><th>Fee</th><th>When</th></tr>
<tr><td>Parents</td><td>Transport Price set by the Driver, plus a 2% Enivel Platform Fee on that price</td><td>Monthly in advance for monthly Bookings; at booking for once-off trips</td></tr>
<tr><td>Drivers</td><td>R100 per calendar month</td><td>Only in months in which the Driver has at least one active paying passenger</td></tr>
<tr><td>Drivers</td><td>R49.99 per month per vehicle beyond the first three (“parking slot”)</td><td>From the month the extra vehicle is added, until it is removed</td></tr></table>
<p>Example: Transport Price R1 000, Platform Fee 2% = R20, total R1 020. The exact amounts are always shown before you pay. ${L.VAT}</p>
<h2 id="m2">2. How payments work</h2>
<p>2.1 Payments are processed by third-party payment providers using secure payment systems. Enivel does not store full card numbers. The payment provider’s own terms may apply.</p>
<p>2.2 The Transport Price is collected on behalf of the Driver as limited collection agent and paid out to the Driver after deductions under the Driver Agreement. Payment to Enivel discharges the Parent’s obligation to the Driver for that amount.</p>
<p>2.3 Monthly Bookings are billed in advance for each calendar month (or for the remaining part of the first month, pro rata, if the Platform shows a pro-rata first payment).</p>
<p>2.4 If a payment fails, we may retry it and will notify the Parent and Driver. If it is not paid within 7 days of the notice, the Booking may be suspended and the seat released to another Parent or the Waiting List.</p>
<p>2.5 If the Platform shows that payments are in test mode, no money moves and no Booking is paid.</p>
<p>2.6 Receipts and statements are available in your account.</p>
<h2 id="m3">3. Cancelling a monthly Booking (Parents)</h2>
<p>3.1 You may cancel at any time in the Platform. Cancellation takes effect at the end of the month already paid, unless the Driver agrees to an earlier date.</p>
<p>3.2 Under section 14 of the Consumer Protection Act, a consumer may cancel a fixed-term agreement on 20 business days’ notice, and a reasonable cancellation penalty may apply. Monthly Bookings on Enivel have no fixed term beyond the month paid, so no penalty applies beyond that month. If a Driver offers a fixed-term arrangement through the Platform, section 14 applies to it in full.</p>
<h2 id="m4">4. Cancelling a monthly Booking (Drivers)</h2>
<p>4.1 A Driver must give at least 20 Business Days’ notice through the Platform before ending a monthly Booking.</p>
<p>4.2 Shorter or no notice is allowed only where a Child’s safety, non-payment, a serious breach by the Parent, the loss of the Driver’s licence, permit or vehicle, or an event beyond the Driver’s control justifies it. The Parent then receives the refunds in section 5.</p>
<h2 id="m5">5. Refunds</h2>
<ul>
<li><b>Driver stops service or is suspended or banned mid-month:</b> the Parent receives a pro-rata refund of the Transport Price and Platform Fee for the unused school days.</li>
<li><b>Service not provided on a school day</b> without notice through the Platform: the Parent may request a pro-rata refund of that day’s Transport Price within 14 days; we decide on the Trip Data and the parties’ representations.</li>
<li><b>Child absent, days off, school holidays and closures</b> (illness, family travel, exam days without trips, public holidays, and holidays or closures recorded in the Term Planner): <b>no refund and no automatic reduction, because the Driver keeps the seat reserved</b>, unless the Driver agrees otherwise through the Platform.</li>
<li><b>Once-off trips:</b> full refund if cancelled more than 2 hours before pickup; no refund after the Driver has arrived at the pickup point. Between those times the Driver may retain a reasonable cancellation fee shown before booking. Under section 17(5) of the Consumer Protection Act no cancellation fee applies if the trip could not take place because of the death or hospitalisation of the person for whom it was booked.</li>
<li><b>Service of poor quality:</b> where the Consumer Protection Act (section 54) entitles you to have a service remedied or refunded, you keep that right.</li>
<li><b>Platform Fees</b> are refunded together with a refunded Transport Price, if we made an error, or where the law requires.</li>
<li><b>Driver Fees</b> (R100 and parking slots) are not refunded for a month already started, except where we made an error or as clause 13.2 of the Driver Agreement provides.</li>
</ul>
<p>Refunds are paid to the original payment method, or as Enivel credit if you choose, within 10 Business Days of approval. Refunds of amounts already paid out to a Driver may be recovered from the Driver.</p>
<h2 id="m6">6. Electronic transaction cooling-off</h2>
<p>6.1 Section 44 of the Electronic Communications and Transactions Act gives a 7-day cooling-off right for some electronic transactions. Under section 42(2) it does not apply, among other things, to services that began with your consent before the end of the 7 days, or to certain transport services that the supplier undertakes to provide on a specific date or within a specific period.</p>
<p>6.2 Regardless of those exclusions, if you cancel a monthly Booking within 7 days of first paying and before any trip has taken place, you receive a full refund within 30 days.</p>
<h2 id="m7">7. Chargebacks</h2>
<p>Please contact us before disputing a payment with your bank. A chargeback made in bad faith after the service was provided may lead to suspension and recovery of the amount, the chargeback fee charged to us, and reasonable costs.</p>
<h2 id="m8">8. Credits, referrals and giveaways</h2>
<p>Referral credit (R50 each for the referrer and the new user) and giveaways are governed by the <a href="#" data-doc="promotions">Referral, Credit and Giveaway Terms</a>. Credit is applied automatically to Enivel payments, has no cash value and expires as set out there.</p>
<h2 id="m9">9. Price changes</h2>
<p>9.1 Drivers may change their Transport Price for future months with at least 30 days’ notice to Parents through the Platform. A Parent who does not accept the new price may cancel before it takes effect without penalty.</p>
<p>9.2 Enivel will give at least 30 days’ notice of any change to its Platform Fees or Driver Fees. Changes do not apply to periods already paid.</p>
<h2 id="m10">10. Set-off, errors and statements</h2>
<p>10.1 Enivel may set off amounts due to it as clause 9.3 of the Terms of Service and clause 10.3 of the Driver Agreement provide.</p>
<p>10.2 If you are charged in error, we will refund the incorrect amount. If we under-charge or over-pay in error, we may recover the difference after telling you, in instalments where reasonable.</p>
<p>10.3 Tell us about a disputed charge within 60 days of the statement on which it first appears so we can investigate while records are fresh. This does not limit any right you have under the law or shorten prescription.</p>`},

{id:'promotions',title:'Referral, Credit and Giveaway Terms',sub:'How referral credit and giveaways work, their limits and what counts as abuse',body:L=>`
<p>These terms govern the Enivel referral programme, Enivel credit and giveaways. They form part of the Terms of Service. Each promotion may have additional rules shown in the Platform; if they conflict, the specific rules apply to that promotion.</p>
<h2 id="g1">1. Referral programme</h2>
<p>1.1 Each User has a referral code. When a new User creates an account with your code, both of you receive R50 Enivel credit, once per new account, when the conditions shown in the Platform are met.</p>
<p>1.2 The new User must be a genuine new person who has not held an Enivel account before, using their own identity, phone number and payment method. A referral cannot be added after the account has been created.</p>
<p>1.3 Enivel may set a maximum number of rewarded referrals per User per period, shown in the Platform.</p>
<p>1.4 You may share your code only with people you know or in your own social channels. You may not send unsolicited bulk messages, post it on coupon sites, pay for advertising using the Enivel name, or describe it in a misleading way.</p>
<h2 id="g2">2. Using credit</h2>
<p>2.1 Credit is applied automatically to Enivel payments you make, before your payment method is charged.</p>
<p><b>2.2 Credit has no cash value, cannot be exchanged for cash, transferred, sold or combined across accounts, and is not refunded if you close your account, except where the law requires.</b></p>
<p><b>2.3 Credit expires on the earlier of the date it is fully used or 3 years after the date it was issued.</b> Refunds paid as credit at your choice follow the same rule. Your balance and expiry dates are shown in your account.</p>
<p>2.4 Credit used to pay a Driver’s Transport Price is funded by Enivel; the Driver’s payout is not reduced.</p>
<h2 id="g3">3. Giveaways</h2>
<p>3.1 From time to time Enivel may pay a Parent’s monthly Transport Price and Platform Fee as a promotion (“Giveaway”). Enivel pays the Driver directly; the Parent receives no cash.</p>
<p>3.2 A Giveaway is awarded at Enivel’s discretion, for example to recognise community involvement or need. Unless it is run as a competition, it is a gift: it creates no right to future Giveaways and cannot be exchanged, transferred or converted into cash.</p>
<p>3.3 Where a Giveaway is a promotional competition as defined in section 36 of the Consumer Protection Act, Enivel will comply with that section and its regulations, including by: publishing the competition rules before it starts; not requiring payment to enter beyond the reasonable cost of communication; not awarding a prize to anyone the law excludes, such as Enivel’s directors, employees, agents and consultants and their close family; announcing results as the rules state; and keeping the required records for at least three years.</p>
<p>3.4 Enivel may publish a winner’s first name and town only with their consent and never publishes information about a Child.</p>
<h2 id="g4">4. Loyalty programme rules</h2>
<p>To the extent the referral programme is a loyalty programme under section 35 of the Consumer Protection Act, credit may be used on the same terms as any other payment for available services, and Enivel will honour credit already issued until it expires, even if the programme ends.</p>
<h2 id="g5">5. Abuse</h2>
<p>5.1 The following are abuse: referring yourself or a household member through a second account; creating fake, duplicate or borrowed accounts; using another person’s identity, phone number or payment method; colluding with a Driver or other User to generate credit or a Giveaway; paying or being paid for a referral; and any other attempt to obtain a benefit not intended by these terms.</p>
<p><b>5.2 Where we reasonably suspect abuse, we may withhold, cancel or reverse credit or a Giveaway, recover the value of credit already used by set-off or as a debt, and suspend or close the accounts involved.</b> We will tell you the reason and give you an opportunity to respond, except where this would prejudice a fraud investigation.</p>
<h2 id="g6">6. Tax</h2>
<p>6.1 A Giveaway or credit does not change the nature of the Driver’s income: the Driver receives the Transport Price as income from the Driver’s business and must declare it as usual.</p>
<p>6.2 Enivel does not give tax advice. Any tax consequence of a benefit you receive is your responsibility; Enivel will provide reasonable information about benefits paid to you on request.</p>
<h2 id="g7">7. Changes and ending promotions</h2>
<p>7.1 Enivel may change or end the referral programme or any Giveaway on 30 days’ notice in the Platform, or immediately where needed to stop abuse or comply with law. Credit already issued remains valid until it expires.</p>
<p>7.2 A competition, once started, will not be changed to entrants’ prejudice except as its rules or the law allow.</p>
<h2 id="g8">8. Liability</h2>
<p>Enivel’s liability for a promotion is limited to the value of the credit or Giveaway concerned, subject to clause 14.5 of the Terms of Service.</p>`},

{id:'conduct',title:'Acceptable Use and Community Rules',sub:'What everyone on Enivel must and must not do',body:L=>`
<p>These rules apply to everyone who uses Enivel, in the Platform and in person when transport arranged on Enivel takes place. They form part of the Terms of Service.</p>
<h2 id="c1">1. Everyone must</h2><ul><li>Use their real identity and only their own documents, phone number and payment method.</li><li>Be respectful in messages, reviews and in person.</li><li>Keep arrangements, payments and changes inside Enivel so there is a record.</li><li>Keep passwords, one-time codes, PINs and Handover Codes secret.</li><li>Report safety concerns immediately.</li><li>Comply with the law.</li></ul>
<h2 id="c2">2. Nobody may</h2><ul><li>Upload false, altered, borrowed or stolen documents or photographs, or impersonate anyone.</li><li>Create more than one account, or an account for someone else, or to get around a suspension or ban.</li><li>Harass, threaten, stalk, discriminate against or abuse anyone, including on the grounds listed in section 9 of the Constitution.</li><li>Send sexual, violent, hateful or otherwise harmful content, or any content involving a Child that is inappropriate.</li><li>Share another person’s personal information, location or Handover Code outside Enivel without their consent.</li><li>Post fake reviews, review yourself, or offer or accept anything in exchange for a review or to remove one.</li><li>Arrange payments outside Enivel to avoid Platform Fees, or abuse referrals, credit or Giveaways.</li><li>Raise a false SOS alert or make a report you know to be false.</li><li>Scrape, copy, reverse engineer, overload, probe or attack the Platform, introduce malware, or access data you are not entitled to (which may be an offence under the Cybercrimes Act 19 of 2020), except within the responsible disclosure rules.</li><li>Use the Platform for any unlawful purpose or to advertise unrelated goods or services.</li></ul>
<h2 id="c3">3. Parents must not</h2><ul><li>Ask a Driver to carry more Children than seats, to carry a Child without a required restraint, to break traffic law, or to stop where it is unsafe or unlawful.</li><li>Place a Child who is not booked in a Driver’s vehicle without the Driver’s agreement in the Platform.</li><li>Withhold payment as leverage in a dispute instead of using the complaints process.</li></ul>
<h2 id="c4">4. Drivers must not</h2><ul><li>Offer transport with a vehicle or person not verified on Enivel.</li><li>Inflate seat counts, hold seats to sell outside Enivel, or misrepresent times, prices or capacity.</li><li>Falsify pickups, drop-offs or handovers, or enter a Handover Code not given by the receiving adult.</li><li>Contact Children directly outside what the trip requires, or contact Parents for purposes unrelated to the transport.</li></ul>
<h2 id="c5">5. Messages and reviews</h2><p>Chat is for arranging and discussing transport. Keep it factual and courteous. Reviews must describe your own genuine experience and must not include personal information, allegations of crime that have not been reported to the police and Enivel, or language that is abusive or discriminatory. We may remove content that breaks these rules.</p>
<h2 id="c6">6. Reporting</h2><p>Use Report an issue, the SOS button or ${L.EMAIL}. Reports made honestly are welcome even if they turn out to be unfounded. Retaliation against anyone who reports in good faith is a serious breach.</p>
<h2 id="c7">7. Consequences</h2><p>Depending on how serious it is: a warning, removal of content, loss of credit, temporary suspension, permanent ban, recovery of losses, and a report to the police or another authority. Anything involving the safety of a Child is treated as most serious. Our approach to suspension and bans is set out in clause 12 of the Terms of Service.</p>`},
