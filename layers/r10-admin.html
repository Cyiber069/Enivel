<style>
/* ===== r10 admin: Control grid, live room, safety, documents, audit, status ===== */
@keyframes admPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}70%{box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 0%,transparent)}}
@keyframes admIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes admSpin{to{transform:rotate(360deg)}}
.adm-ctl{margin-bottom:16px}
.adm-ctl h3{display:flex;align-items:center;gap:8px}
.adm-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,152px),1fr))}
@media(max-width:520px){.adm-grid{grid-template-columns:1fr 1fr}.adm-grid>.adm-tile:last-child:nth-child(odd){grid-column:1/-1;min-height:96px}}
.adm-tile{--tc:var(--acc);--tg:linear-gradient(135deg,#6d5dfc,#22d3ee);position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:118px;min-width:0;border-radius:18px;border:1px solid var(--line);background:radial-gradient(130% 90% at 100% 0%,color-mix(in srgb,var(--tc) 13%,transparent),transparent 62%),var(--bg);cursor:pointer;font:inherit;color:inherit;overflow:hidden;transition:transform .16s,box-shadow .2s,border-color .2s}
.adm-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}
.adm-tile:active{transform:scale(.98)}
main.enter .adm-tile{animation:admIn .42s cubic-bezier(.2,.8,.2,1) both}
.adm-tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--tg);margin-bottom:6px;box-shadow:0 6px 16px color-mix(in srgb,var(--tc) 30%,transparent)}
.adm-tile .ic svg{width:19px;height:19px}
.adm-tile .n{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.adm-tile .l{font-weight:600;font-size:.86rem}
.adm-tile .s{font-size:.72rem;color:var(--fg3);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-tile.adm-alert{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.adm-tile .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:admPulse 1.6s infinite}
.adm-tile.adm-tone-red{--tc:#ef4444;--tg:linear-gradient(135deg,#ef4444,#f97316)}
.adm-tile.adm-tone-amber{--tc:#f59e0b;--tg:linear-gradient(135deg,#f59e0b,#facc15)}
.adm-tile.adm-tone-ink{--tc:#64748b;--tg:linear-gradient(135deg,#334155,#64748b)}
.adm-tile.adm-tone-green{--tc:#1db954;--tg:linear-gradient(135deg,#1db954,#22d3ee)}
.adm-tile.adm-tone-cyan{--tc:#06b6d4;--tg:linear-gradient(135deg,#0ea5e9,#22d3ee)}
.adm-tile.adm-tone-pink{--tc:#ec4899;--tg:linear-gradient(135deg,#ec4899,#8b5cf6)}
/* header SOS + nav dot */
.top .ib.adm-sosb{background:var(--bad);border-color:var(--bad);color:#fff;animation:admPulse 1.6s infinite}
.top .ib.adm-sosb svg{width:19px;height:19px}
.top .ib.adm-sosb .cnt{background:#fff;color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.adm-hasdot{position:relative}
.adm-nd{position:absolute;top:7px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--bad);animation:admPulse 1.6s infinite;font-style:normal}
.rail .adm-nd{position:static;margin-left:auto}
/* shared bits */
.adm-back{flex-shrink:0}
.adm-ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.adm-chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--bg2);color:var(--fg2);max-width:100%}
.adm-chip svg{width:13px;height:13px;flex-shrink:0}
.adm-chip>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-chip.adm-c-ok{background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live)}
.adm-chip.adm-c-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--fg))}
.adm-chip.adm-c-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.adm-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.adm-acts .btn{min-height:44px}
.adm-empty{text-align:center;padding:36px 18px}
.adm-empty .ei{width:64px;height:64px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:var(--bg2);color:var(--fg3)}
.adm-empty .ei svg{width:30px;height:30px}
.adm-empty b{display:block;font-size:1.02rem;margin-bottom:4px}
.adm-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.adm-mini>div{background:var(--bg2);border-radius:16px;padding:12px 10px;min-width:0}
.adm-mini b{display:block;font-family:var(--display);font-size:1.35rem;letter-spacing:-.02em;line-height:1.1}
.adm-mini span{font-size:.72rem;color:var(--fg3)}
.adm-mini .adm-c-bad b{color:var(--bad)}.adm-mini .adm-c-warn b{color:var(--warn)}.adm-mini .adm-c-ok b{color:var(--live)}
/* live room */
.adm-livewrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.adm-livewrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.adm-livewrap>.rmap{position:sticky;top:76px;aspect-ratio:4/3}}
.adm-car{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6d5dfc,#22d3ee);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,#6d5dfc 26%,transparent),0 6px 16px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-weight:700;font-size:.76rem;letter-spacing:.02em}
.adm-car.adm-stale{background:var(--warn);box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 30%,transparent),0 6px 16px rgba(0,0,0,.3)}
.adm-car.adm-late{background:linear-gradient(135deg,#f97316,#ef4444)}
.adm-trip{position:relative;overflow:hidden}
.adm-trip.adm-stale{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.adm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.adm-stats>div{background:var(--bg2);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.adm-stats b{display:block;font-family:var(--display);font-size:1.25rem;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.adm-stats span{font-size:.7rem;color:var(--fg3)}
.adm-stats .adm-on b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.adm-trip .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* safety */
.adm-sf{position:relative;overflow:hidden;--k:var(--info)}
.adm-sf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.adm-sf.adm-k-sos{--k:var(--bad)}.adm-sf.adm-k-ride{--k:var(--warn)}.adm-sf.adm-k-report{--k:var(--info)}
.adm-sf.adm-s-resolved{opacity:.78}
.adm-kic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k);flex-shrink:0}
.adm-kic svg{width:20px;height:20px}
.adm-sf.adm-k-sos.adm-s-open .adm-kic{background:var(--bad);color:#fff;animation:admPulse 1.6s infinite}
.adm-sf .txt{margin-top:10px;font-size:.92rem;overflow-wrap:anywhere}
.adm-sf .res{margin-top:10px;font-size:.84rem;background:var(--bg2);border-radius:12px;padding:8px 12px;overflow-wrap:anywhere}
.adm-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adm-meta span{font-size:.74rem;background:var(--bg2);border-radius:999px;padding:4px 10px;color:var(--fg2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-meta span b{color:var(--fg);font-weight:600}
.adm-quick{display:flex;flex-wrap:wrap;gap:6px}
.adm-quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:.8rem;cursor:pointer;min-height:38px}
.adm-quick button:hover{border-color:var(--ink)}
/* documents */
.adm-bks{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-bottom:14px}
.adm-bk{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:66px;font:inherit;color:inherit;transition:transform .12s,border-color .2s}
.adm-bk:active{transform:scale(.97)}
.adm-bk b{font-family:var(--display);font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.adm-bk span{font-size:.72rem;color:var(--fg3);white-space:nowrap}
.adm-bk.adm-c-bad b{color:var(--bad)}.adm-bk.adm-c-warn b{color:var(--warn)}.adm-bk.adm-c-info b{color:var(--info)}
.adm-bk.adm-on{border-color:var(--ink);background:var(--bg2);box-shadow:inset 0 0 0 1px var(--ink)}
.adm-docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.adm-doc{display:inline-flex;gap:6px;align-items:center;font-size:.76rem;padding:6px 10px;border-radius:10px;background:var(--bg2);max-width:100%}
.adm-doc b{font-weight:700}
.adm-doc.adm-c-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.adm-doc.adm-c-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:color-mix(in srgb,var(--warn) 78%,var(--fg))}
.adm-doc.adm-c-info{background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info)}
/* audit */
.adm-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.adm-tools input,.adm-tools select{flex:1;min-width:0;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:44px}
.adm-tools select{flex:0 1 190px}
.adm-arow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.adm-arow:last-child{border-bottom:0}
.adm-adot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--info)}
.adm-adot.adm-c-live{background:var(--live)}.adm-adot.adm-c-bad{background:var(--bad)}.adm-adot.adm-c-warn{background:var(--warn)}
.adm-arow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
/* status */
.adm-sum{display:flex;gap:16px;align-items:center}
.adm-sum .ring{width:76px;height:76px;flex-shrink:0}
.adm-st{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.adm-st:last-child{border-bottom:0}
.adm-sti{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-style:normal;font-weight:800;color:#fff;font-size:.9rem}
.adm-sti svg{width:16px;height:16px}
.adm-st.adm-c-ok .adm-sti{background:var(--live)}.adm-st.adm-c-warn .adm-sti{background:var(--warn)}.adm-st.adm-c-bad .adm-sti{background:var(--bad)}
.adm-st.adm-c-wait .adm-sti{background:var(--bg3);color:var(--fg3)}
.adm-st.adm-c-wait .adm-sti svg{animation:admSpin 1s linear infinite}
.adm-st .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px}
.adm-st .v{font-size:.82rem;font-weight:600;color:var(--fg2);overflow-wrap:anywhere}
.adm-st.adm-c-bad .v{color:var(--bad)}.adm-st.adm-c-ok .v{color:var(--live)}
.adm-st .fix{font-size:.78rem;color:var(--fg3);margin-top:2px;overflow-wrap:anywhere}
.adm-st .grow{flex:1;min-width:0}
/* funnel */
.adm-fun{display:grid;gap:10px;margin-top:10px}
.adm-fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.82rem;align-items:baseline}
.adm-fr .pc{font-size:.72rem;color:var(--fg3);margin-left:4px;font-weight:500}
.adm-fr .bar{grid-column:1/-1;height:10px;background:var(--bg3);border-radius:6px;overflow:hidden}
.adm-fr .bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.adm-fr.adm-fr-d .bar i{background:linear-gradient(120deg,#f59e0b,#ec4899)}
@media(prefers-reduced-motion:reduce){.adm-tile,.adm-tile .dot,.top .ib.adm-sosb,.adm-nd,.adm-sf.adm-k-sos.adm-s-open .adm-kic,.adm-st.adm-c-wait .adm-sti svg{animation:none!important}}
</style>
<script>
/* ===================== Round 10 · admin =====================
   Control grid on a-home (ADMIN_TILES, extensible), a-live, a-safety, a-docs, a-audit, a-status,
   growth funnel, audit wrappers for existing admin actions, open-SOS badge in the header. */
for(const c of COLS)if(!S.data[c])S.data[c]={};

const ADM_IC={
  radar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.5-6.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',
  siren:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18v-5a5 5 0 0 1 10 0v5"/><rect x="5" y="18" width="14" height="3" rx="1"/><path d="M12 2v2M4 6l1.5 1.5M20 6l-1.5 1.5M12 11v3"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>',
  funnel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16l13-8z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>'
};
function admIcon(i){return ADM_IC[i]||ICON[i]||(typeof i==='string'&&i.trim().startsWith('<svg')?i:ICON.list)}
function admId(id){return String(id??'').replace(/[^A-Za-z0-9_-]/g,'')}
function admAgo(ts){if(!ts)return 'never';const s=Math.max(0,Math.round((Date.now()-ts)/1000));if(s<45)return 'just now';const m=Math.round(s/60);if(m<60)return m+' min ago';const hr=Math.floor(m/60);if(hr<24)return hr+' h ago';return Math.floor(hr/24)+' d ago'}
function admDur(ms){const m=Math.max(0,Math.round(ms/60000));if(m<1)return 'under 1 min';if(m<60)return m+' min';const hr=Math.floor(m/60);if(hr<24)return hr+' h'+(m%60?' '+(m%60)+' min':'');return Math.floor(hr/24)+' d'}
function admFmtDate(d){if(!d||d==='none')return '';const t=new Date(d+'T00:00:00');return isNaN(t)?String(d):t.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'})}
function admTel(p){const n=(typeof normPhone==='function'&&normPhone(p||''))||String(p||'').replace(/[^\d+]/g,'');return n.length>=9?'tel:'+n:''}
function admWho(id){if(!id)return '';if(id==='admin')return 'Admin';return Store.get('users',id)?.name||Store.get('kids',id)?.name||'Unknown'}
function admBack(){return `<button class="btn sm ghost adm-back" onclick="go('a-home')">Back</button>`}
function admChat(id){S.adminApp=false;S.chatWith=admId(id);go('a-chat')}
function admEmpty(icon,title,text){return `<div class="card adm-empty"><div class="ei">${admIcon(icon)}</div><b>${h(title)}</b><p class="small muted">${h(text)}</p></div>`}
/* extra RPC names the System status page should find on the server (worker-only ones); other layers may push */
const ADMIN_RPC_EXPECT=['due_push','drop_push_sub','passkey_lookup'];
const ADM_SQL_FIX='Run supabase/setup.sql again (Supabase → SQL Editor → Run).';

/* ---------- 1. Live control room ---------- */
const ADM_STALE_MS=180000;
function admLiveTrips(){const now=Date.now();return Store.all('routes').filter(r=>r.live?.active&&now-(r.live.ts||0)<6*3600e3)}
function admLeftRunning(){const now=Date.now();return Store.all('routes').filter(r=>r.live?.active&&now-(r.live.ts||0)>=6*3600e3)}
function admTodayEvents(){const t=localKey();return Store.all('events').filter(e=>(e.type==='pickup'||e.type==='dropoff')&&e.ts&&localKey(new Date(e.ts))===t)}
function admOnboard(k,ev){const l=ev.filter(e=>e.kidId===k.id).sort((a,b)=>b.ts-a.ts)[0];return l?.type==='pickup'}
function admTripInfo(r,ev){ev=ev||admTodayEvents();const d=Store.get('users',r.driverId)||{};const v=r.vehicleId?Store.get('vehicles',r.vehicleId):null;
  const kids=activeBookings(b=>b.routeId===r.id).map(b=>Store.get('kids',b.kidId)).filter(Boolean);const re=ev.filter(e=>e.routeId===r.id);
  const live=r.live||{};const hasGps=!!(live.gps&&live.lat!=null&&live.lng!=null&&Number.isFinite(+live.lat)&&Number.isFinite(+live.lng));const age=live.ts?Date.now()-live.ts:null;
  const late=r.late&&r.late.day===localKey()?r.late:null;
  return {r,d,plate:r.plate||v?.plate||'',kids,total:kids.length,onboard:kids.filter(k=>admOnboard(k,ev)).length,
    picked:new Set(re.filter(e=>e.type==='pickup').map(e=>e.kidId)).size,dropped:new Set(re.filter(e=>e.type==='dropoff').map(e=>e.kidId)).size,
    live,hasGps,age,stale:!hasGps||age==null||age>ADM_STALE_MS,late}}
function admPing(t){const ts=t.live.ts||0;return t.hasGps?`<span class="adm-chip ${t.stale?'adm-c-warn':'adm-c-ok'}" data-adm-k="ping" data-adm-ts="${ts}">${ADM_IC.radar}<span>GPS ${admAgo(ts)}</span></span>`:`<span class="adm-chip adm-c-warn">${ADM_IC.radar}<span>Waiting for GPS</span></span>`}
function admTripCard(t){const r=t.r,d=t.d;const tel=admTel(d.phone);
  return `<div class="card adm-trip ${t.stale?'adm-stale':''}" id="lv-${admId(r.id)}"><div class="row between" style="flex-wrap:nowrap;gap:10px"><div class="row" style="flex-wrap:nowrap;min-width:0;gap:10px"><span class="avatar">${initials(d.name)}</span><div style="min-width:0"><b class="adm-ell">${h(d.name||'Driver')}</b><span class="tiny muted adm-ell">${h(r.name||'Route')}${t.plate?' · '+h(t.plate):''}</span></div></div><span class="pill ${t.stale?'warn':'live'}"><i class="blink" style="${t.stale?'background:var(--warn)':''}"></i>${t.stale?'Check':'Live'}</span></div>

function admRpcNames(){const s=new Set(ADMIN_RPC_EXPECT);document.querySelectorAll('script:not([src])').forEach(sc=>{for(const m of sc.textContent.matchAll(/\.rpc\(\s*['"]([a-z_][a-z0-9_]*)['"]/g))s.add(m[1])});return [...s].sort()}

function admTimeout(ms){return new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out')),ms))}
async function admRunChecks(){if(S.admSysBusy)return;S.admSysBusy=true;const R={at:Date.now()};
  try{const cloud=!!(S.cloud&&typeof sb!=='undefined'&&sb);
    if(cloud){const t0=performance.now();let err=null;try{const r=await Promise.race([sb.rpc('fetch_docs',{p_since:new Date().toISOString()}),admTimeout(8000)]);if(r?.error)err=r.error.message}catch(e){err=e.message}const ms=Math.round(performance.now()-t0);R.dbOk=!err;R.dbMs=ms;R.dbErr=err;
      const missing=[];let err2=null;
      const probe=async(n,a)=>{try{const r=await Promise.race([sb.rpc(n,a),admTimeout(8000)]);if(r?.error){if(admMissingErr(r.error))missing.push(n);else if(n!=='admin_sys_check')err2=err2||r.error.message;return r}return r}catch(e){err2=err2||e.message;return null}};
      await probe('public_config');await probe('handover_check',{p_kid:'x',p_code:''});
      const names=admRpcNames();const sc=await probe('admin_sys_check',{p_names:names});
      if(sc&&!sc.error&&sc.data){const fns=sc.data.fns||{};names.forEach(n=>{if(fns[n]===false)missing.push(n)});if(sc.data.audit===false)missing.push('audit log rules');R.skew=sc.data.now?Date.now()-Number(sc.data.now):null;R.docs=sc.data.docs}
      else if(sc?.error&&!admMissingErr(sc.error))err2=err2||sc.error.message;
      R.missing=[...new Set(missing)];R.sqlErr=err2}
    try{const ps=await navigator.permissions?.query({name:'notifications'});if(ps?.state)R.notif=ps.state==='prompt'?'default':ps.state}catch(e){}
    const ep=otpEndpoint();R.ep=ep;
    if(ep){try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),6000);const r=await fetch(ep+'/health',{signal:ac.signal,cache:'no-store'});clearTimeout(t);const j=await r.json().catch(()=>null);if(!r.ok||!j||typeof j!=='object')throw new Error('HTTP '+r.status);R.health=j}catch(e){R.health=null;R.workerErr=e.name==='AbortError'?'No answer in 6 s':e.message}}
  }catch(e){console.warn('status',e)}finally{S.admSys=R;S.admSysBusy=false;if(S.admin&&['a-status','a-home'].includes(S.route)&&!$('.overlay'))render()}}

  {route:'a-status',label:'System',icon:'pulse',tone:'green',count:()=>{const r=admStatusRows();const bad=r.filter(x=>x[2].st==='bad').length;return bad||r.filter(x=>x[2].st==='ok').length+'/'+r.length},alert:()=>admStatusRows().some(x=>x[2].st==='bad'),sub:()=>{const r=admStatusRows();const bad=r.filter(x=>x[2].st==='bad').length,warn=r.filter(x=>x[2].st==='warn').length;return bad?'to fix':r.some(x=>x[2].st==='wait')?'checking…':warn?warn+' amber':'checks pass'}}
];
function admTilesHtml(){return `<div class="adm-ctl"><div class="row between" style="margin-bottom:10px"><h3>${ADM_IC.radar.replace('<svg','<svg width="18" height="18"')} Control</h3><span class="tiny muted">live</span></div><div class="adm-grid">${ADMIN_TILES.map((t,i)=>{let c='',a=false,s='';try{c=typeof t.count==='function'?t.count():''}catch(e){c='—'}try{a=!!(typeof t.alert==='function'&&t.alert())}catch(e){}try{s=typeof t.sub==='function'?t.sub():''}catch(e){}const r=safeRoute(t.route);const tone=String(t.tone||'violet').replace(/[^a-z]/g,'');
  return `<button class="adm-tile adm-tone-${tone}${a?' adm-alert':''}" style="animation-delay:${i*45}ms" ${r?`onclick="S.adminApp=false;go('${r}')"`:'disabled'} aria-label="${h(t.label)}"><span class="ic">${admIcon(t.icon)}</span>${a?'<i class="dot"></i>':''}<span class="n">${h(c)}</span><span class="l">${h(t.label)}</span>${s?`<span class="s">${h(s)}</span>`:''}</button>`}).join('')}</div></div>`}

/* growth funnel from real data */
function admFunnel(){const us=Store.all('users').filter(u=>!u.demo);const P=us.filter(u=>u.role==='parent'),D=us.filter(u=>u.role==='driver');const m=monthKey();const bs=Store.all('bookings');
  const paid=new Set(Store.all('transactions').filter(t=>t.month===m&&(t.type==='subscription'||t.type==='trip')).map(t=>t.from));const spons=new Set(bs.filter(b=>(b.sponsoredMonths||[]).includes(m)).map(b=>b.parentId));
  const ev=Store.all('events').filter(e=>(e.type==='pickup'||e.type==='dropoff')&&e.ts&&monthKey(new Date(e.ts))===m);const rode=new Set(ev.map(e=>e.parentId).filter(Boolean));const drove=new Set(ev.map(e=>e.driverId).filter(Boolean));const booked=new Set(bs.map(b=>b.parentId));
  const act=new Set(activeBookings().map(b=>b.parentId));
  return {parents:[['Signed up',P.length],['ID verified',P.filter(u=>u.idStatus==='approved').length],['Booked',P.filter(u=>booked.has(u.id)).length],['Active this month',P.filter(u=>act.has(u.id)&&(paid.has(u.id)||spons.has(u.id)||rode.has(u.id))).length]],
    drivers:[['Signed up',D.length],['Verified',D.filter(isVerified).length],['Route listed',D.filter(u=>Store.all('routes').some(r=>r.driverId===u.id&&r.active!==false)).length],['Drove this month',D.filter(u=>drove.has(u.id)).length]]}}
function admFunnelHtml(){const F=admFunnel();const block=(title,rows,cls)=>{const top=Math.max(rows[0][1],1);return `<div><div class="eyebrow">${title}</div><div class="adm-fun">${rows.map(([l,n],i)=>`<div class="adm-fr ${cls}"><span>${l}</span><b>${n}${i?`<span class="pc">${Math.round(n/top*100)}%</span>`:''}</b><div class="bar"><i style="width:${Math.max(n?3:0,Math.round(n/top*100))}%"></i></div></div>`).join('')}</div></div>`};
  return `<div class="card adm-funnel" style="margin-top:14px"><div class="row between"><h3>Growth funnel</h3><span class="tiny muted">${new Date().toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}</span></div><div class="grid g2" style="margin-top:10px">${block('Parents',F.parents,'adm-fr-p')}${block('Drivers',F.drivers,'adm-fr-d')}</div></div>`}

/* a-home: Control grid on top, funnel before the charts */
const _admHome=VIEWS['a-home'];VIEWS['a-home']=()=>{let html=_admHome();if(!S.admin)return html;
  if(!S.admSysBusy&&(!S.admSys||Date.now()-S.admSys.at>600000||S.admSys.ep!==otpEndpoint()))setTimeout(admRunChecks,0);
  const i=html.indexOf('<div class="kpi">');const tiles=admTilesHtml();html=i>=0?html.slice(0,i)+tiles+html.slice(i):tiles+html;
  let fun='';try{fun=admFunnelHtml()}catch(e){}const k='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Revenue by month</h3>';const j=html.indexOf(k);return j>=0?html.slice(0,j)+fun+html.slice(j):html+fun};
/* Settings → Pages lists the new screens */
const _admMore=VIEWS['a-more'];VIEWS['a-more']=()=>{const html=_admMore();const k='<h3>Pages</h3><div class="list" style="margin-top:6px">';if(!html.includes(k))return html;
  return html.replace(k,k+[['a-live','Live control room'],['a-safety','Safety centre'],['a-docs','Document watch'],['a-audit','Audit log'],['a-status','System status']].map(([r,l])=>`<div class="item" style="cursor:pointer" onclick="go('${r}')"><div class="grow">${l}</div>›</div>`).join(''))};
/* old Reports page points to the Safety centre */
const _admReports=VIEWS['a-reports'];VIEWS['a-reports']=()=>{const html=_admReports();return S.admin?`<div class="notice" style="margin-bottom:14px;border-left-color:var(--info)">Track, mark seen and resolve in the <button class="btn sm ghost" style="margin-left:4px" onclick="go('a-safety')">Safety centre</button></div>`+html:html};

/* header: open-SOS badge, nav dot, sub-screens keep Overview highlighted, toast on new SOS */
function admSosToast(open){if(!S.admSosSeen){S.admSosSeen=new Set(open.map(e=>e.id));return}const fresh=open.filter(e=>!S.admSosSeen.has(e.id));fresh.forEach(e=>S.admSosSeen.add(e.id));if(fresh.some(e=>Date.now()-(e.ts||0)<30*60000)&&S.route!=='a-safety'){toast('🚨 New SOS. Open the Safety centre.');buzz([200,100,200])}}
function admDecorate(){if(!S.admin||!me())return;const open=admOpenSos();const n=open.length;const top=document.querySelector('#app .top');
  if(top&&n&&!top.querySelector('.adm-sosb')){const b=document.createElement('button');b.className='ib adm-sosb';b.title=n+' open SOS';b.setAttribute('aria-label',n+' open SOS');b.innerHTML=ADM_IC.siren+`<span class="cnt">${n}</span>`;b.onclick=()=>{S.adminApp=false;go('a-safety')};const bell=top.querySelector('.ib[title="Notifications"]');bell?top.insertBefore(b,bell):top.appendChild(b)}
  if(viewRole()==='admin'){const mine=['a-live','a-safety','a-docs','a-audit','a-status'].includes(S.route);document.querySelectorAll('#app .tabs button,#app .rail button').forEach(btn=>{if(!(btn.getAttribute('onclick')||'').includes("'a-home'"))return;if(mine)btn.classList.add('on');if(n){btn.classList.add('adm-hasdot');if(!btn.querySelector('.adm-nd'))btn.insertAdjacentHTML('beforeend','<i class="adm-nd" aria-hidden="true"></i>')}})}
  admSosToast(open)}
const _admRender=render;render=function(){_admRender.apply(this,arguments);try{admDecorate()}catch(e){console.warn('admin decorate',e)}};
/* live timers tick without a full redraw */
setInterval(()=>{if(document.hidden||!S.admin)return;const now=Date.now();document.querySelectorAll('[data-adm-k]').forEach(el=>{const ts=+el.dataset.admTs;if(!ts)return;const k=el.dataset.admK;
  if(k==='ago')el.textContent=admAgo(ts);else if(k==='wait'){const s=el.querySelector('span');if(s)s.textContent='Waiting '+admDur(now-ts)}else if(k==='ping'){const s=el.querySelector('span');if(s)s.textContent='GPS '+admAgo(ts);const st=now-ts>ADM_STALE_MS;el.classList.toggle('adm-c-warn',st);el.classList.toggle('adm-c-ok',!st);el.closest('.adm-trip')?.classList.toggle('adm-stale',st)}})},5000);
</script>
