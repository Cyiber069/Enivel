<style>
/* ===== 09 Nov owner video: after tapping Log in / Create account, the button turns into a little road with
   a school minibus driving on it (dashes rushing past, speed lines), then the app fades in. ===== */
.btn.ld-on{position:relative;overflow:hidden;pointer-events:none;color:transparent!important}
.btn.ld-on>*:not(.ld-road){visibility:hidden}
.ld-road{position:absolute;inset:0;display:block;color:var(--ink-fg,#fff)}
.ld-road::before{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;margin-top:10px;border-radius:2px;opacity:.55;
  background:repeating-linear-gradient(90deg,currentColor 0 14px,transparent 14px 26px);background-size:26px 2px;animation:ldDash .45s linear infinite}
.ld-car{position:absolute;left:50%;top:50%;width:54px;height:28px;margin:-17px 0 0 -27px;animation:ldBob .32s ease-in-out infinite alternate,ldSway 1.6s ease-in-out infinite}
.btn .ld-car svg{width:100%!important;height:100%!important;display:block;margin:0!important;flex:none}
.ld-speed{position:absolute;right:100%;top:7px;width:22px;height:14px;margin-right:2px;opacity:.7;
  background:linear-gradient(currentColor,currentColor) 0 2px/14px 2px no-repeat,linear-gradient(currentColor,currentColor) 6px 7px/16px 2px no-repeat,linear-gradient(currentColor,currentColor) 2px 12px/10px 2px no-repeat;
  border-radius:2px;animation:ldSpeed .3s linear infinite}
.btn.ld-done .ld-car{animation:ldGo .45s cubic-bezier(.5,0,.9,.4) forwards}
.btn.ld-done .ld-road::before{animation-duration:.2s}
@keyframes ldDash{from{background-position:0 0}to{background-position:-26px 0}}
@keyframes ldBob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes ldSway{0%,100%{margin-left:-36px}50%{margin-left:-18px}}
@keyframes ldSpeed{0%{opacity:.25;transform:translateX(3px)}50%{opacity:.8}100%{opacity:.25;transform:translateX(-3px)}}
@keyframes ldGo{to{margin-left:60%;opacity:0}}
.ld-enter{animation:ldEnter .45s ease-out}
@keyframes ldEnter{from{opacity:0;filter:blur(6px);transform:scale(.985)}to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion:reduce){.ld-road::before,.ld-car,.ld-speed{animation:none}.ld-enter{animation:none}.btn.ld-done .ld-car{animation:none}}
</style>
<script>
const LD_BUS='<svg viewBox="0 0 46 24" fill="none" aria-hidden="true"><path d="M4 18V7.5C4 5.6 5.6 4 7.5 4H33c2 0 3.7 1.2 4.4 3l3.4 7.4c.3.7.5 1.4.5 2.2V18c0 .8-.7 1.5-1.5 1.5H5.5C4.7 19.5 4 18.8 4 18Z" fill="currentColor"/><path d="M8 7.5h6v5H8zM16.5 7.5h6v5h-6zM25 7.5h6v5h-6zM33.3 7.5h1.4c.7 0 1.3.4 1.6 1l1.7 3.5h-4.7z" fill="#7c3aed" opacity=".85"/><rect x="4" y="14" width="37" height="1.6" fill="#f5b400"/><circle cx="12" cy="19.5" r="3.6" fill="#111"/><circle cx="12" cy="19.5" r="1.4" fill="#bbb"/><circle cx="33" cy="19.5" r="3.6" fill="#111"/><circle cx="33" cy="19.5" r="1.4" fill="#bbb"/><rect x="39.5" y="15" width="2" height="1.6" rx=".8" fill="#ffd54d"/></svg>';
let LD_FORM=null;
document.addEventListener('submit',e=>{LD_FORM=e.target},true);
function ldButton(){const f=LD_FORM&&LD_FORM.isConnected?LD_FORM:null;const b=f&&(f.querySelector('button[type=submit]')||[...f.querySelectorAll('button.btn')].find(x=>x.type!=='button'));return b||null}
function ldStart(){const b=ldButton();if(!b||b.classList.contains('ld-on'))return null;b.classList.add('ld-on');b.setAttribute('aria-busy','true');b.dataset.ldLabel=b.textContent;
  const r=document.createElement('span');r.className='ld-road';r.innerHTML=`<span class="ld-car"><span class="ld-speed"></span>${LD_BUS}</span>`;b.appendChild(r);return {b,t0:Date.now()}}
function ldStop(st,ok){if(!st)return;const {b}=st;if(ok&&b.isConnected){b.classList.add('ld-done');setTimeout(()=>ldClear(b),500)}else ldClear(b)}
function ldClear(b){if(!b)return;b.classList.remove('ld-on','ld-done');b.removeAttribute('aria-busy');b.querySelector('.ld-road')?.remove()}
function ldEnter(){const a=document.getElementById('app')||document.querySelector('main');if(!a)return;a.classList.remove('ld-enter');void a.offsetWidth;a.classList.add('ld-enter');setTimeout(()=>a.classList.remove('ld-enter'),600)}
function ldWrap(fn){return async function(){const st=ldStart();const before=typeof me==='function'?me()?.id:null;let res;try{res=await fn.apply(this,arguments)}finally{
  const ok=typeof me==='function'&&!!me()&&me().id!==before;
  ldStop(st,ok);if(ok)ldEnter();LD_FORM=null}return res}}
if(typeof login==='function')login=ldWrap(login);
if(typeof register==='function')register=ldWrap(register);
</script>
