<style>
/* ===================== Round 10 extras: smart match, calendar, forecast, seats, lost & found, help, text size ===================== */
/* text size (per device) */
html[data-ts="l"]{font-size:112.5%}
html[data-ts="xl"]{font-size:125%}
html[data-ts="l"] body{font-size:16.9px}
html[data-ts="xl"] body{font-size:18.75px}
@media (max-width:700px){html[data-ts="l"] :is(input,select,textarea){font-size:18px!important}html[data-ts="xl"] :is(input,select,textarea){font-size:20px!important}}
html[data-ts] .btn{white-space:normal;text-align:center}
html[data-ts] .pill{white-space:normal}
html[data-ts] .tabs button{font-size:.62rem}
i[data-exrid]{display:none!important}
@keyframes exPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes exUp{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes exShine{to{background-position:-200% 0}}
@keyframes exRing{from{stroke-dashoffset:var(--full)}}
.ex-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--grad);box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 28%,transparent)}
.ex-ic svg{width:20px;height:20px}
.ex-ic.warm{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 6px 16px rgba(245,158,11,.28)}
.ex-ic.cool{background:linear-gradient(135deg,#22d3ee,#0ea5e9);box-shadow:0 6px 16px rgba(14,165,233,.28)}
.ex-ic.green{background:linear-gradient(135deg,#34d399,#1db954);box-shadow:0 6px 16px rgba(29,185,84,.28)}
/* 1. smart match */
.ex-kids{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex-kids .kidchip{min-height:44px}
.ex-hint{margin-top:12px;font-size:.8rem;color:var(--fg2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card.ex-top{border:1.5px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 16%,transparent)}
.ex-best{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px;font-size:.8rem;font-weight:600;color:var(--fg2)}
.ex-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;color:#fff;font-weight:800;font-size:.74rem;background:linear-gradient(100deg,#6d5dfc 0%,#22d3ee 50%,#6d5dfc 100%);background-size:200% 100%;animation:exPop .45s cubic-bezier(.2,.8,.2,1) both,exShine 5s linear infinite;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent);white-space:nowrap}
.ex-badge svg{width:13px;height:13px}
.ex-why{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ex-why span{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--acc) 9%,var(--bg2));color:var(--fg2)}
.ex-why svg{width:12px;height:12px}
.ex-strip{display:inline-flex;flex-wrap:wrap;gap:2px;max-width:150px;align-items:center;vertical-align:middle}
.ex-strip i{width:8px;height:10px;border-radius:3px 3px 2px 2px;background:var(--bg3);border:1px solid var(--line)}
.ex-strip i.t{background:var(--acc);border-color:transparent}
/* 2. calendar */
.ex-calsum{display:flex;gap:28px;margin-top:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc2) 12%,var(--bg2)),var(--bg2))}
.ex-day{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.ex-day:last-child{border-bottom:0}
.ex-day .d{width:44px;text-align:center;font-weight:800;line-height:1.05;flex-shrink:0;font-family:var(--display);font-size:1.15rem}
.ex-day .d small{display:block;font-weight:600;font-size:.66rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em}
.ex-day .grow{min-width:0;flex:1}
/* 3. earnings forecast */
.ex-earn{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px}
.ex-ring{width:104px;height:104px;flex-shrink:0}
.ex-ring circle.a{animation:exRing 1.1s cubic-bezier(.2,.8,.2,1) both}
.ex-earn .grow{flex:1;min-width:160px}
.ex-kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:8px}
.ex-kv span{color:var(--fg3)}
.ex-kv .tot{font-weight:800;color:var(--fg);border-top:1px solid var(--line);padding-top:5px}
.ex-tip{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--live) 10%,var(--bg2));font-size:.85rem}
.ex-tip>svg{width:20px;height:20px;color:var(--live);flex-shrink:0}
.ex-tip.goal{background:color-mix(in srgb,var(--acc) 10%,var(--bg2))}.ex-tip.goal>svg{color:var(--acc)}
/* 4. seat map */
.ex-van{position:relative;margin:14px auto 6px;max-width:300px;padding:36px 14px 16px;border-radius:46px 46px 22px 22px;background:var(--bg2);border:2px solid var(--line)}
.ex-van::before{content:"";position:absolute;left:16%;right:16%;top:10px;height:12px;border-radius:10px 10px 4px 4px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc2) 45%,var(--bg3)),color-mix(in srgb,var(--acc) 35%,var(--bg3)))}
.ex-van .ex-r{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:8px;margin-top:8px}
.ex-van .ex-r:first-child{margin-top:0;padding-bottom:10px;border-bottom:1px dashed var(--s4,var(--line))}
.ex-seat{min-height:48px;min-width:0;border-radius:14px 14px 9px 9px;border:1.5px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;font-size:.68rem;font-weight:700;color:var(--fg3);padding:3px 2px;position:relative;overflow:hidden;transition:transform .15s}
button.ex-seat{cursor:pointer}button.ex-seat:active{transform:scale(.94)}
.ex-seat b{font-size:.74rem;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.ex-seat.t{background:color-mix(in srgb,var(--acc) 14%,var(--bg));border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc)}
.ex-seat.me{background:var(--grad);border-color:transparent;color:#fff;animation:exPop .4s ease both}.ex-seat.me b{color:#fff}
.ex-seat.drv{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}.ex-seat.drv svg{width:22px;height:22px}
.ex-seat.sel{outline:3px solid var(--acc);outline-offset:2px}
.ex-sp{min-height:48px}
.ex-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.74rem;color:var(--fg3);margin-top:8px}
.ex-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--bg);border:1px solid var(--line)}
.ex-legend i.t{background:var(--acc);border-color:transparent}.ex-legend i.me{background:var(--grad);border-color:transparent}
.ex-pick{margin-top:12px;padding:12px;border-radius:16px;background:var(--bg2);animation:exUp .25s ease both}
.ex-who{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ex-who .kidchip{min-height:44px}
/* 5. lost & found */
.ex-lf{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ex-lf:first-child{padding-top:0}.ex-lf:last-child{border-bottom:0;padding-bottom:0}
.ex-lf .ph{width:64px;height:64px;border-radius:14px;flex-shrink:0;cursor:zoom-in;border:1px solid var(--line);padding:0;background:var(--bg2);overflow:hidden}
.ex-lf .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ex-lf .noph{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;background:color-mix(in srgb,var(--acc3) 14%,var(--bg2));color:var(--acc3)}
.ex-lf .noph svg{width:26px;height:26px}
.ex-lf .grow{min-width:0;flex:1}
.ex-lf .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* 6. help centre */
.ex-hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,var(--bg)),color-mix(in srgb,var(--acc2) 14%,var(--bg)));border:1px solid var(--line)}
.ex-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc3) 30%,transparent),transparent 70%);pointer-events:none}
.ex-hero h2{margin-bottom:4px;position:relative}
.ex-hero p{position:relative}
.ex-hero .searchbar{background:var(--bg);box-shadow:var(--shadow);margin-top:14px;position:relative;z-index:1;min-height:48px}
.ex-hero .searchbar input{font-size:16px}
.ex-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.ex-cats::-webkit-scrollbar{display:none}
.ex-cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.82rem;cursor:pointer;min-height:44px;color:var(--fg2)}
.ex-cats button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.ex-faq details{border-bottom:1px solid var(--line)}
.ex-faq details.last{border-bottom:0}
.ex-faq summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 0;min-height:52px;font-weight:700}
.ex-faq summary::-webkit-details-marker{display:none}
.ex-faq summary .q{flex:1;min-width:0}
.ex-faq summary .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--acc)}
.ex-faq summary .dot.safe{background:var(--live)}.ex-faq summary .dot.money{background:var(--acc3)}.ex-faq summary .dot.ride{background:var(--acc2)}.ex-faq summary .dot.acct{background:var(--fg3)}
.ex-faq summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--fg3);border-bottom:2px solid var(--fg3);transform:rotate(45deg);transition:transform .2s;flex-shrink:0;margin:0 6px 5px 0}
.ex-faq details[open] summary::after{transform:rotate(225deg);margin:5px 6px 0 0}
.ex-faq .a{padding:0 0 14px 20px;color:var(--fg2);font-size:.92rem;animation:exUp .2s ease both}
.ex-faq .a .btn{margin-top:10px}
/* 7. text size */
.ex-ts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ex-ts button{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);min-height:64px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.ex-ts button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--bg));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.ex-ts b{font-family:var(--display);line-height:1}
.ex-ts span{font-size:.7rem;color:var(--fg3);text-align:center;line-height:1.2}
@media(prefers-reduced-motion:reduce){.ex-badge,.ex-seat.me,.ex-pick,.ex-faq .a,.ex-ring circle.a{animation:none}}
</style>
<script>
/* ===================== Round 10 extras (daily-use) =====================
   Data written here:
   - users.earnGoal (number, rand per month)            · driver monthly goal
   - routes.seatMap {"<seat number>": kidId}            · driver seat assignment (parents only see counts + their own child's seat)
   - routes.areaGeo {lat,lng,label} (+ routes.schoolGeo) · saved when the driver picks a suggestion in the route form
   - messages.lost {kind:'lost'|'found'|'reply', item, kidId, bookingId, photo, day, note, ref, status}
   Views: 'help-centre', 'lost-found'. Per-device setting: localStorage 'enivel_textsize' = 'n'|'l'|'xl'. */
const EX_IC={
cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg>',
help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9M12 17.2h.01"/></svg>',
bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M9 8V6a3 3 0 0 1 6 0v2M9 13h6"/></svg>',
seat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h6a2 2 0 0 1 2 2v7H7z"/><path d="M5 13h12a2 2 0 0 1 2 2v2H5zM7 17v3M17 17v3"/></svg>',
target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>',
spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
wheel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3.5 10.5h6.6M13.9 10.5h6.6M12 14v7"/></svg>',
dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>'};
function exRole(){return typeof viewRole==='function'?viewRole():me()?.role}
function exHome(){const r=exRole();return r==='driver'?'d-more':r==='admin'?'a-more':'p-more'}
function exKm(m){return m<1000?Math.max(50,Math.round(m/50)*50)+' m':(m/1000).toFixed(m<10000?1:0)+' km'}
function exNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function exR2(n){return Math.round((Number(n)||0)*100)/100}
function exNowHm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
async function exDownload(filename,text,type){
  if(typeof claude!=='undefined'&&claude&&claude.use&&!S.cloud){try{const dl=await claude.use('downloads');if(dl&&dl.save){await dl.save({filename,data:text});return 'saved'}}catch(e){}}
  try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);return 'download'}catch(e){return null}}

/* ---------- 7. text size: Normal / Large / Extra large, saved on this device ---------- */
const EX_TS=[['n','Normal',15],['l','Large',18],['xl','Extra large',21]];
function exTextSize(){const t=ls.get('enivel_textsize');return t==='l'||t==='xl'?t:'n'}
function exApplyTextSize(t){const el=document.documentElement;if(t==='l'||t==='xl')el.setAttribute('data-ts',t);else el.removeAttribute('data-ts')}
function exSetTextSize(t){if(!EX_TS.some(x=>x[0]===t))return;ls.set('enivel_textsize',t);exApplyTextSize(t);buzz();render();toast(t==='n'?'Normal text size':t==='l'?'Large text on':'Extra large text on')}
exApplyTextSize(exTextSize());
function exTextBlock(){const cur=exTextSize();return `<div class="ex-tsw"><div class="eyebrow" style="margin-top:14px">Text size</div><div class="ex-ts" role="radiogroup" aria-label="Text size">${EX_TS.map(([k,l,px])=>`<button type="button" role="radio" aria-checked="${cur===k}" class="${cur===k?'on':''}" data-ts="${k}" onclick="exSetTextSize('${k}')"><b style="font-size:${px}px">Aa</b><span>${l}</span></button>`).join('')}</div></div>`}

/* ---------- 1. smart match on Find ---------- */
function exMatchKid(){const u=me();const id=S.exMatchKid||S.findKid;const k=id&&Store.get('kids',id);return k&&u&&k.parentId===u.id?k:null}
function exSameSchool(r,k){const ks=exNorm(k?.school);if(ks){const parts=String(r.schools||'').split(/[,;\/&]+/).map(exNorm).filter(Boolean);if(parts.some(p=>p===ks||(Math.min(p.length,ks.length)>=6&&(p.includes(ks)||ks.includes(p)))))return true}const a=k?.schoolGeo,b=r.schoolGeo;return !!(a&&b&&isFinite(a.lat)&&isFinite(b.lat)&&distM(a,b)<=300)}
function exMatchFacts(r,k){const f={open:(+r.seats||0)-routeSeatsUsed(r.id),price:+r.price||0,sameSchool:exSameSchool(r,k)};
  const area=r.areaGeo||r.pickupGeo;if(k?.geo&&isFinite(k.geo.lat)&&area&&isFinite(area.lat))f.dist=distM(k.geo,area);
  if(f.dist==null&&k){const sub=exNorm(k.pickupAddr?.suburb||k.pickupAddr?.neighbourhood||'');const pick=' '+exNorm(k.pickup)+' ';const hit=String(r.area||'').split(/[,;\/&]+/).map(x=>x.trim()).filter(Boolean).find(a=>{const n=exNorm(a);return n.length>=4&&((sub&&sub===n)||pick.includes(' '+n+' '))});if(hit)f.serves=hit}
  f.nR=Store.all('ratings').filter(x=>x.driverId===r.driverId).length;f.rating=f.nR?driverRating(r.driverId):0;f.onTime=onTimeScore(r.driverId);return f}
function exMatchKey(f){return [f.open>0?0:1,f.sameSchool?0:1,f.dist!=null?(f.dist<=2000?0:f.dist<=5000?1:f.dist<=10000?2:3):(f.serves?1:3),-(f.nR?f.rating:0),-(f.onTime==null?-1:f.onTime),f.price]}
function exCmp(a,b){for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1}return 0}
function exReasons(f){const out=[];if(f.sameSchool)out.push(['school','Same school']);if(f.dist!=null)out.push(['pin',exKm(f.dist)+' from home']);else if(f.serves)out.push(['pin','Serves '+f.serves]);if(f.nR)out.push(['star',f.rating.toFixed(1)+'★']);if(f.onTime!=null)out.push(['check',f.onTime+'% on time']);if(f.open>0)out.push(['users',f.open+(f.open===1?' seat':' seats')+' left']);return out}
function exIsGood(f){return f.open>0&&(f.sameSchool||(f.dist!=null&&f.dist<=5000)||!!f.serves||f.nR>0||f.onTime!=null)}
function exMatchCard(kids){const k=exMatchKid();const miss=k&&(!k.geo||!k.school);
  return `<div class="card ex-match" data-mount="exFind"><div class="row" style="gap:12px;flex-wrap:nowrap"><span class="ex-ic">${EX_IC.spark}</span><div style="min-width:0"><b>Smart match</b><div class="tiny muted">${k?`Best routes for ${h(k.name)} first`:'Pick a child to rank routes by fit'}</div></div></div>
  <div class="ex-kids">${kids.map(x=>`<button type="button" class="kidchip ${k&&k.id===x.id?'on':''}" data-exkid="${h(x.id)}" aria-pressed="${!!(k&&k.id===x.id)}"><span class="avatar">${initials(x.name)}</span>${h(x.name)}</button>`).join('')}${k?`<button type="button" class="btn sm ghost" data-exkid="">Clear</button>`:''}</div>
  ${miss?`<div class="ex-hint"><span>${!k.geo&&!k.school?`Add ${h(k.name)}'s school and pickup pin for better matches.`:!k.geo?`Pin ${h(k.name)}'s pickup address to see distances.`:`Add ${h(k.name)}'s school to find same-school routes.`}</span><button type="button" class="btn sm ghost" data-exedit="${h(k.id)}">Edit ${h(k.name)}</button></div>`:''}</div>`}
MOUNT.exFind=el=>{
  el.querySelectorAll('[data-exkid]').forEach(b=>b.onclick=()=>{const id=b.dataset.exkid;buzz();const cur=exMatchKid();if(!id||(cur&&cur.id===id)){S.exMatchKid=null;S.findKid=null;if(S.filters.sort==='match')S.filters.sort=''}else{const k=Store.get('kids',id);S.exMatchKid=id;S.findKid=k&&!bookingOf(k)?id:null;if(!S.filters.sort)S.filters.sort='match'}render()});
  el.querySelectorAll('[data-exedit]').forEach(b=>b.onclick=()=>addKid(b.dataset.exedit));
  const k=exMatchKid();if(!k)return;
  const items=[...document.querySelectorAll('main i[data-exrid]')].map((m,i)=>({m,i,card:m.nextElementSibling,r:routeOf(m.dataset.exrid)})).filter(x=>x.card&&x.r&&x.card.classList.contains('card'));if(!items.length)return;
  items.forEach(x=>x.f=exMatchFacts(x.r,k));
  const ranked=[...items].sort((a,b)=>exCmp(exMatchKey(a.f),exMatchKey(b.f))||a.i-b.i);
  const prices=items.map(x=>x.f.price).filter(p=>p>0);const minP=prices.length?Math.min(...prices):0;const cheapest=items.filter(x=>x.f.price===minP).length<items.length;
  const parent=items[0].m.parentNode;
  if(!['price','rating'].includes(S.filters.sort)&&items.every(x=>x.m.parentNode===parent&&x.card.parentNode===parent))ranked.forEach(x=>{parent.appendChild(x.m);parent.appendChild(x.card)});
  ranked.forEach((x,i)=>{const rs=exReasons(x.f);if(cheapest&&x.f.price===minP)rs.push(['money','Lowest price']);x.card.dataset.exrank=i+1;

function exHm(s){return /^\d{1,2}:\d{2}$/.test(s||'')?String(s).padStart(5,'0'):null}

        if(b.once){if(b.status==='trip'&&b.date===day.key&&exHm(b.time)){const t=exHm(b.time);out.push({uid:`b-${b.id}-${day.key}-once`,day:day.key,start:t,end:exAddMin(t,45),title:`${k.name}: once-off trip`,where:b.from||'',note:`To ${b.to||''} · ${drv?.name||'Driver'}`})}continue}

function exLostAll(){const u=me();if(!u)return [];return Store.all('messages').filter(m=>m&&m.lost&&typeof m.lost==='object'&&(m.from===u.id||m.to===u.id))}

function exLostStatus(rep){const rs=exLostAll().filter(m=>m.lost.kind==='reply'&&m.lost.ref===rep.id&&(m.from===rep.from||m.from===rep.to)).sort((a,b)=>a.ts-b.ts);return rs.length?rs[rs.length-1].lost.status:null}
function exLostChoices(role){const u=me();const now=Date.now();const out=[];const seen=new Set();
  for(const b of Store.all('bookings').filter(b=>(role==='driver'?b.driverId===u.id:b.parentId===u.id)&&(b.status==='active'||(b.once&&['trip','done'].includes(b.status)&&now-(b.startedAt||0)<30*864e5)))){const k=Store.get('kids',b.kidId);const other=role==='driver'?b.parentId:b.driverId;if(!k||!other)continue;const key=k.id+'|'+other;if(seen.has(key))continue;seen.add(key);out.push({b,k,other})}return out}

  modal(`<div class="row" style="gap:12px;flex-wrap:nowrap"><span class="ex-ic warm">${EX_IC.bag}</span><div style="min-width:0"><h3>${title}</h3><p class="tiny muted">${found?'The parent gets a message and an alert.':'Your driver gets a message and an alert.'}</p></div></div>
  <div class="ex-who" id="ex-lw">${ch.map((c,i)=>`<button type="button" class="kidchip ${i===sel?'on':''}" data-i="${i}"><span class="avatar">${initials(c.k.name)}</span>${h(c.k.name)} <span class="tiny muted">· ${h(String(userName(c.other)).split(' ')[0])}</span></button>`).join('')}</div>
  <div class="stack"><div class="field"><label for="ex-li">${found?'What did you find?':'What was left behind?'}</label><input id="ex-li" maxlength="80" autocomplete="off" placeholder="${found?'e.g. Green school jersey':'e.g. Blue lunchbox'}"></div>

  ${photoBox('ex-lp','Add a photo (optional)')}
  <button class="btn wide" id="ex-lgo">${found?'Tell the parent':'Tell my driver'}</button></div>`,m=>{bindPhotos(m);
    m.querySelectorAll('#ex-lw .kidchip').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;m.querySelectorAll('#ex-lw .kidchip').forEach(x=>x.classList.toggle('on',x===b))});

      const extra=found?val(m,'ex-ln').trim().slice(0,120):val(m,'ex-ld');const when=!found&&extra&&extra!==localKey()?' on '+new Date(extra+'T12:00:00').toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'}):'';

  await Store.put('messages',uid(),{from:u.id,to:other,text:t+(k?` (${k.name})`:'')+'.',ts:Date.now(),read:false,lost:{kind:'reply',ref:id,status}});await notify(other,`${u.name}: ${t}`,'info','lost-found');buzz();toast('Sent')}
function exLostRow(m){const u=me();const L=m.lost||{};const mine=m.from===u.id;const other=mine?m.to:m.from;const k=Store.get('kids',L.kidId);const st=exLostStatus(m);const isLost=L.kind==='lost';

function exChatEnivel(){const u=me();if(!u)return;if(S.admin&&!S.adminApp)return toast('You are signed in as Enivel');const a=Store.all('users').find(x=>x.role==='admin'&&!x.banned&&x.id!==u.id);if(a){buzz();return openChat(a.id)}const em=Store.get('settings','legal')?.email;
  modal(`<h3>Chat isn't set up yet</h3><p class="muted small" style="margin:8px 0 14px">Enivel support isn't available in the app yet.${em?` Email <b>${h(em)}</b>.`:''}</p><button class="btn wide" onclick="closeModal()">OK</button>`)}
function exHelpFilter(){const words=exNorm(S.exHelpQ||'').split(' ').filter(Boolean);const cat=S.exHelpCat||'all';let n=0,first=null,last=null;
  document.querySelectorAll('.ex-faq details').forEach(d=>{const ok=(cat==='all'||d.dataset.c===cat)&&words.every(w=>d.dataset.t.includes(w));d.hidden=!ok;d.classList.remove('last');if(ok){n++;first=first||d;last=d}});
  if(last)last.classList.add('last');if(words.length&&first)first.open=true;const c=$('#ex-hn');if(c)c.textContent=n+' answer'+(n===1?'':'s');const z=$('#ex-h0');if(z)z.hidden=n>0}
VIEWS['help-centre']=()=>{const u=me();if(!u)return VIEWS.landing();const list=exFaqFor(exRole());const cat=S.exHelpCat||'all';
  return `<div class="stack" style="gap:16px">${pageHead('Help centre','',`<button class="btn sm ghost" onclick="go('${exHome()}')">Back</button>`)}
  <div class="ex-hero"><h2>How can we help?</h2><p class="small muted">${list.length} answers for ${exRole()==='driver'?'drivers':exRole()==='admin'?'everyone':'parents'}.</p><div class="searchbar">${ICON.search}<input id="ex-hq" type="search" enterkeyhint="search" placeholder="Search fees, handover, cancel…" value="${h(S.exHelpQ||'')}" autocomplete="off" aria-label="Search help"></div></div>
  <div class="ex-cats" role="group" aria-label="Topics">${EX_CATS.map(([k,l])=>`<button type="button" data-excat="${k}" class="${cat===k?'on':''}" aria-pressed="${cat===k}">${l}</button>`).join('')}</div>
  <div class="card ex-faq" data-mount="exHelp"><div class="tiny muted" id="ex-hn" aria-live="polite"></div>${list.map(f=>`<details data-c="${f.c}" data-t="${h(exNorm(f.q+' '+f.a+' '+(f.k||'')))}"><summary><i class="dot ${f.c}"></i><span class="q">${h(f.q)}</span></summary><div class="a">${h(f.a)}${f.act?`<div><button type="button" class="btn sm ghost" onclick="${f.act[0]}">${h(f.act[1])}</button></div>`:''}</div></details>`).join('')}<div class="empty" id="ex-h0" hidden>${ICON.search}<p>No answer found. Ask us below.</p></div></div>
  <div class="card ink"><div class="row between" style="gap:12px"><div style="min-width:0"><h3>Still stuck?</h3><p class="small" style="opacity:.75;margin-top:4px">The Enivel team answers in your chats.</p></div><button class="btn" id="ex-chat" style="background:var(--ink-fg);color:var(--ink);border-color:var(--ink-fg)" onclick="exChatEnivel()">${ICON.chat} Chat to Enivel</button></div></div></div>`};
MOUNT.exHelp=el=>{const q=$('#ex-hq');if(q)q.oninput=()=>{S.exHelpQ=q.value;exHelpFilter()};document.querySelectorAll('[data-excat]').forEach(b=>b.onclick=()=>{S.exHelpCat=b.dataset.excat;document.querySelectorAll('[data-excat]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});buzz(8);exHelpFilter()});exHelpFilter()};

/* ---------- where the extras appear ---------- */
function exSettingsItems(){return [["go('help-centre')",'Help centre'],["go('lost-found')",'Lost &amp; found'],['exCalModal()','Rides in my calendar']].map(([f,l])=>`<div class="item ex-item" style="cursor:pointer" onclick="${f}"><div class="grow">${l}</div>›</div>`).join('')}
function exSettings(html,withItems){let out=html;let done=false;const ap=out.indexOf('<h3>Appearance</h3>');
  if(ap>=0){const j=out.indexOf('</div></div>',ap);if(j>=0){out=out.slice(0,j+6)+exTextBlock()+out.slice(j+6);done=true}}
  if(withItems){const mk=`<div class="item" style="cursor:pointer" onclick="go('notifs')">`;const i=out.indexOf(mk);if(i>=0)out=out.slice(0,i)+exSettingsItems()+out.slice(i);else out+=`<div class="card" style="margin-top:14px"><h3>Help &amp; extras</h3><div class="list" style="margin-top:6px">${exSettingsItems()}</div></div>`}
  if(!done)out+=`<div class="card" style="margin-top:14px"><h3>Text size</h3>${exTextBlock()}</div>`;return out}
for(const r of ['p-more','d-more']){const f=VIEWS[r];VIEWS[r]=()=>{const html=f();try{return exSettings(html,true)}catch(e){console.warn('extras settings',e);return html}}}
const _exAMore=VIEWS['a-more'];VIEWS['a-more']=()=>{const html=_exAMore();try{return exSettings(html,false)}catch(e){return html}};
const _exDRoutes=VIEWS['d-routes'];VIEWS['d-routes']=()=>{let html=_exDRoutes();try{for(const r of myRoutes()){const bs=activeBookings(b=>b.routeId===r.id&&!b.once).length;html=html.replace(`onclick="addRoute('${r.id}')">Edit</button>`,`onclick="addRoute('${r.id}')">Edit</button><button class="btn sm ghost" onclick="exSeatModal('${r.id}')">${EX_IC.seat} Seats${bs?` ${exSeatCount(r)}/${bs}`:''}</button>`)}
  html=html.replace(`<button class="btn sm" onclick="addRoute()"`,`<button class="btn sm ghost" onclick="exFoundModal()">${EX_IC.bag} Found an item</button><button class="btn sm" onclick="addRoute()"`)}catch(e){console.warn('extras routes',e)}return html};
const _exDHome=VIEWS['d-home'];VIEWS['d-home']=()=>{const html=_exDHome();try{const u=me();if(!u||(!myRoutes().length&&!u.earnGoal))return html;const card=exEarnCard();const mk=`<div class="card"><div class="row between"><h3>Today's trips</h3>`;const i=html.indexOf(mk);return i>=0?html.slice(0,i)+card+html.slice(i):html+`<div style="margin-top:18px">${card}</div>`}catch(e){console.warn('extras home',e);return html}};
const _exDBill=VIEWS['d-billing'];VIEWS['d-billing']=()=>{const html=_exDBill();try{if(!me())return html;const card=`<div style="margin-bottom:14px">${exEarnCard()}</div>`;const i=html.indexOf('<div class="kpi">');return i>=0?html.slice(0,i)+card+html.slice(i):card+html}catch(e){console.warn('extras billing',e);return html}};
const _exPBooking=VIEWS['p-booking'];VIEWS['p-booking']=()=>{let html=_exPBooking();try{const b=Store.get('bookings',S.bookingId);if(!b||b.parentId!==me()?.id&&!S.admin)return html;
  html=html.replace(`<button class="btn sm ghost" onclick="reportIssue('${b.id}')">`,`<button class="btn sm ghost" onclick="exLostModal('${b.id}')">${EX_IC.bag} Left something?</button><button class="btn sm ghost" onclick="reportIssue('${b.id}')">`);
  if(!b.once){const seat=exSeatCardParent(b);const mk='<div class="card" style="grid-column:1/-1"><h3>Trip history</h3>';const i=html.indexOf(mk);if(seat)html=i>=0?html.slice(0,i)+seat+html.slice(i):html+`<div style="margin-top:14px">${seat}</div>`}}catch(e){console.warn('extras booking',e)}return html};
</script>
