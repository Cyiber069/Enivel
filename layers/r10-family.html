<style>
/* ===== Round 10 · family members + help centre ===== */
.fm-pill{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--acc) 12%,var(--bg));border:1px solid var(--line);font-size:.85rem;margin-bottom:14px;line-height:1.35}
.fm-pill svg{width:18px;height:18px;flex-shrink:0}
.fm-off{opacity:.45}
.fm-link{word-break:break-all;font-family:ui-monospace,monospace;font-size:.76rem;background:var(--bg2);padding:10px 12px;border-radius:10px;margin:10px 0;user-select:all}
.fm-share{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fm-share .btn{min-width:0}
.fm-rels{display:flex;flex-wrap:wrap;gap:6px}
.fm-rels button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-weight:600;font-size:.82rem;cursor:pointer;min-height:40px;color:var(--fg2)}
.fm-rels button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.hc-topics{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.hc-topics button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.8rem;cursor:pointer;min-height:40px;color:var(--fg2);max-width:100%}
.hc-topics button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.hc-topics button .n{opacity:.6;font-weight:500;margin-left:4px}
.hc-faq details{border-bottom:1px solid var(--line)}
.hc-faq details:last-of-type{border-bottom:0}
.hc-faq summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 0;min-height:52px;font-weight:700}
.hc-faq summary::-webkit-details-marker{display:none}
.hc-faq summary .q{flex:1;min-width:0;overflow-wrap:anywhere}
.hc-faq summary .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--bg2);color:var(--fg2)}
.hc-faq summary .ic svg{width:15px;height:15px}
.hc-faq summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--fg3);border-bottom:2px solid var(--fg3);transform:rotate(45deg);transition:transform .2s;flex-shrink:0;margin:0 6px 5px 0}
.hc-faq details[open] summary::after{transform:rotate(225deg);margin:5px 6px 0 0}
.hc-faq .a{padding:0 0 14px 40px;color:var(--fg2);font-size:.92rem;line-height:1.5}
.hc-faq .a .btn{margin-top:10px}
.hc-faq .a .topic{display:block;margin-top:8px;font-size:.72rem;color:var(--fg3)}
.hc-popular{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hc-popular button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;cursor:pointer;font-weight:600;font-size:.84rem;min-height:56px;color:var(--fg);display:flex;gap:8px;align-items:center}
.hc-popular button svg{width:18px;height:18px;flex-shrink:0;color:var(--acc)}
.hc-bug textarea{min-height:90px}
.hc-kid .hc-faq summary{font-size:1rem}
@media(max-width:360px){.hc-popular{grid-template-columns:1fr}.hc-faq .a{padding-left:0}.fm-share{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.hc-faq summary::after{transition:none}}
</style>
<script>
/* =====================================================================
   Round 10 · family members (co-parents)
   A parent (the "owner") adds a mom, dad, gran or guardian by email from Settings → Family.
   The server (supabase/r10-family.sql) keeps family_members / family_invites and lets a member
   read the owner's children, bookings, ride events, driver chats and alerts (copied to them).
   Client: the owner's kids/bookings arrive with parentId = owner; for a member we relabel them
   to parentId = member (+ familyOwner) when they land, so every parent screen just works.
   Members may chat to the drivers, mark "not riding" (family_absent) and send a note to the
   driver (family_note). Pay / book / cancel / change children are blocked here and on the server.
   ===================================================================== */
const FM_RELS=['Mom','Dad','Gran','Grandpa','Aunt','Uncle','Guardian','Other'];
function fmMember(){const u=me();return !!(u&&u.role==='parent'&&typeof u.familyOf==='string'&&u.familyOf&&!S.admin)}
function familyOwnerId(){const u=me();return u?(fmMember()?u.familyOf:u.id):null}
function fmOwner(){return fmMember()?Store.get('users',me().familyOf):null}
function fmOwnerFirst(){const o=fmOwner();return kcFirst(o?.name||me()?.familyOwnerName||'')||'the parent'}
function fmOnly(){toast(`Only ${fmOwnerFirst()} can do this`);buzz(8);return false}
function fmFamKid(id){const k=id&&Store.get('kids',id);return !!(k&&k.familyOwner)}
function fmFamBooking(id){const b=id&&Store.get('bookings',id);return !!(b&&b.familyOwner)}
function fmJoin(a){a=a.filter(Boolean);return a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' & '+a[a.length-1]}
function fmKids(){return fmMember()?kidsOf(me().id).filter(k=>k.familyOwner):[]}
/* relabel the owner's documents for a member (runs after every sync) */
function fmApply(){if(!fmMember())return 0;const u=me();const o=u.familyOf;let n=0;
  for(const c of ['kids','bookings','waitlist','events']){const col=S.data[c]||{};for(const id in col){const d=col[id];if(d&&d.parentId===o&&d.familyOwner!==o){col[id]={...d,parentId:u.id,familyOwner:o};n++}}}
  return n}
/* a full pull that really runs (cloudPull is a no-op while another pull is busy) */
async function fmFullPull(){for(let i=0;i<40&&pulling;i++)await new Promise(r=>setTimeout(r,150));await cloudPull(true)}
const _fmPull=cloudPull;cloudPull=async function(full){await _fmPull.apply(this,arguments);try{const u=me();const now=u&&u.role==='parent'&&u.familyOf||null;if(S.fmWas!==undefined&&S.fmWas!==now&&!full){S.fmWas=now;setTimeout(fmFullPull,50);return}S.fmWas=now;if(fmApply()&&typeof cloudRender==='function')cloudRender()}catch(e){console.warn('family',e)}};
/* a member's own actions that must go through the family RPCs */
const _fmToggleAbsent=toggleAbsent;toggleAbsent=async function(kidId){const k=Store.get('kids',kidId);
  if(fmMember()&&k&&k.familyOwner){if(!S.cloud||!sb)return fmOnly();const day=todayKey();const {data,error}=await sb.rpc('family_absent',{p_kid:kidId,p_day:day});if(error)return toast(error.message);
    const a=new Set(k.absences||[]);data?a.add(day):a.delete(day);S.data.kids[kidId]={...k,absences:[...a]};toast(data?`${k.name} marked not riding today. ${fmOwnerFirst()} and the driver are told.`:`${k.name} is riding today.`);buzz();render();try{schedulePull()}catch(e){}return}
  return _fmToggleAbsent.apply(this,arguments)};
const _fmOpsPut=opsPut;opsPut=async function(c,id,doc){if(c==='bookings'&&fmMember()&&S.cloud&&sb){const cur=Store.get('bookings',id);
    if(cur&&cur.familyOwner){const old=cur.notes||{},nw=doc.notes||{};const days=new Set([...Object.keys(old),...Object.keys(nw)]);
      for(const d of days){if((old[d]||'')!==(nw[d]||'')){const {error}=await sb.rpc('family_note',{p_booking:id,p_day:d,p_text:nw[d]||''});if(error)throw new Error(error.message)}}
      S.data.bookings[id]={...cur,notes:nw};try{schedulePull()}catch(e){}render();return S.data.bookings[id]}}
  return _fmOpsPut.apply(this,arguments)};
/* the server already told the driver about a member's note (with "from Thandi (Thabo's gran)") */
const _fmNotify=notify;notify=async function(userId,text,type,link){if(fmMember()&&type==='note'&&S.cloud)return;return _fmNotify.apply(this,arguments)};
/* owner-only actions: blocked for a member (the server refuses them too) */
(function fmGuards(){const list=[['bookRoute',null],['onceTrip',null],['newRequest',null],['payMonth',null],['payModal',null],['joinWaitlist',null],['leaveWaitlist',null],['acceptOffer',null],['addGuardian',null],['removeGuardian',null],['kidSetupStart',null],
  ['addKid',id=>!id||fmFamKid(id)],['removeKid',fmFamKid],['handoverModal',fmFamKid],['termModal',fmFamKid],['kidPermsModal',fmFamKid],['dayOffModal',fmFamKid],['removeDayOff',fmFamKid],['cancelBooking',fmFamBooking],['scheduleModal',fmFamBooking]];
  for(const [name,chk] of list){try{const f=window[name];if(typeof f!=='function')continue;window[name]=function(...a){if(fmMember()&&(!chk||chk(a[0])))return fmOnly();return f.apply(this,a)}}catch(e){}}})();
const FM_OFF_RE=/^(bookRoute|onceTrip|newRequest|payMonth|payModal|joinWaitlist|leaveWaitlist|acceptOffer|addGuardian|removeGuardian|addKid|removeKid|handoverModal|termModal|kidPermsModal|dayOffModal|removeDayOff|cancelBooking|scheduleModal)\(/;
const FM_SEL='.tp-km button,[data-kc-give],[data-kc-perms],[data-kc-off],[data-kc-sw],[data-ops-note]';
function fmDim(){if(!fmMember())return;const t=`Only ${fmOwnerFirst()} can do this`;const off=b=>{b.classList.add('fm-off');b.title=t;b.setAttribute('aria-disabled','true')};
  document.querySelectorAll('#app [onclick]').forEach(b=>{if(FM_OFF_RE.test(b.getAttribute('onclick')||''))off(b)});
  document.querySelectorAll('#app '+FM_SEL.split(',').join(',#app ')).forEach(b=>{if(b.matches('[data-ops-note]'))return;off(b)})}
/* taps on those dimmed controls (bound by other layers through data attributes) are stopped before they fire */
document.addEventListener('click',e=>{if(!fmMember())return;const b=e.target.closest&&e.target.closest('.fm-off');if(!b||!b.matches(FM_SEL))return;e.preventDefault();e.stopImmediatePropagation();fmOnly()},true);
/* how a driver sees a family member */
function fmLabel(id){const u=Store.get('users',id);if(!u)return '';if(!(u.familyOf&&u.familyRel))return u.name||'';const o=Store.get('users',u.familyOf);const f=kcFirst(o?.name||'');return f?`${u.name} (${f}'s ${String(u.familyRel).toLowerCase()})`:`${u.name} (family)`}
const _fmUserName=userName;userName=function(id){const n=_fmUserName.apply(this,arguments);try{if(viewRole()==='driver'){const u=Store.get('users',id);if(u&&u.familyOf&&u.familyRel)return fmLabel(id)}}catch(e){}return n};
const _fmChatView=chatView;chatView=function(){let html=_fmChatView.apply(this,arguments);try{if(viewRole()!=='driver')return html;
  Store.all('users').filter(x=>x.familyOf&&x.familyRel&&x.role==='parent').forEach(x=>{const lab=h(fmLabel(x.id));html=html.split(`<b>${h(x.name)}</b><span class="pill tiny">parent</span>`).join(`<b>${lab}</b><span class="pill tiny">family</span>`).split(`<div class="t">${h(x.name)} <span class="tiny muted">parent</span>`).join(`<div class="t">${lab} <span class="tiny muted">family</span>`)})}catch(e){}return html};
VIEWS['p-chat']=chatView;VIEWS['d-chat']=chatView;
/* ---------- invites and the Family card ---------- */
function fmLink(tok){return location.origin+location.pathname+'#family='+tok}
async function fmLoad(){if(!S.cloud||!sb||!me())return;try{const {data,error}=await sb.rpc('family_list');if(!error&&data)S.fm=data}catch(e){console.warn('family list',e)}}
function fmCard(){const u=me();if(!u||viewRole()!=='parent')return '';
  if(fmMember()){const o=fmOwner();return `<div class="card fm-card" style="margin-top:14px"><div class="row between"><h3>Family</h3><span class="pill">${h(u.familyRel||'Member')}</span></div><p class="small muted" style="margin:4px 0 10px">You are in <b>${h(o?.name||u.familyOwnerName||'a parent')}</b>'s family as ${h(u.familyRel||'a member')}. You see their children's rides, driver chats and alerts. Only ${h(fmOwnerFirst())} can pay, book, cancel or change children.</p><button class="btn sm ghost" onclick="fmLeave()">Leave this family</button></div>`}
  const fm=S.fm||{};const ms=fm.members||[],inv=fm.invites||[];
  return `<div class="card fm-card" style="margin-top:14px" data-mount="fmCard"><div class="row between"><h3>Family</h3><button class="btn sm ghost" onclick="fmInviteModal()">Add</button></div><p class="tiny muted" style="margin:4px 0 8px">Add a mom, dad, gran or guardian. They sign in with their own email and see your children's rides, driver chats and alerts. They can't pay, book or change children.</p>
  <div class="list">${ms.map(m=>`<div class="item small"><div class="grow" style="min-width:0"><b>${h(m.name||m.email)}</b> · ${h(m.relation)}<div class="tiny muted" style="overflow-wrap:anywhere">${h(m.email||'')}</div></div><button class="btn sm ghost" onclick="fmRemove('${h(m.id)}','${h(m.name||m.email||'')}')">Remove</button></div>`).join('')}${inv.map(i=>`<div class="item small"><div class="grow" style="min-width:0"><b style="overflow-wrap:anywhere">${h(i.email)}</b> · ${h(i.relation)}<div class="tiny muted">Invited · link works until ${new Date(i.expiresAt).toLocaleDateString('en-ZA',{day:'numeric',month:'short'})}</div></div><span class="pill">Waiting</span></div>`).join('')}${!ms.length&&!inv.length?`<p class="muted small">${S.cloud?'No family members yet.':'Family members work on the live Enivel app.'}</p>`:''}</div></div>`}
MOUNT.fmCard=el=>{if(S.cloud&&!S.fmLoaded){S.fmLoaded=true;fmLoad().then(()=>{if(S.route==='p-more'&&$('.fm-card')){const c=$('.fm-card');const d=document.createElement('div');d.innerHTML=fmCard();if(d.firstElementChild)c.replaceWith(d.firstElementChild)}})}};
const _fmPMore=VIEWS['p-more'];VIEWS['p-more']=function(){let html=_fmPMore.apply(this,arguments);try{if(viewRole()!=='parent')return html;const mk='<div class="card" style="margin-top:14px"><div class="row between"><h3>Trusted guardians</h3>';const i=html.indexOf(mk);html=i>=0?html.slice(0,i)+fmCard()+html.slice(i):html+fmCard()}catch(e){console.warn('family card',e)}return html};
function fmInviteModal(){const u=me();if(!u)return;if(!S.cloud||!sb)return toast('Family members work on the live Enivel app');if(fmMember())return fmOnly();let rel='Gran';
  modal(`<h3>Add a family member</h3><p class="muted small" style="margin:6px 0 12px">They get a link. They sign up (or log in) as a parent with this email and then see your children's rides.</p>
  <div class="stack"><div class="field"><label for="fm-e">Their email</label><input id="fm-e" type="email" inputmode="email" autocomplete="off" placeholder="gran@example.com"></div>
  <div class="field"><label>They are the children's</label><div class="fm-rels" role="group" aria-label="Relationship">${FM_RELS.map(r=>`<button type="button" data-rel="${r}" class="${r===rel?'on':''}" aria-pressed="${r===rel}">${r}</button>`).join('')}</div></div>
  <button class="btn wide" id="fm-go">Create invite link</button><button class="btn ghost wide" onclick="closeModal()">Cancel</button></div>`,m=>{
    m.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{rel=b.dataset.rel;m.querySelectorAll('[data-rel]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)})});
    $('#fm-go',m).onclick=async()=>{const em=val(m,'fm-e').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em))return toast('Enter their email address');const btn=$('#fm-go',m);btn.disabled=true;
      const {data,error}=await sb.rpc('family_invite',{p_email:em,p_relation:rel});if(error){btn.disabled=false;return toast(error.message)}
      S.fmLoaded=false;fmLoad().then(()=>{if(S.route==='p-more')render()});fmShareModal(data,em,rel)}})}
function fmShareText(tok,em,rel){const u=me();const names=fmJoin(kidsOf(u.id).map(k=>kcFirst(k.name)));return `${kcFirst(u.name)} added you as ${rel} on Enivel so you can follow ${names||'the children'}'s school transport. Open this link and sign up or log in with ${em}: ${fmLink(tok)}`}
function fmShareModal(tok,em,rel){const link=fmLink(tok);const text=fmShareText(tok,em,rel);const canShare=!!navigator.share;
  modal(`<h3>Share the family link</h3><p class="muted small" style="margin:6px 0 4px">Send this to <b>${h(em)}</b>. It works once and expires in 7 days.</p><div class="fm-link" id="fm-l">${h(link)}</div>
  <div class="fm-share"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a>${canShare?'<button class="btn ghost" id="fm-sh">Share…</button>':''}<button class="btn ghost" id="fm-cp">Copy link</button><a class="btn ghost" href="mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent('Join my family on Enivel')}&body=${encodeURIComponent(text)}">Email</a></div>
  <button class="btn ghost wide" style="margin-top:12px" onclick="closeModal()">Done</button>`,m=>{
    const cp=$('#fm-cp',m);cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Link copied')}catch(e){const r=document.createRange();r.selectNodeContents($('#fm-l',m));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Select and copy the link')}};
    const sh=$('#fm-sh',m);if(sh)sh.onclick=()=>navigator.share({title:'Join my family on Enivel',text,url:link}).catch(()=>{})})}
function fmRemove(id,name){if(!S.cloud||!sb)return;confirmBox(`Remove ${name||'this family member'}?`,'They will no longer see your children\'s rides, chats or alerts.',async()=>{const {error}=await sb.rpc('family_remove',{p_member:id});if(error)return toast(error.message);S.fmLoaded=false;await fmLoad();toast('Family member removed');render()})}
function fmLeave(){if(!S.cloud||!sb)return;confirmBox('Leave this family?','You will no longer see their children\'s rides or alerts.',async()=>{const {error}=await sb.rpc('family_leave');if(error)return toast(error.message);S.fm=null;S.fmLoaded=false;await fmFullPull();toast('You left the family');go('p-home')})}
/* ---------- the #family=<token> link ---------- */
function fmHashToken(){const m=(location.hash||'').match(/^#family=([A-Za-z0-9]{32,128})$/);return m?m[1]:null}
function fmPending(){const t=ls.get('enivel_family_token');return t&&t.token&&Date.now()-(t.at||0)<8*864e5?t.token:null}
function fmClearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
(function fmEarly(){const t=fmHashToken();if(t){ls.set('enivel_family_token',{token:t,at:Date.now()});fmClearHash();S.authMode='signup';S.signupRole='parent'}})();
let fmBusy=false;
async function fmAcceptPending(){const tok=fmPending();const u=me();if(!tok||!u||fmBusy||!S.cloud||!sb)return;fmBusy=true;
  try{if(u.role!=='parent'||S.admin){ls.set('enivel_family_token',null);return toast('Family links are for parent accounts')}
    const {data,error}=await sb.rpc('family_accept',{p_token:tok});
    if(error){ls.set('enivel_family_token',null);return modal(`<h3>Could not join the family</h3><p class="muted small" style="margin:8px 0 14px">${h(error.message)}</p><button class="btn wide" onclick="closeModal()">OK</button>`)}
    ls.set('enivel_family_token',null);S.fm=null;S.fmLoaded=false;await fmFullPull();const names=fmJoin((data?.kids||[]).map(n=>kcFirst(n)));
    modal(`<h3>You're in 🎉</h3><p class="muted small" style="margin:8px 0 14px">You now see ${h(names||'the children')}'s rides as <b>${h(data?.relation||'family')}</b> in ${h(kcFirst(data?.ownerName||'')||'the parent')}'s family. You get the same pickup, drop-off and emergency alerts, and you can chat to the drivers. Only ${h(kcFirst(data?.ownerName||'')||'the parent')} can pay, book or change children.</p><button class="btn wide" onclick="closeModal();go('p-home')">See the rides</button>`);buzz()}
  finally{fmBusy=false}}
const _fmLanding=VIEWS.landing;VIEWS.landing=function(){let html=_fmLanding.apply(this,arguments);try{if(!me()&&fmPending()){html=html.replace('<div class="seg">',`<div class="notice" style="margin-bottom:12px">You were invited to join a family on Enivel. Sign up as a <b>parent</b> (or log in) with the email the invite was sent to.</div><div class="seg">`)}}catch(e){}return html};
const _fmRender=render;render=function(){const r=_fmRender.apply(this,arguments);try{fmDim();if(S.ready&&me()&&fmPending())setTimeout(fmAcceptPending,400)}catch(e){console.warn('family render',e)}return r};
const _fmPHome=VIEWS['p-home'];VIEWS['p-home']=function(){let html=_fmPHome.apply(this,arguments);try{if(!fmMember())return html;const names=fmJoin(fmKids().map(k=>kcFirst(k.name)));
  try{if(typeof growChecklistCard==='function'){const gc=growChecklistCard();if(gc)html=html.split(gc).join('')}}catch(e){}
  html=html.replace(/<div class="notice"><b>Add your ID<\/b> before your first booking\. <a [^>]*>Add now<\/a><\/div>/,'');
  html=`<div class="fm-pill" role="status">${ICON.users}<span><b>Viewing ${h(names||fmOwnerFirst()+"'s children")}</b> as ${h(me().familyRel||'family')}. Only ${h(fmOwnerFirst())} can pay, book or change children.</span></div>`+html}catch(e){}return html};
/* ---------- help text for the family feature in the kid/parent docs ---------- */
</script>
<script>
/* =====================================================================
   Round 10 · Help centre: search, topics, 60+ answers written from the app, "Go there"
   buttons, "Report a bug" (events type 'report' with bug:true → admin Reports / Safety centre),
   and a short friendly kid version. Replaces VIEWS['help-centre'] from the extras layer.
   ===================================================================== */
const HC_TOPICS=[['start','Getting started'],['ride','Booking & routes'],['money','Payments & fees'],['safe','Safety & emergency'],['kid','Kid accounts'],['alert','Alerts & pop-ups'],['docs','Documents & roadblock card'],['earn','Earnings'],['acct','Account & sign-in'],['family','Family members'],['legal','Legal & privacy']];
const HC_IC={start:ICON.home,ride:ICON.car,money:ICON.gift,safe:ICON.shield,kid:ICON.kid||ICON.users,alert:ICON.bell,docs:ICON.list||ICON.check,earn:ICON.star,acct:ICON.user||ICON.lock,family:ICON.users,legal:ICON.lock};
const hcGo=(r,l)=>({go:r,label:l});
/* r: 'p' parents, 'd' drivers, 'b' both. c: topic. go: route name or a function call. */
const HC_FAQ=[
 /* getting started */
 {r:'p',c:'start',q:'How do I start using Enivel?',a:'Add your child on the Kids tab (name, age, grade, school and pickup pin) and add your SA ID once in Settings. Then open Find, pick a route and tap Choose. You pay the first month to confirm the seat.',k:'begin new first time setup',go:hcGo('p-kids','Open Kids')},
 {r:'p',c:'start',q:'Why must I add my ID?',a:'Every parent adds an SA ID number and a photo of it once, before the first booking. Enivel checks it so that only real, traceable adults book transport for children. Drivers never see your ID.',k:'identity document verify parent',go:hcGo('p-more','Add my ID')},
 {r:'p',c:'start',q:'Shared or private transport?',a:'Shared transport is a driver\'s route with other children, paid monthly. A private chauffeur drives only your children. Both are on Find; the price is per child per month.',k:'chauffeur difference type',go:hcGo('p-find','Open Find')},
 {r:'p',c:'start',q:'What is Best match on Find?',a:'Pick a child at the top of Find. Routes are then sorted by same school, distance from your pickup pin, open seats, rating, on-time record and price. The badge on each route shows the real reasons.',k:'smart match ranking sort nearest',go:hcGo('p-find','Open Find')},
 {r:'p',c:'start',q:'Can I share a route with other parents?',a:'Yes. Every route has a public page you can share (the link looks like #route=…). It shows the driver\'s verification, schools, seats and price, but never any child\'s details.',k:'share link public page route',go:hcGo('p-find','Open Find')},
 {r:'d',c:'start',q:'How do I get verified?',a:'Settings → Verification documents. Upload all 10 photos (ID, licence, PrDP, police clearance, roadworthy, operating licence, insurance, licence disc, proof of address and a selfie), plus your PrDP expiry and police clearance date. Enivel reviews them and tells you if a photo must be redone.',k:'verify approved documents upload',go:hcGo('d-verify','Verification documents')},
 {r:'d',c:'start',q:'How do I add a vehicle?',a:'Vehicles → Add vehicle. Take photos of all sides and the number plate, then scan the seats so parents know how many seats you have. Your first 3 vehicles are free.',k:'car taxi add photos plate',go:hcGo('d-vehicles','Open Vehicles')},
 {r:'d',c:'start',q:'How do I list a route?',a:'Routes → New route. Pick the area and school from the suggestions so nearby parents see how close you are, set the monthly price, seats and times. Only active routes of verified drivers show on Find.',k:'new route list create',go:hcGo('d-routes','Open Routes')},
 {r:'d',c:'start',q:'How do parents find me?',a:'Verified drivers with active routes show on Find. Parents see your rating, on-time record, badges and pre-trip check record. Keep your area, schools and seats accurate, and your documents in date, or your routes are hidden.',k:'visible listing',go:hcGo('d-routes','Open Routes')},
 /* booking & routes */
 {r:'p',c:'ride',q:'How do I book transport?',a:'Open Find, choose a route and tap Choose. Pick the child, confirm the first month and you are booked from today. The driver is told at once and appears in your Chat.',k:'book booking choose',go:hcGo('p-find','Open Find')},
 {r:'p',c:'ride',q:'The route I want is full',a:'Join the waiting list on that route. When a seat opens you are told first and have 24 hours to book before it goes to the next person. It does not guarantee a seat.',k:'full waitlist waiting list seat',go:hcGo('p-find','Open Find')},
 {r:'p',c:'ride',q:'Can I book a once-off trip?',a:'Yes. On Home tap Once-off trip and say where, when and for whom. Drivers send offers with a price; you pay when you accept one. See them under Settings → My transport requests.',k:'once off single trip request offer',go:hcGo('p-requests','My requests')},
 {r:'p',c:'ride',q:'Can I change times or add exam times?',a:'Open the booking (Details) → Times & exam schedule. Set regular pickup and drop-off times, a second drop-off or exam times. Your driver must accept before the new times apply.',k:'schedule times exam afternoon change',go:hcGo('p-kids','Open Kids')},
 {r:'p',c:'ride',q:'My child isn\'t riding today',a:'On Home tap Not riding today under the child, or Schedule a day off for a future date. For school holidays use Holidays on the Kids tab. Your driver is told straight away. Family members can do this too.',k:'absent sick day off holiday not riding',go:hcGo('p-home','Open Home')},
 {r:'p',c:'ride',q:'Can I send my driver a note for the day?',a:'Yes. On Home or the booking, tap Note to driver: for example "Has sport kit" or "Someone else collects: Gogo". The driver sees it on the trip screen. Notes are 140 characters and only kept for today and future days.',k:'note message driver today sport kit collects',go:hcGo('p-home','Open Home')},
 {r:'p',c:'ride',q:'Where will my child sit?',a:'Your driver can assign each child a seat. Open the booking to see your child\'s seat on the seat map. You only ever see your own child\'s name, never other children\'s.',k:'seat map sit seating',go:hcGo('p-kids','Open Kids')},
 {r:'b',c:'ride',q:'How do I get my rides into my calendar?',a:'Settings → Rides in my calendar. Download the next 4 weeks as a calendar file for Google, Apple or Outlook. Weekends, public holidays and days off are left out. Download again after times change.',k:'calendar ics google apple outlook',go:{fn:'exCalModal()',label:'Open calendar'}},
 {r:'b',c:'ride',q:'Are there rides on public holidays?',a:'No. There is no school transport on South African public holidays. The app warns you a week before and skips them in reminders and calendar files.',k:'holiday public holiday school closed'},
 {r:'b',c:'ride',q:'Something was left in the car',a:'Settings → Lost & found. Parents tell the driver (add a photo if you have one). Drivers tell the parent when they find something. Both sides get a message and an alert.',k:'lost found forgot bag jersey lunchbox item',go:hcGo('lost-found','Open Lost & found')},
 {r:'p',c:'ride',q:'How do I cancel transport?',a:'Kids → Cancel transport, or Cancel on the booking. Your driver is told at once and the seat is freed from next month. The month you have paid is still driven.',k:'cancel stop end booking',go:hcGo('p-kids','Open Kids')},
 {r:'d',c:'ride',q:'How do I mark pickups and drop-offs?',a:'Start the trip from Routes → Trip. Tap Pick up and Drop off at each stop; you must be close to the stop with GPS on. Automatic pickup can mark it for you, with 10 seconds to undo. Parents get an alert for each one.',k:'pickup drop off mark trip gps automatic',go:hcGo('d-routes','Open Routes')},
 {r:'d',c:'ride',q:'What is the best pickup order?',a:'Routes → Trip → Pickup order. Suggest best order uses your passengers\' pins; you can move stops up or down. Parents then see their stop number on Home.',k:'order stops optimise sequence',go:hcGo('d-routes','Open Routes')},
 {r:'d',c:'ride',q:'How do I assign seats?',a:'Routes → Seats. Tap a seat, then a child. Parents only see free and taken seats and their own child\'s seat. Keep a seat empty if its belt does not work.',k:'seat map assign seats',go:hcGo('d-routes','Open Routes')},
 {r:'d',c:'ride',q:'I can\'t drive one day',a:'Home → Not driving a day. Pick the date and a short reason. Every parent on your routes is told immediately and the day is skipped in their reminders and calendars.',k:'off day sick not driving',go:{fn:'driverOffModal()',label:'Not driving a day'}},
 {r:'d',c:'ride',q:'A parent asked for new times',a:'You get a notification and the request shows on the booking. Accept it or decline with a short note. Until you accept, the old times apply.',k:'schedule request times accept decline',go:hcGo('d-home','Open Home')},
 /* payments & fees */
 {r:'b',c:'money',q:'What does Enivel cost?',a:'Parents pay the driver\'s monthly price plus a 2% Enivel fee (R1 000 + R20 = R1 020). Drivers pay R100 a month, only in months with a paying passenger, plus R49.99 a month for each vehicle after the first 3.',k:'fees price 2% r100 r49.99 cost'},
 {r:'p',c:'money',q:'How do monthly payments work?',a:'Each month is paid in advance from Settings → Payments and invoices. Enivel credit is used first. Card payments go through PayFast; Enivel never sees or stores your card. If the app says test mode, no money moves.',k:'pay payment monthly card payfast',go:hcGo('p-pay','Payments and invoices')},
 {r:'b',c:'money',q:'How do referral credits work?',a:'Share your code from Settings → Security or Invite friends. When a friend signs up with it, you both get R50 Enivel credit. Credit is used automatically on your next Enivel payment and cannot be cashed out.',k:'referral code credit r50 invite friend',go:hcGo('p-more','Open Settings')},
 {r:'b',c:'money',q:'Where are my statements and invoices?',a:'Parents: Settings → Payments and invoices. Drivers: Settings → Earnings and fees. Tap Statement (CSV) to download every payment for your records.',k:'receipt invoice statement csv history'},
 {r:'p',c:'money',q:'Do I get money back when my child is absent?',a:'No. Absences, days off and school holidays do not lower the price, because the driver keeps the seat for you. If the driver stops service in the middle of a paid month, you get a pro-rata refund.',k:'refund absent money back'},
 {r:'b',c:'money',q:'What is Enivel Pays?',a:'Every month Enivel picks families at random and pays their school transport for them. Parents who are booked and in good standing are in the draw automatically; winners get a certificate in the app and appear on the winners wall by first name. Drivers and Enivel staff cannot win.',k:'enivel pays giveaway draw win free month certificate',go:hcGo('pays','Enivel Pays')},
 {r:'d',c:'money',q:'When do I pay the R100 fee?',a:'Only in a month where you have at least one active paying passenger. No passengers, no fee. The fee comes off before Enivel pays you out.',k:'r100 fee driver fee monthly',go:hcGo('d-billing','Earnings and fees')},
 {r:'d',c:'money',q:'What are parking slots?',a:'Your first 3 vehicles are free. Each extra vehicle costs R49.99 a month while it is listed. Remove a vehicle you no longer use to stop the slot fee.',k:'parking slot vehicle r49.99 extra',go:hcGo('d-vehicles','Open Vehicles')},
 /* safety & emergency */
 {r:'b',c:'safe',q:'What does the Emergency button do?',a:'Parents find it on the live tracking screen, drivers on the trip screen. It shows Police 10111, Ambulance 10177 and 112 first, then "Alert Enivel now" sends your account, the trip and the time to the Enivel safety team. In danger, always call the police first.',k:'sos panic police ambulance 10111 112 emergency button'},
 {r:'p',c:'safe',q:'My child pressed their Emergency button',a:'You get a 🚨 alert and the Emergency screen shows their live location for 30 minutes, their message, the ride and the driver. Tap "I\'m on it" so the child sees you saw it. The driver never sees the child\'s emergency location.',k:'kid sos child emergency location',go:hcGo('p-emergency','Emergency screen')},
 {r:'b',c:'safe',q:'Who can see where the car is?',a:'Only parents (and their family members) whose child is on board, and only while the trip is running. Other parents, drivers and strangers never see it.',k:'location gps live map privacy tracking'},
 {r:'p',c:'safe',q:'How do I track the car?',a:'While your child is on board, Home shows Track live. The map follows the car until drop-off and shows the stops. Before pickup you see "Driver on the way" and whether they are running late.',k:'track live map where is the car',go:hcGo('p-home','Open Home')},
 {r:'p',c:'safe',q:'What is the handover code?',a:'A 4 to 6 digit code you set per child (Kids → Handover code). At home drop-off the driver must enter it before marking your child dropped off. Give it only to adults who may receive your child, never to the driver. After 5 wrong codes it locks for 15 minutes and the driver can ask you to confirm in the app instead.',k:'handover code pin drop off safety',go:hcGo('p-kids','Open Kids')},
 {r:'b',c:'safe',q:'How does Enivel check drivers?',a:'Every driver uploads their ID, licence, PrDP, police clearance, roadworthy, operating licence, insurance, licence disc, proof of address and a selfie. Enivel reviews them before any parent can book. Expired licences hide a driver\'s routes from Find; police clearances older than 6 months are flagged.',k:'verification verified documents prdp police clearance'},
 {r:'b',c:'safe',q:'What is a pre-trip vehicle check?',a:'Before a trip the driver ticks 8 items in the app: tyres, lights, brakes, seatbelts, child locks, first-aid kit, fire extinguisher and a clean, undamaged car. Parents see a "Checked today" badge on the ride. It is the driver\'s own declaration, not an inspection.',k:'pre-trip check vehicle tyres brakes belts checked today'},
 {r:'p',c:'safe',q:'What is the weekly report?',a:'Home → Weekly report shows each child\'s rides for the week: pickups and drop-offs, on-time record, who drove, pre-trip checks and any late or missed days. It is built from the ride records in the app.',k:'weekly report summary week on time',go:hcGo('p-report','Weekly report')},
 {r:'p',c:'safe',q:'Who are trusted guardians?',a:'People you name in Settings (for example a grandparent or a helper). Their names appear on your pickup and drop-off alerts so the driver knows who may receive your child. They do not get their own login; for that, add a family member.',k:'guardian granny helper',go:hcGo('p-more','Open Settings')},
 {r:'p',c:'safe',q:'How do I report a problem with a driver?',a:'Open the booking → Report an issue, and say what happened. Enivel reviews every report in the Safety centre and may pause the driver\'s routes. In an emergency call 10111 first.',k:'report complaint problem issue unsafe',go:hcGo('p-kids','Open Kids')},
 {r:'d',c:'safe',q:'A child has a handover code',a:'At home drop-off ask the adult for the code and enter it. If nobody has it, tap Ask parent to confirm and the parent answers in the app. After 5 wrong codes it locks for 15 minutes. Never hand over a child to someone without the code or the parent\'s confirmation.',k:'handover code drop off',go:hcGo('d-routes','Open Routes')},
 {r:'d',c:'safe',q:'How do I do the pre-trip check?',a:'Home → Pre-trip check (or Routes → Trip). Tick the 8 items honestly; a failed item tells you what to do before you drive. One check per vehicle per day. Ticking items you did not check is a permanent ban.',k:'pre-trip check tyres brakes belts first aid',go:hcGo('d-home','Open Home')},
 {r:'d',c:'safe',q:'What is a ride check?',a:'When a trip looks different from the plan (for example a drop-off far from the usual place) the parent is asked to confirm it was fine. Keep your pickups and drop-offs accurate and this rarely happens.',k:'ride check mismatch confirm'},
 /* kid accounts */
 {r:'p',c:'kid',q:'Can my child have their own login?',a:'Yes. Kids → Set up a login for the child. You enter their email and get a one-time code that is valid for 15 minutes; the child signs up with it. They see their own ride only, and you stay in control from your parent account.',k:'kid account child login own phone',go:hcGo('p-kids','Open Kids')},
 {r:'p',c:'kid',q:'What can my child see and do?',a:'By default: the map while on board, "driver nearby" alerts, Face ID and the look of the app. Chat with the driver and "I\'m not riding" are off until you switch them on under the child\'s permissions. A child can never pay, book or accept terms.',k:'permissions kid track chat absent switch',go:hcGo('p-kids','Open Kids')},
 {r:'p',c:'kid',q:'How do I switch a kid login off?',a:'Kids → the child\'s login → Switch off. They are signed out at once and their Face ID and pop-ups are removed. You can set it up again later with a new code.',k:'remove kid login unlink switch off',go:hcGo('p-kids','Open Kids')},
 {r:'p',c:'kid',q:'Does my child have an Emergency button?',a:'Yes, always, on their Home screen. It sends their live location to you for 30 minutes, with an optional message. It never goes to the driver. You see it on your Emergency screen.',k:'kid sos emergency button child'},
 {r:'d',c:'kid',q:'Can a child message me?',a:'Only if their parent switched chat on for them. You then see the child in Chat with their parent\'s name next to it. Keep it short and about the ride; the parent can read every message.',k:'kid chat child message'},
 /* alerts & pop-ups */
 {r:'p',c:'alert',q:'What alerts will I get?',a:'Driver nearby (when the driver is 1 km from your pickup pin; set it to 0.5, 1 or 2 km on the Kids tab), Picked up, Dropped off, Driver outside, Running late, handover and emergency alerts, plus payments and messages. Family members get the ride alerts too.',k:'notification alert pickup dropoff nearby late',go:hcGo('notifs','Open Notifications')},
 {r:'b',c:'alert',q:'How do I get pop-ups when Enivel is closed?',a:'Settings → Phone pop-ups → Turn on, then allow notifications. On iPhone first add Enivel to your Home Screen (Share → Add to Home Screen). Pop-ups only work on the live Enivel site.',k:'push pop-up lock screen iphone home screen notifications',go:{fn:'enablePush()',label:'Turn on pop-ups'}},
 {r:'p',c:'alert',q:'Can I change the "driver nearby" distance?',a:'Yes. On the Kids tab each child has "Alert me when the driver is 0.5 / 1 / 2 km" away. The default is 1 km. The alert uses the driver\'s live GPS, so it can be a minute early or late.',k:'nearby distance km approach alert',go:hcGo('p-kids','Open Kids')},
 {r:'d',c:'alert',q:'How do reminders work?',a:'Enivel reminds you 30 and 10 minutes before each pickup. Turn on phone pop-ups on Home so they reach you even when Enivel is closed. Days off and public holidays are skipped.',k:'reminder notification push countdown',go:hcGo('d-home','Open Home')},
 {r:'d',c:'alert',q:'How do I tell parents I am late or outside?',a:'On the trip screen tap Running late and pick a reason, or I am outside at a stop. Every parent on the trip gets an alert and sees it on Home. Back on time clears it.',k:'late hoot outside alert parents',go:hcGo('d-routes','Open Routes')},
 /* documents & roadblock card (drivers) */
 {r:'d',c:'docs',q:'What is the roadblock card?',a:'A screen with your Enivel verification, your vehicle and your document dates to show a traffic officer at a roadblock. It has a QR code the officer can scan to see a live check from Enivel. It is not a licence, PrDP or operating licence: carry the real ones.',k:'roadblock traffic officer police stop qr card',go:hcGo('d-roadblock','Open roadblock card')},
 {r:'d',c:'docs',q:'Someone has a screenshot of my QR code',a:'Open the roadblock card and tap Reset QR code. Old codes and screenshots stop working straight away and a new code is made.',k:'reset qr code screenshot',go:hcGo('d-roadblock','Open roadblock card')},
 {r:'d',c:'docs',q:'My licence or PrDP is expiring',a:'Settings → My documents shows each document with its date and marks it Expiring soon from 30 days before. Once a licence or PrDP has expired your routes are hidden from Find until you upload the new one and Enivel approves it.',k:'expiry expired licence prdp hidden routes documents',go:hcGo('d-docs','My documents')},
 {r:'d',c:'docs',q:'A photo was rejected',a:'Enivel tells you which photo and why (blurry, cut off, too old, or already used on another account). Retake it in good light with the whole document in frame and upload again from Verification documents.',k:'rejected photo blurry redo upload',go:hcGo('d-verify','Verification documents')},
 /* earnings (drivers) */
 {r:'d',c:'earn',q:'What will I earn this month?',a:'Home and Earnings and fees show expected income from your bookings, money received so far, Enivel fees and your monthly goal. Set a goal and track it on Home.',k:'earnings forecast goal income',go:hcGo('d-billing','Earnings and fees')},
 {r:'d',c:'earn',q:'How do I track fuel and other costs?',a:'Earnings and fees → Add an expense (fuel, tyres, service, licence). Your profit after expenses is shown next to your income, and you can download it with your statement.',k:'expenses fuel profit costs',go:{fn:'addExpense()',label:'Add an expense'}},
 {r:'d',c:'earn',q:'When and how am I paid?',a:'Parents pay Enivel monthly in advance for their seat. Earnings and fees shows what was paid for each booking, your R100 monthly fee and any slot fees, and the Statement (CSV) has the full history for your records.',k:'payout paid when bank',go:hcGo('d-billing','Earnings and fees')},
 /* account & sign-in */
 {r:'b',c:'acct',q:'How do I make my account safer?',a:'Settings → Security: turn on two-step sign-in with a PIN or an SMS code. On the live app you can also add Face ID or a fingerprint, so you sign in without a password on this phone.',k:'security 2fa pin sms password two step',go:{fn:'twoFaPrompt()',label:'Turn on two-step'}},
 {r:'b',c:'acct',q:'How does Face ID sign-in work?',a:'Settings → Face ID / fingerprint → Turn on. Your phone keeps the key; Enivel only gets a signed proof, never your face. Each phone is added separately and you can remove it in Settings.',k:'face id fingerprint passkey biometric',go:{fn:'enableFaceId()',label:'Set up Face ID'}},
 {r:'b',c:'acct',q:'How do I sign out or move to a new phone?',a:'Settings → Log out at the bottom. On a shared phone also remove Face ID for that phone under Settings → Security. On a new phone just log in with your email and password; your children, bookings and chats are on the Enivel database, not the phone.',k:'log out sign out new phone switch'},
 {r:'b',c:'acct',q:'How do I change the look or text size?',a:'Settings → Appearance: Light or Dark, and Normal, Large or Extra large text. Text size is saved on this phone only.',k:'dark mode theme text size font bigger',go:hcGo('p-more','Open Settings')},
 {r:'b',c:'acct',q:'Can I install Enivel on my phone?',a:'Yes. Open enivel in your browser and tap Add to Home Screen (iPhone: Share → Add to Home Screen; Android: the Install banner or menu → Install app). It then opens full screen and can show pop-ups.',k:'install app home screen android iphone pwa'},
 {r:'b',c:'acct',q:'How do I contact Enivel?',a:'Tap Chat to Enivel at the bottom of this page. Parents can also use Report an issue on a booking. Found something broken? Use Report a bug below.',k:'support contact help chat email'},
 /* family members */
 {r:'p',c:'family',q:'Can my husband, wife or gran use my account too?',a:'Yes. Settings → Family → Add. Enter their email and how they are related (Mom, Dad, Gran, Guardian…). Send them the link; they sign up as a parent with that email and see your children\'s rides, driver chats and alerts.',k:'family member co-parent husband wife gran dad mom share account',go:hcGo('p-more','Open Settings')},
 {r:'p',c:'family',q:'What can a family member do?',a:'See the children, bookings, live tracking and trip history, chat to the drivers, mark a child "not riding today" and send a note to the driver, and get every ride alert. They cannot pay, book, cancel, change children or add other family members.',k:'family member permissions can do'},
 {r:'p',c:'family',q:'How do I remove a family member?',a:'Settings → Family → Remove next to their name. They lose access at once and are told. A family member can also leave from their own Settings.',k:'remove family member leave',go:hcGo('p-more','Open Settings')},
 {r:'p',c:'family',q:'The family link does not work',a:'A link works once and for 7 days, and only for the email it was sent to. The person must sign up or log in as a parent with that exact email. Create a new link from Settings → Family if it expired.',k:'family link expired invalid wrong email',go:hcGo('p-more','Open Settings')},
 {r:'d',c:'family',q:'Who is "Thandi (Thabo\'s gran)" in my chat?',a:'A family member the parent added. They see the same rides and alerts as the parent and may chat to you, send day notes and mark a child not riding. Payments and bookings still come from the parent.',k:'family member gran chat who'},
 /* legal & privacy */
 {r:'b',c:'legal',q:'Can I see or delete my data?',a:'Yes. Under POPIA you can see, correct or delete your information. Ask us with Chat to Enivel. The Privacy Policy in the Legal centre says what we keep and for how long.',k:'privacy popia delete account data',go:hcGo('legal','Legal centre')},
 {r:'b',c:'legal',q:'Where are the terms and policies?',a:'Settings → Legal centre has the Terms, Privacy Policy, Safety standards, the Children\'s Accounts and Family terms, Enivel Pays rules and more, with a What\'s new list when they change.',k:'terms policy legal centre privacy',go:hcGo('legal','Legal centre')},
 {r:'b',c:'legal',q:'Why was I asked to accept the terms again?',a:'When the terms change, everyone accepts the new version once at sign-in. The What\'s new box shows what changed; you can read the full document before you tick the box.',k:'accept terms again updated version',go:hcGo('legal','Legal centre')},
 {r:'p',c:'legal',q:'Is my child\'s information safe?',a:'Drivers only see a child\'s name, school, pickup pin and notes while the child is booked on their route. ID numbers, documents and emergency locations are never shown to drivers. Enivel keeps trip records for safety for a limited time, as set out in the Privacy Policy.',k:'child data privacy driver sees',go:hcGo('legal','Legal centre')}];

const HC_KID=[
 {q:'Where is my driver?',a:'Open Home. When the car is on the way you see it on the map, and a "driver nearby" pop-up tells you to get ready.',go:hcGo('k-home','Open Home')},
 {q:'I don\'t feel safe',a:'Press the red Emergency button on Home. Your parent gets your location right away. In real danger also call 10111 or 112.'},
 {q:'I\'m not riding today',a:'If your parent switched it on, tap "Not riding today" on Home. Your parent and driver are told. Otherwise ask your parent to do it.',go:hcGo('k-home','Open Home')},
 {q:'Can I chat to my driver?',a:'Only if your parent switched chat on. Keep it about the ride, like "I\'m at the gate". Your parent can read the messages.',go:hcGo('k-chat','Open Chat')},
 {q:'What are the ride rules?',a:'Be ready on time, check the number plate, seatbelt on every ride, be kind to your driver, and press Emergency if you feel unsafe.',go:hcGo('k-more','Open Settings')},
 {q:'Can I change how the app looks?',a:'Settings → Look lets you pick Light or Dark, if your parent allows it.',go:hcGo('k-more','Open Settings')},
 {q:'Why can\'t I see something?',a:'Your parent chooses what is switched on for you, like chat, tracking and pop-ups. Ask them to change it in their Kids tab.'}];
function hcRole(){return exRole()}
function hcHome(){const r=hcRole();return r==='driver'?'d-more':r==='admin'?'a-more':r==='kid'?'k-more':'p-more'}
function hcFor(role){const want=role==='driver'?'d':role==='admin'?null:'p';return HC_FAQ.filter(f=>f.r==='b'||!want||f.r===want)}
function hcCount(list,c){return c==='all'?list.length:list.filter(f=>f.c===c).length}
function hcGoAttr(g){if(!g)return '';if(g.fn)return `onclick="${h(g.fn)}"`;const r=safeRoute(g.go);return r?`onclick="go('${r}')"`:''}
function hcItem(f,i){const ga=hcGoAttr(f.go);const topic=HC_TOPICS.find(t=>t[0]===f.c);return `<details data-c="${f.c||''}" data-t="${h(exNorm(f.q+' '+f.a+' '+(f.k||'')))}" id="hc-${i}"><summary><span class="ic">${HC_IC[f.c]||ICON.check}</span><span class="q">${h(f.q)}</span></summary><div class="a">${h(f.a)}${ga?`<div><button type="button" class="btn sm ghost" ${ga}>${h(f.go.label||'Go there')} ›</button></div>`:''}${topic?`<span class="topic">${h(topic[1])}</span>`:''}</div></details>`}
function hcFilter(){const words=exNorm(S.hcQ||'').split(' ').filter(Boolean);const cat=S.hcCat||'all';let n=0,first=null;
  document.querySelectorAll('.hc-faq details').forEach(d=>{const ok=(cat==='all'||d.dataset.c===cat)&&words.every(w=>d.dataset.t.includes(w));d.hidden=!ok;if(ok){n++;first=first||d}});
  if(words.length&&first)first.open=true;const c=$('#hc-n');if(c)c.textContent=n+' answer'+(n===1?'':'s')+(words.length?' for “'+(S.hcQ||'').trim()+'”':'');const z=$('#hc-0');if(z)z.hidden=n>0;const pop=$('#hc-pop');if(pop)pop.hidden=!!(words.length||cat!=='all')}
function hcOpen(i){S.hcQ='';S.hcCat='all';const q=$('#hc-q');if(q)q.value='';hcFilter();const d=document.getElementById('hc-'+i);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'})}}
const HC_POPULAR={p:['What does Enivel cost?','What alerts will I get?','What is the handover code?','Can my husband, wife or gran use my account too?','My child isn\'t riding today','What does the Emergency button do?'],d:['How do I get verified?','What is the roadblock card?','When do I pay the R100 fee?','How do I mark pickups and drop-offs?','My licence or PrDP is expiring','How do I do the pre-trip check?']};
function hcBugModal(){const u=me();if(!u)return;modal(`<h3>Report a bug</h3><p class="muted small" style="margin:6px 0 12px">Tell us what you tapped, what you expected and what happened. The Enivel team sees it in the Safety centre.</p><div class="stack hc-bug"><div class="field"><label for="hc-bt">What went wrong?</label><textarea id="hc-bt" maxlength="600" placeholder="e.g. The Pay button does nothing on the Payments page"></textarea></div><label class="row small" style="gap:8px;align-items:center"><input type="checkbox" id="hc-bd" checked> Include my phone and screen details</label><button class="btn wide" id="hc-bgo">Send report</button><button class="btn ghost wide" onclick="closeModal()">Cancel</button></div>`,m=>{
  $('#hc-bgo',m).onclick=async()=>{const text=$('#hc-bt',m).value.replace(/\s+/g,' ').trim();if(text.length<8)return toast('Tell us a bit more');const btn=$('#hc-bgo',m);btn.disabled=true;const det=$('#hc-bd',m).checked;const id='bug'+uid();
    const doc={type:'report',bug:true,by:u.id,text:'🐞 Bug: '+text,ts:Date.now(),screen:S.hcFrom||'help-centre',role:viewRole()||u.role,status:'open'};if(det){doc.ua=navigator.userAgent.slice(0,200);doc.viewport=innerWidth+'x'+innerHeight;doc.version=typeof APP_VERSION!=='undefined'?APP_VERSION:''}
    try{await Store.put('events',id,doc);try{await notify('admin',`🐞 Bug report from ${u.name}: ${text.slice(0,120)}`,'report','a-safety')}catch(e){}closeModal();buzz();toast('Thanks! Your report reached the Enivel team.')}catch(e){btn.disabled=false;toast('Could not send: '+(e.message||e))}}})}
VIEWS['help-centre']=()=>{const u=me();if(!u)return VIEWS.landing();const role=hcRole();
  if(role==='kid'){return `<div class="stack hc-kid" style="gap:16px">${pageHead('Help','',`<button class="btn sm ghost" onclick="go('k-more')">Back</button>`)}<div class="ex-hero"><h2>Need a hand?</h2><p class="small muted">Quick answers for you. Your parent can help with the rest.</p></div><div class="card hc-faq">${HC_KID.map((f,i)=>hcItem({...f,c:'kid'},i)).join('')}</div><div class="card soft"><b>Still stuck?</b><p class="small muted" style="margin:4px 0 10px">Ask your parent, or press Emergency on Home if you feel unsafe.</p><button class="btn sm ghost" onclick="go('k-home')">Go to Home</button></div></div>`}
  const list=hcFor(role);const cat=S.hcCat||'all';const who=role==='driver'?'drivers':role==='admin'?'everyone':'parents';const pop=(HC_POPULAR[role==='driver'?'d':'p']||[]).map(q=>list.findIndex(f=>f.q===q)).filter(i=>i>=0);
  return `<div class="stack" style="gap:16px">${pageHead('Help centre','',`<button class="btn sm ghost" onclick="go('${hcHome()}')">Back</button>`)}
  <div class="ex-hero"><h2>How can we help?</h2><p class="small muted">${list.length} answers for ${who}, written from how Enivel works today.</p><div class="searchbar">${ICON.search}<input id="hc-q" type="search" enterkeyhint="search" placeholder="Search fees, handover, family, roadblock…" value="${h(S.hcQ||'')}" autocomplete="off" aria-label="Search help"></div></div>
  <div class="hc-topics" role="group" aria-label="Topics"><button type="button" data-hccat="all" class="${cat==='all'?'on':''}" aria-pressed="${cat==='all'}">All<span class="n">${list.length}</span></button>${HC_TOPICS.filter(([k])=>hcCount(list,k)).map(([k,l])=>`<button type="button" data-hccat="${k}" class="${cat===k?'on':''}" aria-pressed="${cat===k}">${l}<span class="n">${hcCount(list,k)}</span></button>`).join('')}</div>
  ${pop.length?`<div id="hc-pop"><div class="eyebrow" style="margin-bottom:8px">Popular</div><div class="hc-popular">${pop.map(i=>`<button type="button" onclick="hcOpen(${i})">${HC_IC[list[i].c]||ICON.check}<span>${h(list[i].q)}</span></button>`).join('')}</div></div>`:''}
  <div class="card hc-faq" data-mount="hcHelp"><div class="tiny muted" id="hc-n" aria-live="polite"></div>${list.map(hcItem).join('')}<div class="empty" id="hc-0" hidden>${ICON.search}<p>No answer found. Ask us below.</p></div></div>
  <div class="card ink"><div class="row between" style="gap:12px"><div style="min-width:0"><h3>Still stuck?</h3><p class="small" style="opacity:.75;margin-top:4px">Chat to the Enivel team, or tell us about a bug.</p></div></div><div class="row" style="margin-top:12px;gap:8px"><button class="btn" id="hc-chat" style="background:var(--ink-fg);color:var(--ink);border-color:var(--ink-fg)" onclick="exChatEnivel()">${ICON.chat} Chat to Enivel</button><button class="btn ghost" id="hc-bug" style="color:var(--ink-fg);border-color:color-mix(in srgb,var(--ink-fg) 40%,transparent)" onclick="hcBugModal()">Report a bug</button></div></div></div>`};
MOUNT.hcHelp=el=>{const q=$('#hc-q');if(q)q.oninput=()=>{S.hcQ=q.value;hcFilter()};document.querySelectorAll('[data-hccat]').forEach(b=>b.onclick=()=>{S.hcCat=b.dataset.hccat;document.querySelectorAll('[data-hccat]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});buzz(8);hcFilter()});hcFilter()};
/* remember which screen the person came from (for bug reports) and give kids a Help row */
const _hcGo=go;go=function(r,extra){if(r==='help-centre'&&S.route!=='help-centre')S.hcFrom=S.route;return _hcGo.apply(this,arguments)};
const _hcKMore=VIEWS['k-more'];if(typeof _hcKMore==='function')VIEWS['k-more']=function(){let html=_hcKMore.apply(this,arguments);try{const mk=`<button class="kc-row" onclick="go('notifs')">`;if(html.includes(mk)&&!html.includes("go('help-centre')"))html=html.replace(mk,`<button class="kc-row" onclick="go('help-centre')"><span class="kc-sq">${ICON.search}</span><span class="grow"><b>Help</b></span><span class="chev">${typeof KC_ICON!=='undefined'?KC_ICON.chev:'›'}</span></button>`+mk)}catch(e){}return html};
</script>
