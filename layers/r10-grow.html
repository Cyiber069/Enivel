<style>
/* ===================== r10 grow: share links, posters, public route page, get-started, install, invites ===================== */
:root{--gw-g1:#5b4bf0;--gw-g2:#0e7490;--gw-grad:linear-gradient(135deg,#5b4bf0,#0e7490)}
.gw-x{width:44px;height:44px;margin:-8px -8px 0 0;border:0;background:none;color:var(--fg3);font-size:1.5rem;line-height:1;border-radius:12px;cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.gw-x:hover{background:var(--bg2);color:var(--fg)}
@keyframes gwUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes gwRing{from{stroke-dashoffset:var(--gw-c)}}
@keyframes gwFloat{50%{transform:translateY(-4px) rotate(-4deg)}}
@keyframes gwBounce{50%{transform:translateY(8px)}}
@keyframes gwPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 40%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
/* get-started checklist */
.card.gw-ck{padding:18px 18px 16px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 8%,var(--bg)),var(--bg) 62%);animation:gwUp .45s cubic-bezier(.2,.8,.2,1) both}
.gw-ck-hd{display:flex;align-items:center;gap:14px}
.gw-ck-hd .grow{flex:1;min-width:0}
.gw-ck-hd h3{margin-top:2px}
.gw-ring{position:relative;width:58px;height:58px;flex-shrink:0;display:grid;place-items:center}
.gw-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.gw-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.gw-ring .t{stroke:var(--bg3)}
.gw-ring .f{stroke:url(#gw-rg);animation:gwRing 1.1s cubic-bezier(.2,.8,.2,1) both}
.gw-ring b{font-family:var(--display);font-size:.86rem;font-variant-numeric:tabular-nums;position:relative}
.gw-tiles{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -18px 0;padding:4px 18px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 18px}
.gw-tiles::-webkit-scrollbar{display:none}
.gw-tile{flex:0 0 136px;scroll-snap-align:start;min-height:112px;border-radius:16px;border:1px solid var(--line);background:var(--bg);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer;color:var(--fg);transition:transform .15s,border-color .2s,box-shadow .2s;font:inherit}
.gw-tile:active{transform:scale(.97)}
.gw-tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bg2);color:var(--fg2);transition:background .3s}
.gw-tile .ic svg{width:18px;height:18px}
.gw-tile b{font-size:.84rem;font-weight:600;line-height:1.25;display:block}
.gw-tile small{display:block;font-size:.7rem;color:var(--fg3);margin-top:3px;line-height:1.25}
.gw-tile.done{background:var(--bg2);border-color:transparent}
.gw-tile.done .ic{background:var(--live);color:#fff}
.gw-tile.done b{color:var(--fg3);text-decoration:line-through;text-decoration-thickness:1px}
.gw-tile.next{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
.gw-tile.next .ic{background:var(--gw-grad);color:#fff;animation:gwPulse 1.8s ease-out infinite}
@media(min-width:760px){.gw-tiles{flex-wrap:wrap;overflow:visible;margin:14px 0 0;padding:0}.gw-tile{flex:1 1 140px}}
@media(prefers-reduced-motion:reduce){.card.gw-ck,.gw-pub,.gw-tile.next .ic,.gw-ring .f,.gw-inv .gift,.gw-ios-arrow{animation:none!important}}
/* install */
.card.gw-inst{display:flex;align-items:center;gap:12px;padding:12px 14px}
.gw-inst .grow{flex:1;min-width:0}
.gw-inst .gw-x{margin:0 -6px 0 -6px}
.gw-app{width:44px;height:44px;border-radius:12px;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.03em;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.14)}
.gw-ios{text-align:center}
.gw-ios .gw-app{width:64px;height:64px;border-radius:16px;font-size:1.5rem;margin:4px auto 12px}
.gw-ios ol{list-style:none;padding:0;margin:16px 0 8px;display:flex;flex-direction:column;gap:8px;text-align:left}
.gw-ios li{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:12px 14px;min-height:56px}
.gw-ios .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.gw-key{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:#0a84ff;vertical-align:middle;margin:0 2px;flex-shrink:0}
.gw-key svg{width:20px;height:20px}
.gw-ios-arrow{display:grid;place-items:center;color:#0a84ff;margin-top:6px;animation:gwBounce 1.2s ease-in-out infinite}
.gw-ios-arrow svg{width:30px;height:30px}
/* settings banner */
.gw-banner{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;border-radius:var(--r);border:0;background:var(--gw-grad);color:#fff;text-align:left;cursor:pointer;margin-bottom:14px;box-shadow:0 10px 28px color-mix(in srgb,#5b4bf0 28%,transparent);font:inherit}
.gw-banner .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex-shrink:0;animation:gwFloat 3.4s ease-in-out infinite}
.gw-banner .ic svg{width:22px;height:22px}
.gw-banner .grow{flex:1;min-width:0}
.gw-banner b{display:block;font-size:1rem}.gw-banner span{font-size:.8rem;opacity:.92}
.gw-banner>svg{width:20px;height:20px;flex-shrink:0;opacity:.85}
.gw-set{margin-bottom:14px}
/* share sheet */
.gw-sh-top{display:flex;gap:14px;align-items:center}
.gw-sh-top .grow{flex:1;min-width:0}
.gw-qr{width:104px;height:104px;flex-shrink:0;border-radius:16px;background:#fff;padding:6px;border:1px solid var(--line);display:grid;place-items:center;color:#555;font-size:.7rem;text-align:center}
.gw-qr svg{width:100%;height:100%;display:block}
.gw-clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0}
.gw-link{display:flex;gap:8px;align-items:center;background:var(--bg2);border-radius:999px;padding:5px 5px 5px 16px;margin-top:14px}
.gw-link input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--fg2);text-overflow:ellipsis;padding:6px 0}
.gw-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:8px;margin-top:12px}
.gw-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:74px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.78rem;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .12s,background .2s}
.gw-act:hover{background:var(--bg2)}.gw-act:active{transform:scale(.96)}
.gw-act svg{width:22px;height:22px}
.gw-act.wa{background:#15803d;border-color:#15803d;color:#fff}
.gw-act.wa:hover{background:#166534}
.gw-sh .notice{margin-top:12px}
.gw-pv{max-width:340px;margin:12px auto 0}
/* find: from your link */
.gw-focus{border-radius:calc(var(--r) + 6px);padding:6px;background:var(--gw-grad);animation:gwUp .45s cubic-bezier(.2,.8,.2,1) both}
.gw-focus>.row{padding:2px 4px 6px 10px;color:#fff}
.gw-focus .chip-on{background:rgba(255,255,255,.2);color:#fff}
.gw-focus .chip-on svg{width:13px;height:13px}
.gw-focus .gw-x{color:#fff;margin:0}
.gw-focus .gw-x:hover{background:rgba(255,255,255,.15)}
.gw-fnote{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gw-fnote .gw-x{margin:-8px -10px -8px 0}
/* public route page */
.gw-pub{max-width:470px;margin:0 auto;display:flex;flex-direction:column;gap:14px;animation:gwUp .5s cubic-bezier(.2,.8,.2,1) both}
.gw-pc{border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:var(--shadow)}
.gw-pc-hero{padding:20px 20px 24px;color:#fff;background:radial-gradient(130% 120% at 0% 0%,#7c6dff 0%,#5b4bf0 38%,#0e7490 100%);position:relative;overflow:hidden}
.gw-pc-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.gw-pc-hero::before{content:"";position:absolute;left:-40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.gw-pc-hero .row{position:relative;z-index:1}
.gw-pc-hero h1{position:relative;z-index:1;font-size:clamp(1.55rem,7vw,2.1rem);margin-top:12px;overflow-wrap:anywhere;color:#fff}
.gw-kick{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.88}
.gw-ver{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap}
.gw-ver svg{width:14px;height:14px}
.gw-sch{position:relative;z-index:1;display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:.92rem;opacity:.96;overflow-wrap:anywhere}
.gw-sch svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.gw-pc-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.gw-pr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gw-price{font-family:var(--display);font-size:2rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gw-rows{display:flex;flex-direction:column;background:var(--bg2);border-radius:18px;padding:2px 14px}
.gw-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.gw-row:last-child{border-bottom:0}
.gw-row>svg{width:20px;height:20px;flex-shrink:0;color:var(--acc);margin-top:2px}
.gw-row div{min-width:0;overflow-wrap:anywhere}
.gw-row small{display:block;font-size:.72rem;color:var(--fg3);font-weight:600}
.gw-drv{display:flex;align-items:center;gap:12px}
.gw-drv .grow{flex:1;min-width:0}
.gw-cta{min-height:54px;font-size:1.02rem;background:var(--gw-grad);border:0;color:#fff;box-shadow:0 10px 26px color-mix(in srgb,#5b4bf0 32%,transparent)}
.gw-cta:hover{opacity:.94}
.gw-center{text-align:center}
.gw-skel{height:120px}
.gw-none{text-align:center;padding:30px 20px}
.gw-none .ic{width:60px;height:60px;border-radius:20px;background:var(--bg2);display:grid;place-items:center;margin:0 auto 12px;color:var(--fg3)}
.gw-none .ic svg{width:28px;height:28px}
.gw-pend{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--acc) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);font-size:.86rem}
.gw-pend .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.gw-pend>svg{width:20px;height:20px;color:var(--acc);flex-shrink:0}
.gw-pend button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;min-height:44px;padding:0 4px;font:inherit;font-weight:700}
/* invite page */
.card.gw-inv{text-align:center;padding:26px 20px;color:#fff;border:0;background:radial-gradient(120% 140% at 100% 0%,rgba(34,211,238,.35),transparent 55%),var(--gw-grad)}
.gw-inv .gift{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 12px;animation:gwFloat 3s ease-in-out infinite}
.gw-inv .gift svg{width:30px;height:30px}
.gw-inv h2{font-size:1.6rem;color:#fff}
.gw-inv p{opacity:.92;margin:6px auto 16px;max-width:30ch;font-size:.92rem}
.gw-code{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;min-height:54px;max-width:100%;border-radius:16px;border:1.5px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.12);color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.35rem;font-weight:700;letter-spacing:.14em;cursor:pointer}
.gw-code svg{width:18px;height:18px;opacity:.85}
.gw-inv .btn{background:#fff;color:#2b1fa8;border-color:#fff}
.gw-prev{display:flex;flex-direction:column;align-items:center;gap:10px}
.gw-prev img{width:min(100%,260px);aspect-ratio:1080/1350;border-radius:18px;box-shadow:var(--shadow);background:var(--bg3);object-fit:cover}
.gw-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* A4 poster (paper colours in both themes) */
.gp{container-type:inline-size;position:relative;width:100%;aspect-ratio:190/275;background:#fff;color:#0a0a0a;font-family:var(--body);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:left}
.gp-band{background:linear-gradient(120deg,#5b4bf0,#0e7490);color:#fff;padding:5cqw 6cqw;display:flex;justify-content:space-between;align-items:center;gap:3cqw}
.gp-logo{font-family:var(--display);font-weight:800;font-size:7.4cqw;letter-spacing:-.04em;line-height:1}
.gp-ver{display:inline-flex;align-items:center;gap:1.4cqw;background:#fff;color:#14532d;padding:1.8cqw 3.2cqw;border-radius:99px;font-weight:800;font-size:3cqw;white-space:nowrap}
.gp-ver svg{width:3.8cqw;height:3.8cqw;color:#15803d}
.gp-main{padding:6cqw 6cqw 0;flex:1;display:flex;flex-direction:column;gap:2.6cqw;min-height:0}
.gp-kick{font-size:3.2cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5b4bf0}
.gp-title{font-family:var(--display);font-weight:800;font-size:9.6cqw;line-height:1.02;letter-spacing:-.04em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gp-sch{font-size:4.4cqw;font-weight:600;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gp-pr{display:flex;align-items:center;gap:3cqw;flex-wrap:wrap;margin-top:1cqw}
.gp-price{font-family:var(--display);font-weight:800;font-size:9cqw;letter-spacing:-.03em;line-height:1}
.gp-price small{font-size:3.6cqw;font-weight:600;color:#555;letter-spacing:0}
.gp-seats{background:#dcfce7;color:#14532d;font-weight:800;font-size:3.6cqw;padding:1.6cqw 3.4cqw;border-radius:99px}
.gp-seats.full{background:#fee2e2;color:#7f1d1d}
.gp-rows{display:grid;gap:2.4cqw;margin-top:1.4cqw}
.gp-rows>div{display:flex;flex-direction:column;border-left:1cqw solid #e4e1ff;padding-left:3cqw;min-width:0}
.gp-rows b{font-size:2.7cqw;text-transform:uppercase;letter-spacing:.08em;color:#6b6b6b}
.gp-rows span{font-size:4.1cqw;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gp-foot{display:flex;align-items:center;gap:5cqw;margin:4cqw 6cqw 6cqw;padding:4cqw;border:.5cqw dashed #c9c9c9;border-radius:4cqw}
.gp-qr{width:32cqw;height:32cqw;flex-shrink:0}
.gp-qr svg{width:100%;height:100%;display:block}
.gp-noqr{font-size:2.6cqw;word-break:break-all;color:#333}
.gp-cta{min-width:0}
.gp-cta b{display:block;font-family:var(--display);font-size:5.2cqw;line-height:1.1;letter-spacing:-.02em}
.gp-cta span{display:block;font-size:2.7cqw;color:#555;margin-top:2cqw;word-break:break-all}
/* the address-suggest wrapper must shrink inside the home search bar (else 320 px phones scroll sideways) */
.searchbar>.sugwrap{flex:1 1 auto;min-width:0}.searchbar>.sugwrap input{width:100%}
#grow-print{display:none}
@page gwposter{size:A4 portrait;margin:10mm}
@media print{
  body.gw-printing>*:not(#grow-print){display:none!important}
  body.gw-printing::before{display:none!important}
  body.gw-printing{background:#fff!important}
  body.gw-printing #grow-print{display:block!important}
  #grow-print .gp{page:gwposter;width:190mm;height:275mm;aspect-ratio:auto;border-radius:0;box-shadow:none;margin:0 auto;break-inside:avoid}
}
</style>

  <div class="gw-drv"><span class="avatar">${h(initials(p.driverFirst))}</span><div class="grow"><b>${h(p.driverFirst)}</b><div class="tiny muted">${h(stats)}</div></div></div></div></div>`}
VIEWS['g-route']=()=>{const id=S.growPubId;if(!id||!GROW_RX.test(id))return growPubNone();if(!S.ready)return growPubSkel();if(!S.growPub||S.growPub.id!==id){growFetchPublic(id);return growPubSkel()}if(S.growPub.state==='loading')return growPubSkel();if(S.growPub.state!=='ok')return growPubNone(S.growPub.state==='error');
  const p=S.growPub.data;const full=p.free!=null&&+p.free<=0;const role=me()?viewRole():null;
  return `<div class="gw-pub" id="gw-pub">${growPubCard(p)}
  ${role==='driver'||role==='admin'?`<p class="tiny muted gw-center">This is what parents see when they open the link.</p>`:`<button class="btn wide gw-cta" data-grow-book="${h(id)}">${full?'Join the waiting list':'Book a seat'}</button><p class="tiny muted gw-center">${me()?'':'Free parent account. Takes a minute.'}</p>`}
  ${me()?'':`<p class="small muted gw-center">Have an account? <a href="#" data-grow-login>Log in</a></p>`}</div>`};
function growOpenRoute(id,force){if(!GROW_RX.test(id))return;S.growPubId=id;if(S.growPub?.id!==id||S.growPub.state==='error'||(force&&S.growPub.state!=='loading'))S.growPub=null;const u=me();if(u&&viewRole()==='parent'&&!S.admin){growClearHash();growFocusFind(id);return}go('g-route')}
function growRemember(id){const t=S.growPub?.id===id?S.growPub.data?.title:'';ls.set('enivel_grow_route',{id,at:Date.now(),title:t||''})}
function growBook(id){if(!GROW_RX.test(id))return;buzz();if(me()){if(viewRole()==='parent')return growFocusFind(id);return}growRemember(id);go('landing',{authMode:'signup',signupRole:'parent'})}
function growFocusFind(id){const r=routeOf(id);S.growFocus=id;if(r)S.filters.type=r.type==='private'?'private':'shared';go('p-find')}
/* Find: the route from the link sits on top */
function growFocusCard(id){const r=routeOf(id);const d=r&&Store.get('users',r.driverId);const ok=r&&r.active&&isVerified(d)&&!d?.banned&&!d?.suspended;const u=me();
  if(!ok)return `<div class="notice gw-fnote" id="gw-focus"><span>That route isn’t taking bookings right now. Here are others.</span><button class="gw-x" data-grow-unfocus aria-label="Close">×</button></div>`;
  return `<div class="gw-focus" id="gw-focus"><div class="row between" style="flex-wrap:nowrap"><span class="chip-on">${GI.link} From your link</span><button class="gw-x" data-grow-unfocus aria-label="Close">×</button></div>${routeCard(r,kidsOf(u.id))}</div>`}
const _growFind=VIEWS['p-find'];VIEWS['p-find']=()=>{const html=_growFind();const id=S.growFocus;if(!id||!me())return html;const card=growFocusCard(id);return growInsertAfter(html,GROW_HEAD,card)||card+html};
/* landing: remember the route / prefill the referral code */
const _growLanding=VIEWS.landing;VIEWS.landing=()=>{let html=_growLanding();if(me())return html;
  const ref=ls.get('enivel_grow_ref');if(ref?.code&&/^[A-Z0-9]{4,16}$/.test(ref.code))html=html.replace('id="su-ref" name="ref"',`id="su-ref" name="ref" value="${h(ref.code)}"`);
  const p=ls.get('enivel_grow_route');if(p?.id&&GROW_RX.test(p.id)&&Date.now()-(p.at||0)<14*864e5){const ban=`<div class="gw-pend" id="gw-pend">${ICON.car}<div class="grow">${(S.authMode||'login')==='signup'?'Create your parent account to book':'Log in to book'}${p.title?` <b>${h(p.title)}</b>`:' that route'}.</div><button type="button" data-grow-view="${h(p.id)}">View</button></div>`;
    const i=html.indexOf('<div class="seg">');if(i>=0)html=html.slice(0,i)+ban+html.slice(i)}
  return html};
/* no welcome slides over a shared route */
const _growIntro=showIntro;showIntro=function(){if(growHashRoute()||S.route==='g-route')return;return _growIntro()};
/* leaving the route page drops the #route= part of the address */
const _growGo=go;go=function(r,extra){if(r!=='g-route'&&growHashRoute())growClearHash();return _growGo(r,extra)};
/* handle #route= and #ref= links */
function growOnHash(force){const id=growHashRoute();if(id){growOpenRoute(id,force);return true}
  const ref=growHashRef();if(ref){growClearHash();if(!me()){ls.set('enivel_grow_ref',{code:ref,at:Date.now()});go('landing',{authMode:'signup',signupRole:S.signupRole||'parent'})}else toast('Referral codes are for new accounts');return true}return false}
(function growEarly(){const id=growHashRoute();if(id&&!S.session){S.growPubId=id;S.route='g-route'}})();
(function growWaitHash(){const t=setInterval(()=>{if(!S.ready)return;clearInterval(t);growOnHash()},120);setTimeout(()=>clearInterval(t),30000)})();
window.addEventListener('hashchange',()=>{if(S.ready)growOnHash(true)});
/* after the first sign-in: open the remembered route in Find */
const _growRender=render;render=function(){_growRender();try{growAfterRender()}catch(e){console.warn('grow',e)}};
function growAfterRender(){if(!S.ready)return;const u=me();if(!u)return;if(ls.get('enivel_grow_ref'))ls.set('enivel_grow_ref',null);
  if(S.admin||u.role!=='parent'||S.route!=='p-home'||S._growJump)return;const p=ls.get('enivel_grow_route');if(!p?.id)return;ls.set('enivel_grow_route',null);if(!GROW_RX.test(p.id)||Date.now()-(p.at||0)>14*864e5)return;
  S._growJump=true;setTimeout(()=>{S._growJump=false;if(me()&&S.route==='p-home')growFocusFind(p.id)},0)}

/* =================== 3. get-started checklist =================== */
function growPhotoCount(v){return Object.values(v?.photos||{}).filter(x=>typeof x==='string'&&x.startsWith('data:image')).length}
function growAlertsPossible(){return 'Notification' in window}
function growAlertsOn(){const u=me();if(!u||!('Notification' in window)||Notification.permission!=='granted')return false;if(S.cloud&&'serviceWorker' in navigator&&'PushManager' in window)return (u.pushSubs||[]).length>0;return true}
function growAlertsGo(){if(S.cloud&&typeof enablePush==='function')return enablePush().then(()=>render());if(!('Notification' in window))return toast('This browser can’t show pop-ups');Notification.requestPermission().then(p=>{toast(p==='granted'?'Alerts on':'Alerts stay inside the app');render()})}
function growFaceStep(){return S.cloud&&typeof faceOnHere==='function'&&typeof faceEndpoint==='function'&&faceEndpoint()&&typeof bioAvail!=='undefined'&&bioAvail===true}
function growCheckDay(c){const v=c.day||c.date||c.localDay||(c.ts?localKey(new Date(c.ts)):c.at?localKey(new Date(c.at)):c.createdAt?localKey(new Date(c.createdAt)):'');return String(v).slice(0,10)}
function growCheckView(){return ['d-check','d-checks','d-vcheck','d-inspect','d-safety'].find(k=>VIEWS[k])||Object.keys(VIEWS).find(k=>/^d-.*check/.test(k))||null}
function growDocDates(u){/* only when the documents layer adds expiry dates; guarded */
  if(typeof docDatesMissing==='function'){try{const m=docDatesMissing(u);return {on:true,done:Array.isArray(m)?!m.length:!m}}catch(e){}}
  if(typeof docsDatesComplete==='function'){try{return {on:true,done:!!docsDatesComplete(u)}}catch(e){}}
  return {on:false}}
function growSteps(){const u=me();if(!u||S.admin)return null;const s=[];const later=(f,ms)=>setTimeout(()=>{try{f()}catch(e){}},ms||80);
  if(u.role==='parent'){const kids=kidsOf(u.id);
    s.push({k:'kid',t:'Add your child',ic:ICON.kids,d:kids.length>0,go:()=>{go('p-kids');later(()=>addKid())}});
    s.push({k:'pin',t:'Set the pickup pin',ic:ICON.pin,d:!!(journey().pickupGeo||kids.some(k=>k.geo&&Number.isFinite(+k.geo.lat))),go:()=>{go('p-home');later(()=>pickPlace('pickup'))}});
    s.push({k:'id',t:'Add your ID',ic:ICON.lock,d:!needsParentId(u),sub:u.idStatus==='retry'?'Enivel asked for a new photo':'',go:()=>{go('p-more');later(()=>{const e=$('#pid-n');if(e){e.scrollIntoView({block:'center',behavior:'smooth'});e.focus({preventScroll:true})}},150)}});
    s.push({k:'book',t:'Book a driver',ic:ICON.car,d:Store.all('bookings').some(b=>b.parentId===u.id),go:()=>go('p-find')});
    if(growAlertsPossible())s.push({k:'alerts',t:'Turn on alerts',sub:'Pickup and drop-off pop-ups',ic:ICON.bell,d:growAlertsOn(),go:growAlertsGo});
    s.push({k:'guard',t:'Add a trusted guardian',ic:ICON.users,d:(u.guardians||[]).length>0,go:()=>{go('p-more');later(()=>addGuardian())}});
    if(growFaceStep())s.push({k:'face',t:'Turn on '+bioLabel(),ic:typeof bioIcon==='function'?bioIcon():ICON.lock,d:faceOnHere(),go:()=>enableFaceId()});
  }else if(u.role==='driver'){const st=u.verification?.status||'none';
    s.push({k:'docs',t:'Send verification documents',ic:ICON.shield,d:st==='pending'||st==='approved',sub:st==='pending'?'Enivel is checking them':st==='rejected'?'Some need redoing':'',go:()=>go('d-verify')});
    const dd=growDocDates(u);if(dd.on)s.push({k:'dates',t:'Fill in document dates',ic:GI.cal,d:dd.done,go:()=>go('d-verify')});
    s.push({k:'veh',t:'Add your vehicle with photos',ic:ICON.car,d:myVehicles().some(v=>growPhotoCount(v)>=5),go:()=>{go('d-vehicles');if(!myVehicles().length)later(()=>addVehicle())}});
    s.push({k:'route',t:'Create your first route',ic:ICON.pin,d:myRoutes().length>0,go:()=>{go('d-routes');if(myVehicles().length&&!myRoutes().length)later(()=>addRoute())}});
    if(growAlertsPossible())s.push({k:'alerts',t:'Turn on pickup pop-ups',sub:'30 and 10 min before',ic:ICON.bell,d:growAlertsOn(),go:growAlertsGo});
    const cv=growCheckView();if(cv)s.push({k:'check',t:'Do today’s vehicle check',ic:GI.clip,d:Store.all('checks').some(c=>c.driverId===u.id&&growCheckDay(c)===localKey()),go:()=>go(cv)});
    if(growFaceStep())s.push({k:'face',t:'Turn on '+bioLabel(),ic:typeof bioIcon==='function'?bioIcon():ICON.lock,d:faceOnHere(),go:()=>enableFaceId()});
  }else return null;
  return s}
function growChecklistCard(){const u=me();const steps=growSteps();if(!steps||!steps.length)return '';const done=steps.filter(x=>x.d).length;if(done===steps.length)return '';if(ls.get('enivel_grow_ckx_'+u.id))return '';
  const C=2*Math.PI*18,pct=done/steps.length,next=steps.find(x=>!x.d);
  return `<div class="card gw-ck" id="gw-ck"><div class="gw-ck-hd"><div class="gw-ring" role="img" aria-label="${done} of ${steps.length} done"><svg viewBox="0 0 44 44"><defs><linearGradient id="gw-rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle class="t" cx="22" cy="22" r="18"/><circle class="f" cx="22" cy="22" r="18" style="--gw-c:${C.toFixed(2)}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-pct)).toFixed(2)}"/></svg><b>${done}/${steps.length}</b></div>
  <div class="grow"><span class="eyebrow">Get started</span><h3>${done?'Nice, keep going':'Set up in a few taps'}</h3><div class="tiny muted">Next: ${h(next.t)}</div></div><button class="gw-x" data-grow-ckx aria-label="Hide this card">×</button></div>
  <div class="gw-tiles" data-mount="growCk">${steps.map(x=>`<button class="gw-tile ${x.d?'done':''} ${x===next?'next':''}" data-grow-step="${x.k}" aria-label="${h(x.t)}${x.d?' (done)':''}"><span class="ic">${x.d?ICON.check:x.ic}</span><span><b>${h(x.t)}</b>${x.sub?`<small>${h(x.sub)}</small>`:''}</span></button>`).join('')}</div></div>`}
MOUNT.growCk=el=>{const n=el.querySelector('.gw-tile.next');if(n&&el.scrollWidth>el.clientWidth+4)el.scrollLeft=Math.max(0,n.offsetLeft-18)};

/* =================== 4. install prompt =================== */
let growBIP=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();growBIP=e;if(S.ready&&me())render()});
window.addEventListener('appinstalled',()=>{growBIP=null;ls.set('enivel_grow_installed',Date.now());if(S.ready)render()});
function growIsSafari(){const ua=navigator.userAgent;return /Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Instagram|FBAN|FBAV/i.test(ua)}
function growInstallMode(){if(growStandalone())return null;if(growBIP)return 'prompt';if(typeof isIOS!=='undefined'&&isIOS)return 'ios';return null}
function growInstallCard(where){const m=growInstallMode();if(!m)return '';if(where!=='settings'&&ls.get('enivel_grow_instx'))return '';
  return `<div class="card gw-inst ${where==='settings'?'gw-set':''}" id="gw-inst-${where==='settings'?'s':'h'}"><span class="gw-app" aria-hidden="true">En</span><div class="grow"><b>Install Enivel</b><div class="tiny muted">${m==='ios'?'Add it to your Home Screen.':'Opens full screen, like an app.'}</div></div><button class="btn sm" data-grow-install>${m==='ios'?'Show me':'Install'}</button>${where==='settings'?'':'<button class="gw-x" data-grow-instx aria-label="Not now">×</button>'}</div>`}
async function growInstall(){const m=growInstallMode();if(m==='prompt'){const e=growBIP;growBIP=null;try{await e.prompt();const c=await e.userChoice;if(c?.outcome==='accepted'){ls.set('enivel_grow_installed',Date.now());toast('Enivel installed')}else growBIP=null}catch(err){toast('Could not install here')}render();return}if(m==='ios')return growIOSGuide()}
function growIOSGuide(){const ipad=/iPad/.test(navigator.userAgent);const saf=growIsSafari();
  modal(`<div class="gw-ios"><span class="gw-app" aria-hidden="true">En</span><h3>Add Enivel to your Home Screen</h3><ol>
  <li><span class="n">1</span><span>Tap <span class="gw-key">${GI.ios}</span> <b>Share</b> ${saf?(ipad?'at the top':'below'):'in your browser'}</span></li>
  <li><span class="n">2</span><span>Tap <span class="gw-key">${GI.addsq}</span> <b>Add to Home Screen</b></span></li>
  <li><span class="n">3</span><span>Tap <b>Add</b>. Open Enivel from your Home Screen.</span></li></ol>
  ${saf&&!ipad?`<div class="gw-ios-arrow" aria-hidden="true">${GI.down}</div>`:''}<button class="btn wide" style="margin-top:8px" onclick="closeModal()">Got it</button></div>`)}

/* =================== 5. invite friends =================== */
function growRefStats(){const u=me();if(!u)return null;if(S.cloud)return S.growRefs&&S.growRefs.uid===u.id?S.growRefs:null;
  const list=Store.all('users').filter(x=>x.referredBy===u.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return {count:list.length,earned:list.length*50,names:list.slice(0,30).map(x=>growFirst(x.name))}}
async function growPullRefs(force){if(!S.cloud||typeof sb==='undefined'||!sb||!me())return;if(!force&&S._growRefT&&Date.now()-S._growRefT<15000)return;S._growRefT=Date.now();
  try{const {data,error}=await sb.rpc('grow_referrals');if(error)throw error;const u=me();if(!u||!data)return;const nv={count:+data.count||0,earned:+data.earned||0,names:Array.isArray(data.names)?data.names:[],uid:u.id};const ch=JSON.stringify(nv)!==JSON.stringify(S.growRefs);S.growRefs=nv;if(ch&&S.route==='invite'&&!$('.overlay'))render()}catch(e){console.warn('grow_referrals',e)}}
function growInviteText(u){return `${growFirst(u.name)} invited you to Enivel: safe, verified scholar transport. Sign up with my code ${u.refCode} and we both get R50 credit. ${growRefLink(u.refCode)}`}
async function growInviteBlob(){const u=me();if(!u?.refCode)throw new Error('No code yet');const f=growFirst(u.name);
  return growCardPNG({kicker:f?f+' invited you':'You’re invited',title:'Safe, verified scholar transport',sub:'Sign up with my code and we both get R50 credit.',big:u.refCode,bigSize:86,bigSpace:'6px',qr:growRefLink(u.refCode),qrLabel:'Scan to join Enivel'})}
async function growInvitePreview(){const u=me();const img=$('#gw-card-img');if(!u?.refCode||!img)return;const key=u.id+'|'+u.refCode+'|'+u.name;
  if(S._growCard?.key!==key){try{const b=await growInviteBlob();if(S._growCard?.url)URL.revokeObjectURL(S._growCard.url);S._growCard={key,url:URL.createObjectURL(b),size:b.size}}catch(e){return}}
  const im=$('#gw-card-img');if(im&&im.getAttribute('src')!==S._growCard.url)im.src=S._growCard.url}
VIEWS['invite']=()=>{const u=me();if(!u)return VIEWS.landing();const code=u.refCode||'';const st=growRefStats();
  return `<div class="stack" style="gap:16px">${pageHead('Invite friends','')}
  <div class="card gw-inv" data-mount="growInv"><div class="gift">${ICON.gift}</div><h2>Give R50, get R50</h2><p>A friend signs up with your code. You both get R50 credit off your next payment.</p>
  ${code?`<button class="gw-code" data-grow-copycode aria-label="Copy code ${h(code)}">${h(code)} ${GI.copy}</button>`:`<button class="btn" data-grow-mkcode>Create my code</button>`}</div>
  ${code?`<div class="gw-acts" style="margin-top:0"><a class="gw-act wa" id="gw-iwa" href="${h(growWa(growInviteText(u)))}" target="_blank" rel="noopener">${GI.wa}<span>WhatsApp</span></a><button class="gw-act" data-grow-invshare>${GI.img}<span>Share card</span></button><button class="gw-act" data-grow-invlink>${GI.link}<span>Copy link</span></button></div>`:''}
  <div class="kpi"><div class="card"><div class="eyebrow">Friends joined</div><div class="num" id="gw-rn">${st?st.count:'…'}</div></div><div class="card"><div class="eyebrow">Credit earned</div><div class="num" id="gw-re" style="font-size:1.5rem">${st?growMoney(st.earned):'…'}</div></div><div class="card"><div class="eyebrow">Credit now</div><div class="num" style="font-size:1.5rem">${growMoney(u.credit||0)}</div></div></div>
  ${st&&st.names.length?`<div class="card"><h3>Joined with your code</h3><div class="gw-names">${st.names.map(n=>`<span class="pill">${h(n||'Friend')}</span>`).join('')}</div></div>`:''}
  ${code?`<div class="card soft gw-prev"><img id="gw-card-img" alt="Your invite card"><span class="tiny muted">Your share card</span></div>`:''}</div>`};
MOUNT.growInv=()=>{growPullRefs();growInvitePreview()};
function growInviteBanner(){const u=me();if(!u||S.admin||!['parent','driver'].includes(u.role))return '';const st=growRefStats();
  return `<button class="gw-banner" data-grow-invite><span class="ic">${ICON.gift}</span><span class="grow"><b>Invite friends</b><span>${st&&st.count?growMoney(st.earned)+' earned so far':'Give R50, get R50'}</span></span>${GI.chev}</button>`}
for(const r of ['p-more','d-more']){const f=VIEWS[r];VIEWS[r]=()=>{const html=f();if(S.admin||!me())return html;const ins=growInviteBanner()+growInstallCard('settings');if(!ins)return html;return growInsertAfter(html,GROW_HEAD,ins)||ins+html}}

/* ---------- home: checklist + install card ---------- */
const _growPHome=VIEWS['p-home'];VIEWS['p-home']=()=>{const html=_growPHome();if(!me()||S.admin)return html;const ins=growChecklistCard()+growInstallCard('home');if(!ins)return html;
  return growInsertAfter(html,'<div class="hdr">',ins)||(html.includes('<div class="rides">')?html.replace('<div class="rides">',ins+'<div class="rides">'):ins+html)};
const _growDHome=VIEWS['d-home'];VIEWS['d-home']=()=>{const html=_growDHome();if(!me()||S.admin)return html;const ins=growChecklistCard()+growInstallCard('home');if(!ins)return html;
  return growInsertAfter(html,'<div class="row between">',ins,{marker:'<span class="eyebrow">Driver</span>',skip:'<div class="card ink">'})||ins+html};

/* ---------- one click listener for everything above ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest&&e.target.closest('[data-grow-share],[data-grow-step],[data-grow-ckx],[data-grow-install],[data-grow-instx],[data-grow-book],[data-grow-login],[data-grow-signup],[data-grow-retry],[data-grow-unfocus],[data-grow-view],[data-grow-copycode],[data-grow-mkcode],[data-grow-invshare],[data-grow-invlink],[data-grow-invite]');if(!t)return;const d=t.dataset;
  if(d.growShare!==undefined)return growShareRoute(d.growShare);
  if(d.growStep!==undefined){const st=(growSteps()||[]).find(x=>x.k===d.growStep);buzz();if(st)st.go();return}
  if(d.growCkx!==undefined){const u=me();if(u)ls.set('enivel_grow_ckx_'+u.id,Date.now());return render()}
  if(d.growInstall!==undefined)return growInstall();
  if(d.growInstx!==undefined){ls.set('enivel_grow_instx',Date.now());return render()}
  if(d.growBook!==undefined)return growBook(d.growBook);
  if(d.growLogin!==undefined){e.preventDefault();if(S.growPubId)growRemember(S.growPubId);return go('landing',{authMode:'login'})}
  if(d.growSignup!==undefined)return go('landing',{authMode:'signup',signupRole:'parent'});
  if(d.growRetry!==undefined){S.growPub=null;return render()}
  if(d.growUnfocus!==undefined){S.growFocus=null;return render()}
  if(d.growView!==undefined){if(GROW_RX.test(d.growView)){S.growPubId=d.growView;S.growPub=null;go('g-route')}return}
  if(d.growInvite!==undefined)return go('invite');
  const u=me();if(!u)return;
  if(d.growCopycode!==undefined)return growCopy(u.refCode,'Code copied');
  if(d.growInvlink!==undefined)return growCopy(growRefLink(u.refCode),'Invite link copied');
  if(d.growMkcode!==undefined){await Store.patch('users',u.id,{refCode:refCodeFor(u.name||'Enivel')});return}
  if(d.growInvshare!==undefined){t.disabled=true;try{const b=await growInviteBlob();await growShareFile(b,'enivel-invite.png',growInviteText(u))}catch(err){toast('Could not make the image')}finally{t.disabled=false}}});
</script>
