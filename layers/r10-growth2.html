<style>

.g2-src{display:grid;gap:6px;margin-top:8px}
.g2-src div{display:flex;align-items:center;gap:10px;font-size:.86rem}
.g2-src div .bar{flex:1;height:8px;border-radius:999px;background:var(--bg3);overflow:hidden}

.g2-pay-row .r{text-align:right;font-variant-numeric:tabular-nums}
.g2-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:10px}
.g2-fields input,.g2-fields select,.g2-fields textarea,.g2-in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.g2-promo{display:flex;gap:8px;margin-top:10px}
.g2-promo input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-transform:uppercase}
@media(max-width:360px){.g2-hero .acts .btn{flex-basis:100%}.g2-cta{flex-direction:column}.g2-cta .btn{width:100%}}
@media(min-width:900px){.g2-land{max-width:760px}}
</style>
<script>
/* ===================== r10 growth2: ad landing, admin superpowers, conversion ===================== */
const G2_ICON={
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',

  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.3-.2-.5-.3z"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>',
  mega:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>',
  gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 13h18M12 8c-2-4-6-3-6-1s3 1 6 1zm0 0c2-4 6-3 6-1s-3 1-6 1z"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  sheet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>'};
const G2_DEF_FLAGS={pays:true,chauffeur:true,waitlist:true,kids:true,family:true,seatmap:true,lostfound:true,help:true,landingReviews:true,guarantee:false};
const G2_FLAG_LABELS=[
  ['pays','Enivel Pays public page','The #pays giveaway wall, certificates and home cards'],
  ['chauffeur','Private chauffeur','Private routes in Find transport and driver route types'],
  ['waitlist','Waiting list','"Join the waiting list" on full routes'],
  ['kids','Kid accounts','"I\'m a kid" on the landing page and "Give … their own login"'],
  ['family','Family members','Trusted guardians card in parent settings'],
  ['seatmap','Seat map','Driver seat assignment and the parent seat card'],
  ['lostfound','Lost & found','Lost & found page and "Found an item"'],
  ['help','Help centre','Help centre page and FAQ'],
  ['landingReviews','Landing page reviews','Latest parent reviews on the ad landing page'],
  ['guarantee','First-week guarantee','"Not happy after the first week? Enivel credits your fee" on route cards. You honour it by giving credit.']];
function g2Flags(){let s={};try{s=(S.data&&S.data.settings&&Store.get('settings','flags'))||{}}catch(e){}const pub=(S.g2Pub&&S.g2Pub.flags)||{};const out={...G2_DEF_FLAGS};for(const k in pub)if(typeof pub[k]==='boolean')out[k]=pub[k];for(const k in s)if(typeof s[k]==='boolean')out[k]=s[k];return out}
function flagOn(k){return g2Flags()[k]!==false}
/* ---------- pricing: one helper, every reader goes through it ---------- */
const G2_DEF_PRICING={feePct:5,driverFee:100,parkingFee:49.99,freeVehicles:3,referralCredit:50};
function pricing(){let s={};try{s=Store.get('settings','pricing')||{}}catch(e){}const n=(k,d)=>{const v=+s[k];return Number.isFinite(v)&&v>=0?v:d};const feePct=n('feePct',5);
  return {feePct,feeRate:feePct/100,driverFee:n('driverFee',100),parkingFee:n('parkingFee',49.99),freeVehicles:Math.round(n('freeVehicles',3)),referralCredit:n('referralCredit',50)}}
function g2PricingChanged(){const p=pricing();return Object.keys(G2_DEF_PRICING).some(k=>p[k]!==G2_DEF_PRICING[k])}
feeFor=function(amount){return Math.round((+amount||0)*pricing().feeRate*100)/100};
parkingSlotsNeeded=function(driverId){return Math.max(0,Store.all('vehicles').filter(v=>v.driverId===driverId).length-pricing().freeVehicles)};
chargeDriverFeeIfDue=async function(driverId){const u=me();if(!u||u.id!==driverId||u.role!=='driver')return;const p=pricing();const m=monthKey();const txs=Store.all('transactions').filter(t=>t.from===driverId&&t.month===m);let charged=0;
  if(driverPassengers(driverId)>=1&&!txs.some(t=>t.type==='driver_fee')&&p.driverFee>0){await pushTx({type:'driver_fee',amount:p.driverFee,from:driverId,to:'enivel',note:'Monthly driver platform fee (first passenger active)'});await notify(driverId,`Your ${money(p.driverFee).replace('.00','')} monthly Enivel fee for ${m} is now active because you have a paying passenger.`,'pay','d-billing');charged+=p.driverFee}
  const slots=parkingSlotsNeeded(driverId);const paidSlots=txs.filter(t=>t.type==='parking_slot').reduce((s,t)=>s+(t.slots||1),0);if(slots>paidSlots&&p.parkingFee>0){const n=slots-paidSlots;const amt=Math.round(n*p.parkingFee*100)/100;await pushTx({type:'parking_slot',amount:amt,slots:n,from:driverId,to:'enivel',note:`Parking slot${n>1?'s':''} × ${n} for ${m}`});charged+=amt}
  const cr=Math.min(u.credit||0,charged);if(cr>0&&typeof recordCredit==='function')await recordCredit(cr)};
/* code that still uses the old constants in arithmetic (vehicle slot payment) is corrected here */
const _g2PushTx=pushTx;pushTx=function(t){try{const p=pricing();if(t&&t.type==='driver_fee'&&t.amount===DRIVER_FEE)t={...t,amount:p.driverFee};if(t&&t.type==='parking_slot'&&Math.abs(t.amount-(t.slots||1)*PARKING_FEE)<0.005)t={...t,amount:Math.round((t.slots||1)*p.parkingFee*100)/100}}catch(e){}return _g2PushTx(t)};
const _g2PayModal=payModal;payModal=function(total,done){try{if(S.route==='d-vehicles'&&Math.abs(total-PARKING_FEE)<0.005)total=pricing().parkingFee}catch(e){}return _g2PayModal(total,done)};
function g2Pct(){const p=pricing().feePct;return (Math.round(p*100)/100)+'%'}
function g2ShortMoney(n){return money(n).replace(/\.00$/,'')}
/* copy that spells out "5%", "R100" or "R49.99" follows the live pricing */
function g2PriceText(root){if(!g2PricingChanged())return;const p=pricing();root=root||$('#app main');if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const todo=[];let n;while((n=w.nextNode())){const t=n.nodeValue;if(!t||!/5%|R100|R49\.99/.test(t))continue;todo.push(n)}
  for(const n of todo){let t=n.nodeValue;if(p.feePct!==5)t=t.replace(/\b5%/g,g2Pct());if(p.driverFee!==100)t=t.replace(/\bR100(?:\.00)?(?!\d)/g,g2ShortMoney(p.driverFee));if(p.parkingFee!==49.99)t=t.replace(/\bR49\.99\b/g,money(p.parkingFee));if(t!==n.nodeValue)n.nodeValue=t}}
/* pop-ups (booking, payment) are drawn outside <main>; fix their copy too */
try{new MutationObserver(()=>{if(!g2PricingChanged())return;document.querySelectorAll('.modal').forEach(m=>g2PriceText(m))}).observe(document.body,{childList:true,subtree:true})}catch(e){}

/* ---------- UTM: remember where a visitor came from, save it on the profile at sign-up ---------- */

  for(const b of mine){try{await Store.patch('bookings',b.id,{status:'expired',expiredAt:now});const k=Store.get('kids',b.kidId);const r=routeOf(b.routeId);if(b.parentId===u.id)await notify(u.id,`Your 48 h seat hold for ${k?.name||'your child'} on ${r?.name||'the route'} ended. The seat is open again — book when you are ready.`,'info','p-find')}catch(e){}}}
async function g2Reserve(routeId,kidIds){const u=me();const r=routeOf(routeId);if(!u||!r||!kidIds.length)return;const open=r.seats-routeSeatsUsed(r.id);if(kidIds.length>open)return toast(`Only ${open} seat${open===1?'':'s'} open`);
  const until=Date.now()+G2_HOLD_MS;for(const kidId of kidIds){const k=Store.get('kids',kidId);await Store.put('bookings',uid(),{parentId:u.id,kidId,routeId:r.id,driverId:r.driverId,price:r.price,type:r.type||'shared',status:'reserved',reservedAt:Date.now(),reservedUntil:until,sponsoredMonths:[]});
    await notify(r.driverId,`${u.name} reserved a seat for ${k?.name||'a child'} on ${r.name} (48 h hold, payment to follow).`,'info','d-routes')}
  await notify(u.id,`Seat${kidIds.length>1?'s':''} held for 48 h on ${r.name}. Pay before ${fmtDT(until)} to confirm.`,'pay','p-home');closeModal();S.findKid=null;go('p-home');toast('Seat reserved for 48 hours')}

async function g2SetFlag(k,on){await Store.patch('settings','flags',{[k]:!!on,updatedAt:Date.now()});await auditLog('flag.'+k,null,on?'on':'off');toast(G2_FLAG_LABELS.find(x=>x[0]===k)?.[1]+' '+(on?'on':'off'))}
function g2PricingPreview(p){const ex=900;return `On a ${g2ShortMoney(ex)} route a parent pays <b>${money(ex+Math.round(ex*p.feePct)/100)}</b> (${money(Math.round(ex*p.feePct)/100)} fee), the driver keeps <b>${money(ex)}</b>. Drivers pay <b>${g2ShortMoney(p.driverFee)}/month</b> after their first passenger, ${p.freeVehicles} vehicle${p.freeVehicles===1?'':'s'} free then <b>${money(p.parkingFee)}</b> per extra vehicle. Referral credit <b>${g2ShortMoney(p.referralCredit)}</b>.`}
function g2PricingRead(m){return {feePct:+val(m,'g2pr-fee'),driverFee:+val(m,'g2pr-drv'),parkingFee:+val(m,'g2pr-park'),freeVehicles:+val(m,'g2pr-free'),referralCredit:+val(m,'g2pr-ref')}}
function g2PricingInput(){const m=$('#g2-pricing');if(!m)return;const p=g2PricingRead(m);const ok=[p.feePct,p.driverFee,p.parkingFee,p.freeVehicles,p.referralCredit].every(x=>Number.isFinite(x)&&x>=0)&&p.feePct<=20;$('#g2pr-prev').innerHTML=ok?g2PricingPreview(p):'<span style="color:var(--bad)">Check the numbers (fee at most 20%).</span>';$('#g2pr-save').disabled=!ok}
async function g2PricingSave(){const m=$('#g2-pricing');if(!m)return;const p=g2PricingRead(m);const cur=pricing();const diff=Object.keys(p).filter(k=>p[k]!==cur[k]);if(!diff.length)return toast('Nothing changed');
  confirmBox('Change prices for everyone?',`This applies app-wide the moment you confirm: ${diff.map(k=>k+' '+cur[k]+' → '+p[k]).join(', ')}. Parents and drivers see the new numbers at their next payment.`,async()=>{await Store.put('settings','pricing',{...p,updatedAt:Date.now(),by:me()?.id});await auditLog('pricing.change',null,diff.map(k=>k+' '+cur[k]+' → '+p[k]).join(', '));toast('Pricing saved');render()})}
async function g2PricingReset(){confirmBox('Back to the standard prices?','5% parent fee, R100 driver fee, 3 free vehicles, R49.99 per parking slot, R50 referral credit.',async()=>{await Store.put('settings','pricing',{...G2_DEF_PRICING,updatedAt:Date.now()});await auditLog('pricing.reset',null,'standard prices');toast('Standard prices restored');render()})}
async function g2PromosLoad(){if(!S.cloud||!sb||S.g2PromoBusy)return;S.g2PromoBusy=true;try{const {data,error}=await sb.rpc('promo_list');if(!error)S.g2Promos=data||[];S.g2PromoAt=Date.now()}catch(e){}finally{S.g2PromoBusy=false;if(S.route==='a-controls')render()}}
async function g2PromoSave(){const m=$('#g2-promos');if(!m)return;const code=val(m,'g2pm-c').trim().toUpperCase(),credit=+val(m,'g2pm-a'),max=+val(m,'g2pm-m'),exp=val(m,'g2pm-e'),role=val(m,'g2pm-r');if(!/^[A-Z0-9]{3,20}$/.test(code))return toast('Code: 3 to 20 letters or digits');if(!(credit>0))return toast('Credit amount?');if(!(max>=1))return toast('Max uses?');
  if(!S.cloud||!sb)return toast('Promo codes work in the live app');const {error}=await sb.rpc('promo_upsert',{p_code:code,p_credit:credit,p_max:max,p_expires:exp||'',p_role:role||'any'});if(error)return toast(error.message);await auditLog('promo.save',code,money(credit)+' · max '+max+(exp?' · until '+exp:'')+' · '+role);toast('Promo code '+code+' saved');S.g2PromoAt=0;g2PromosLoad()}
async function g2PromoDelete(code){confirmBox('Delete '+code+'?','Nobody can redeem it any more. People who already used it keep their credit.',async()=>{const {error}=await sb.rpc('promo_delete',{p_code:code});if(error)return toast(error.message);await auditLog('promo.delete',code,'');toast('Deleted');S.g2PromoAt=0;g2PromosLoad()})}
async function g2BannerSave(clear){const m=$('#g2-banner-card');if(!m)return;if(clear){await Store.put('settings','banner',{id:null,text:'',updatedAt:Date.now()});await auditLog('banner.clear',null,'');toast('Banner removed');render();return}
  const text=val(m,'g2b-t').trim();if(!text)return toast('Write the announcement');const b={id:'b'+Date.now().toString(36),text:text.slice(0,240),audience:val(m,'g2b-a')||'all',start:val(m,'g2b-s')||'',end:val(m,'g2b-e')||'',link:val(m,'g2b-l')||'',linkLabel:val(m,'g2b-ll').trim().slice(0,30)||'',updatedAt:Date.now()};
  if(b.start&&b.end&&Date.parse(b.end)<Date.parse(b.start))return toast('End is before start');await Store.put('settings','banner',b);await auditLog('banner.set',null,b.audience+(b.start?' from '+b.start:'')+(b.end?' to '+b.end:'')+': '+b.text.slice(0,120));toast('Banner live');render()}
async function g2LandingSave(){const m=$('#g2-landing-card');if(!m)return;const city=val(m,'g2l-city').trim().slice(0,60);await Store.patch('settings','landing',{city,updatedAt:Date.now()});await auditLog('landing.city',null,city||'(none)');toast('Saved');S.g2PubAt=0}

    <div class="g2-fields"><div class="field"><label>Parent fee %</label><input id="g2pr-fee" type="number" step="0.1" min="0" max="20" value="${p.feePct}" oninput="g2PricingInput()"></div><div class="field"><label>Driver fee / month (R)</label><input id="g2pr-drv" type="number" step="1" min="0" value="${p.driverFee}" oninput="g2PricingInput()"></div><div class="field"><label>Free vehicles</label><input id="g2pr-free" type="number" step="1" min="0" value="${p.freeVehicles}" oninput="g2PricingInput()"></div><div class="field"><label>Parking slot / month (R)</label><input id="g2pr-park" type="number" step="0.01" min="0" value="${p.parkingFee}" oninput="g2PricingInput()"></div><div class="field"><label>Referral credit (R)</label><input id="g2pr-ref" type="number" step="1" min="0" value="${p.referralCredit}" oninput="g2PricingInput()"></div></div>

  <div class="card" id="g2-promos"><div class="row between"><h3>Promo codes</h3><span class="tiny muted">${S.cloud?promos.length+' code'+(promos.length===1?'':'s'):'live app only'}${S.cloud?' <button class="btn sm ghost" style="min-height:30px;padding:4px 10px" onclick="S.g2PromoAt=0;g2PromosLoad()">Refresh</button>':''}</span></div><p class="tiny muted" style="margin-top:4px">Each person can use a code once. Credit goes to their next payment.</p>

/* ---------- admin: driver payouts sheet ---------- */
function g2Months(n){const out=[];const d=new Date();d.setDate(1);for(let i=0;i<n;i++){out.push(monthKey(d));d.setMonth(d.getMonth()-1)}return out}
function g2R2(x){return Math.round((+x||0)*100)/100}
function g2Payouts(m){const tx=Store.all('transactions').filter(t=>t.month===m);const ds=Store.all('users').filter(u=>u.role==='driver');const endOfMonth=new Date(+m.slice(0,4),+m.slice(5,7),1).getTime();
  return ds.map(d=>{const bs=Store.all('bookings').filter(b=>b.driverId===d.id&&!b.once&&(b.startedAt||0)<endOfMonth&&(b.status==='active'||(typeof bookingPaidFor==='function'&&bookingPaidFor(b,m))));const expected=g2R2(bs.reduce((s,b)=>s+(+b.price||0),0));
    const mine=tx.filter(t=>t.to===d.id);const paid=g2R2(mine.filter(t=>t.type==='subscription'||t.type==='trip').reduce((s,t)=>s+t.amount,0));const sponsored=g2R2(mine.filter(t=>t.type==='sponsorship').reduce((s,t)=>s+t.amount,0));
    const fees=g2R2(tx.filter(t=>t.from===d.id&&(t.type==='driver_fee'||t.type==='parking_slot')).reduce((s,t)=>s+t.amount,0));const enivelFee=g2R2(tx.filter(t=>t.type==='platform_fee'&&bs.some(b=>b.id===t.bookingId)).reduce((s,t)=>s+t.amount,0));
    const paidOut=g2R2(mine.filter(t=>t.type==='payout').reduce((s,t)=>s+t.amount,0));const lastOut=mine.filter(t=>t.type==='payout').sort((a,b)=>b.ts-a.ts)[0];const net=g2R2(paid+sponsored-fees);
    return {d,bookings:bs.length,expected,paid,sponsored,fees,enivelFee,net,paidOut,due:g2R2(net-paidOut),lastOut}}).filter(r=>r.bookings||r.paid||r.sponsored||r.fees||r.paidOut).sort((a,b)=>b.due-a.due)}
function g2PayoutCsv(m){const rows=g2Payouts(m);const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const head=['Month','Driver','Email','Phone','Passengers','Expected from bookings','Paid by parents','Sponsored by Enivel','Enivel fee (5%) on their bookings','Driver fees (platform + parking)','Net to driver','Paid out','Still due','Last payout'];
  const csv=[head.map(esc).join(',')].concat(rows.map(r=>[m,r.d.name,r.d.email,r.d.phone,r.bookings,r.expected,r.paid,r.sponsored,r.enivelFee,r.fees,r.net,r.paidOut,r.due,r.lastOut?new Date(r.lastOut.ts).toISOString().slice(0,10):''].map(esc).join(','))).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='enivel-payouts-'+m+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);auditLog('payouts.export',null,m+' · '+rows.length+' drivers');toast('CSV downloaded')}
function g2MarkPaid(driverId,m){const r=g2Payouts(m).find(x=>x.d.id===driverId);if(!r)return;if(r.due<=0)return toast('Nothing due');
  modal(`<h3>Mark paid out</h3><p class="small muted" style="margin-top:4px">${h(r.d.name)} · ${m}</p><div class="fee" style="margin-top:10px"><span>Paid by parents</span><b>${money(r.paid)}</b><span>Sponsored</span><b>${money(r.sponsored)}</b><span>Driver fees</span><b>−${money(r.fees)}</b><span>Already paid out</span><b>−${money(r.paidOut)}</b><span class="tot">Due now</span><b class="tot">${money(r.due)}</b></div><div class="g2-fields"><div class="field"><label>Amount (R)</label><input id="g2po-a" type="number" step="0.01" value="${r.due}"></div><div class="field"><label>Paid on</label><input id="g2po-d" type="date" value="${localKey()}"></div><div class="field"><label>Reference</label><input id="g2po-r" maxlength="80" placeholder="EFT ref"></div></div><button class="btn wide" style="margin-top:12px" id="g2po-go">Record payout</button>`,mm=>{$('#g2po-go',mm).onclick=async()=>{const a=+val(mm,'g2po-a');if(!(a>0))return toast('Amount?');const d=val(mm,'g2po-d');const ref=val(mm,'g2po-r').trim();await pushTx({type:'payout',amount:g2R2(a),from:'enivel',to:driverId,month:m,note:'Driver payout '+m+(ref?' · '+ref:''),paidAt:d?Date.parse(d):Date.now()});await notify(driverId,`💸 Enivel paid out ${money(a)} for ${m}${ref?' (ref '+ref+')':''}.`,'pay','d-billing');await auditLog('payout.mark',driverId,r.d.name+' · '+m+' · '+money(a)+(ref?' · '+ref:''));closeModal();toast('Payout recorded')}})}
VIEWS['a-payouts']=adminGate(()=>{const months=g2Months(6);const m=months.includes(S.g2PayM)?S.g2PayM:months[0];S.g2PayM=m;const rows=g2Payouts(m);const tot=k=>g2R2(rows.reduce((s,r)=>s+r[k],0));
  return pageHead('Driver payouts',m+' · what each driver is owed',`<button class="btn sm ghost" onclick="g2PayoutCsv('${m}')">${G2_ICON.sheet} CSV</button>`)+`<div class="row" style="margin-bottom:12px"><div class="seg">${months.map(x=>`<button class="${x===m?'on':''}" onclick="S.g2PayM='${x}';render()">${x}</button>`).join('')}</div></div>
  <div class="kpi">${[['Expected from bookings',tot('expected')],['Paid by parents',tot('paid')],['Sponsored',tot('sponsored')],['Driver fees',tot('fees')],['Net to drivers',tot('net')],['Paid out',tot('paidOut')],['Still due',tot('due')]].map(([l,v])=>`<div class="card"><div class="eyebrow">${l}</div><div class="num" style="font-size:1.25rem">${money(v)}</div></div>`).join('')}</div>
  <p class="tiny muted" style="margin:10px 0">Net = paid by parents + sponsored − driver fees (platform + parking). The Enivel ${g2Pct()} parent fee is paid on top by parents and never comes out of the driver's price. "Paid out" rows are the payout transactions you record here.</p>
  <div class="tw" style="margin-top:4px"><table><thead><tr><th>Driver</th><th>Pax</th><th style="text-align:right">Expected</th><th style="text-align:right">Paid by parents</th><th style="text-align:right">Sponsored</th><th style="text-align:right">Enivel fee</th><th style="text-align:right">Driver fees</th><th style="text-align:right">Net</th><th style="text-align:right">Paid out</th><th style="text-align:right">Due</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr data-g2-pay="${h(r.d.id)}"><td><b>${h(r.d.name)}</b><div class="tiny muted">${h(r.d.email||'')}</div></td><td>${r.bookings}</td><td style="text-align:right">${money(r.expected)}</td><td style="text-align:right">${money(r.paid)}</td><td style="text-align:right">${money(r.sponsored)}</td><td style="text-align:right">${money(r.enivelFee)}</td><td style="text-align:right">−${money(r.fees)}</td><td style="text-align:right"><b>${money(r.net)}</b></td><td style="text-align:right">${money(r.paidOut)}${r.lastOut?`<div class="tiny muted">${new Date(r.lastOut.paidAt||r.lastOut.ts).toLocaleDateString('en-ZA')}</div>`:''}</td><td style="text-align:right"><b style="color:${r.due>0.005?'var(--warn)':'var(--live)'}">${money(r.due)}</b></td><td>${r.due>0.005?`<button class="btn sm" onclick="g2MarkPaid('${h(r.d.id)}','${m}')">Mark paid out</button>`:'<span class="pill live tiny">settled</span>'}</td></tr>`).join('')||'<tr><td colspan="11" class="muted">No driver activity in this month.</td></tr>'}</tbody></table></div>`});
/* payouts are money Enivel sends on; they are not revenue through the app */
if(typeof revenue==='function'){const _g2Rev=revenue;revenue=function(){const r=_g2Rev.apply(this,arguments);try{const po=g2R2(Store.all('transactions').filter(t=>t.type==='payout').reduce((s,t)=>s+t.amount,0));if(po&&typeof r.gmv==='number')r.gmv=g2R2(r.gmv-po)}catch(e){}return r}}
const _g2AMoney=VIEWS['a-money'];VIEWS['a-money']=function(){let html=_g2AMoney.apply(this,arguments);if(!S.admin)return html;try{const mk=`<button class="${S.filters.tt==='sponsorship'?'on':''}" onclick="S.filters.tt='sponsorship';render()">Giveaways</button>`;if(html.includes(mk))html=html.replace(mk,mk+`<button class="${S.filters.tt==='payout'?'on':''}" onclick="S.filters.tt='payout';render()">Payouts</button>`);
  const i=html.indexOf('<div class="row" style="margin:14px 0">');const card=`<div class="card soft" style="margin-top:14px"><div class="row between"><div><b>Driver payouts sheet</b><div class="tiny muted">Per driver per month: owed, paid out, CSV for the bank.</div></div><button class="btn sm" onclick="go('a-payouts')">Open</button></div></div>`;html=i>=0?html.slice(0,i)+card+html.slice(i):html+card}catch(e){}return html};
if(typeof paidAllTime==='function'){const _g2Pat=paidAllTime;paidAllTime=function(id){return _g2Pat(id)}}

/* ---------- admin tiles, pages ---------- */
if(typeof ADMIN_TILES!=='undefined'){
  ADMIN_TILES.push({route:'a-payouts',label:'Payouts',icon:G2_ICON.sheet,tone:'green',count:()=>{const r=g2Payouts(monthKey());return r.filter(x=>x.due>0.005).length},alert:()=>false,sub:()=>{const r=g2Payouts(monthKey());const due=g2R2(r.reduce((s,x)=>s+Math.max(0,x.due),0));return due?money(due)+' due':'All settled'}});
  ADMIN_TILES.push({route:'a-controls',label:'Controls',icon:G2_ICON.sliders,tone:'violet',count:()=>{const F=g2Flags();return Object.keys(G2_DEF_FLAGS).filter(k=>F[k]).length+'/'+Object.keys(G2_DEF_FLAGS).length},alert:()=>g2PricingChanged(),sub:()=>{const b=g2BannerActive();return g2PricingChanged()?'custom pricing':b?'banner live':'switches on'}})}
const _g2AMore=VIEWS['a-more'];VIEWS['a-more']=function(){const html=_g2AMore.apply(this,arguments);const k='<h3>Pages</h3><div class="list" style="margin-top:6px">';if(!html.includes(k))return html;return html.replace(k,k+[['a-controls','Controls: switches, pricing, promos, banner'],['a-payouts','Driver payouts']].map(([r,l])=>`<div class="item" style="cursor:pointer" onclick="go('${r}')"><div class="grow">${l}</div>›</div>`).join(''))};

/* ---------- render hook ---------- */
const _g2Render=render;render=function(){if(S.viewAs&&S.admin&&typeof S.route==='string'&&S.route.startsWith('a-')){S.viewAs=null;S.adminApp=false}
  const r=_g2Render.apply(this,arguments);try{const main=$('#app main');if(main){const u=me();
    if(S.viewAs&&S.admin)main.insertAdjacentHTML('afterbegin',g2ViewAsBar());
