<script>

(function helpFix(){

    [/It sends SMS codes, phone pop-ups,/g,'It sends phone pop-ups,']];
  const fix=s=>typeof s==='string'?swaps.reduce((t,[a,b])=>t.replace(a,b),s):s;
  try{if(typeof OWN_GUIDES==='object')for(const g of Object.values(OWN_GUIDES)){if(!g)continue;g.why=fix(g.why);g.t=fix(g.t);if(Array.isArray(g.steps))g.steps=g.steps.map(fix)}}catch(e){}

  const faqFix=[[/then scan the seats so parents know how many seats you have/g,'then tap Estimate for the seat count (Enivel checks the real seats when it verifies the vehicle)'],
