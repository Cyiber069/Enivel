i18nT('School transport in South Africa','Skoolvervoer in Suid-Afrika','Ukuthuthwa kwezingane zesikole eNingizimu Afrika');
i18nT('Log in','Teken in','Ngena');
i18nT('Safe school transport,','Veilige skoolvervoer,','Ukuthutha okuphephile kwesikole,');

i18nT(', live alerts.',', regstreekse kennisgewings.',', nezaziso ezibukhoma.');
i18nT("Book a checked driver for your child's school run. Know the moment they are picked up, at school and home again.","Bespreek 'n nagegaande bestuurder vir jou kind se skoolrit. Weet dadelik wanneer hulle opgelaai word, by die skool is en weer tuis is.","Bhuka umshayeli ohloliwe ozothutha ingane yakho iye esikoleni. Yazi ngaso leso sikhathi uma ithathwa, isesikoleni futhi isibuyele ekhaya.");

i18nT("ID, driver's licence, PrDP and police clearance checked before a driver can take a child. Documents are watched for expiry.","ID, bestuurslisensie, PrDP en polisieklaring word nagegaan voordat 'n bestuurder 'n kind mag vervoer. Ons hou die vervaldatums van dokumente dop.",'Umazisi, ilayisense yokushayela, i-PrDP nesitifiketi samaphoyisa kuyahlolwa ngaphambi kokuba umshayeli athuthe ingane. Siqapha nezinsuku zokuphelelwa yisikhathi kwemibhalo.');
i18nT('Live alerts','Regstreekse kennisgewings','Izaziso ezibukhoma');
i18nT('Know when the driver is 1 km away, when your child is picked up, at school and dropped off. Live map on the trip.',"Weet wanneer die bestuurder 1 km weg is, wanneer jou kind opgelaai word, by die skool aankom en afgelaai word. Regstreekse kaart tydens die rit.",'Yazi uma umshayeli eseku-1 km, uma ingane yakho ithathwa, ifika esikoleni futhi yehliswa. Ibalazwe elibukhoma ngesikhathi sohambo.');
i18nT('Kid Emergency button','Noodknoppie vir kinders','Inkinobho yezimo eziphuthumayo yengane');
i18nT("One tap sends your child's location straight to you and to Enivel.","Een tik stuur jou kind se ligging direk na jou en na Enivel.",'Ukuthinta kanye kuthumela indawo ingane yakho ekuyo ngqo kuwe naku-Enivel.');
i18nT('How it works','Hoe dit werk','Kusebenza kanjani');
i18nT('Add your child','Voeg jou kind by','Engeza ingane yakho');
i18nT('Name, school and pickup address. Takes a minute.',"Naam, skool en optel-adres. Dit neem 'n minuut.",'Igama, isikole nekheli lokuthathwa. Kuthatha umzuzu.');
i18nT('Pick a verified driver',"Kies 'n geverifieerde bestuurder",'Khetha umshayeli oqinisekisiwe');
i18nT('See the vehicle, the price, reviews and open seats on routes near you. Ask questions in chat.','Sien die voertuig, die prys, resensies en oop sitplekke op roetes naby jou. Vra vrae in die klets.','Bona imoto, intengo, izibuyekezo nezihlalo ezivulekile emizileni eseduze nawe. Buza imibuzo engxoxweni.');
i18nT('Relax with live alerts','Ontspan met regstreekse kennisgewings','Phumula ngezaziso ezibukhoma');
i18nT('Pay monthly in the app. Get told at every pickup and drop-off.',"Betaal maandeliks in die app. Kry 'n kennisgewing by elke optel en aflaai.",'Khokha nyanga zonke ku-app. Uzotshelwa njalo uma ingane ithathwa nalapho yehliswa.');
i18nT('Enivel today','Enivel vandag','I-Enivel namuhla');
i18nT('Live numbers from the app, not marketing estimates.','Regstreekse syfers uit die app, nie bemarkingskattings nie.','Izinombolo ezibukhoma ezivela ku-app, hhayi izilinganiso zokukhangisa.');
i18nT('Just launched','Pas bekendgestel','Isanda kwethulwa');
i18nT('Be one of the first families on Enivel. The first drivers are being verified now.','Wees een van die eerste gesinne op Enivel. Die eerste bestuurders word nou geverifieer.','Yiba ngomunye wemindeni yokuqala ku-Enivel. Abashayeli bokuqala baqinisekiswa manje.');
i18nT('Honest pricing','Eerlike pryse','Amanani athembekile');
i18nT('fee for parents','fooi vir ouers','imali yabazali');
i18nT('No hidden costs, no sign-up fee, no contract. Cancel any time.','Geen verborge koste, geen registrasiefooi en geen kontrak nie. Kanselleer enige tyd.','Azikho izindleko ezifihliwe, ayikho imali yokubhalisa, ayikho inkontileka. Ungahoxisa noma nini.');
i18nT('Drivers keep the full transport price.','Bestuurders hou die volle vervoerprys.','Abashayeli bagcina yonke intengo yokuthutha.');
i18nTR(/^You pay the driver's monthly price plus ([\d.,]+%)\. On a (R[\d\s.,]+) route that is (R[\d\s.,]+)\.$/,"Jy betaal die bestuurder se maandelikse prys plus $1. Op 'n $2-roete is dit $3.",'Ukhokha intengo yanyanga zonke yomshayeli kanye no-$1. Emzileni we-$2 lokho kungu-$3.');
i18nTR(/^Drivers: listing is free\. (R[\d\s.,]+)\/month only once you have your first paying passenger\.$/,"Bestuurders: lys is gratis. $1 per maand eers wanneer jy jou eerste betalende passasier het.",'Abashayeli: ukufaka umzila kumahhala. U-$1 ngenyanga kuphela uma usunomgibeli wokuqala okhokhayo.');
i18nTR(/^Invite a friend and you both get (R[\d\s.,]+) credit\.$/,"Nooi 'n vriend en julle kry albei $1 krediet.",'Mema umngane bese nobabili nithola isikweletu sika-$1.');
i18nT('Questions parents ask','Vrae wat ouers vra','Imibuzo abazali abayibuzayo');
i18nT('How are drivers verified?','Hoe word bestuurders geverifieer?','Abashayeli baqinisekiswa kanjani?');
i18nT("Every driver uploads their SA ID, driver's licence, PrDP (professional driving permit), police clearance, vehicle photos, operating licence and insurance. Enivel checks the documents and the ID number before a driver can list a route, and watches expiry dates afterwards.","Elke bestuurder laai hul SA ID, bestuurslisensie, PrDP (professionele bestuurspermit), polisieklaring, foto's van die voertuig, bedryfslisensie en versekering op. Enivel gaan die dokumente en die ID-nommer na voordat 'n bestuurder 'n roete mag lys, en hou daarna die vervaldatums dop.",'Wonke umshayeli ulayisha umazisi waseNingizimu Afrika, ilayisense yokushayela, i-PrDP (imvume yokushayela ngobungcweti), isitifiketi samaphoyisa, izithombe zemoto, ilayisense yokusebenza kanye nomshwalense. I-Enivel ihlola imibhalo nenombolo kamazisi ngaphambi kokuba umshayeli afake umzila, bese iqapha izinsuku zokuphelelwa yisikhathi.');
i18nT('What does it cost?','Wat kos dit?','Kubiza malini?');
i18nT("You pay the driver's monthly price plus a small Enivel fee on top. Drivers keep the full price. No sign-up fee, no contract, cancel any time.","Jy betaal die bestuurder se maandelikse prys plus 'n klein Enivel-fooi bo-op. Bestuurders hou die volle prys. Geen registrasiefooi, geen kontrak nie, kanselleer enige tyd.",'Ukhokha intengo yanyanga zonke yomshayeli kanye nemali encane ye-Enivel ngaphezulu. Abashayeli bagcina yonke intengo. Ayikho imali yokubhalisa, ayikho inkontileka, ungahoxisa noma nini.');
i18nT('How do I know my child is safe on the trip?','Hoe weet ek my kind is veilig tydens die rit?','Ngazi kanjani ukuthi ingane yami iphephile ohambweni?');
i18nT('You get an alert when the driver is near your pickup, when your child is picked up, when they arrive at school and when they are dropped off. On trips you can see the vehicle live on a map. Your child has an Emergency button that sends their location straight to you.',"Jy kry 'n kennisgewing wanneer die bestuurder naby jou optelpunt is, wanneer jou kind opgelaai word, by die skool aankom en afgelaai word. Tydens die rit sien jy die voertuig regstreeks op 'n kaart. Jou kind het 'n Noodknoppie wat hul ligging direk na jou stuur.",'Uthola isaziso uma umshayeli eseduze nendawo yokuthatha, uma ingane yakho ithathwa, uma ifika esikoleni nalapho yehliswa. Ngesikhathi sohambo ungabona imoto ibukhoma ebalazweni. Ingane yakho inenkinobho yezimo eziphuthumayo ethumela indawo ekuyo ngqo kuwe.');
i18nT('Can I talk to the driver before I book?','Kan ek met die bestuurder praat voordat ek bespreek?','Ngingakhuluma nomshayeli ngaphambi kokubhuka?');
i18nT('Yes. Every route has an Ask button that opens a chat with the driver, plus photos of the vehicle and reviews from other parents.',"Ja. Elke roete het 'n Vra-knoppie wat 'n klets met die bestuurder oopmaak, asook foto's van die voertuig en resensies van ander ouers.",'Yebo. Wonke umzila unenkinobho ethi Buza evula ingxoxo nomshayeli, kanye nezithombe zemoto nezibuyekezo zabanye abazali.');
i18nT('What if the driver is sick or the car breaks down?','Wat as die bestuurder siek is of die motor breek?','Kuthiwani uma umshayeli egula noma imoto iphukile?');
i18nT('Drivers mark days off in the app and you are told straight away. You can report any issue from the booking screen and Enivel follows up. In an emergency you have the Emergency button and the national numbers in the app.',"Bestuurders merk afdae in die app en jy word dadelik laat weet. Jy kan enige probleem vanaf die besprekingskerm aanmeld en Enivel volg dit op. In 'n noodgeval het jy die Noodknoppie en die nasionale noodnommers in die app.",'Abashayeli bamaka izinsuku abangasebenzi ngazo ku-app futhi uyatshelwa ngokushesha. Ungabika noma iyiphi inkinga esikrinini sokubhuka futhi i-Enivel iyalandelela. Esimweni esiphuthumayo unenkinobho yezimo eziphuthumayo nezinombolo zikazwelonke ku-app.');
i18nT("I'm a driver. What do I need?","Ek is 'n bestuurder. Wat het ek nodig?",'Ngingumshayeli. Ngidingani?');
i18nT('A valid licence, PrDP, police clearance, a roadworthy vehicle with insurance and an operating licence. Listing routes is free. Once you have a paying passenger you pay a small monthly fee, and you keep 100% of your transport price.',"'n Geldige lisensie, PrDP, polisieklaring, 'n padwaardige voertuig met versekering en 'n bedryfslisensie. Roetes lys is gratis. Sodra jy 'n betalende passasier het, betaal jy 'n klein maandelikse fooi en hou jy 100% van jou vervoerprys.",'Ilayisense esebenzayo, i-PrDP, isitifiketi samaphoyisa, imoto efanele umgwaqo enomshwalense kanye nelayisense yokusebenza. Ukufaka imizila kumahhala. Uma usunomgibeli okhokhayo ukhokha imali encane ngenyanga, futhi ugcina u-100% wentengo yakho yokuthutha.');
i18nT('Drive for Enivel','Ry vir Enivel','Shayela i-Enivel');
i18nT('Fill your empty seats with parents who are looking for you. Free to list, you keep 100% of your price, and verified drivers get booked first.',"Vul jou leë sitplekke met ouers wat na jou soek. Gratis om te lys, jy hou 100% van jou prys, en geverifieerde bestuurders word eerste bespreek.",'Gcwalisa izihlalo zakho ezingenalutho ngabazali abakufunayo. Ukufaka umzila kumahhala, ugcina u-100% wentengo yakho, futhi abashayeli abaqinisekisiwe babhukwa kuqala.');
i18nT('Sign up as a driver','Registreer as bestuurder','Bhalisa njengomshayeli');
i18nT('Is there a driver for my school?',"Is daar 'n bestuurder vir my skool?",'Ingabe ukhona umshayeli wesikole sami?');
i18nT("Type your child's school. We'll show verified drivers and open seats, or put you on the waitlist.","Tik jou kind se skool in. Ons wys geverifieerde bestuurders en oop sitplekke, of plaas jou op die waglys.",'Bhala igama lesikole sengane yakho. Sizokukhombisa abashayeli abaqinisekisiwe nezihlalo ezivulekile, noma sikufake ohlwini lokulinda.');
i18nT('Search','Soek','Sesha');
i18nT('Schools with Enivel drivers','Skole met Enivel-bestuurders','Izikole ezinabashayeli be-Enivel');
i18nT('Check a driver',"Gaan 'n bestuurder na",'Hlola umshayeli');
i18nT("Type a driver's full name or their number plate to see if they're verified on Enivel and when their documents expire.","Tik 'n bestuurder se volle naam of nommerplaat in om te sien of hulle op Enivel geverifieer is en wanneer hul dokumente verval.",'Bhala igama eliphelele lomshayeli noma inombolo yepuleti ukuze ubone ukuthi uqinisekisiwe yini ku-Enivel nokuthi imibhalo yakhe iphelelwa nini.');
i18nT('Check','Gaan na','Hlola');
i18nT('Talk to a person',"Praat met 'n mens",'Khuluma nomuntu');
i18nT('Enivel is built in South Africa by founder Kgosi Mosupi, to make the school run safer for children and simpler for parents and drivers. Questions before you sign up? We reply ourselves.','Enivel is in Suid-Afrika gebou deur stigter Kgosi Mosupi, om die skoolrit veiliger vir kinders en eenvoudiger vir ouers en bestuurders te maak. Vrae voordat jy registreer? Ons antwoord self.','I-Enivel yakhiwe eNingizimu Afrika ngumsunguli uKgosi Mosupi, ukwenza uhambo lwesikole luphephe kakhulu ezinganeni futhi lube lula kubazali nabashayeli. Unemibuzo ngaphambi kokubhalisa? Siyaziphendulela.');
i18nT('WhatsApp us','WhatsApp ons','Sithumelele ku-WhatsApp');
i18nT('Email Enivel000@gmail.com','E-pos Enivel000@gmail.com','I-imeyili: Enivel000@gmail.com');
i18nT('Legal centre','Regsentrum','Isikhungo sezomthetho');i18nT('Privacy','Privaatheid','Ubumfihlo');i18nT('Terms','Bepalings','Imigomo');i18nT('Safety','Veiligheid','Ukuphepha');
i18nT('Join the waitlist','Sluit by die waglys aan','Joyina uhlu lokulinda');i18nT('Book a seat',"Bespreek 'n sitplek",'Bhuka isihlalo');
const I18N_PH={'School name, e.g. Bapedi Primary':['Skoolnaam, bv. Bapedi Primary','Igama lesikole, isb. Bapedi Primary'],'e.g. Sipho Dlamini or GP 12 AB CD':['bv. Sipho Dlamini of GP 12 AB CD','isb. Sipho Dlamini noma GP 12 AB CD'],'Your name':['Jou naam','Igama lakho'],'WhatsApp number':['WhatsApp-nommer','Inombolo ye-WhatsApp'],'Your suburb / area':['Jou voorstad / area','Indawo ohlala kuyo']};
function i18nApply(root){const L=I18N.lang;if(L==='en'||!root)return;const d=I18N.dict[L],rx=I18N.rx[L];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const todo=[];let n;while((n=w.nextNode()))todo.push(n);
  for(const n of todo){const raw=n.nodeValue;const t=raw.replace(/\s+/g,' ').trim();if(!t)continue;let out=d[t];if(!out)for(const [re,rep] of rx){if(re.test(t)){out=t.replace(re,rep);break}}if(out)n.nodeValue=raw.replace(raw.trim(),out)}
  root.querySelectorAll('input[placeholder]').forEach(i=>{const p=I18N_PH[i.placeholder];if(p)i.placeholder=L==='af'?p[0]:p[1]})}
{const _i18nR=render;render=function(){const r=_i18nR.apply(this,arguments);try{document.documentElement.lang=I18N.lang==='af'?'af':I18N.lang==='zu'?'zu':'en';if(S.route==='landing'&&!S.authPage&&(!me()||S.g2Preview))i18nApply(document.getElementById('app'))}catch(e){}return r}}
/* coverage / results are drawn after render: translate them too */
for(const fn of ['l2Paint','l2Find']){try{const f=window[fn];if(typeof f==='function')window[fn]=async function(){const r=await f.apply(this,arguments);try{i18nApply(document.getElementById('l2-cov'))}catch(e){}return r}}catch(e){}}
