 {end:L=>`
<h2 id="p17">17. Children’s Accounts</h2>
<p>17.1 When a Parent creates a Children’s Account, we process the Child’s name, sign-in email address, app activity, ride checks, chat messages, settings and Emergency Button events, as the <a href="#" data-doc="kids">Children’s Accounts</a> terms describe, with the Parent’s consent under section 35(1)(a) of POPIA.</p>
<p>17.2 We apply our strictest protection to Children’s Accounts: the minimum information, no advertising, no marketing, no profiling, no sale and no publication. The Parent can see the account’s activity, change permissions, ask for a copy, correction or deletion, and remove the account at any time.</p>
<p>17.3 If we learn that a Children’s Account was created without the consent of a competent person, we will suspend it and delete the information we do not need to keep.</p>
<h2 id="p18">18. Emergency Button location</h2>
<p>18.1 When a Child presses the Emergency Button and confirms, the Child’s device sends its location, the time and any message the Child adds, and keeps sending updated locations for up to 30 minutes unless it stops earlier (for example if the phone is switched off, loses signal or the app is closed).</p>
<p>18.2 The location and message are shown to the Child’s Parent and to Enivel’s safety team. They are never shown to the Driver. Enivel may give them to the police, emergency services or a child-protection authority where we believe a Child may be in danger or the law requires it (section 8.2).</p>
<p>18.3 A Child’s location is collected only for this purpose and at no other time. If location permission is not allowed on the device, the alert is sent without a location.</p>
<h2 id="p19">19. Public information: Live Check Page, public wall and share cards</h2>
<p>19.1 <b>Live Check Page.</b> With the Driver’s consent, anyone who opens a Driver’s Roadblock Card QR code or link can see the Driver’s name, whether the Driver is verified and active, the validity status and recorded expiry dates of the Driver’s documents, and vehicle details. It never shows ID numbers, photographs, document images, phone numbers, addresses, Children, routes or location. The Driver can withdraw consent by resetting the QR code (<a href="#" data-doc="roadcard">Roadblock Card and Live Check</a>).</p>
<p>19.2 <b>Public wall.</b> We publish totals, such as how many Children’s transport Enivel paid this month. A winner’s first name and surname initial are shown only if the winner opts in, and consent can be withdrawn at any time (<a href="#" data-doc="enivel-pays" data-sec="ep11">Enivel Pays Rules 11</a>).</p>
<p>19.3 <b>Share cards.</b> A share card contains only what is shown on it. You decide whether to share it and are responsible for what you post.</p>
<h2 id="p20">20. Payments made by Enivel</h2>
<p>20.1 When Enivel pays a Parent’s month, the payment is made through PayFast on PayFast’s own secure payment page. PayFast processes the card details as its own responsible party under its own terms and privacy policy. Enivel receives only confirmation of the payment, such as the amount, date, reference and status, and never full card details.</p>
<p>20.2 The Parent whose month is paid sees that it was paid by Enivel. The Parent receives no information about the payer’s card, bank account or personal details.</p>
<p>20.3 We keep a record of the Parent, Children, Bookings, amounts and dates as financial records (section 10).</p>
<h2 id="p21">21. Administrator audit log and safety centre</h2>
<p>21.1 Significant actions by Enivel administrators, for example approving, rejecting or banning an account, paying a month, running an Enivel Pays draw, changing settings or acting on a safety alert, are recorded in an audit log with the administrator, the action, the record affected and the time.</p>
<p>21.2 The safety centre brings together SOS alerts, Emergency Button alerts, reports and the actions taken on them.</p>
<p>21.3 Both are visible only to authorised administrators. They are kept to protect Children, to hold administrators accountable for how they use their access, to investigate and resolve disputes, to establish or defend legal claims, and to respond to lawful requests from the police, courts and regulators, for the periods in section 10.</p>
<p>21.4 You may ask for audit log entries about your own account under section 23 of POPIA or our PAIA manual, subject to the privacy of others and the grounds for refusal in PAIA.</p>
<h2 id="p22">22. Face ID and fingerprint sign-in</h2>
<p>22.1 Face ID or fingerprint sign-in uses a passkey created by your device. Your face or fingerprint is checked only by your device. Enivel never receives, stores or has access to biometric information; we store only a public key and a device label so that we can recognise the passkey.</p>
<p>22.2 Switching it off on a device removes that passkey from your Enivel account. Anyone whose face or fingerprint your device accepts may be able to sign in on that device.</p>
<h2 id="p23">23. Sharing and planning tools</h2>
<p>23.1 Public route pages show only the Route and Driver details listed in clause 32.2 of the <a href="#" data-doc="terms" data-sec="t32">Terms of Service</a>. A Driver can stop a page by pausing or removing the Route.</p>
<p>23.2 Share links and invites may carry your referral code so that a new User’s sign-up can be credited. We do not track who opens a link beyond what is needed to credit a referral and to keep the Platform secure.</p>
<p>23.3 Calendar files you download may include your Child’s first name and ride times. They are stored on your device and in any calendar app you import them into, under that provider’s terms, and you are responsible for keeping them private.</p>
<p>23.4 Smart match, seat maps and earnings forecasts are calculated from information already in the Platform. They do not use special personal information and are not used to make decisions about you.</p>`}
],'p17');

/* ============================== Information Security ============================== */
lg10Patch('security',[{end:L=>`
<h2 id="x7">7. Administrator audit log</h2>
<p>7.1 Significant administrator actions are recorded in an audit log that only authorised administrators can see, as section 21 of the <a href="#" data-doc="privacy" data-sec="p21">Privacy Policy</a> describes. We restrict who can change or delete entries.</p>
<p>7.2 We review the audit log when investigating complaints, security incidents and safety matters.</p>
<h2 id="x8">8. Children’s Account security</h2>
<p>8.1 A Children’s Account has its own sign-in, set up by the Parent with the Parent’s credentials, and can be signed out or removed by the Parent at any time.</p>
<p>8.2 Parents must keep their Child’s sign-in details secret and change them if they may have been shared. Face ID and fingerprint sign-in use passkeys; biometric information never leaves the device.</p>
<h2 id="x9">9. Live Check codes</h2>
<p>9.1 Roadblock Card QR codes use identifiers that are designed to be hard to guess and show only limited information. A Driver can reset a code at any time, after which the old code stops working.</p>
<p>9.2 Report a lost phone or a misused card immediately to ${L.EMAIL}.</p>
<h2 id="x10">10. Card payments</h2>
<p>Card details for payments made by Enivel are entered only on PayFast’s secure payment page and are never received or stored by Enivel. Enivel staff will never ask you for card details, passwords or one-time PINs.</p>`}],'x7');

/* ============================== Child Safeguarding ============================== */
lg10Patch('safeguarding',[{end:L=>`
<h2 id="s11">11. Children’s Accounts and contact with Children</h2>
<p>11.1 Children’s Accounts are created and controlled by Parents (<a href="#" data-doc="kids">Children’s Accounts</a>). All the standards in this policy apply to every contact between a Driver and a Child through Enivel.</p>
<p>11.2 A Driver’s messages to a Child must be short, professional, visible and about the trip. A Driver must never ask a Child to move a conversation off Enivel, keep a secret, send a photograph, share their location or meet outside the transport arrangement. Any such request is treated as a safeguarding concern.</p>
<p>11.3 Enivel’s safety team may review messages between Drivers and Children where a concern is raised.</p>
<h2 id="s12">12. The Emergency Button</h2>
<p>12.1 A Child with a Children’s Account can press the Emergency Button to send their location and an optional message to their Parent and to Enivel’s safety team, which keeps sharing the location for up to 30 minutes. It is never shared with the Driver.</p>
<p>12.2 When we see an alert we try to contact the Parent and, where we believe the Child may be in danger, may contact the police or emergency services and give them the Child’s location.</p>
<p><b>12.3 The Emergency Button is not an emergency service, and Enivel does not guarantee delivery of an alert or any response time.</b> In an emergency, call 10111 or 112 first.</p>
<p>12.4 A Child is never blamed or penalised for pressing the button in good faith.</p>
<h2 id="s13">13. Parent notes and the Driver’s role</h2>
<p>Parents’ notes help the Driver with practical matters. They are not for emergencies or medical instructions. A Driver is not a caregiver or medical provider (<a href="#" data-doc="parent" data-sec="pa18">Parent Terms 18</a>).</p>
<h2 id="s14">14. Safety centre and records</h2>
<p>14.1 Enivel’s safety centre brings together SOS alerts, Emergency Button alerts, reports and the actions taken. Access is restricted to authorised administrators and recorded in the audit log.</p>
<p>14.2 These records are kept for the periods in the Privacy Policy and shared with the South African Police Service, the Department of Social Development or a designated child protection organisation where the law requires or allows it, as section 7 sets out.</p>`}],'s11');

/* ============================== Incident Response ============================== */
lg10Patch('incidents',[{end:L=>`
<h2 id="i11">11. The Emergency Button in a Children’s Account</h2>
<p>11.1 A Child with a Children’s Account can press the Emergency Button, confirm, and then either add a short message or choose “Skip and send”. The alert sends the Child’s location, the time and any message to the Parent’s account and to Enivel’s safety team, notifies the Parent, and keeps sharing the Child’s location for up to 30 minutes. It is deliberately not shared with the Driver.</p>
<p><b>11.2 The Emergency Button is not an emergency service and is not a substitute for calling 10111, 10177 or 112. Delivery, location accuracy and response times are not guaranteed. Enivel cannot dispatch police, ambulances or security, and our safety team may not see an alert immediately, particularly outside support hours.</b></p>
<p>11.3 <b>Parents:</b> when you receive an alert, try to reach your Child at once. If you cannot, or believe your Child is in danger, call 10111 or 112 immediately and give the location shown. Do not wait for Enivel.</p>
<p>11.4 <b>Enivel:</b> when the safety team sees an alert, we will try to contact the Parent and, where we believe a Child may be in danger, may contact the police or emergency services and share the Child’s location and message with them. We preserve the alert and related records (section 5).</p>
<p>11.5 Pressing the button in good faith is never a breach, even if there was no emergency. Deliberate, repeated pranks are handled with the Parent first, as the <a href="#" data-doc="kids" data-sec="k9">Children’s Accounts</a> terms describe.</p>
<h2 id="i12">12. Roadside stops and roadblocks</h2>
<p>12.1 Stop safely when instructed, cooperate with the officer and produce your own driving licence, Professional Driving Permit, operating licence and other documents the law requires. The Roadblock Card does not replace them (<a href="#" data-doc="roadcard">Roadblock Card and Live Check</a>).</p>
<p>12.2 Keep the Children safe and together in the vehicle unless an officer directs otherwise, and tell their Parents through Enivel as soon as it is safe, including any delay.</p>
<p>12.3 If a vehicle is impounded or cannot continue, arrange safe onward transport or collection with the Parents, never leave a Child unattended, and report it to Enivel through the Platform immediately.</p>
<p><b>12.4 To the extent the law allows, Enivel is not liable for fines, impoundment, delays or other consequences of a roadside stop (Roadblock Card and Live Check terms section 3).</b></p>
<h2 id="i13">13. Breakdowns and defects found in a pre-trip check</h2>
<p>13.1 If a Pre-trip Check shows a defect that could affect safety, do not carry Children until it is repaired. Tell the Parents through Enivel as early as possible.</p>
<p>13.2 If the vehicle breaks down on a trip, move the Children to safety away from traffic, switch on hazard lights, tell the Parents through Enivel (a running-late notice is not enough on its own), and arrange safe onward transport or collection with them.</p>`}],'i11');

/* ============================== Payments ============================== */
lg10Patch('payments',[{end:L=>`
<h2 id="m11">11. Transport fees paid by Enivel</h2>
<p>11.1 Enivel may, at its sole discretion and without any obligation, choose to pay a Parent’s monthly Transport Price and Platform Fee for one or more Children and months (a “Sponsored Month”). No one is entitled to be chosen, and choosing one Parent creates no right for anyone else.</p>
<p>11.2 Enivel pays with its own card or account through PayFast, on PayFast’s own secure payment page. Enivel never receives or stores card details. The Parent does not receive, and has no access to, the payer’s card, bank or personal details, and the Parent’s own payment method is not charged for that month.</p>
<p>11.3 The Parent is told in the app that the month’s transport fee has been paid, shown as paid by Enivel admin. The Driver receives the Transport Price as usual (Driver Agreement clause 10.4).</p>
<p>11.4 A Sponsored Month covers only Bookings that are still unpaid for that month when Enivel pays. It does not refund amounts the Parent already paid. If the Parent pays a covered Booking by mistake afterwards, the Parent may ask for a refund under section 5.</p>
<p><b>11.5 A Sponsored Month is a gift. It has no cash value, cannot be transferred, sold or exchanged, does not extend a Booking or fix a price, and creates no right to future payments. If the Booking ends during a Sponsored Month, the unused part is not paid out. Any tax or other consequence is the recipient’s responsibility.</b></p>
<p>11.6 Enivel may cancel a Sponsored Month before it starts, or recover it, if it was made in error or obtained by fraud or abuse (<a href="#" data-doc="promotions" data-sec="g5">Referral, Credit and Giveaway Terms 5</a>).</p>
<p>11.7 Enivel will never ask anyone for card details, passwords or one-time PINs to receive a Sponsored Month. A message that does is a scam; report it to ${L.EMAIL}.</p>
<h2 id="m12">12. Enivel Pays prizes</h2>
<p>Months won in the Enivel Pays draw are paid under the <a href="#" data-doc="enivel-pays">Enivel Pays Rules</a>. Section 11 applies to them as well, except where those Rules say otherwise.</p>`}],'m11');

/* ============================== Acceptable Use ============================== */
lg10Patch('conduct',[{end:L=>`
<h2 id="c8">8. Rules for the new features</h2><p>Nobody may:</p><ul>
<li>Show or use another person’s Roadblock Card, edit a card, or pass off a screenshot, photograph or recording as the live card or live check.</li>
<li>Make a false Pre-trip Check or tick items that were not checked.</li>
<li>Press the Emergency Button, or get a Child to press it, as a prank or to cause trouble. A Child who presses it in good faith never breaks this rule.</li>
<li>Share a Child’s sign-in details, use a Children’s Account to pay or book, or pretend to be a Child.</li>
<li>Contact a Child through Enivel about anything other than the trip.</li>
<li>Manipulate Enivel Pays or Sponsored Months, for example with fake Bookings, price changes or collusion.</li>
<li>Make fake certificates or share cards, or claim falsely that Enivel paid for something.</li>
<li>Pretend to be an Enivel administrator or ask anyone for card details, passwords or one-time PINs in Enivel’s name.</li>
<li>Copy, scrape or publish information from Live Check Pages.</li></ul>
<p>These breaches are serious, may be crimes (including under the Cybercrimes Act 19 of 2020) and may lead to a permanent ban and a report to the police.</p>`}],'c8');

/* ============================== Location notice ============================== */
lg10Patch('location',[
 {rep:['Location is not collected from Parents or Children.','Location is not collected from Parents or Children, except a Child’s location when the Child presses the Emergency Button in a Children’s Account (section 15).']},
 {end:L=>`
<h2 id="l11">11. Approach Alerts</h2><p>11.1 A Parent receives an Approach Alert when the Driver’s phone reports a position within the chosen distance of the Child’s pinned pickup point. The default is 1 km; the Parent can choose another distance in the app.</p><p>11.2 The distance is measured in a straight line from the position the Driver’s phone reports, not along roads. Depending on the road layout, traffic and the order of stops, the Driver may take much more or much less time to arrive than the distance suggests.</p><p>11.3 An alert can only be sent if the Driver has started the trip, the Driver’s phone is sharing its location and is connected, and the pickup point is pinned on the map. It is normally sent once per trip and may not be sent if the Driver passes quickly or the phone reports its position only now and then, for example to save battery.</p><p><b>11.4 Approach Alerts are best-effort estimates. They may be late, early, inaccurate or not sent at all, and to the extent the law allows Enivel is not liable for a missed, late or wrong alert.</b></p>
<h2 id="l12">12. Arrival estimates, live status and running-late notices</h2><p>12.1 Arrival times, progress, live status (such as on the way, outside or picked up) and running-late notices are worked out from the Driver’s reported location, the Route times, records made in the app and simple calculations, or are sent by the Driver or a Child.</p><p><b>12.2 They are estimates and messages, not promises.</b> A Driver’s running-late notice does not change the agreed times or the Driver’s duty to be punctual, and a Child’s “ready” tap does not mean an adult is with the Child.</p>
<h2 id="l13">13. Phone pop-ups</h2><p>13.1 Phone pop-ups are sent through push services run by your phone’s operating system and browser providers.</p><p><b>13.2 Delivery is not guaranteed.</b> A pop-up may be delayed or never shown if notifications are not allowed, the phone is off, offline, in battery-saving, power-saving or do-not-disturb mode, the operating system limits background activity, browser data was cleared, or a push service is down. On iPhone, pop-ups while Enivel is closed only work if Enivel was added to the Home Screen and notifications were allowed.</p><p>13.3 The notifications list in the app is the record of what was sent. Check it if you expected a pop-up.</p>
<h2 id="l14">14. The map for Children</h2><p>If the Parent allows map tracking during the ride, a Child signed in to a Children’s Account can follow the ride on the map while on board, using the Driver’s location as in section 1. This does not track the Child’s own phone.</p>
<h2 id="l15">15. Emergency Button location</h2><p>When a Child presses the Emergency Button and confirms, the Child’s phone sends its location to the Parent and to Enivel’s safety team and keeps sharing it for up to 30 minutes. It is not shared with the Driver. GPS and network location can be inaccurate by tens or hundreds of metres, or unavailable. See section 18 of the <a href="#" data-doc="privacy" data-sec="p18">Privacy Policy</a>.</p>
<h2 id="l16">16. Driver document reminders</h2><p>Reminders are worked out from the expiry dates recorded in Enivel. A wrong date leads to a wrong reminder, and reminders may arrive late or not at all. Keeping documents valid is the Driver’s sole responsibility (<a href="#" data-doc="driver" data-sec="d18">Driver Agreement 18</a>).</p>
<h2 id="l17">17. Weekly safety report and summaries</h2><p>Weekly reports and other summaries are built from records in the Platform. They may be incomplete if a record was not made, a phone was offline or data did not sync. They are information only.</p>
<h2 id="l18">18. Your responsibility for new features</h2><p><b>Section 10 applies to every feature in sections 11 to 17. The Parent remains responsible for supervising the Child until pickup and after handover, and the Driver remains responsible for punctuality, documents, the vehicle and safe driving.</b></p>`}
],'l11');

function lg10Ver(s){return String(s).split('Version '+LG10_PREV).join('Version '+LG10_VERSION).split('effective '+TERMS_EFFECTIVE).join('effective '+LG10_EFFECTIVE)}
const _lg10Legal=VIEWS.legal;

  const i=s.indexOf('<div class="grid g2">');if(i>=0)s=s.slice(0,i)+legalWhatsNew(null)+s.slice(i);
  s=s.replace(/(legalDoc:'([a-z-]+)'\}\)"><b>)/g,(m,a,id)=>{const d=legalDoc(id);return d&&d.lg10==='new'?a.replace('<b>',`<span class="lg10-tag">New</span><b>`):a});
  setTimeout(()=>{const m=$('main');if(m)legalLinks(m)},40);return s};

  if(d&&d.lg10){const sub=`<p class="muted">${h(d.sub)} · effective ${LG10_EFFECTIVE}</p>`;const chip=d.lg10==='new'?`<p><span class="lg10-tag">New in version ${LG10_VERSION}</span></p>`:d.lg10New?`<button class="lg10-jump" onclick="document.getElementById('${d.lg10New}')?.scrollIntoView({behavior:'smooth',block:'start'})">${ICON.bolt}<span>New in this version · jump to it</span></button>`:'';if(chip&&s.includes(sub))s=s.replace(sub,()=>sub+chip)}

  <label class="small" style="display:flex;gap:8px;margin-top:12px;line-height:1.45"><input type="checkbox" id="tg-ok"> <span>I accept the <a href="#" data-doc="terms">Terms</a>, <a href="#" data-doc="privacy">Privacy Policy</a>, <a href="#" data-doc="safeguarding">Child Safeguarding Policy</a>${drv?`, <a href="#" data-doc="driver">Driver Agreement</a> and <a href="#" data-doc="roadcard">Roadblock Card terms</a>`:`, <a href="#" data-doc="parent">Parent Terms</a> and <a href="#" data-doc="kids">Children’s Accounts</a> terms`}.</span></label>

    $('#tg-go',m).onclick=async()=>{if(!$('#tg-ok',m).checked){if(typeof buzz==='function')buzz();return toast('Tick the box to accept')}const b=$('#tg-go',m);b.disabled=true;

const _lg10Render=render;render=function(){const r=_lg10Render.apply(this,arguments);try{const k=S.lg10Tick;if(k&&S.session){const u=me();if(u&&!S.admin){if(!u.termsAccepted&&k.email&&u.email===k.email)Store.patch('users',u.id,{termsAccepted:k.rec});S.lg10Tick=null}}}catch(e){console.warn('terms record',e)}return r};
/* the child consent the base records on "Add child" carries the version in force */
if(typeof addKid==='function'){const _lg10AddKid=addKid;addKid=function(id){const r=_lg10AddKid.apply(this,arguments);const m=$('.modal');const b=m&&$('#k-save',m);

const _lg10AMore=VIEWS['a-more'];VIEWS['a-more']=()=>{let s=_lg10AMore();const a='Shown in every policy. Use your registered company details.</p>';
  if(s.includes(a)){const us=Store.all('users').filter(u=>u.role==='parent'||u.role==='driver');const ok=us.filter(u=>u.termsAccepted?.version===LG10_VERSION).length;
    s=s.replace(a,()=>a+`<p class="tiny muted" id="lg10-acc" style="margin-top:4px">Terms ${LG10_VERSION} · ${ok} of ${us.length} account${us.length===1?'':'s'} accepted · <a href="#" onclick="event.preventDefault();go('legal')">Legal centre</a></p>`)}
