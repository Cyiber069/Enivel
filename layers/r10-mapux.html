<style>
/* map box: smaller on computers (owner: "the block that holds the map is too big on desktop") */
@media(min-width:760px){.rmap{max-height:320px}.rmap.mux-home{max-height:270px}}
.rmap .mux-hint{display:none!important;position:absolute;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:rgba(0,0,0,.42);color:#fff;font:600 .95rem/1.3 Manrope,system-ui,sans-serif;text-align:center;padding:16px;opacity:0;transition:opacity .25s}
.rmap .mux-hint.on{opacity:1}
</style>
<script>
/* ===== 06 Nov owner feedback on the new map:
   - "I can zoom in very far and zoom out far, please don't make that possible" → zoom 9 (city) to 18 (street), map kept inside South Africa;
   - "I can't even scroll, it just keeps making me zoom in and out" → like Google Maps on websites:
       computer: mouse wheel scrolls the page, Ctrl/⌘ + scroll (or trackpad pinch) zooms the map, + / − buttons still work;
       phone: one finger scrolls the page, two fingers move/zoom the map;
     a short hint shows when someone tries the old way;
   - map box smaller on computers. ===== */
const MUX={minZoom:9,maxZoom:18,bounds:[[-35.6,15.8],[-21.6,33.6]]};
const MUX_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'');
function muxTouch(){try{return matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&!matchMedia('(pointer:fine)').matches)}catch(e){return false}}

/* limits are re-applied on every redraw (an older layer raises the max zoom on refresh) */
function muxLimits(M){const map=M.map;try{M.box.classList.add('mux-'+(M.mode||'map'))}catch(e){}
  if(map.getMinZoom()!==MUX.minZoom)map.setMinZoom(MUX.minZoom);if(map.getMaxZoom()!==MUX.maxZoom)map.setMaxZoom(MUX.maxZoom);
  if(!map.options.maxBounds){map.options.maxBoundsViscosity=1;map.setMaxBounds(L.latLngBounds(MUX.bounds))}
  map.eachLayer(l=>{if(l instanceof L.TileLayer&&l.options.maxZoom>MUX.maxZoom)l.options.maxZoom=MUX.maxZoom});
  if(map.getZoom()>MUX.maxZoom)map.setZoom(MUX.maxZoom);if(map.getZoom()<MUX.minZoom)map.setZoom(MUX.minZoom)}
function muxApply(M){if(!M||!M.map)return;muxLimits(M);if(M.map._mux)return;const map=M.map,box=M.box;map._mux=true;
  /* 07 Nov owner: normal gestures — mouse wheel zooms, one finger moves the map (no Ctrl / two-finger rule) */
  if(!map.scrollWheelZoom.enabled())map.scrollWheelZoom.enable();if(map.dragging&&!map.dragging.enabled())map.dragging.enable();
  map.options.wheelPxPerZoomLevel=90;map.options.wheelDebounceTime=30;
  /* fitting never zooms past street level or out past city level */
  if(!M._muxFit){M._muxFit=true;map.on('zoomend',()=>{const z=map.getZoom();if(z>MUX.maxZoom)map.setZoom(MUX.maxZoom);else if(z<MUX.minZoom)map.setZoom(MUX.minZoom)})}}
{const _muxRmap=MOUNT.rmap;MOUNT.rmap=async function(el){const key=[el.dataset.mode,el.dataset.route||'',el.dataset.kid||''].join(':');const res=await _muxRmap.call(this,el);try{const M=typeof MAPS==='object'?MAPS[key]:null;if(M&&M.box?.isConnected)muxApply(M)}catch(e){console.warn('mux',e)}return res}}
</script>
