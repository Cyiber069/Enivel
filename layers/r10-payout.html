<style>
.po-card .num{font-size:1.05rem}
.po-mask{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.po-bank{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.po-copy{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--fg2)}
.po-copy:active{transform:scale(.96)}
.po-warn{color:var(--warn);font-size:.72rem}
.po-cell{font-size:.78rem;line-height:1.35;white-space:nowrap}
</style>
<script>
/* ===== Driver bank details → admin payouts. The field lives on the driver's own user doc ("payout");
   the server's _public_user whitelist means only the driver and the admin can read it. ===== */
const PO_BANKS=[['Absa','632005'],['African Bank','430000'],['Bank Zero','888000'],['Bidvest Bank','462005'],['Capitec','470010'],['Discovery Bank','679000'],['FNB','250655'],['Investec','580105'],['Nedbank','198765'],['Standard Bank','051001'],['TymeBank','678910'],['Other','']];
function poOf(u){const p=u&&u.payout;return p&&p.number?p:null}
function poMask(n){n=String(n||'').replace(/\D/g,'');return n.length>4?'•••• '+n.slice(-4):n}
function poNameMatch(u){const p=poOf(u);if(!p)return true;const norm=s=>String(s||'').toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(Boolean);const a=norm(u.name),b=norm(p.holder);if(!a.length||!b.length)return true;return a.some(w=>w.length>2&&b.includes(w))}
function poCopy(text,label){try{navigator.clipboard?.writeText(text)}catch(e){}toast((label||'Copied')+' copied')}
function poForm(){const u=me();if(!u)return;const p=u.payout||{};modal(`<h3>Bank details for payouts</h3><p class="small muted" style="margin:6px 0 12px">Enivel pays what parents paid you, minus your fees, into this account by EFT. Only you and the Enivel admin can see it. Use an account in your own name: payouts to someone else's account are held until we have checked.</p>
  <div class="stack"><div class="field"><label>Bank</label><select id="po-bank">${PO_BANKS.map(([b])=>`<option ${p.bank===b?'selected':''}>${b}</option>`).join('')}</select></div>
  <div class="field"><label>Account holder (as on the bank account)</label><input id="po-holder" maxlength="80" value="${h(p.holder||u.name||'')}" autocomplete="off"></div>
  <div class="field"><label>Account number</label><input id="po-number" inputmode="numeric" maxlength="16" value="${h(p.number||'')}" autocomplete="off" placeholder="Digits only"></div>
  <div class="row" style="gap:10px"><div class="field grow"><label>Account type</label><select id="po-type">${['Cheque / current','Savings','Transmission'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field grow"><label>Branch code</label><input id="po-branch" inputmode="numeric" maxlength="6" value="${h(p.branch||'')}" autocomplete="off"></div></div>
  <button class="btn wide" id="po-save">Save bank details</button>${p.number?'<button class="btn ghost wide" id="po-rm">Remove bank details</button>':''}</div>`,m=>{const bank=$('#po-bank',m),br=$('#po-branch',m);const auto=()=>{const c=(PO_BANKS.find(([b])=>b===bank.value)||[])[1];if(c)br.value=c};if(!p.branch)auto();bank.onchange=auto;
    $('#po-save',m).onclick=async()=>{const holder=val(m,'po-holder').trim(),number=val(m,'po-number').replace(/\s/g,''),branch=val(m,'po-branch').replace(/\s/g,'');if(!holder)return toast('Account holder is required');if(!/^\d{6,16}$/.test(number))return toast('Account number: 6 to 16 digits');if(!/^\d{6}$/.test(branch))return toast('Branch code: 6 digits');const cur=me();await Store.patch('users',cur.id,{payout:{bank:bank.value,holder,number,type:val(m,'po-type'),branch,updatedAt:Date.now()}});if(typeof auditLog==='function')try{auditLog('payout.details','users',cur.id)}catch(e){}closeModal();toast('Bank details saved');render()};
    const rm=$('#po-rm',m);if(rm)rm.onclick=async()=>{await Store.patch('users',me().id,{payout:null});closeModal();toast('Bank details removed');render()}})}
function poCard(){const u=me();if(!u||u.role!=='driver')return '';const p=poOf(u);const pax=typeof driverPassengers==='function'?driverPassengers(u.id):0;
  if(!p)return `<div class="card po-card" style="margin-bottom:14px;border-color:${pax?'var(--warn)':'var(--line)'}"><div class="row between"><div><h3>Where should Enivel pay you?</h3><p class="small muted" style="margin-top:4px">Add your bank account so your monthly payout can be sent. ${pax?'<b>You already have passengers: add it before month-end.</b>':'Takes a minute.'}</p></div></div><button class="btn wide" style="margin-top:10px" onclick="poForm()">Add bank details</button></div>`;
  return `<div class="card po-card" style="margin-bottom:14px"><div class="row between"><div><h3>Payout account</h3><div class="small" style="margin-top:4px"><b>${h(p.bank)}</b> · ${h(p.type||'')}<br><span class="po-mask">${h(poMask(p.number))}</span> · ${h(p.holder)}</div>${poNameMatch(u)?'':'<div class="po-warn" style="margin-top:4px">The account holder name differs from your profile name. Payouts to that account are checked by hand first.</div>'}</div><button class="btn sm ghost" onclick="poForm()">Edit</button></div></div>`}
const _poDBill=VIEWS['d-billing'];VIEWS['d-billing']=function(){const html=_poDBill.apply(this,arguments);try{const c=poCard();if(!c)return html;const i=html.indexOf('<div class="kpi">');return i>0?html.slice(0,i)+c+html.slice(i):html+c}catch(e){return html}};
const _poDHome=VIEWS['d-home'];VIEWS['d-home']=function(){const html=_poDHome.apply(this,arguments);try{const u=me();if(!u||u.role!=='driver'||poOf(u))return html;const pax=typeof driverPassengers==='function'?driverPassengers(u.id):0;if(!pax)return html;const nag=`<div class="notice" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between"><span class="small">Add your bank details so your payout for this month can be sent.</span><button class="btn sm" onclick="poForm()">Add</button></div>`;const i=html.indexOf('<div class="kpi">');return i>0?html.slice(0,i)+nag+html.slice(i):html+nag}catch(e){return html}};
/* ---- admin: payouts table, "Mark paid out" sheet, CSV ---- */
function poAdminCell(d){const p=poOf(d);if(!p)return '<span class="pill warn tiny">No bank details</span><div class="tiny muted">Driver adds them under Earnings & fees</div>';const warn=poNameMatch(d)?'':'<div class="po-warn">Holder differs from driver name: check before paying</div>';return `<div class="po-cell"><b>${h(p.bank)}</b> · ${h(p.type||'')}<br>${h(p.holder)}<br><span class="po-mask">${h(p.number)}</span> · branch ${h(p.branch)} <button class="po-copy" onclick="poCopy('${h(p.number)}','Account number')">copy</button>${warn}</div>`}
if(VIEWS['a-payouts']){const _poAPay=VIEWS['a-payouts'];VIEWS['a-payouts']=function(){let html=_poAPay.apply(this,arguments);try{if(!S.admin)return html;html=html.replace('<th style="text-align:right">Due</th><th></th>','<th style="text-align:right">Due</th><th>Pay to</th><th></th>');html=html.replace(/<tr data-g2-pay="([^"]+)">([\s\S]*?)(<td>(?:<button class="btn sm" onclick="g2MarkPaid|<span class="pill live tiny">settled))/g,(m,id,mid,tail)=>{const d=Store.get('users',id);return `<tr data-g2-pay="${id}">${mid}<td>${poAdminCell(d)}</td>${tail}`});html=html.replace('colspan="11"','colspan="12"');const miss=Store.all('users').filter(u=>u.role==='driver'&&!u.banned&&!poOf(u)&&(typeof driverPassengers==='function'?driverPassengers(u.id):0)>0);if(miss.length)html=html.replace('<div class="kpi">',`<div class="notice" style="margin-bottom:12px"><b>${miss.length} driver${miss.length>1?'s':''} with passengers ${miss.length>1?'have':'has'} no bank details:</b> ${miss.map(u=>h(u.name)).join(', ')}. <button class="btn sm ghost" onclick="poNudge()">Remind them</button></div><div class="kpi">`)}catch(e){console.warn('payout col',e)}return html}}
async function poNudge(){const miss=Store.all('users').filter(u=>u.role==='driver'&&!u.banned&&!poOf(u)&&(typeof driverPassengers==='function'?driverPassengers(u.id):0)>0);for(const u of miss)await notify(u.id,'Add your bank details in Earnings & fees so Enivel can pay you this month.','pay','d-billing');toast('Reminder sent to '+miss.length)}
if(typeof g2MarkPaid==='function'){const _poMark=g2MarkPaid;g2MarkPaid=function(driverId,m){_poMark(driverId,m);try{const mm=$('.modal');const d=Store.get('users',driverId);if(!mm||!d)return;const p=poOf(d);const box=document.createElement('div');box.className='card';box.style.cssText='margin:10px 0;padding:10px 12px';box.innerHTML=p?`<div class="eyebrow">Pay to</div><div class="po-bank" style="margin-top:4px"><b>${h(p.bank)}</b><span>${h(p.type||'')}</span><span>branch ${h(p.branch)}</span></div><div class="small" style="margin-top:4px">${h(p.holder)}</div><div class="row" style="gap:8px;margin-top:4px"><span class="po-mask">${h(p.number)}</span><button class="po-copy" onclick="poCopy('${h(p.number)}','Account number')">copy</button><button class="po-copy" onclick="poCopy('${h([p.bank,p.holder,p.number,'branch '+p.branch,p.type||''].join(' · '))}','Bank details')">copy all</button></div>${poNameMatch(d)?'':'<div class="po-warn" style="margin-top:6px">Account holder differs from the driver\'s name. Confirm with the driver before paying.</div>'}`:`<div class="po-warn"><b>No bank details yet.</b> Ask the driver to add them under Earnings & fees, or pay by another agreed method and note it in the reference.</div>`;const anchor=mm.querySelector('.g2-fields');anchor?anchor.insertAdjacentElement('beforebegin',box):mm.appendChild(box)}catch(e){}}}
if(typeof g2PayoutCsv==='function'){const _poCsv=g2PayoutCsv;g2PayoutCsv=function(m){/* same rows, plus bank columns */const rows=g2Payouts(m);const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const head=['Month','Driver','Email','Phone','Passengers','Expected from bookings','Paid by parents','Sponsored by Enivel','Driver fees','Net to driver','Already paid out','Due now','Bank','Account holder','Account number','Branch code','Account type','Holder matches name'];const lines=[head.map(esc).join(',')];for(const r of rows){const p=poOf(r.d)||{};lines.push([m,r.d.name,r.d.email||'',r.d.phone||'',r.bookings,r.expected,r.paid,r.sponsored,r.fees,r.net,r.paidOut,r.due,p.bank||'',p.holder||'',p.number?"'"+p.number:'',p.branch||'',p.type||'',p.number?(poNameMatch(r.d)?'yes':'CHECK'):''].map(esc).join(','))}const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='enivel-payouts-'+m+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}
/* help centre answers */
try{if(Array.isArray(HC_FAQ)){HC_FAQ.push({r:'d',c:'money',q:'How do I get paid?',a:'Add your bank account under Earnings & fees → Payout account. Each month Enivel pays what parents paid for your passengers, minus your R100 platform fee and any parking slots, by EFT into that account, and you see "Paid out" in your ledger.',k:'paid payout bank account eft money'})}}catch(e){}
/* SMS is off, so the Worker card is about the Worker URL, not SMS */
if(typeof admStatusRows==='function'){const _wkRows=admStatusRows;admStatusRows=function(){return _wkRows().map(r=>r[0]==='worker'&&r[2]&&/SMS gateway/.test(r[2].fix||'')?[r[0],r[1],{...r[2],fix:'Paste your Worker URL (https://enivel.….workers.dev) under Settings → Worker URL, then Save.'}]:r)}}
{const _wkMore=VIEWS['a-more'];VIEWS['a-more']=function(){const html=_wkMore.apply(this,arguments);return html.replace(/<h3>SMS gateway (<span class="pill[^"]*">)(?:Live|Test mode)<\/span><\/h3><p class="small muted">[^<]*<\/p>/,(m,pill)=>`<h3>Worker URL ${pill}${/live/.test(pill)?'Connected':'Not set'}</span></h3><p class="small muted">Your Cloudflare Worker address, e.g. https://enivel.yourname.workers.dev. It runs payments, Face ID sign-in and phone pop-ups.</p>`)}}
/* The Worker only answers the live site (ALLOWED_ORIGIN). Anywhere else (the claude.ai preview, a local copy) the browser blocks the check: say so instead of showing red. */
const WK_LIVE='cyiber069.github.io';
const WK_LIVE_HOSTS=['cyiber069.github.io','enivel.co.za','www.enivel.co.za'];
function wkElsewhere(){try{return !WK_LIVE_HOSTS.includes(location.hostname)}catch(e){return false}}
if(typeof admStatusRows==='function'){const _wkRows2=admStatusRows;admStatusRows=function(){const rows=_wkRows2();if(!wkElsewhere())return rows;const ep=typeof otpEndpoint==='function'?otpEndpoint():'';if(!ep)return rows;return rows.map(r=>{if(!['worker','payfast','faceid','push','reminders'].includes(r[0]))return r;const st=r[2]||{};if(st.st==='ok'||st.st==='wait')return r;return [r[0],r[1],{st:'ok',v:'Live site only',fix:'',note:'Your Worker only answers your live site (security setting). Check this row there.'}]})}}
if(typeof OWN_GUIDES==='object'){for(const k in OWN_GUIDES){const g=OWN_GUIDES[k];if(g&&Array.isArray(g.steps))g.steps=g.steps.map(x=>typeof x==='string'?x.replace(/Settings\s*(?:→|->)\s*SMS gateway/g,'Settings → Worker URL'):x)}}
</script>
