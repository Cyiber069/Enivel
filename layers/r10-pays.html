.pays-done svg{width:36px;height:36px}
@keyframes paysSpin{to{transform:rotate(360deg)}}

<script>
/* ===== Round 10 · pays: "Pay for parents" (admin pays a family's month by card on PayFast, or records an EFT)
   and "Enivel Pays" (random monthly draw, parent certificate + share card, public #pays wall, TikTok card).
   Data written (same shapes as sponsor()): bookings.sponsoredMonths, bookings.paysCerts{month:{no,at,kind,method}},
   transactions type 'sponsorship' (price, from 'enivel' to the driver) and 'platform_fee' (2%, from the admin) with
   paidBy:'admin', method:'card'|'manual', intentId, parentId. users.paysWall = parent opted in to the public wall.
   Cloud: amounts, payments, draws and the public counter are done by the r10-pays.sql functions. ===== */
const PAYS_FONT='"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const PAYS_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const PAYS_DICE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>';
S.paysSel=S.paysSel||new Set();

/* ---------- small helpers ---------- */
function paysMonthLabel(m){const [y,mm]=String(m||monthKey()).split('-').map(Number);return new Date(y,(mm||1)-1,1).toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}
function paysMonthName(m){return paysMonthLabel(m).split(' ')[0]}
function paysMonthShort(m){const [y,mm]=String(m).split('-').map(Number);return new Date(y,mm-1,1).toLocaleDateString('en-ZA',{month:'short'})}
function paysNextMonth(){const d=new Date();return monthKey(new Date(d.getFullYear(),d.getMonth()+1,1))}
function paysLastMonths(n){const d=new Date();return Array.from({length:n},(_,i)=>monthKey(new Date(d.getFullYear(),d.getMonth()-i,1))).reverse()}
function paysR2(n){return Math.round((Number(n)||0)*100)/100}
function paysFirst(n){return String(n||'').trim().split(/\s+/)[0]||'Parent'}
function paysWallName(n){const p=String(n||'').trim().split(/\s+/).filter(Boolean);return p.length>1?p[0]+' '+p[p.length-1][0].toUpperCase()+'.':(p[0]||'')}
function paysPossessive(names){const n=(names||[]).filter(Boolean);const list=!n.length?'Your children':n.length===1?n[0]:n.slice(0,-1).join(', ')+' & '+n[n.length-1];return list+(/s$/i.test(list)?'’':'’s')}
function paysHash6(s){let x=0x811c9dc5;for(const ch of String(s)){x^=ch.codePointAt(0);x=Math.imul(x,0x01000193)>>>0}return x.toString(16).toUpperCase().padStart(8,'0').slice(0,6)}
/* fair pick: uniform integer in [0,n) from crypto.getRandomValues (rejection sampling, no modulo bias) */
function paysRandInt(n){if(!(n>0))return -1;const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function paysCovered(b,m){return Array.isArray(b.sponsoredMonths)&&b.sponsoredMonths.includes(m)}
/* same rule as the server: a booking never costs more than its route's (or accepted offer's) price */
function paysPrice(b){let p=Number(b.price);if(!(p>0)||p>100000)return 0;let ref=null;if(b.fromRequest){const rq=Store.get('requests',b.fromRequest);const o=rq&&rq.acceptedOffer?Store.get('offers',rq.acceptedOffer):null;ref=o?Number(o.price):null}else{const r=Store.get('routes',b.routeId);ref=r?Number(r.price):null}if(ref>0&&ref<p)p=ref;return paysR2(p)}
function paysSoftRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox')return;if($('.overlay'))return;render()}

/* ---------- families (admin) ---------- */
/* every parent with an active monthly booking: what is still due for month m (transport + 2% fee per booking) */
function paysFamilies(m){const by={};
  for(const b of Store.all('bookings')){if(b.status!=='active'||b.once)continue;const u=Store.get('users',b.parentId);if(!u||u.role!=='parent')continue;(by[u.id]=by[u.id]||{u,bs:[]}).bs.push(b)}
  return Object.values(by).map(f=>{const due=f.bs.filter(b=>!bookingPaidFor(b,m)&&paysPrice(b)>0);const covered=f.bs.filter(b=>paysCovered(b,m));const blocked=!!(f.u.banned||f.u.suspended);
    const amount=paysR2(due.reduce((s,b)=>s+paysPrice(b)+feeFor(paysPrice(b)),0));const kids=[...new Set(f.bs.map(b=>Store.get('kids',b.kidId)?.name).filter(Boolean))];
    const status=blocked?'blocked':due.length?(covered.length?'partial':'due'):covered.length?'covered':'paid';
    return {...f,due,covered,blocked,amount,kids,status}}).sort((a,b)=>((b.due.length&&!b.blocked)-(a.due.length&&!a.blocked))||String(a.u.name).localeCompare(String(b.u.name)))}
/* who can win the draw: still something due that month, not banned or suspended */
function paysEligible(m){return paysFamilies(m).filter(f=>f.due.length&&!f.blocked)}

/* ---------- public numbers ---------- */
function paysStatsLocal(m){const bs=Store.all('bookings').filter(b=>paysCovered(b,m));const kids=new Set(bs.map(b=>b.kidId).filter(Boolean)),fams=new Set(bs.map(b=>b.parentId).filter(Boolean));
  const total=paysR2(Store.all('transactions').filter(t=>t.type==='sponsorship'&&t.month===m).reduce((s,t)=>s+(Number(t.amount)||0),0));
  const wall=[...fams].map(id=>Store.get('users',id)).filter(u=>u&&u.paysWall===true).map(u=>paysWallName(u.name)).filter(Boolean).sort();
  return {month:m,label:paysMonthLabel(m),kids:kids.size,families:fams.size,total,wall}}
/* on the live site only the admin can see everyone's data; others (and visitors) ask the server for the totals */
function paysStats(m){if(!(S.cloud&&!S.admin))return paysStatsLocal(m);S.paysPub=S.paysPub||{};const c=S.paysPub[m];
  if(!c||(!c.loading&&Date.now()-(c.at||0)>60000))paysFetchPub(m);return c&&c.data?c.data:null}
async function paysFetchPub(m){S.paysPub=S.paysPub||{};const c=S.paysPub[m]=S.paysPub[m]||{};if(c.loading)return;c.loading=true;
  try{if(typeof sb==='undefined'||!sb)throw new Error('offline');const {data,error}=await sb.rpc('enivel_pays_public',{p_month:m});if(error)throw error;c.data=data;c.err=null}
  catch(e){c.err=e.message||String(e)}finally{c.loading=false;c.at=Date.now();if(S.route==='pays'||S.route==='p-cert')paysSoftRender()}}
function paysPublicUrl(){return location.origin+location.pathname+'#pays'}

/* ---------- PayFast status (from the Worker's /health) ---------- */
function paysPfState(){return S.paysPf?.state||(S.cloud?'unknown':'local')}
async function paysPfCheck(force){if(!S.cloud){S.paysPf={state:'local',at:Date.now()};return S.paysPf}
  const ep=typeof otpEndpoint==='function'?otpEndpoint():'';if(!ep){S.paysPf={state:'noworker',at:Date.now()};return S.paysPf}
  if(!force&&S.paysPf&&S.paysPf.state!=='checking'&&Date.now()-S.paysPf.at<60000)return S.paysPf;
  const prev=S.paysPf?.state;S.paysPf={state:'checking',at:Date.now()};
  try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),6000);const r=await fetch(ep+'/health',{signal:ac.signal});clearTimeout(t);const j=await r.json();S.paysPf={state:j&&j.payfast?'on':'off',at:Date.now()}}
  catch(e){S.paysPf={state:'off',at:Date.now(),err:true}}
  if(prev!==S.paysPf.state&&S.route==='a-pays')paysSoftRender();return S.paysPf}

/* ---------- certificates (parent) ---------- */
function paysCertsOf(pid){const out={};
  for(const b of Store.all('bookings')){if(b.parentId!==pid||!Array.isArray(b.sponsoredMonths))continue;
    for(const m of b.sponsoredMonths){if(!/^\d{4}-\d{2}$/.test(m))continue;const o=out[m]=out[m]||{month:m,kids:[],no:null,at:null,kind:null};const c=b.paysCerts&&b.paysCerts[m];const kn=Store.get('kids',b.kidId)?.name;
      if(kn&&!o.kids.includes(kn))o.kids.push(kn);if(c){o.no=o.no||c.no;o.at=o.at||c.at;o.kind=o.kind||c.kind}}}
  return Object.values(out).map(o=>{if(!o.at){const tx=Store.all('transactions').filter(t=>t.type==='sponsorship'&&t.month===o.month&&Store.get('bookings',t.bookingId)?.parentId===pid).sort((a,b)=>a.ts-b.ts)[0];const [y,mm]=o.month.split('-').map(Number);o.at=tx?.ts||new Date(y,mm-1,1).getTime()}
    o.no=o.no||('EP-'+o.month.replace('-','')+'-'+paysHash6(pid+':'+o.month));return o}).sort((a,b)=>b.month.localeCompare(a.month))}
async function paysSetWall(on){const u=me();if(!u)return;await Store.patch('users',u.id,{paysWall:!!on});S.paysPub=null;toast(on?'Your first name shows on the Enivel Pays wall':'Your name is hidden from the wall')}

/* ---------- applying a payment in local / preview mode (the server does this on the live site) ---------- */
async function paysApplyLocal(ids,m,kind,method,note){const fams=paysFamilies(m).filter(f=>ids.includes(f.u.id)&&f.due.length&&!f.blocked);if(!fams.length)throw new Error('Nothing to pay: already paid for '+paysMonthLabel(m));
  const intentId='pl'+uid();const label=paysMonthLabel(m);const at=Date.now();const adm=me()?.id||'admin';const tail=m===monthKey()?'Nothing to pay this month.':'Nothing to pay for '+label+'.';let amount=0,done=0;
  S.silent=true;
  try{for(const f of fams){const cert='EP-'+m.replace('-','')+'-'+paysHash6(intentId+':'+f.u.id);const names=[];
      for(const b of f.due){const price=paysPrice(b),fee=feeFor(price);const kn=Store.get('kids',b.kidId)?.name||'Child';
        await Store.patch('bookings',b.id,{sponsoredMonths:[...new Set([...(b.sponsoredMonths||[]),m])],paysCerts:{...(b.paysCerts||{}),[m]:{no:cert,at,kind,method}}});
        await pushTx({type:'sponsorship',amount:price,from:'enivel',to:b.driverId,bookingId:b.id,kidId:b.kidId,parentId:f.u.id,month:m,note:`Transport for ${label} paid by Enivel admin`,paidBy:'admin',method,intentId});
        await pushTx({type:'platform_fee',amount:fee,from:adm,to:'enivel',bookingId:b.id,parentId:f.u.id,month:m,note:`2% fee for ${label}, paid by Enivel admin`,paidBy:'admin',method,intentId,...(note?{memo:String(note).slice(0,200)}:{})});
        await notify(b.driverId,`💸 Enivel paid ${kn}'s transport for ${label}. You receive the full price.`,'pay','d-billing');
        if(!names.includes(kn))names.push(kn);amount+=price+fee;done++}
      await notify(f.u.id,`${kind==='draw'?'🎉 Enivel Pays picked your family! ':''}🎁 Your transport fee for ${label} (${names.join(', ')}) has been paid by Enivel admin. ${tail}`,'pay','p-cert')}}
  finally{S.silent=false}
  render();return {id:intentId,amount:paysR2(amount),families:fams.length,bookings:done}}

/* ---------- admin actions ---------- */
function paysOpen(parentId){S.paysSel=new Set(parentId?[parentId]:[]);S.paysQ='';S.paysMonth=monthKey();go('a-pays')}
function paysSelected(m){return paysFamilies(m).filter(f=>S.paysSel.has(f.u.id)&&f.due.length&&!f.blocked)}
function paysSyncBar(){const root=$('.pays');if(!root)return;const fams=paysSelected(S.paysMonth||monthKey());const total=paysR2(fams.reduce((s,f)=>s+f.amount,0));const n=fams.length;
  const sum=$('#pays-sum',root),cnt=$('#pays-cnt',root),card=$('#pays-card',root),man=$('#pays-manual',root);
  if(sum)sum.textContent=money(total);if(cnt)cnt.textContent=n?`${n} ${n===1?'family':'families'} · ${fams.reduce((s,f)=>s+f.due.length,0)} ${fams.reduce((s,f)=>s+f.due.length,0)===1?'child':'children'}`:'Pick families above';

MOUNT.paysCheck=el=>{const c=S.paysCheck;if(c&&c.state==='checking'&&!c.timer&&!c.busy)c.timer=setTimeout(paysPoll,500)};
async function paysPoll(){const c=S.paysCheck;if(!c||c.state!=='checking'||c.busy)return;c.timer=null;c.busy=true;c.n=(c.n||0)+1;
  try{const {data,error}=await sb.rpc('pay_intent_status',{p_id:c.id});if(error)throw error;c.data=data;c.err=null;
    if(!data)c.state='missing';else if(data.status==='paid'){c.state='paid';ls.set('enivel_pays_pending',null);S.paysRecent=null;if(typeof cloudPull==='function')await cloudPull(false)}else if(data.status==='cancelled')c.state='cancelled'}
  catch(e){c.err=e.message||String(e)}
  c.busy=false;if(c.state==='checking'){if(c.n>=36)c.state='timeout';else c.timer=setTimeout(paysPoll,2500)}
  if(S.route==='a-paycheck'){render();if(c.state==='paid'&&!c.party){c.party=true;confetti();buzz([20,40,20])}}}
VIEWS['a-paycheck']=adminGate(()=>{const c=S.paysCheck;if(!c)return `<div class="pays">${pageHead('Payment')}${empty('No payment to check.','money')}<button class="btn wide" onclick="go('a-pays')">Back to Enivel Pays</button></div>`;
  const d=c.data;const fams=(d?.items||[]).map(f=>f.name).filter(Boolean);
  const body=c.state==='paid'?`<div class="pays-done">${ICON.check}</div><h2>Paid!</h2><p class="muted">${money(d.amount)} · ${fams.length} ${fams.length===1?'family':'families'} told it’s paid by Enivel admin.</p>${fams.length?`<p class="small" style="max-width:420px">${h(fams.join(', '))}</p>`:''}`
    :c.state==='cancelled'?`<div class="pays-done" style="background:var(--bg3);color:var(--fg)">${ICON.x}</div><h2>Cancelled</h2><p class="muted">Nothing was charged.</p>`
    :c.state==='missing'?`<h2>Payment not found</h2><p class="muted small">It may belong to another admin session.</p>`
    :c.state==='timeout'?`<div class="pays-done" style="background:var(--warn)">${ICON.bell}</div><h2>Still waiting for PayFast</h2><p class="muted small" style="max-width:420px">If you paid, it turns to Paid under Recent payments as soon as PayFast confirms. Parents are told then.</p><button class="btn" onclick="S.paysCheck.state='checking';S.paysCheck.n=0;render()">Check again</button>`

  return `<div class="pays">${pageHead('Enivel Pays','Card payment')}<div class="card"><div class="pays-check" data-mount="paysCheck">${body}</div></div><button class="btn ghost wide" style="margin-top:14px" onclick="go('a-pays')">Back to Enivel Pays</button></div>`});

/* keep the address bar honest: #pays only while on the public wall */
const _paysGo=go;go=function(r,extra){try{if(r==='pays'&&location.hash!=='#pays')history.replaceState(null,'','#pays');else if(r!=='pays'&&location.hash==='#pays')history.replaceState(null,'',location.pathname+location.search)}catch(e){}return _paysGo(r,extra)};
/* links: #pays (public wall, no sign-in), #paid=<id> / #paycancel=<id> (back from PayFast) */
function paysHashRoute(){const hs=location.hash||'';if(hs==='#pays'){if(S.route!=='pays')go('pays');return 'done'}
  const mt=hs.match(/^#(paid|paycancel)=(pi[0-9a-f]{32})$/);if(!mt)return 'none';if(!S.admin||!me())return 'wait';
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(mt[1]==='paid'){S.paysCheck={id:mt[2],n:0,state:'checking'};go('a-paycheck')}
  else{(async()=>{try{if(S.cloud&&sb)await sb.rpc('pay_intent_cancel',{p_id:mt[2]})}catch(e){}auditLog('pays_card_cancel',mt[2],'Cancelled on PayFast');S.paysRecent=null;go('a-pays');toast('Payment cancelled. Nothing was charged.')})()}
  return 'done'}
(function paysBoot(){let n=0;const t=setInterval(()=>{if(!S.ready)return;n++;const r=paysHashRoute();if(r!=='wait'||n>60)clearInterval(t)},300)})();
window.addEventListener('hashchange',()=>{if(S.ready)paysHashRoute()});
