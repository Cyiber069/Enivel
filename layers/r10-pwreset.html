<style>
.fpw-link{display:block;margin:-4px 0 10px auto;width:max-content;font-size:.8rem;color:var(--acc);background:none;border:0;padding:4px 0;cursor:pointer;font-weight:600}
</style>
<script>
/* ===== Forgot password + an honest admin login message.
   Supabase answers "Invalid login credentials" both for a wrong password and for an email with no account,
   so the app must not claim "no account exists". ===== */
function fpwRedirect(){try{return location.origin+location.pathname}catch(e){return ''}}
function fpwModal(prefill){modal(`<h3>Reset your password</h3><p class="small muted" style="margin:6px 0 12px">We'll email you a link. Open it on this device, then choose a new password.</p><div class="stack"><div class="field"><label>Email</label><input id="fpw-e" type="email" value="${h(prefill||'')}" placeholder="you@example.com" autocomplete="username"></div><button class="btn wide" id="fpw-go">Send reset link</button></div>`,m=>{$('#fpw-go',m).onclick=async()=>{const e=val(m,'fpw-e').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast('Enter your email');const b=$('#fpw-go',m);b.disabled=true;b.textContent='Sending…';try{if(!S.cloud||typeof sb==='undefined'||!sb||!sb.auth.resetPasswordForEmail){toast('Password reset works on the live Enivel site');b.disabled=false;b.textContent='Send reset link';return}const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:fpwRedirect()});if(error&&!/rate|seconds/i.test(error.message))throw error;closeModal();modal(`<h3>Check your email</h3><p class="small muted" style="margin-top:6px">If an Enivel account uses <b>${h(e)}</b>, a reset link is on its way. Check spam too. The link opens Enivel and asks for a new password.</p><button class="btn wide" style="margin-top:12px" onclick="closeModal()">OK</button>`)}catch(err){b.disabled=false;b.textContent='Send reset link';toast(/rate|seconds/i.test(err.message||'')?'Please wait a minute before asking again':(err.message||'Could not send'))}}})}
function fpwNewPassword(){modal(`<h3>Choose a new password</h3><p class="small muted" style="margin:6px 0 12px">At least 8 characters. You'll use it to log in from now on.</p><div class="stack"><div class="field"><label>New password</label><div class="pw"><input id="fpw-p1" type="password" autocomplete="new-password"><button type="button" class="eye" onclick="togglePw(this)" aria-label="Show password">${ICON.eye||'👁'}</button></div></div><div class="field"><label>Type it again</label><input id="fpw-p2" type="password" autocomplete="new-password"></div><button class="btn wide" id="fpw-save">Save new password</button></div>`,m=>{$('#fpw-save',m).onclick=async()=>{const p1=val(m,'fpw-p1'),p2=val(m,'fpw-p2');if(p1.length<8)return toast('At least 8 characters');if(p1!==p2)return toast('The two passwords do not match');const b=$('#fpw-save',m);b.disabled=true;b.textContent='Saving…';const {error}=await sb.auth.updateUser({password:p1});if(error){b.disabled=false;b.textContent='Save new password';return toast(error.message)}try{history.replaceState(null,'',fpwRedirect())}catch(e){}closeModal();toast('Password changed');S.fpwRecovery=false;try{const {data}=await sb.auth.getUser();if(data?.user){S.session={userId:data.user.id};const {data:adm}=await sb.rpc('is_admin');S.admin=!!adm;await cloudPull(true);go(S.admin?'a-home':(me()?.role==='driver'?'d-home':'p-home'))}}catch(e){render()}}})}
/* listen for the recovery link (Supabase fires PASSWORD_RECOVERY after reading the link) */
(function fpwHook(){let n=0;const t=setInterval(()=>{n++;if(typeof sb!=='undefined'&&sb&&sb.auth&&sb.auth.onAuthStateChange){clearInterval(t);try{sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'&&!S.fpwRecovery){S.fpwRecovery=true;setTimeout(fpwNewPassword,300)}})}catch(e){}if(/type=recovery/.test(location.hash+location.search)&&!S.fpwRecovery){S.fpwRecovery=true;setTimeout(fpwNewPassword,1200)}}else if(n>80)clearInterval(t)},150)})();
/* "Forgot password?" under the login password */
function fpwInject(){const pw=document.getElementById('li-pw');if(!pw||document.getElementById('fpw-link'))return;const f=pw.closest('.field');if(!f)return;const a=document.createElement('button');a.type='button';a.id='fpw-link';a.className='fpw-link';a.textContent='Forgot password?';a.onclick=()=>fpwModal((document.getElementById('li-e')?.value||'').trim());f.insertAdjacentElement('afterend',a)}
{const _fpwRender=render;render=function(){const r=_fpwRender.apply(this,arguments);try{fpwInject()}catch(e){}return r}}
setTimeout(fpwInject,500);
/* admin email + "invalid": say what it really means and offer both ways */
{const _fpwConfirm=confirmBox;confirmBox=function(title,text,onYes){if(title!=='Create the admin account?')return _fpwConfirm.apply(this,arguments);const email=(document.getElementById('li-e')?.value||'').trim();
  modal(`<h3>Couldn't log you in</h3><p class="small muted" style="margin:6px 0 12px">The password is wrong, or this admin account hasn't been created yet. If you've logged in as admin before, the password is the problem: reset it.</p><div class="stack"><button class="btn wide" id="fpw-reset">Reset my password</button><button class="btn ghost wide" id="fpw-try">Try again</button><button class="btn ghost wide" id="cOk" style="font-size:.85rem">First time only: create the admin account</button></div>`,m=>{$('#fpw-reset',m).onclick=()=>{closeModal();fpwModal(email)};$('#fpw-try',m).onclick=()=>{closeModal();const p=document.getElementById('li-pw');if(p){p.value='';p.focus()}};$('#cOk',m).onclick=async()=>{closeModal();const _t=toast;toast=function(msg){if(/registered|already exists|Check your email to confirm the admin/i.test(String(msg||'')))msg='The admin account already exists, so the password was wrong. Use "Reset my password".';return _t.call(this,msg)};try{await (onYes&&onYes())}finally{setTimeout(()=>{toast=_t},50)}}})}}
</script>
