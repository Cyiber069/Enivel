<style>
.rp-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.rp-map{position:relative;height:170px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);margin:8px 0}
.rp-map .lmap{position:absolute;inset:0}
.rp-old{width:16px;height:16px;border-radius:50%;background:#9ca3af;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);margin:-8px 0 0 -8px}
.rp-new{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#df1b12;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);margin:-24px 0 0 -12px}
.rp-leg{display:flex;gap:14px;font-size:.72rem;color:var(--fg3)}
.rp-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>
<script>
/* ===== Re-check old pins once a better map (TomTom / Google) is on.
   Pins saved from the free map before the upgrade can be off. Nothing moves on its own:
   the parent sees old vs new on a small map and chooses. Pins they dragged themselves are left alone. ===== */
const RP={busy:false,list:null,at:0,sig:''};
function rpBetter(){return (typeof ttOn==='function'&&ttOn())||(typeof gmOn==='function'&&gmOn())}
function rpSrc(){return (typeof gmOn==='function'&&gmOn())?'google':'tomtom'}
function rpStale(g){return !!(g&&g.lat!=null&&!g.adjusted&&!['tomtom','google'].includes(g.src)&&!g.rpKept)}
function rpItems(){const u=me();if(!u||u.role!=='parent')return [];const out=[];const j=u.journey||{};
  [['pickup','Pickup (home)',false],['dropoff','Drop-off (school)',true],['stop','Extra stop',false]].forEach(([k,l,sch])=>{const g=j[k+'Geo'];if(rpStale(g)&&(j[k]||g.label))out.push({kind:'journey',key:k,label:l,text:j[k]||g.label,school:sch,old:g})});
  for(const k of (typeof kidsOf==='function'?kidsOf(u.id):[])){if(rpStale(k.geo)&&(k.pickup||k.geo.label))out.push({kind:'kid',id:k.id,key:'geo',label:kcFirstName(k)+' · pickup',text:k.pickup||k.geo.label,school:false,old:k.geo});if(rpStale(k.schoolGeo)&&(k.school||k.schoolGeo.label))out.push({kind:'kid',id:k.id,key:'schoolGeo',label:kcFirstName(k)+' · school',text:k.school||k.schoolGeo.label,school:true,old:k.schoolGeo})}
  /* same text pinned in two places → check once */
  const seen=new Set();return out.filter(x=>{const s=x.school+'|'+String(x.text).toLowerCase().trim();if(seen.has(s))return true;seen.add(s);return true})}
function kcFirstName(k){return String(k?.name||'Child').split(' ')[0]}
async function rpSuggest(it){const q=String(it.text||'').trim();if(!q)return null;try{if(it.school){const r=await suggestSchools(q);const c=(r||[]).filter(x=>x&&x.lat!=null&&(x.tomtom||x.google||x.src==='tomtom'||x.src==='google'));if(!c.length)return null;c.sort((a,b)=>distM(it.old,a)-distM(it.old,b));const best=c[0];if(distM(it.old,best)>25000)return null;return {lat:+best.lat,lng:+best.lng,label:best.name+(best.loc?', '+best.loc:''),address:best.address||null,src:rpSrc()}}
  const g=await geocode(q);if(!g||g.lat==null||!['tomtom','google'].includes(g.src))return null;if(distM(it.old,g)>25000)return null;return {lat:+g.lat,lng:+g.lng,label:g.label||q,address:g.address||null,src:rpSrc()}}catch(e){return null}}
async function rpScan(force){if(RP.busy||!rpBetter())return RP.list;if(!force&&RP.list&&Date.now()-RP.at<600000)return RP.list;RP.busy=true;try{const items=rpItems();const res=[];for(const it of items.slice(0,8)){const s=await rpSuggest(it);if(!s){continue}const d=distM(it.old,s);if(d<40){await rpSave(it,{...it.old,src:s.src},true);continue}res.push({...it,sug:s,dist:d})}RP.list=res;RP.at=Date.now()}finally{RP.busy=false}if(S.route==='p-home'&&!document.querySelector('.overlay'))render();return RP.list}
async function rpSave(it,geo,quiet){if(it.kind==='journey'){await Store.patch('users',me().id,{journey:{...journey(),[it.key+'Geo']:geo}})}else{await Store.patch('kids',it.id,{[it.key]:geo})}if(!quiet)toast('Pin updated')}
function rpKm(d){return d<950?Math.round(d/10)*10+' m':(d/1000).toFixed(1)+' km'}
function rpCard(){const L_=RP.list||[];if(!L_.length)return '';return `<div class="card" style="margin-bottom:14px;border-color:#df1b12"><div class="row between" style="gap:10px"><div><h3>Maps upgraded: check ${L_.length} pin${L_.length>1?'s':''}</h3><p class="small muted" style="margin-top:4px">${h(L_.map(x=>x.label).join(', '))} ${L_.length>1?'were':'was'} pinned with the old map. The new map may have a more exact spot.</p></div><button class="btn sm" onclick="rpReview()">Review</button></div></div>`}
function rpReview(){const L_=RP.list||[];if(!L_.length)return toast('All pins are up to date');modal(`<h3>Check your pins</h3><p class="small muted" style="margin-top:4px">Grey dot = where it is now. Red pin = the new map's spot. If neither is right, keep yours and change the address with Change home / Change school.</p><div class="rp-leg" style="margin-top:8px"><span><i style="background:#9ca3af"></i>Now</span><span><i style="background:#df1b12"></i>New map</span></div>${L_.map((x,i)=>`<div class="rp-item" data-rp="${i}"><b>${h(x.label)}</b><div class="tiny muted">${h(x.text)} · moves ${rpKm(x.dist)}</div><div class="rp-map"><div class="lmap"></div></div><div class="row" style="gap:8px"><button class="btn sm" data-rp-use="${i}">Use new spot</button><button class="btn sm ghost" data-rp-keep="${i}">Keep mine</button></div></div>`).join('')}`,m=>{
  L_.forEach((x,i)=>{const box=m.querySelector(`[data-rp="${i}"] .lmap`);if(!box||typeof L==='undefined'||typeof HAS_L==='undefined'||!HAS_L)return;const map=L.map(box,{zoomControl:false,attributionControl:false,scrollWheelZoom:false});L.tileLayer(typeof m2TileUrl==='function'?m2TileUrl():'https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);L.marker([x.old.lat,x.old.lng],{icon:L.divIcon({className:'',html:'<div class="rp-old"></div>',iconSize:[0,0]})}).addTo(map);const nm=L.marker([x.sug.lat,x.sug.lng],{draggable:false,interactive:false,zIndexOffset:500,icon:L.divIcon({className:'',html:'<div class="rp-new"></div>',iconSize:[0,0]})}).addTo(map);nm.on('dragend',()=>{const ll=nm.getLatLng();x.sug={...x.sug,lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6),adjusted:true}});x._map=map;try{map.fitBounds([[x.old.lat,x.old.lng],[x.sug.lat,x.sug.lng]],{padding:[30,30],maxZoom:17})}catch(e){map.setView([x.sug.lat,x.sug.lng],16)}setTimeout(()=>map.invalidateSize(),60)});
  const done=i=>{const el=m.querySelector(`[data-rp="${i}"]`);if(el){try{L_[i]._map&&L_[i]._map.remove()}catch(e){}el.remove()}RP.list=(RP.list||[]).filter(y=>y!==L_[i]);if(!m.querySelector('[data-rp]')){closeModal();toast('Pins checked');render()}};
  m.querySelectorAll('[data-rp-use]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.rpUse;const x=L_[i];await rpSave(x,{...x.old,...x.sug,label:x.old.label||x.sug.label});done(i)});
  m.querySelectorAll('[data-rp-keep]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.rpKeep;const x=L_[i];await rpSave(x,{...x.old,rpKept:true},true);done(i)})})}
{const _rpPHome=VIEWS['p-home'];VIEWS['p-home']=function(){const html=_rpPHome.apply(this,arguments);try{if(!me()||me().role!=='parent'||S.admin)return html;const sig=JSON.stringify(rpItems().map(x=>[x.label,x.old.lat,x.old.lng]));if(sig!==RP.sig){RP.sig=sig;RP.list=null}if(rpBetter()&&!RP.busy&&(!RP.list||Date.now()-RP.at>600000))setTimeout(()=>rpScan(),400);const c=rpCard();if(!c)return html;const i=html.indexOf('<div class="grid');return i>=0?html.slice(0,i)+c+html.slice(i):c+html}catch(e){return html}}}
/* new map on → old cached routes are dropped so directions are recalculated with it */
{let last='';setInterval(()=>{try{const now=rpBetter()?rpSrc():'free';if(last&&now!==last){if(typeof M2==='object'&&M2.plans)M2.plans.clear();if(typeof MAPS==='object')Object.values(MAPS).forEach(M=>{M.sig='';M.m2pinSig=''});RP.list=null;if(!document.querySelector('.overlay'))render()}last=now}catch(e){}},3000)}
</script>
