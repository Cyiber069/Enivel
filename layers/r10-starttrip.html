<style>
.st-push{border:2px solid #7c3aed;border-radius:18px;padding:14px;margin-bottom:14px;background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(79,70,229,.04))}
.st-push .st-h{display:block;font-weight:800;font-size:1rem;margin-bottom:4px}
.st-go{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,#4f46e5,#7c3aed);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.st-go .t{font-size:.9rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.st-go .big{font-size:2.6rem;font-weight:800;margin:6px 0}
.st-go .who{font-size:1.05rem;opacity:.95;max-width:420px}
.st-go .startbtn{margin-top:28px;width:100%;max-width:380px;min-height:64px;border-radius:20px;border:0;background:#fff;color:#4f46e5;font-size:1.25rem;font-weight:800;cursor:pointer}
.st-go .later{margin-top:14px;background:transparent;border:0;color:#fff;opacity:.85;font-size:.95rem;min-height:44px;cursor:pointer;text-decoration:underline}
.st-go .why{margin-top:18px;font-size:.82rem;opacity:.8;max-width:380px}
</style>
<script>
/* ===== 09 Nov owner: "make sure the driver clicks Start trip".
   1. Reminder pop-ups (server, even with the app closed): drivers are now asked up front to turn them on
      (a card on the driver home that stays until they do); reminders 30 and 10 min before pickup AND at
      pickup time if the trip still isn't started; the plan covers 14 days ahead instead of 7.
      Admin Overview lists drivers with passengers whose reminders are off.
   2. Auto-start: tapping "Picked up" starts the trip if the driver forgot. Opening the app from 45 min
      before pickup (until 30 min after) shows a full-screen "Start trip" button.
   5. Driver rule: drivers confirm once "I'll start every trip in Enivel" (stored on their profile with the
      time), and the Driver Agreement has a "Starting each trip" section. ===== */
const ST={ahead:45*60000,after:30*60000};
function stDriverHasPax(u){try{return (typeof driverPassengers==='function'?driverPassengers(u.id):0)>0}catch(e){return false}}
/* ---- 1a. reminder plan: 30, 10 and 0 minutes, 14 days ahead ---- */
if(typeof savePushPlan==='function'){savePushPlan=async function(){const u=me();if(!S.cloud||!u||u.role!=='driver'||!(u.pushSubs||[]).length)return;const items=[];const now=Date.now();
  for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);for(const g of planSlotsFor(u.id,d))for(const mins of [30,10,0]){const at=g.slot-mins*60000;if(at<now-60000)continue;items.push({key:g.key+'-'+mins,at,slot:g.slot,mins,label:g.label,time:g.time,routeId:g.routeId,kidIds:g.kidIds,kind:g.kind})}}
  items.sort((a,b)=>a.at-b.at);const plan=items.slice(0,240);const sig=JSON.stringify(plan.map(x=>[x.key,x.at,x.kidIds]));
  if(sig===S._planSig||sig===JSON.stringify((u.pushPlan||[]).map(x=>[x.key,x.at,x.kidIds])))return(S._planSig=sig);S._planSig=sig;await Store.patch('users',u.id,{pushPlan:plan})}}
/* ---- 1b. drivers are asked to turn reminders on (driver home, until done) ---- */
function stPushCard(){const u=me();if(!u||u.role!=='driver'||S.admin||typeof tpPushOn!=='function'||tpPushOn())return '';
  const denied='Notification' in window&&Notification.permission==='denied';const iosWeb=typeof isIOS!=='undefined'&&isIOS&&!(typeof isStandalone!=='undefined'&&isStandalone);
  const how=denied?'Notifications are blocked for Enivel on this phone. Open your phone Settings → Notifications (or the browser’s site settings) and allow Enivel, then come back.':iosWeb?'On iPhone: tap Share → <b>Add to Home Screen</b>, open Enivel from the home screen, then tap the button below.':'';
  return `<div class="st-push"><span class="st-h">Turn on trip reminders</span><div class="small">Enivel buzzes your phone 30 and 10 minutes before each pickup, even when the app is closed, with a <b>Start trip</b> button. Parents only see you on the map after you start the trip.</div>${how?`<div class="small" style="margin-top:6px">${how}</div>`:''}${denied?'':`<button class="btn wide" style="margin-top:10px" onclick="tpEnablePush()">Turn on reminders</button>`}</div>`}
{const _stDHome=VIEWS['d-home'];VIEWS['d-home']=function(){const html=_stDHome.apply(this,arguments);try{const c=stPushCard();if(!c)return html;const i=html.indexOf('<div class="hdr');const j=i>=0?html.indexOf('</div></div>',i):-1;if(j>0)return html.slice(0,j+12)+c+html.slice(j+12);return c+html}catch(e){return html}}}
/* admin: who still has reminders off */
{const _stAHome=VIEWS['a-home'];if(_stAHome)VIEWS['a-home']=function(){const html=_stAHome.apply(this,arguments);try{if(!S.admin)return html;const off=Store.all('users').filter(u=>u.role==='driver'&&!u.banned&&stDriverHasPax(u)&&!(u.pushSubs||[]).length);if(!off.length)return html;
  const n=`<div class="notice" style="margin-bottom:12px"><b>${off.length} driver${off.length>1?'s':''} with passengers ${off.length>1?'have':'has'} trip reminders off:</b> ${off.slice(0,8).map(u=>h(u.name)).join(', ')}${off.length>8?' …':''}. Ask them to open Enivel and tap “Turn on reminders”.</div>`;
  const k=html.search(/<div class="(kpi|grid|card)/);return k>0?html.slice(0,k)+n+html.slice(k):n+html}catch(e){return html}}}
/* ---- 2a. "Picked up" starts the trip if the driver forgot ---- */
if(typeof markEvent==='function'){const _stMark=markEvent;markEvent=async function(bookingId,type){try{if(type==='pickup'){const b=Store.get('bookings',bookingId);const r=b&&routeOf(b.routeId);if(r&&!b.once&&!r.live?.active&&r.driverId===me()?.id){await startTrip(r.id);toast('Trip started so parents can follow you')}}}catch(e){console.warn('st auto',e)}return _stMark.apply(this,arguments)}}
/* ---- 2b. full-screen Start trip when the app is opened near pickup ---- */
function stNextSlot(){const u=me();if(!u||u.role!=='driver'||S.admin||typeof driverSlots!=='function')return null;const now=Date.now();
  return driverSlots(u.id).filter(s=>s.kind!=='once'&&s.route&&!slotStarted(s)&&s.ts-now<=ST.ahead&&now-s.ts<=ST.after&&(s.kids||[]).some(k=>!(typeof isAbsent==='function'&&isAbsent(k)))).sort((a,b)=>a.ts-b.ts)[0]||null}
function stGoClose(key){try{sessionStorage.setItem('enivel_stgo_'+key,'1')}catch(e){}document.querySelector('.st-go')?.remove()}
async function stGoStart(routeId,key){stGoClose(key);await startTrip(routeId);go('d-trip',{tripRoute:routeId})}
function stGoShow(){if(document.querySelector('.st-go,.overlay,.modal'))return;if(!me()?.startRuleAt)return;const s=stNextSlot();if(!s)return;let seen=false;try{seen=!!sessionStorage.getItem('enivel_stgo_'+s.key)}catch(e){}if(seen)return;
  const mins=Math.round((s.ts-Date.now())/60000);const when=mins>1?`in ${mins} min`:mins>=-1?'now':`${-mins} min ago`;const names=(s.kids||[]).filter(k=>!(typeof isAbsent==='function'&&isAbsent(k))).map(k=>k.name).join(', ');
  const d=document.createElement('div');d.className='st-go';d.setAttribute('role','dialog');d.setAttribute('aria-label','Start trip');
  d.innerHTML=`<div class="t">${h(s.route?.name||'Your route')}</div><div class="big">Pickup ${h(when)}</div><div class="who">${h(names)}${s.kids?.[0]?.pickup?' · '+h(s.kids[0].pickup):''}</div><button class="startbtn" onclick="stGoStart('${h(s.route.id)}','${h(s.key)}')">Start trip</button><button class="later" onclick="stGoClose('${h(s.key)}')">Not yet</button><div class="why">Parents only see you on the map, and get “driver nearby” alerts, after you start the trip.</div>`;
  document.body.appendChild(d)}
{const _stRender=render;render=function(){const r=_stRender.apply(this,arguments);try{const u=me();if(u&&u.role==='driver'&&!S.admin&&S.route!=='d-trip')setTimeout(stGoShow,300)}catch(e){}return r}}
/* ---- 5. driver rule ---- */
function stRuleShow(){const u=me();if(!u||u.role!=='driver'||S.admin||u.startRuleAt||document.querySelector('.modal,.overlay,.st-go'))return;if(typeof LG2_VERSION!=='undefined'&&u.legal?.version&&u.legal.version!==LG2_VERSION)return;
  modal(`<h3>Start every trip in Enivel</h3><p class="small" style="margin:8px 0">Before your first pickup, open Enivel and tap <b>Start trip</b>. That is what lets parents see you on the map and get their “driver nearby”, “picked up” and “at school” alerts.</p><ul class="small" style="margin:0 0 10px 18px;padding:0"><li>You’ll get a reminder 30 and 10 minutes before pickup.</li><li>Keep Enivel open on screen while you drive (a phone holder helps).</li><li>Repeatedly not starting trips can pause your listing (Driver Agreement, “Starting each trip”).</li></ul><label class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" id="st-ok" style="margin-top:3px"><span class="small">I’ll start every trip in Enivel before my first pickup.</span></label><button class="btn wide" id="st-save" style="margin-top:12px">I agree</button>`);
  const m=document.querySelector('.modal');m.querySelector('#st-save').onclick=async()=>{if(!m.querySelector('#st-ok').checked)return toast('Tick the box to agree');await Store.patch('users',u.id,{startRuleAt:Date.now()});closeModal();toast('Thanks. Drive safe!');setTimeout(()=>{try{stGoShow()}catch(e){}},400)}}
{const _stRender2=render;render=function(){const r=_stRender2.apply(this,arguments);try{const u=me();if(u&&u.role==='driver'&&!S.admin&&!u.startRuleAt)setTimeout(stRuleShow,700)}catch(e){}return r}}
if(typeof legalDoc==='function'){const d=legalDoc('driver');if(d&&!d._st){const b=d.body;d.body=L=>b(L)+`<h3>Starting each trip</h3><p>Before your first pickup on every ride day, you must open the Enivel app and tap <b>Start trip</b>, and keep the app open while you drive, so that Parents can follow the ride and receive pickup, drop-off and safety alerts. Enivel sends reminders, and tapping <b>Picked up</b> starts the trip if you forgot. If you repeatedly do not start trips, Enivel may warn you and may pause your listing until the issue is resolved, as part of keeping Children safe.</p>`;d._st=1}}
</script>
