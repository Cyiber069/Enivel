<style>
.tt-logo{position:absolute;left:8px;bottom:8px;z-index:440;pointer-events:none;font:800 11px/1 Manrope,system-ui,sans-serif;letter-spacing:.02em;color:#df1b12;background:rgba(255,255,255,.88);border-radius:8px;padding:4px 7px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tt-attr{position:absolute;right:8px;bottom:8px;z-index:440;pointer-events:none;font-size:10px;line-height:1.2;color:#5f6368;background:rgba(255,255,255,.86);border-radius:8px;padding:3px 6px}
</style>
<script>
/* ===== TomTom mode: TomTom's own map data for tiles, address + school search, geocoding and turn-by-turn with traffic.
   Free plan, no card: 50 000 tiles + 2 500 other calls a day; past that TomTom blocks (never bills) and Enivel falls back to the free stack.
   Order: Google key (if any) > TomTom key > free stack. The key sits in settings/config, which every signed-in user can read. ===== */
const TT={fails:0,ac:new Map(),geo:new Map(),stat:null,base:'https://api.tomtom.com'};
function ttKey(){try{const a=(Store.get('settings','config')||{}).ttKey;if(a)return String(a).trim()}catch(e){}try{return (ls.get('enivel_tt')||'').trim()}catch(e){return ''}}
function ttOn(){return !!ttKey()&&TT.fails<6&&!(typeof gmOn==='function'&&gmOn())}
function ttQ(){return 'key='+encodeURIComponent(ttKey())}
async function ttGet(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||4500);try{const r=await fetch(url,{signal:c.signal});clearTimeout(t);if(!r.ok){if(r.status===403||r.status===429||r.status>=500)TT.fails++;return null}TT.fails=0;return await r.json()}catch(e){clearTimeout(t);TT.fails++;return null}}
/* --- tiles --- */
function ttTileUrl(theme){return TT.base+'/map/1/tile/basic/'+((theme||(typeof m2Theme==='function'?m2Theme():'light'))==='dark'?'night':'main')+'/{z}/{x}/{y}.png?tileSize=256&view=Unified&language=en-GB&'+ttQ()}
if(typeof m2TileUrl==='function'){const _ttTileUrl=m2TileUrl;m2TileUrl=function(theme){const u=_ttTileUrl(theme);if(/googleapis/.test(u))return u;if(ttOn())return ttTileUrl(theme);return u}}
function ttRetile(){try{(typeof M2==='object'&&M2.tiles||[]).forEach(l=>{if(l._map&&l._url!==m2TileUrl())l.setUrl(m2TileUrl())})}catch(e){}}
const _ttRmap=MOUNT.rmap;MOUNT.rmap=async function(el){const key=[el.dataset.mode,el.dataset.route||'',el.dataset.kid||''].join(':');const res=await _ttRmap.call(this,el);try{const M=typeof MAPS==='object'?MAPS[key]:null;if(M&&M.box?.isConnected){if(ttOn()){if(!M.box.querySelector('.tt-logo')){const a=document.createElement('div');a.className='tt-logo';a.textContent='TomTom';M.box.appendChild(a);const b=document.createElement('div');b.className='tt-attr';b.textContent='© 1992–'+new Date().getFullYear()+' TomTom';M.box.appendChild(b)}const tl=(typeof M2==='object'&&M2.tiles||[]).find(l=>l._map===M.map);if(tl&&tl._url!==m2TileUrl())tl.setUrl(m2TileUrl())}else{M.box.querySelector('.tt-logo')?.remove();M.box.querySelector('.tt-attr')?.remove()}}}catch(e){console.warn('tt map',e)}return res};
/* --- search (one call gives the exact spot, no second lookup) --- */
function ttRef(){try{if(typeof schRef==='function'){const r=schRef();if(r)return r}}catch(e){}return {lat:-26.2041,lng:28.0473}}
function ttAddr(a){a=a||{};return {house_number:a.streetNumber||'',road:a.streetName||'',suburb:a.municipalitySubdivision||a.localName||'',city:a.municipality||'',state:a.countrySubdivisionName||a.countrySubdivision||'',postcode:a.postalCode||'',country:'South Africa'}}
function ttLine2(a){a=a||{};return [a.municipalitySubdivision,a.municipality,a.countrySubdivisionName||a.countrySubdivision,a.postalCode].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(', ')}
async function ttSearch(q,opts){if(!ttKey())return null;opts=opts||{};const ck=q.toLowerCase()+'|'+(opts.school?'s':'a');if(TT.ac.has(ck))return TT.ac.get(ck);const ref=ttRef();
  const p=(async()=>{const path=opts.school?'/search/2/poiSearch/':'/search/2/search/';const u=TT.base+path+encodeURIComponent(q)+'.json?'+ttQ()+'&countrySet=ZA&language=en-GB&limit=8&typeahead=true&lat='+ref.lat+'&lon='+ref.lng+(opts.school?'&categorySet=7372,7377':'&idxSet=PAD,Addr,Str,POI,Geo');const j=await ttGet(u);if(!j)return null;return (j.results||[]).filter(r=>r.position).map(r=>{const a=r.address||{};const poi=r.poi?.name||'';const street=[a.streetNumber,a.streetName].filter(Boolean).join(' ');const name=poi||street||a.municipalitySubdivision||a.municipality||a.freeformAddress||'';const isSchool=!!(r.poi&&(r.poi.categorySet||[]).some(c=>c.id===7372||c.id===7377||String(c.id).startsWith('7372')||String(c.id).startsWith('7377')))||!!opts.school;const l2=poi&&street?street+', '+ttLine2(a):ttLine2(a);return {name,loc:l2,full:name+(l2?', '+l2:''),lat:+r.position.lat,lng:+r.position.lon,type:r.type==='POI'?(isSchool?'school':'place'):r.type==='Street'?'street':'house',isSchool,tomtom:true,dist:r.dist,address:{...ttAddr(a),...(isSchool&&poi?{school:poi}:{})},postcode:a.postalCode||'',src:'tomtom'}})})();
  TT.ac.set(ck,p);const out=await p;if(out===null)TT.ac.delete(ck);return out}
if(typeof suggestPlaces==='function'){const _ttSuggest=suggestPlaces;suggestPlaces=async function(q){if(ttOn()){const r=await ttSearch(q);if(r&&r.length)return r}return _ttSuggest(q)}}
if(typeof suggestSchools==='function'){const _ttSchools=suggestSchools;suggestSchools=async function(q){const rest=_ttSchools(q);if(!ttOn())return rest;const t=await ttSearch(q,{school:true});const base=await rest;if(!t||!t.length)return base;const nm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const mine=t.slice(0,5).map(x=>({...x,isSchool:true}));const out=[...mine];for(const b of (base||[])){if(out.length>=10)break;if(mine.some(m=>(nm(m.name)===nm(b.name)||nm(b.name).startsWith(nm(m.name))||nm(m.name).startsWith(nm(b.name)))&&(b.lat==null||distM(m,b)<1500)))continue;out.push(b)}return out}}
if(typeof geocode==='function'){const _ttGeocode=geocode;geocode=async function(q){if(!q)return null;if(ttOn()){const ck=q.toLowerCase();if(!TT.geo.has(ck))TT.geo.set(ck,(async()=>{const ref=ttRef();const j=await ttGet(TT.base+'/search/2/geocode/'+encodeURIComponent(q)+'.json?'+ttQ()+'&countrySet=ZA&limit=1&lat='+ref.lat+'&lon='+ref.lng);const r=j&&j.results&&j.results[0];if(!r||!r.position)return null;return {lat:+r.position.lat,lng:+r.position.lon,label:r.address?.freeformAddress||q,address:ttAddr(r.address),src:'tomtom'}})());const g=await TT.geo.get(ck);if(g)return g}return _ttGeocode(q)}}
/* --- routing with live traffic → the shape the turn-by-turn code understands --- */
function ttManeuver(m,ex){m=String(m||'');const dir=/LEFT/.test(m)?'left':/RIGHT/.test(m)?'right':'';if(m==='DEPART')return {type:'depart',modifier:'straight'};if(/^ARRIVE|WAYPOINT_REACHED/.test(m))return {type:'arrive',modifier:dir};if(/ROUNDABOUT/.test(m))return {type:'roundabout',modifier:dir,exit:ex};if(/UTURN/.test(m))return {type:'turn',modifier:'uturn'};if(/^SHARP_/.test(m))return {type:'turn',modifier:'sharp '+dir};if(/^BEAR_/.test(m))return {type:'turn',modifier:'slight '+dir};if(/^KEEP_|^SWITCH_/.test(m))return {type:'fork',modifier:dir};if(/^TURN_/.test(m))return {type:'turn',modifier:dir};if(/MOTORWAY|FREEWAY|HIGHWAY/.test(m)&&/ENTER|SWITCH/.test(m))return {type:'on ramp',modifier:dir};if(/TAKE_EXIT|^EXIT_/.test(m))return {type:'off ramp',modifier:dir};if(/FERRY/.test(m))return {type:'continue',modifier:'straight'};return {type:'continue',modifier:'straight'}}
async function ttRoute(pts){if(!ttKey()||!pts||pts.length<2)return null;const loc=pts.map(p=>(+p.lat).toFixed(6)+','+(+p.lng).toFixed(6)).join(':');const j=await ttGet(TT.base+'/routing/1/calculateRoute/'+loc+'/json?'+ttQ()+'&traffic=true&travelMode=car&routeType=fastest&instructionsType=text&language=en-GB&routeRepresentation=polyline&sectionType=traffic',9000);const rt=j&&j.routes&&j.routes[0];if(!rt)return null;
  const coords=[];(rt.legs||[]).forEach((lg,i)=>(lg.points||[]).forEach((p,k)=>{if(i>0&&k===0)return;coords.push([+p.longitude,+p.latitude])}));if(coords.length<2)return null;
  const ins=(rt.guidance&&rt.guidance.instructions)||[];const bounds=[];let acc=0;(rt.legs||[]).forEach(lg=>{acc+=+lg.summary?.lengthInMeters||0;bounds.push(acc)});const total=+rt.summary?.lengthInMeters||acc;
  const legs=(rt.legs||[]).map(lg=>({distance:+lg.summary?.lengthInMeters||0,duration:+lg.summary?.travelTimeInSeconds||0,steps:[]}));
  ins.forEach((it,i)=>{const off=+it.routeOffsetInMeters||0;const next=i+1<ins.length?(+ins[i+1].routeOffsetInMeters||0):total;let li=bounds.findIndex(b=>off<b);if(li<0)li=legs.length-1;const mv=ttManeuver(it.maneuver,it.roundaboutExitNumber);if(mv.type==='arrive'&&li<legs.length-1&&/WAYPOINT/.test(it.maneuver||''))li=Math.max(0,bounds.findIndex(b=>off<=b));const tsec=i+1<ins.length?Math.max(0,(+ins[i+1].travelTimeInSeconds||0)-(+it.travelTimeInSeconds||0)):0;legs[li]&&legs[li].steps.push({distance:Math.max(0,next-off),duration:tsec,name:it.street||(it.roadNumbers||[])[0]||'',maneuver:{type:mv.type,modifier:mv.modifier,exit:mv.exit,location:it.point?[+it.point.longitude,+it.point.latitude]:null}})});
  const last=pts[pts.length-1];const lastLeg=legs[legs.length-1];if(lastLeg&&!lastLeg.steps.some(s=>s.maneuver.type==='arrive'))lastLeg.steps.push({distance:0,duration:0,name:'',maneuver:{type:'arrive',modifier:'',location:[+last.lng,+last.lat]}});
  return {geometry:{type:'LineString',coordinates:coords},distance:total,duration:+rt.summary?.travelTimeInSeconds||0,legs,tomtom:true,trafficDelay:+rt.summary?.trafficDelayInSeconds||0}}
if(typeof roadRoute==='function'){const _ttRoadRoute=roadRoute;roadRoute=async function(pts){if(ttOn()){const rt=await ttRoute(pts);if(rt){const p=typeof m2Parse==='function'?m2Parse(rt):{coords:rt.geometry.coordinates.map(([lng,lat])=>[lat,lng]),km:rt.distance/1000,min:Math.round(rt.duration/60)};p.trafficDelay=rt.trafficDelay;return p}}return _ttRoadRoute(pts)}}
/* --- settings card --- */
{const _ttAMore=VIEWS['a-more'];VIEWS['a-more']=function(){const html=_ttAMore.apply(this,arguments);const key=(Store.get('settings','config')||{}).ttKey||'';const card=`<div class="card"><h3>TomTom maps ${key?'<span class="pill live">On</span>':'<span class="pill">Off</span>'}</h3><p class="small muted">Free, <b>no card needed</b>. TomTom's own South African map data for maps, address and school search, and driver directions with live traffic. Paste the API key from developer.tomtom.com. Press ? on the System status row for the steps.</p><div class="row" style="margin-top:10px"><input id="cfg-tt" value="${h(key)}" placeholder="32-character key" autocomplete="off" style="flex:1;min-width:200px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)"><button class="btn sm" onclick="ttSaveKey()">Save</button></div></div>`;const anchor='<div class="card"><h3>Google Maps';return html.includes(anchor)?html.replace(anchor,card+anchor):html.replace('<div class="card"><h3>Announcements</h3>',card+'<div class="card"><h3>Announcements</h3>')}}
async function ttSaveKey(){const v=(document.getElementById('cfg-tt')?.value||'').trim();if(v&&!/^[A-Za-z0-9]{20,64}$/.test(v))return toast('That does not look like a TomTom key (letters and numbers, about 32 long)');await Store.put('settings','config',{...(Store.get('settings','config')||{}),ttKey:v});try{ls.set('enivel_tt',v)}catch(e){}TT.fails=0;TT.stat=null;TT.ac.clear();TT.geo.clear();if(typeof auditLog==='function')try{auditLog('maps.tomtom','config',v?'Key set':'Cleared')}catch(e){}toast(v?'TomTom maps on':'TomTom maps off');ttRetile();render()}
/* every signed-in device keeps a copy so maps switch even before the next sync */
{const _ttRender=render;render=function(){try{const k=(Store.get('settings','config')||{}).ttKey;if(typeof k==='string'&&k!==(ls.get('enivel_tt')||''))ls.set('enivel_tt',k)}catch(e){}return _ttRender.apply(this,arguments)}}
/* --- status row --- */
async function ttStatusCheck(){const k=ttKey();if(!k){TT.stat={st:'off'};return}if(TT.stat&&TT.stat.key===k&&Date.now()-TT.stat.at<600000)return;TT.stat={at:Date.now(),key:k,st:'wait'};const parts={};
  try{const r=await fetch(TT.base+'/map/1/tile/basic/main/10/584/592.png?'+ttQ());parts.tiles=r.ok?'ok':'HTTP '+r.status}catch(e){parts.tiles='blocked'}
  try{const r=await fetch(TT.base+'/search/2/search/Soweto.json?'+ttQ()+'&countrySet=ZA&limit=1');parts.search=r.ok?'ok':'HTTP '+r.status}catch(e){parts.search='blocked'}
  try{const r=await fetch(TT.base+'/routing/1/calculateRoute/-26.2041,28.0473:-26.2794,27.8356/json?'+ttQ());parts.routing=r.ok?'ok':'HTTP '+r.status}catch(e){parts.routing='blocked'}
  const NM={tiles:'Map Display',search:'Search',routing:'Routing'};const bad=Object.entries(parts).filter(([,v])=>v!=='ok');TT.stat={at:Date.now(),key:k,st:bad.length===0?'ok':bad.length===3?'bad':'warn',v:bad.length?bad.map(([x,v])=>NM[x]+': '+v).join(' · '):'Connected'};if(typeof S!=='undefined'&&S.admin&&['a-status','a-home'].includes(S.route)&&!document.querySelector('.overlay'))render()}
if(typeof admStatusRows==='function'){const _ttRows=admStatusRows;admStatusRows=function(){const rows=_ttRows();const k=ttKey();const g=typeof gmKey==='function'&&gmKey();if(k&&(!TT.stat||TT.stat.key!==k||Date.now()-TT.stat.at>600000))setTimeout(ttStatusCheck,0);
  const i=rows.findIndex(r=>r[0]==='gmaps');const st=!k?{st:'off'}:(TT.stat&&TT.stat.key===k?TT.stat:{st:'wait'});
  const row=['tomtom','Maps (TomTom)',st.st==='off'?{st:g?'ok':'warn',v:g?'Using Google instead':'Not set',fix:g?'':'Free maps in use. Add a free TomTom key (no card) for accurate South African maps and directions. Press ? for the steps.'}:st.st==='wait'?{st:'wait',v:'Checking…',fix:''}:st.st==='ok'?{st:'ok',v:g?'Connected (Google is used first)':'Connected',fix:''}:{st:st.st,v:st.v,fix:/403/.test(st.v)?'The key was refused. Copy it again from developer.tomtom.com → Keys.':'Check the key. Press ? for the steps.'}];
  /* a TomTom key covers maps: Google becomes optional, not a warning */
  if(i>=0&&k&&rows[i][2]&&rows[i][2].v==='Not set')rows[i]=[rows[i][0],rows[i][1],{st:'ok',v:'Optional (TomTom is on)',fix:''}];
  if(i>=0)rows.splice(i,0,row);else rows.push(row);return rows}}
if(typeof OWN_GUIDES==='object')OWN_GUIDES.tomtom={t:'Maps (TomTom)',why:'Without a map key Enivel uses free OpenStreetMap data, which is weak in townships, so pins and directions can be off. TomTom has its own South African map data and live traffic. Its free plan needs no card: 50 000 map tiles and 2 500 searches/routes a day. If a day\'s allowance runs out, TomTom pauses (it never bills you) and Enivel uses the free maps until midnight.',steps:['On the computer open <b>developer.tomtom.com</b> → <b>Register</b> (top right). Use the Enivel Gmail. No card is asked for.','Confirm the email TomTom sends you, then log in.','Open <b>Dashboard</b> (or <b>Keys</b>). A key called "My first API key" is already there. If not, press <b>Create key</b>, name it Enivel and tick every product (Map Display, Search, Routing).','Copy the key (about 32 letters and numbers).','Enivel → Admin → <b>Settings</b> → <b>TomTom maps</b> → paste → <b>Save</b>.','Come back here and press refresh. This row turns green. Every parent and driver gets TomTom maps on their next open.']};
</script>
